/* ---- 魔法の筒 ----
   相手モンスターの攻撃宣言時、その攻撃を無効にし、攻撃力分のダメージを与える。 */
defineScript("魔法の筒", {
  type:"trap", priority:2, targets:true,
  condition(ctx){
    const b = gameState.battle;
    if(!b || b.player === ctx.player){
      ctx.reason = "相手モンスターの攻撃宣言時に発動します"; return false;
    }
    if(b.step && b.step !== 'start'){
      ctx.reason = "攻撃宣言時にのみ発動できます"; return false;
    }
    return true;
  },
  selectTargets(ctx, done){
    const b = gameState.battle;
    const atk = API.fieldCards({zone:'mz', player:b.player, filter:x=>x.index===b.atkIdx});
    done(atk);
  },
  resolve(ctx){
    const t = ctx.selectedTargets[0];
    if(!t){ API.log("攻撃モンスターが場にないため不発"); return; }
    const dmg = curATK(t.card);
    API.damageLP(ctx.opponent, dmg, "魔法の筒");
    endBattle();
    API.log(`魔法の筒：攻撃を無効にし ${dmg} ダメージ`);

/* ---- No.16 色の支配者ショック・ルーラー ----
   X素材を1つ取り除き、カードの種類を宣言。次の相手ターン終了時まで
   宣言した種類のカードをお互いに発動できない。
   寒波亭の裁定：「カードの発動」ができなくなるだけで、
   既に表側で存在する永続魔法・永続罠の「効果の発動」は行える。 */
defineScript("No.16 色の支配者ショック・ルーラー", {
  countLimit:1,
  type:"monster", priority:1, quickEffect:false,
  condition(ctx){
    if(ctx.zone !== 'mz'){ ctx.reason = "フィールドで発動します"; return false; }
    if(!(ctx.card.xyz||[]).length){ ctx.reason = "エクシーズ素材が必要です"; return false; }
    return true;
  },
  cost(ctx, done){
    API.detachMaterial(ctx.player, ctx.index, "ショック・ルーラー（素材1つ）");
    done(true);
  },
  selectTargets(ctx, done){
    const kinds = [
      {label:'モンスター', key:'m'},
      {label:'魔法',       key:'s'},
      {label:'罠',         key:'t'},
    ];
    API.selectCard("ショック・ルーラー：宣言するカードの種類",
      kinds.map(k=>({p:ctx.player, zone:'declare', index:0, card:null, db:{n:k.label}, key:k.key})),
      pick=>done([pick]),
      "次の相手ターン終了時まで、その種類のカードを発動できません");
  },
  resolve(ctx){
    const k = ctx.selectedTargets[0];
    if(!k) return;
    // 両プレイヤーに宣言を記録する。解除は次の相手ターン終了時。
    [0,1].forEach(p=>API.setFlag(p, 'shockRuler', {kind:k.key, turn:gameState.turn}));
    API.log(`ショック・ルーラー：「${k.db.n}」を宣言`);
  },
  afterResolve(){}
});

/* ショック・ルーラーの宣言により、そのカードの「カードの発動」が封じられているか。
   永続魔法・永続罠が既に表側で存在する場合の「効果の発動」は封じられない。 */
function shockRulerBlocks(p, card, zone){
  const f = (gameState.players[p].effectFlags||{}).shockRuler;
  if(!f) return false;
  const db = dbOf(card);
  if(db.k !== f.kind) return false;
  // 場に表側で存在するカードからの効果の発動は妨げられない
  if((zone === 'mz' || zone === 'sz' || zone === 'field') && card && card.face === 'up') return false;
  return true;
}

/* ---- TG ラッシュ・ライノ ----
   攻撃する場合、ダメージステップの間 攻撃力が400アップする。
   破壊され墓地へ送られたターンのエンドフェイズに「TG」1体をサーチできる。 */
defineScript("TG ラッシュ・ライノ", {
  type:"monster", priority:1,
  activateFrom:["grave"],
  condition(ctx){
    if(ctx.zone !== 'grave'){ ctx.reason = "破壊され墓地へ送られたターンのエンドフェイズに発動します"; return false; }
    if(!tgInDeck(ctx.player, 'TG ラッシュ・ライノ').length){
      ctx.reason = "デッキに他の「TG」モンスターがいません"; return false;
    }
    return true;
  },
  selectTargets(ctx, done){
    API.selectCard("TG ラッシュ・ライノ：手札に加える「TG」",
      tgInDeck(ctx.player, 'TG ラッシュ・ライノ'), t=>done([t]));
  },
  resolve(ctx){
    const t = ctx.selectedTargets[0];
    if(t) API.searchDeck(ctx.player, t.index, "TG ラッシュ・ライノ");
  },
  afterResolve(){},
  continuous:{
    /* 自分が攻撃しているダメージステップの間だけ攻撃力400アップ */
    scope:'self', from:['mz'],
    apply(target, self){
      const b = gameState.battle;
      if(!b || b.target === 'direct') { /* 直接攻撃でも攻撃はしている */ }
      if(!b) return null;
      const P = gameState.players[b.player];
      if((P.mz||[])[b.atkIdx] !== self) return null;
      return { atk:400 };
    }
  }
});

/* ---- ナチュル・パルキオン ----
   罠カードが発動した時、自分の墓地のカード2枚を除外して、その発動を無効にし破壊する。 */
defineScript("ナチュル・パルキオン", {
  type:"monster", priority:3, quickEffect:true,
  condition(ctx){
    if(ctx.zone !== 'mz' || ctx.card.face !== 'up'){
      ctx.reason = "フィールドに表側表示で存在する場合に発動します"; return false;
    }
    if((API.me(ctx).grave||[]).length < 2){ ctx.reason = "墓地のカードが2枚必要です"; return false; }
    return true;
  },
  cost(ctx, done){
    const chosen = [];
    const pick = ()=>{
      const left = API.pileCards(ctx.player,'grave',x=>chosen.indexOf(x.card)<0);
      if(chosen.length >= 2){
        chosen.forEach(c=>API.banish({card:c}, "ナチュル・パルキオン（コスト）"));
        done(true); return;
      }
      API.selectCard(`ナチュル・パルキオン：除外する墓地のカード（${chosen.length+1}/2）`,
        left, x=>{ chosen.push(x.card); pick(); });
    };
    pick();
  },
  selectTargets(ctx, done){
    const cands = API.fieldCards({zone:'sz', filter:x=>x.card && x.db.k==='t'});
    if(!cands.length){ done([]); return; }
    API.selectCard("ナチュル・パルキオン：無効にして破壊する罠", cands, t=>done([t]));
  },
  resolve(ctx){
    const t = ctx.selectedTargets[0];
    if(!t){ API.log("対象がないため不発"); return; }
    API.negate(t, "ナチュル・パルキオン");
    API.destroy(t, "ナチュル・パルキオン");
  },
  afterResolve(){}
});

/* ---- 氷結界の龍 トリシューラ ----
   S召喚に成功した時、相手の手札・フィールド・墓地のカードをそれぞれ1枚まで除外する。
   対象を取らない（効果処理時に選ぶ）。 */
defineScript("氷結界の龍 トリシューラ", {
  type:"monster", priority:1, targets:false,
  condition(){ return true; },
  resolve(ctx){
    const zones = [['hand','手札'], ['mz','フィールド'], ['grave','墓地']];
    const step = (i)=>{
      if(i >= zones.length){ render(); return; }
      const [z, jp] = zones[i];
      const cands = (z === 'mz')
        ? API.fieldCards({zone:'mz', player:ctx.opponent, filter:x=>x.card})
        : API.pileCards(ctx.opponent, z, x=>x.card);
      if(!cands.length){ step(i+1); return; }
      API.selectCard(`トリシューラ：除外する相手の${jp}（1枚まで）`, cands, x=>{
        API.banish(x, "氷結界の龍 トリシューラ");
        step(i+1);
      }, "選ばない場合は閉じてください");
    };
    step(0);
  },
  afterResolve(){},
  passive:{ onSpecialSummon(ctx){ return ctx.zone==='mz'; } }
});

/* いま通常モンスターとして扱われるか。
   デュアルモンスターはフィールド・墓地では通常モンスター扱いで、
   「再度召喚」した状態（card.dualUp）のときだけ効果モンスターになる。
   《E・HERO アナザー・ネオス》を《ヒーロー・ブラスト》で回収できるのはこのため。 */
function treatedAsNormal(card){
  if(!card) return false;
  const st = dbOf(card).st || [];
  if(st.indexOf('通常') >= 0) return true;
  if(st.indexOf('デュアル') >= 0) return !card.dualUp;
  return false;
}

/* ---- R－ライトジャスティス ----
   自分フィールドの「E・HERO」カードの数だけ、フィールドの魔法・罠を選んで破壊する。
   さばえ氏の裁定まとめより：
     ・対象は取らない
     ・効果処理時のヒーロー枚数を参照し、必ずその枚数分「選んで」破壊する
     ・処理時にヒーローが不在、または場の魔法罠がその枚数を下回った場合は不発 */
defineScript("R－ライトジャスティス", {
  type:"spell", priority:1, targets:false,
  condition(ctx){
    if(!heroOnField(ctx.player).length){ ctx.reason = "自分フィールドに「E・HERO」カードがありません"; return false; }
    return true;
  },
  resolve(ctx){
    const n = heroOnField(ctx.player).length;      // 処理時の枚数を参照する
    if(!n){ API.log("「E・HERO」が不在のため不発"); return; }
    const st = API.fieldCards({zone:'sz', filter:x=>x.card});
    if(st.length < n){
      API.log(`場の魔法・罠が${n}枚に満たないため不発（${st.length}枚）`);
      return;
    }
    const chosen = [];
    const pickOne = ()=>{
      const left = API.fieldCards({zone:'sz', filter:x=>x.card && chosen.indexOf(x.card)<0});
      if(chosen.length >= n || !left.length){
        chosen.forEach(c=>API.destroy({card:c}, "R－ライトジャスティス"));
        render(); return;
      }
      API.selectCard(`R－ライトジャスティス：破壊する魔法・罠（${chosen.length+1}/${n}）`,
        left, x=>{ chosen.push(x.card); pickOne(); }, "自分のカードも選べます");
    };
    pickOne();
  }
});
function heroOnField(p){
  return API.fieldCards({player:p,
    filter:x=>x.card && x.card.face==='up' && String(x.db.n||'').indexOf('E・HERO')>=0});
}

/* ---- ミラクル・フュージョン ----
   自分のフィールド・墓地から融合素材を除外して「E・HERO」融合モンスターを融合召喚する。 */
defineScript("ミラクル・フュージョン", {
  type:"spell", priority:1,
  condition(ctx){
    if(!miracleOptions(ctx.player).length){
      ctx.reason = "素材が揃った「E・HERO」融合モンスターがいません"; return false;
    }
    return true;
  },
  selectTargets(ctx, done){
    const opts = miracleOptions(ctx.player);
    API.selectCard("ミラクル・フュージョン：融合召喚するモンスター",
      opts.map(o=>o.ex), pick=>{
        const o = opts.find(x=>x.ex.card === pick.card);
        done([{ex:o.ex, mats:o.combos[0]}]);
      }, "素材はフィールド・墓地から除外します");
  },
  resolve(ctx){
    const t = ctx.selectedTargets[0];
    if(!t) return;
    // 素材を除外してからEXデッキの融合モンスターを特殊召喚する
    t.mats.slice().reverse().forEach(m=>API.banish(m, "ミラクル・フュージョン（素材）"));
    const P = gameState.players[ctx.player];
    const ei = (P.ex||[]).indexOf(t.ex.card);
    if(ei >= 0) API.specialSummon(ctx.player,'ex',ei,'atk',"ミラクル・フュージョン");
  }
});
/* フィールドと墓地の自分のモンスターから、素材条件を満たすE・HERO融合体を探す */
function miracleOptions(p){
  const P = gameState.players[p];
  const pool = [];
  (P.mz||[]).forEach((c,i)=>{ if(c && c.face==='up')
    pool.push({i:pool.length, p, zone:'mz', index:i, card:c, db:dbOf(c), lv:dbOf(c).lv||0}); });
  (P.grave||[]).forEach((c,i)=>{ if(c && dbOf(c).k==='m')
    pool.push({i:pool.length, p, zone:'grave', index:i, card:c, db:dbOf(c), lv:dbOf(c).lv||0}); });
  const out = [];
  (P.ex||[]).forEach((c,ei)=>{
    const db = dbOf(c);
    if((db.st||[]).indexOf('融合') < 0) return;
    if(String(db.n||'').indexOf('E・HERO') < 0) return;
    const spec = parseMaterialSpec(db);
    if(!spec || !spec.slots) return;
    const combos = findMaterialCombos(pool, spec, null, 5);
    if(combos.length) out.push({ex:{p, zone:'ex', index:ei, card:c, db}, combos});
  });
  return out;
}

/* ---- E・HERO バブルマン ----
   ① 手札がこのカード1枚のみの場合、手札から特殊召喚できる。
   ② 召喚・反転召喚・特殊召喚に成功した時、手札・フィールドに他のカードが
      無い場合に発動でき、デッキから2枚ドローする。 */
defineScript("E・HERO バブルマン", {
  timing:["summon","free"],     // 手札からの特殊召喚は起動効果
  type:"monster", priority:1,
  condition(ctx){
    const P = API.me(ctx);
    if(ctx.zone === 'hand'){
      if((P.hand||[]).length !== 1){ ctx.reason = "手札がこのカード1枚のみの場合に特殊召喚できます"; return false; }
      return true;
    }
    // 場に出た後のドロー効果
    const others = (P.hand||[]).length + (P.mz||[]).filter(c=>c!==ctx.card).length + (P.sz||[]).length;
    if(others){ ctx.reason = "手札・フィールドに他のカードがある場合は発動できません"; return false; }
    if((P.deck||[]).length < 2){ ctx.reason = "デッキが2枚未満です"; return false; }
    return true;
  },
  resolve(ctx){
    if(ctx.zone === 'hand'){
      API.specialSummon(ctx.player,'hand',ctx.index,'atk',"E・HERO バブルマン");
      return;
    }
    API.draw(ctx.player, 2, "E・HERO バブルマン");
  },
  afterResolve(){},
  passive:{
    onNormalSummon(ctx){ return ctx.zone==='mz'; },
    onSpecialSummon(ctx){ return ctx.zone==='mz'; }
  }
});

/* ---- 天空の聖域 ----
   天使族モンスターの戦闘で発生する、そのコントローラーへの戦闘ダメージが0になる。
   攻守には影響しないので battleDamage フックだけを持つ。 */
defineScript("天空の聖域", {
  continuous:{
    scope:'self', from:['field'],
    apply(){ return null; },
    battleDamage(info){
      // 戦闘に参加している天使族のコントローラーが、そのダメージの受け手なら0
      const pair = [
        {card:info.atkCard, owner:info.atkOwner},
        {card:info.defCard, owner:info.defOwner},
      ];
      const hit = pair.some(x => x.card && x.owner === info.to && dbOf(x.card).ra === '天使');
      return hit ? 0 : info.amount;
    }
  }
});

/* ---- レスキューラビット ----
   フィールドのこのカードを除外して発動。デッキからレベル4以下の
   同名の通常モンスター2体を特殊召喚する。エンドフェイズに破壊。
   1103当時のテキストどおり「1ターンに1度」はカード個体単位で扱う。 */
defineScript("レスキューラビット", {
  countLimit:1,
  type:"monster", priority:1, quickEffect:false,
  /* デッキ内で「同名が2枚以上あるレベル4以下の通常モンスター」を集める */
  condition(ctx){
    if(ctx.zone !== 'mz'){ ctx.reason = "フィールドのこのカードを除外して発動します"; return false; }
    if(!rabbitTargets(ctx.player).length){
      ctx.reason = "デッキにレベル4以下の同名の通常モンスターが2体いません"; return false;
    }
    return true;
  },
  /* コストとして自身を除外する（対象選択より前に払う） */
  cost(ctx, done){
    API.banish({p:ctx.player, zone:'mz', index:ctx.index, card:ctx.card},
               "レスキューラビット（コストで除外）");
    done(true);
  },
  selectTargets(ctx, done){
    const groups = rabbitTargets(ctx.player);
    API.selectCard("レスキューラビット：特殊召喚する通常モンスター",
      groups.map(g=>g.sample),
      pick=>done([{name: labelOf(pick.card)}]),
      "同名2体をデッキから特殊召喚します");
  },
  resolve(ctx){
    const nm = (ctx.selectedTargets[0]||{}).name;
    if(!nm) return;
    // デッキから同名を2体。特殊召喚のたびに添字がずれるので都度引き直す
    for(let k=0; k<2; k++){
      const left = API.pileCards(ctx.player,'deck', x=>labelOf(x.card)===nm);
      if(!left.length) break;
      API.specialSummon(ctx.player,'deck',left[0].index,'atk',"レスキューラビット");
    }
    API.registerReserveEffect(ctx.player, "レスキューラビット：エンドに破壊",
      "endPhase", "この効果で特殊召喚したモンスターを破壊");
  },
  afterResolve(){}      // 自身は既に除外済みなので何もしない
});

/* デッキにレベル4以下の通常モンスターが同名で2枚以上あるものを集める */
function rabbitTargets(p){
  const cands = API.pileCards(p,'deck',
    x=>x.db.k==='m' && !x.db.ex && (x.db.st||[]).indexOf('通常')>=0 && (x.db.lv||9)<=4);
  const byName = new Map();
  cands.forEach(x=>{
    const nm = labelOf(x.card);
    if(!byName.has(nm)) byName.set(nm, []);
    byName.get(nm).push(x);
  });
  const out = [];
  byName.forEach((arr, nm)=>{ if(arr.length >= 2) out.push({name:nm, sample:arr[0], cards:arr}); });
  return out;
}

/* =========================================================================
   御前試合 / 群雄割拠
   永続効果。表側表示モンスターが2種類以上になったら、1種類になるよう
   コントローラーが墓地へ送る。チェーンブロックは作らない。
   ダメージステップ中は⑤のタイミングで処理し、その後リバース効果を
   墓地で処理する（＝スキルドレインを貫通する）。
   ========================================================================= */
[['御前試合','at','属性'], ['群雄割拠','ra','種族']].forEach(([nm, key, jp])=>{
  defineScript(nm, {
    continuous:{
      scope:'self', from:['sz'],
      apply(){ return null; }        // 攻守には影響しない
    },
    /* 違反しているプレイヤーと、その場の内訳を返す */
    restriction:{ key, jp,
      violations(){
        const out = [];
        for(let p=0; p<2; p++){
          const ups = (gameState.players[p].mz||[])
            .map((c,i)=>({i, c}))
            .filter(x=>x.c && x.c.face==='up');
          const kinds = new Set(ups.map(x=>dbOf(x.c)[key]));
          if(kinds.size >= 2) out.push({player:p, cards:ups, kinds:[...kinds]});
        }
        return out;
      }
    }
  });
});

/* 違反状態を解消させる。チェーンブロックは作らず、コントローラーが
   1種類になるよう自分で墓地へ送る。ダメージステップ中なら⑤で処理する。
   選択が終わるまで繰り返し呼ばれる。 */
let EXCLUSION_PENDING = false;   // 選択待ちの間は多重に出さない
let EXCLUSION_RESOLVING = false; // 墓地送りの実行中は再入させない
function enforceExclusions(){
  if(EXCLUSION_PENDING || EXCLUSION_RESOLVING) return false;
  const v = exclusionViolations()[0];
  if(!v) return false;
  EXCLUSION_PENDING = true;
  const P = gameState.players[v.player];
  const jp = (CARD_SCRIPTS[v.script].restriction||{}).jp || '種類';
  // 残す種類を選ばせ、それ以外を墓地へ送る
  const key = (CARD_SCRIPTS[v.script].restriction||{}).key;
  setTimeout(()=>{
    const rows = v.kinds.map((k,i)=>
      `<div class="act pick-row" onclick="__exclPick(${jsVal(v.player)},${jsStr(key)},${jsStr(k)})">
         <span class="pk-nm">${k}</span>
         <span class="pk-sub">これを残す</span>
       </div>`).join("");
    sheet.innerHTML = `<div class="grip"></div>
      <h3 style="margin-bottom:4px">${v.script}</h3>
      <div class="meta" style="margin-bottom:10px">
        ${nameOf(v.player)} のフィールドに${jp}が${v.kinds.length}種類あります。
        1種類になるよう、残す${jp}を選んでください。</div>
      <div class="pick-list">${rows}</div>`;
    veil.classList.add("on");
  }, 60);
  return true;
}
function __exclPick(p, key, keep){
  EXCLUSION_PENDING = false;
  EXCLUSION_RESOLVING = true;
  closeSheet();
  const P = gameState.players[p];
  // 添字がずれるので後ろから処理する
  for(let i=(P.mz||[]).length-1; i>=0; i--){
    const c = P.mz[i];
    if(!c || c.face!=='up') continue;
    if(dbOf(c)[key] === keep) continue;
    act({type:"FX_TO_GRAVE", player:p, zone:'mz', index:i,
         reason:"御前試合・群雄割拠による墓地送り"});
  }
  EXCLUSION_RESOLVING = false;
  render();
  enforceExclusions();      // まだ違反が残っていれば繰り返す
}

/* 御前試合・群雄割拠が場にあるとき、違反しているプレイヤーを列挙する。
   戻り値 [{script, player, cards, kinds}] */
function exclusionViolations(){
  const out = [];
  continuousSources().forEach(src=>{
    const r = src.sc.restriction;
    if(!r) return;
    r.violations().forEach(v=>out.push(Object.assign({script:src.sc.name}, v)));
  });
  return out;
}

/* =========================================================================
   UI アクション → applyAction → render のラッパ
   ========================================================================= */
/* ---- Undo（複数段階）＆ このターンにやったこと ---- */
const HISTORY = [];              // 直前スナップショットのスタック
const HISTORY_MAX = 40;
let turnActions = [];            // このターンの短い履歴チップ

/* SET_PHASE / PASS_TURN / SHUFFLE / LOAD_DECK はチップに出さない（ノイズ削減） */
const CHIP_SKIP = new Set(["SET_PHASE","PASS_TURN","SHUFFLE","LOAD_DECK","CHAIN_CLEAR"]);

function snapshot(){
  // 構造が単純なので JSON でディープコピー（DBは別なので安全）
  HISTORY.push(JSON.stringify(gameState));
  if(HISTORY.length>HISTORY_MAX) HISTORY.shift();
  REDO.length = 0;                 // 新しい操作をしたらRedoは破棄
}
/* Redo：Undoで戻した操作をやり直す */
function redo(){
  if(!REDO.length) return;
  HISTORY.push(JSON.stringify(gameState));
  gameState = JSON.parse(REDO.pop());
  render();
}
/* 召喚・リバースなど、誘発の起点になったアクションの窓を開く */
function updateTimingWindow(gs, a){
  const open = k => { gs.timingWindow = {kind:k, turn:gs.turn, action:a.type}; };
  switch(a.type){
    case "NORMAL_SUMMON":
    case "FX_SPECIAL_SUMMON":
    case "FX_EX_SUMMON":
    case "FX_RITUAL_SUMMON":
      open('summon'); break;
    case "FLIP":
      open('flip'); break;
    case "FX_SET_STATE":
      if(a.face === 'up') open('flip'); break;
    case "SET_PHASE":
    case "PASS_TURN":
      gs.timingWindow = null; break;   // フェイズが変われば窓は閉じる
  }
}

function act(a){
  snapshot();
  const beforeTurn = gameState.turn;
  applyAction(gameState, a);
  updateTimingWindow(gameState, a);
  // ターンが変わったらチップ履歴をリセット
  if(gameState.turn !== beforeTurn) turnActions = [];
  const chip = chipFor(a);
  if(chip) turnActions.push(chip);
  render();
  // 御前試合・群雄割拠は永続効果なので、盤面が動いたら即座に適用する。
  // ダメージステップ中は⑤で処理するため、そこでは動かさない。
  if(!gameState.battle) enforceExclusions();
}
const REDO = [];
function undo(){
  if(!HISTORY.length) return;
  REDO.push(JSON.stringify(gameState));
  if(REDO.length>HISTORY_MAX) REDO.shift();
  gameState = JSON.parse(HISTORY.pop());
  // チップは厳密復元が難しいので直近1つを削るだけ（実用上これで十分）
  turnActions.pop();
  render();
}
/* action を短い日本語チップに変換（このターンにやったこと用） */
function chipFor(a){
  if(CHIP_SKIP.has(a.type)) return null;
  const P = gameState.players[a.player ?? gameState.activePlayer];
  const nm = (c)=> c ? cardName(c) : "カード";
  switch(a.type){
    case "DRAW": return `ドロー${(a.n??1)>1?`×${a.n}`:""}`;
    case "LP":   return `LP${a.delta>0?"+":""}${a.delta}`;
    case "MOVE": {
      const to = a.to;
      const label = {mz:"召喚/特殊",sz:"魔法罠",field:"フィールド",grave:"墓地",banish:"除外",hand:"手札戻し",deck:"デッキ戻し",ex:"EX"}[to]||to;
      const faceTag = a.face==='down' ? "セット" : label;
      return faceTag;
    }
    case "FLIP": return "反転";
    case "TOGGLE_POS": return "表示形式変更";
    case "ATTACK": return a.target==='direct' ? "直接攻撃" : "攻撃宣言";
    case "CHAIN_ADD": return `${a.name}発動`;
    case "CHAIN_RESOLVE_TOP": return "チェーン解決";
    default: return null;
  }
}

/* =========================================================================
   エンドフェイズの自動処理
   ライトロードのデッキ削りは強制効果なので、確認を挟まず自動で処理する。
   スクリプトに endPhaseMill を宣言したカードが対象。
   ========================================================================= */
function resolveEndPhaseMills(){
  const p = gameState.activePlayer;
  const P = gameState.players[p];
  const jobs = [];
  const scan = (arr, zone)=>{
    (arr||[]).forEach((c,i)=>{
      if(!c || c.face !== 'up') return;
      if(effectNegated(c)) return;              // スキルドレイン等で無効なら削らない
      const sc = CARD_SCRIPTS[dbOf(c).n];
      if(!sc || !sc.endPhaseMill) return;
      jobs.push({name:dbOf(c).n, n:sc.endPhaseMill});
    });
  };
  scan(P.mz, 'mz');
  scan(P.sz, 'sz');
  if(P.field) scan([P.field], 'field');
  if(!jobs.length) return false;
  jobs.forEach(j=>{
    act({type:"FX_MILL_TOP", player:p, n:j.n, reason:`${j.name}（エンドフェイズ）`});
  });
  const total = jobs.reduce((a,b)=>a+b.n, 0);
  showToast(`ライトロード：デッキから${total}枚を墓地へ`);
  return true;
}

/* 「破壊され墓地へ送られたターンのエンドフェイズ」に該当するか */
function destroyedThisTurn(card){
  const g = card && card.graveInfo;
  return !!(g && g.byDestroy && g.turn === gameState.turn);
}

function doPhase(id){ act({type:"SET_PHASE", phase:id}); }
function doPhaseNext(){
  const i = PHASES.findIndex(x=>x.id===gameState.phase);
  if(i < PHASES.length-1){
    act({type:"SET_PHASE", phase:PHASES[i+1].id});
    const ph = gameState.phase;
    if(ph === "end") resolveEndPhaseMills();   // 強制のデッキ削りを先に済ませる
    emitEvent("onPhaseChange", {phase:ph}) ||
      (ph==="standby" && emitEvent("onStandbyPhase", {phase:ph})) ||
      (ph==="end" && emitEvent("onEndPhase", {phase:ph}));
  }
}
function doPhasePrev(){
  const i = PHASES.findIndex(x=>x.id===gameState.phase);
  if(i > 0) act({type:"SET_PHASE", phase:PHASES[i-1].id});
}
function doPass(){
  emitEvent("onTurnEnd", {turn:gameState.turn});
  act({type:"PASS_TURN"});
  emitEvent("onTurnStart", {turn:gameState.turn});
}
function doDraw(){ act({type:"DRAW", n:1}); }
function doShuffle(){ act({type:"SHUFFLE"}); }
function doLP(d){ act({type:"LP", player:gameState.activePlayer, delta:d}); }

/* =========================================================================
   状態インスペクタ
   ルール処理はプレイヤーが判断するので、アプリが保持している状態を
   いつでも確認・手動修正できるようにする。
   ========================================================================= */
function openState(){
  const gs = gameState;
  const p  = gs.activePlayer;
  const P  = gs.players[p], O = gs.players[p===0?1:0];
  const cell=(k,v,off)=>`<div class="state-cell"><span class="k">${k}</span><span class="v ${off?'off':''}">${v}</span></div>`;
  const atkDone = P.mz.filter(c=>c.attacked).length;
  const pend = gs.pending.length
    ? gs.pending.map((x,i)=>`<div class="act" onclick="act({type:'PENDING_RESOLVE',index:${i}});openState()">${x.name}（${nameOf(x.player)}）を処理</div>`).join("")
    : `<div class="meta">なし</div>`;
  const resv = gs.reserved.length
    ? gs.reserved.map((x,i)=>`<div class="act" onclick="act({type:'RESERVE_REMOVE',index:${i}});openState()">${x.name}（T${x.turn}${x.at==='endPhase'?'エンド':''}）を解除</div>`).join("")
    : `<div class="meta">なし</div>`;
  sheet.innerHTML = `<div class="grip"></div>
    <h3 style="margin-bottom:8px">状態</h3>
    <div class="state-grid">
      ${cell("ターン", `T${gs.turn}`)}
      ${cell("フェーズ", phaseJp(gs.phase))}
      ${cell("手番", nameOf(gs.activePlayer))}
      ${cell("優先権", nameOf(gs.priority??gs.activePlayer))}
      ${cell("通常召喚権", P.normalSummonUsed?"使用済":"未使用", P.normalSummonUsed)}
      ${cell("ドロー", gs.drawnThisTurn?"済":"未", gs.drawnThisTurn)}
      ${cell("攻撃済み", `${atkDone} / ${P.mz.length}体`)}
      ${cell("チェーン", `${gs.chain.length}`)}
      ${cell("特殊召喚(今T)", `${P.ssHistory.length}回`, !P.ssHistory.length)}
      ${cell("墓地送り(今T)", `${P.graveHistory.length}枚`, !P.graveHistory.length)}
    </div>
    <div class="act-label">手動で切り替え</div>
    <div class="act-grid">
      <div class="act" onclick="act({type:'SET_PRIORITY',to:${gs.priority===0?1:0}});openState()">優先権を渡す</div>
      <div class="act" onclick="toggleNormalRight()">召喚権を${P.normalSummonUsed?'戻す':'使用済にする'}</div>
      <div class="act" onclick="clearAttacked()">攻撃済みをリセット</div>
      <div class="act" onclick="addPending()">発動待ちを登録</div>
    </div>
    <div class="act-label">発動待ち効果</div>
    <div class="act-grid wide">${pend}</div>
    <div class="act-label">予約効果</div>
    <div class="act-grid wide">${resv}</div>
    <div class="act-label">このターンの履歴</div>
    <div class="meta">
      特殊召喚：${P.ssHistory.map(h=>h.name).join("、")||"なし"}<br>
      墓地送り：${P.graveHistory.map(h=>h.name).join("、")||"なし"}
    </div>
    <button class="close" onclick="closeSheet()">閉じる</button>`;
  veil.classList.add("on");
}
function toggleNormalRight(){
  const p = gameState.activePlayer;
  snapshot();
  gameState.players[p].normalSummonUsed = !gameState.players[p].normalSummonUsed;
  logIt(gameState, `通常召喚権：${gameState.players[p].normalSummonUsed?'使用済':'未使用'}に変更`);
  render(); openState();
}
function clearAttacked(){
  const p = gameState.activePlayer;
  snapshot();
  gameState.players[p].mz.forEach(c=>{ if(c) c.attacked=false; });
  logIt(gameState, `攻撃済みフラグをリセット`);
  render(); openState();
}
function addPending(){
  const nm = prompt("発動待ちの効果名を入力","");
  if(!nm) return;
  act({type:"PENDING_ADD", player:gameState.activePlayer, name:nm});
  openState();
}

/* =========================================================================
   汎用プリミティブ・パレット
   カード固有処理を持たないカードも、ここから手動で効果を組み立てられる。
   「対象を選ぶ → 処理を選ぶ」の2タップで完了する。
   ========================================================================= */
function openPrimitives(srcP, srcZone, srcIdx, srcName){
  const label = srcName ? `${srcName} の効果` : "効果処理";
  sheet.innerHTML = `<div class="grip"></div>
    <h3 style="margin-bottom:4px">${label}</h3>
    <div class="meta" style="margin-bottom:10px">処理を選ぶと対象を指定できます。裁定はプレイヤーが判断してください。</div>
    <div class="act-label">場のカードに</div>
    <div class="act-grid">
      <div class="act" onclick="primPick('destroy')">破壊</div>
      <div class="act" onclick="primPick('tograve')">墓地へ送る</div>
      <div class="act" onclick="primPick('banish')">除外</div>
      <div class="act" onclick="primPick('bounce')">手札に戻す</div>
      <div class="act" onclick="primPick('todeck')">デッキに戻す</div>
      <div class="act" onclick="primPick('position')">表示形式変更</div>
      <div class="act" onclick="primPick('flip')">反転</div>
      <div class="act" onclick="primPick('negate')">効果を無効化</div>
      <div class="act" onclick="primPick('overlay')">素材として重ねる</div>
    </div>
    <div class="act-label">デッキ・墓地から</div>
    <div class="act-grid">
      <div class="act" onclick="primPick('search')">サーチ</div>
      <div class="act" onclick="primPick('mill')">デッキから墓地へ</div>
      <div class="act" onclick="closeSheet();openDeckTop(${srcP},1)">トップをめくる</div>
      <div class="act" onclick="primPick('revive')">墓地から特殊召喚</div>
      <div class="act" onclick="primPick('graveBanish')">墓地から除外</div>
    </div>
    <div class="act-label">その他</div>
    <div class="act-grid">
      <div class="act" onclick="closeSheet();act({type:'DRAW',player:${srcP},n:1})">1枚ドロー</div>
      <div class="act" onclick="primPick('discard')">手札を捨てる</div>
      <div class="act" onclick="closeSheet();openLP(${srcP})">LPを増減</div>
      <div class="act" onclick="closeSheet();act({type:'SHUFFLE',player:${srcP}})">シャッフル</div>
    </div>
    ${srcZone ? `<div class="act-label">このカード自身（コスト処理）</div>
    <div class="act-grid">
      <div class="act" onclick="primSelf('banish')">自身を除外</div>
      <div class="act" onclick="primSelf('grave')">自身を墓地へ</div>
    </div>` : ""}
    <button class="close" onclick="closeSheet()">閉じる</button>`;
  PRIM_SRC = {p:srcP, zone:srcZone, index:srcIdx, name:srcName};
  veil.classList.add("on");
}
let PRIM_SRC = null;
/* 発動元カード自身を処理する（墓地から除外する等のコスト） */
function primSelf(op){
  const src = PRIM_SRC;
  if(!src || !src.zone){ showToast("対象が特定できません"); return; }
  closeSheet();
  const t = {p:src.p, zone:src.zone, index:src.index, card:{}};
  if(op==='banish') act({type:"FX_BANISH", player:src.p, zone:src.zone, index:src.index, reason:src.name||"コスト"});
  else              act({type:"FX_TO_GRAVE", player:src.p, zone:src.zone, index:src.index, reason:src.name||"コスト"});
}

/* 処理を選んだあと、対象を選ばせて実行する */
function primPick(op){
  const src = PRIM_SRC || {p:gameState.activePlayer};
  const p = src.p;
  const fieldTargets = ()=>{
    const out=[];
    [0,1].forEach(pl=>{
      const P=gameState.players[pl];
      P.mz.forEach((c,i)=>out.push({pl,zone:'mz',i,c}));
      P.sz.forEach((c,i)=>out.push({pl,zone:'sz',i,c}));
      if(P.field) out.push({pl,zone:'field',i:0,c:P.field});
    });
    return out;
  };
  const listOf = (arr, pl, zone)=>arr.map((c,i)=>({
    label: labelOf(c), sub: `${nameOf(pl)}の${zoneJp(zone)}`, pl, zone, i, c
  }));

  const runOnField = (title, fn)=>{
    const t = fieldTargets();
    openPick(title, "場のカードから選ぶ", t.map(x=>({
      label: x.c.face==='down' ? "裏側のカード" : labelOf(x.c),
      sub: `${nameOf(x.pl)}・${zoneJp(x.zone)}`,
      onPick: ()=>fn(x)
    })));
  };

  switch(op){
    case 'destroy':
      runOnField("破壊するカード", x=>{
        act({type:"FX_TO_GRAVE", player:x.pl, zone:x.zone, index:x.i, reason:(src.name||"効果")+"で破壊"});
        afterSentToGrave("破壊");
      });
      break;
    case 'banish':
      runOnField("除外するカード", x=>act({type:"FX_BANISH", player:x.pl, zone:x.zone, index:x.i, reason:src.name||"効果"}));
      break;
    case 'bounce':
      runOnField("手札に戻すカード", x=>act({type:"FX_BOUNCE", player:x.pl, zone:x.zone, index:x.i, reason:src.name||"効果"}));
      break;
    case 'todeck':
      runOnField("デッキに戻すカード", x=>act({type:"FX_RETURN_DECK", player:x.pl, zone:x.zone, index:x.i, reason:src.name||"効果"}));
      break;
    case 'negate':
      runOnField("無効化するカード", x=>act({type:"FX_NEGATE", player:x.pl, zone:x.zone, index:x.i, reason:src.name||"効果"}));
      break;
    case 'position':
      runOnField("表示形式を変えるカード", x=>{
        const cur = x.c.pos==='atk'?'def':'atk';
        act({type:"FX_SET_STATE", player:x.pl, zone:x.zone, index:x.i, pos:cur, reason:src.name||"効果"});
      });
      break;
    case 'flip':
      runOnField("反転するカード", x=>act({type:"FX_SET_STATE", player:x.pl, zone:x.zone, index:x.i,
        face: x.c.face==='up'?'down':'up', reason:src.name||"効果"}));
      break;
    case 'overlay': {
      const P = gameState.players[p];
      const xyzMons = P.mz.map((c,i)=>({c,i})).filter(x=>x.c.xyz);
      if(!xyzMons.length){ showToast("素材を持てるモンスターがいません"); return; }
      openPick("素材を重ねる先", "", xyzMons.map(x=>({
        label: labelOf(x.c), sub:`素材${x.c.xyz.length}`,
        onPick: ()=>{
          const others = P.mz.map((c,i)=>({c,i})).filter(y=>y.i!==x.i);
          openPick("素材にするモンスター", "", others.map(y=>({
            label: labelOf(y.c), sub: subOf(y.c),
            onPick: ()=>act({type:"FX_OVERLAY", player:p, targetMz:x.i, from:"mz", fromIndex:y.i})
          })));
        }
      })));
      break;
    }
    case 'search': {
      const P = gameState.players[p];
      openPick("デッキから手札に加える", `デッキ${P.deck.length}枚`,
        P.deck.map((c,i)=>({label:labelOf(c), sub:subOf(c),
          onPick: ()=>act({type:"FX_SEARCH", player:p, deckIndex:i, reason:src.name||"効果"})})));
      break;
    }
    case 'mill': {
      const P = gameState.players[p];
      openPick("デッキから墓地へ送る", `デッキ${P.deck.length}枚`,
        P.deck.map((c,i)=>({label:labelOf(c), sub:subOf(c),
          onPick: ()=>act({type:"FX_MILL", player:p, deckIndex:i, reason:src.name||"効果"})})));
      break;
    }
    case 'revive': {
      const P = gameState.players[p];
      const mons = P.grave.map((c,i)=>({c,i})).filter(x=>dbOf(x.c).k==='m');
      openPick("墓地から特殊召喚", "", mons.map(x=>({label:labelOf(x.c), sub:subOf(x.c),
        onPick: ()=>act({type:"FX_SPECIAL_SUMMON", player:p, from:"grave", fromIndex:x.i, pos:"atk", reason:src.name||"効果"})})));
      break;
    }
    case 'tograve': {
      const t = fieldTargets();
      openPick("墓地へ送るカード", "場のカードから選ぶ", t.map(x=>({
        label: x.c.face==='down' ? "裏側のカード" : labelOf(x.c),
        sub: `${nameOf(x.pl)}・${zoneJp(x.zone)}`,
        onPick: ()=>{
          act({type:"FX_TO_GRAVE", player:x.pl, zone:x.zone, index:x.i, reason:src.name||"効果"});
          afterSentToGrave("");
        }
      })));
      break;
    }
    case 'graveBanish': {
      const P = gameState.players[p];
      openPick("墓地から除外", "", P.grave.map((c,i)=>({label:labelOf(c), sub:subOf(c),
        onPick: ()=>act({type:"FX_BANISH", player:p, zone:"grave", index:i, reason:src.name||"効果"})})));
      break;
    }
    case 'discard': {
      const P = gameState.players[p];
      openPick("捨てる手札", "", P.hand.map((c,i)=>({label:labelOf(c), sub:subOf(c),
        onPick: ()=>act({type:"FX_DISCARD", player:p, handIndex:i, reason:src.name||"コスト"})})));
      break;
    }
  }
}

/* =========================================================================
   Step13: カードスクリプト デバッガー
   直近のスクリプト実行の各段階（条件→対象→解決→後処理）を追える。
   ========================================================================= */
function openScriptDebug(){
  const logs = gameState.scriptLog || [];
  const body = logs.length
    ? logs.map(l=>`
        <div class="dbg-entry">
          <div class="dbg-name">【${l.name}】</div>
          ${l.steps.map(st=>`<div class="dbg-step ${st.ok?'':'ng'}">${st.ok?'✓':'✗'} ${st.msg}</div>`).join("")}
        </div>`).join("")
    : `<div class="meta">まだスクリプトが実行されていません。<br>
        効果を発動すると、条件判定・対象選択・解決の流れがここに記録されます。</div>`;
  const impl = Object.keys(CARD_SCRIPTS).length;
  sheet.innerHTML = `<div class="grip"></div>
    <h3 style="margin-bottom:4px">スクリプト デバッガー</h3>
    <div class="meta" style="margin-bottom:10px">実装済みスクリプト：<b style="color:var(--gold-hi)">${impl}枚</b></div>
    <div class="dbg-list">${body}</div>
    <div class="act-grid">
      <div class="act" onclick="openScriptList()">実装済み一覧</div>
      <div class="act" onclick="clearScriptLog()">記録を消去</div>
    </div>
    <button class="close" onclick="closeSheet()">閉じる</button>`;
  veil.classList.add("on");
}
function clearScriptLog(){ gameState.scriptLog = []; openScriptDebug(); }
function openScriptList(){
  const names = Object.keys(CARD_SCRIPTS).sort();
  const rows = names.map(n=>{
    const sc = CARD_SCRIPTS[n];
    const ev = sc.passive ? Object.keys(sc.passive).map(e=>eventJp(e)).join("・") : "";
    const tags=[];
    if(sc.countLimit) tags.push(countLimitJp(sc));
    if(sc.cost) tags.push('コスト');
    if(sc.forced) tags.push('強制');
    if(sc.activateFrom) tags.push(sc.activateFrom.map(z=>zoneJp(z)).join('/')+'から');
    return `<div class="act pick-row">
      <span class="pk-nm">${n}</span>
      <span class="pk-sub">${sc.type||''}${ev?' / '+ev:''}${tags.length?' ['+tags.join('・')+']':''}</span>
    </div>`;
  }).join("");
  sheet.innerHTML = `<div class="grip"></div>
    <h3 style="margin-bottom:4px">実装済みスクリプト（${names.length}）</h3>
    <div class="meta" style="margin-bottom:10px">これらは共通APIのみで記述されています。</div>
    <div class="pick-list">${rows}</div>
    <button class="close" onclick="openScriptDebug()">戻る</button>`;
  veil.classList.add("on");
}

const COUNTER_KINDS = ["魔力","デュアル","ボム","呪縛","氷結","風","聖","カウンター"];
function openCounterMenu(p, zone, idx){
  const P = gameState.players[p];
  const c = zoneCard(P, zone, idx);
  const cur = c && c.counters ? c.counters : {};
  const rows = COUNTER_KINDS.map(k=>{
    const n = cur[k]||0;
    return `<div class="ct-row">
      <span class="ct-name">${k}<b>${n}</b></span>
      <button class="ct-btn" onclick="act({type:'COUNTER_REMOVE',player:${p},zone:'${zone}',index:${idx},kind:${jsStr(k)},n:1});openCounterMenu(${p},'${zone}',${idx})">−</button>
      <button class="ct-btn add" onclick="act({type:'COUNTER_ADD',player:${p},zone:'${zone}',index:${idx},kind:${jsStr(k)},n:1});openCounterMenu(${p},'${zone}',${idx})">＋</button>
    </div>`;
  }).join("");
  sheet.innerHTML = `<div class="grip"></div>
    <h3 style="margin-bottom:4px">${c?cardName(c):"カード"} のカウンター</h3>
    <div class="meta" style="margin-bottom:10px">乗せる／取り除くカウンターを選んでください。</div>
    <div class="ct-list">${rows}</div>
    <div class="act-grid">
      <div class="act warn" onclick="act({type:'COUNTER_CLEAR',player:${p},zone:'${zone}',index:${idx}});closeSheet()">全て取り除く</div>
    </div>
    <button class="close" onclick="closeSheet()">閉じる</button>`;
  veil.classList.add("on");
}

/* =========================================================================
   デッキトップをめくる
   「デッキの上からN枚めくり、その中から選ぶ」系の処理に使う。
   選んだ後、残りをデッキに戻す（順番はトップ/ボトムを選べる）。
   ========================================================================= */
function openDeckTop(p, n, opts){
  const P = gameState.players[p];
  const want = Math.max(1, n||1);
  const count = Math.min(want, P.deck.length);
  if(!count){ showToast("デッキにカードがありません"); return; }
  const o = opts||{};
  DECKTOP_OPTS = {p, mode:o.mode||'hand', reason:o.reason||''};
  const top = P.deck.slice(0, count);
  const rows = top.map((c,i)=>{
    const db = dbOf(c);
    return `<div class="act pick-row" onclick="deckTopPick(${p},${count},${i},${jsStr(o.mode||'hand')},${jsStr(o.reason||'')})">
      <span class="pk-idx">${i+1}</span>
      <span class="pk-nm">${db.n||'カード'}</span>
      <span class="pk-sub">${subOf(c)}</span>
    </div>`;
  }).join("");

  // 枚数をその場で変えられるようにする（1枚から）
  const maxN = Math.min(10, P.deck.length);
  let btns = '';
  for(let k=1;k<=maxN;k++){
    btns += `<button class="dt-n ${k===count?'on':''}" onclick="openDeckTop(${p},${k},${jsVal(o)})">${k}</button>`;
  }

  sheet.innerHTML = `<div class="grip"></div>
    <h3 style="margin-bottom:4px">デッキトップ ${count}枚</h3>
    <div class="meta" style="margin-bottom:8px">
      ${o.note || `上から${count}枚をめくりました。1枚タップで${modeJp(o.mode||'hand')}。`}</div>
    <div class="dt-ctl">
      <span class="odds-note">めくる枚数</span>
      <div class="dt-nums">${btns}</div>
    </div>
    <div class="pick-list">${rows}</div>
    <div class="act-label">選んだカードの行き先</div>
    <div class="act-grid">
      <div class="act ${(o.mode||'hand')==='hand'?'fx':''}" onclick="openDeckTop(${p},${count},{mode:'hand'})">手札に加える</div>

function modeJp(m){

/* めくった中から複数枚まとめて処理する */
function deckTopAll(p, count, mode){
  closeSheet();
  const rs = "デッキトップ";
  // 後ろから処理して添字ズレを防ぐ
  for(let i=count-1;i>=0;i--){
    if(mode==='grave')  act({type:"FX_MILL", player:p, deckIndex:i, reason:rs});
    else                act({type:"FX_RETURN_DECK", player:p, zone:"deck", index:i, toBottom:true, reason:rs});
  }
}
/* めくった中から1枚を選ぶ。mode: 'hand'=手札に加える / 'grave'=墓地へ / 'summon'=特殊召喚 */
function deckTopPick(p, count, idx, mode, reason){
  closeSheet();
  const rs = reason || "デッキトップ";
  if(mode==='bottom')      act({type:"FX_RETURN_DECK", player:p, zone:"deck", index:idx, toBottom:true, reason:rs});
  else if(mode==='grave')  act({type:"FX_MILL",   player:p, deckIndex:idx, reason:rs});
  else if(mode==='summon') act({type:"FX_SPECIAL_SUMMON", player:p, from:"deck", fromIndex:idx, pos:"atk", reason:rs});
  else                     act({type:"FX_SEARCH", player:p, deckIndex:idx, reason:rs});
  // 残りはデッキに戻る扱い（FX_SEARCH/FX_MILL が内部でシャッフルする）
  logIt(gameState, `残りのカードをデッキに戻した`);
  render();
}

  act({type:"SHUFFLE", player:p});
}

    ${hasMod(c)?`<div class="mod-list">${c.mods.map(m=>

    <div class="act-label">攻撃力を上げる</div>

function applyMod(p, zone, idx, atk, def, label){

  if(!canModifyNow()){
    showToast("ダメージ計算時以降は攻守を変更できません");
    return;
  }
  act({type:"MOD_ADD", player:p, zone, index:idx, atk, def, until:'endTurn', label:label||'効果'});

function modCustom(p, zone, idx){

  act({type:"MOD_ADD", player:p, zone, index:idx, atk:a, def:d, until:'endTurn', label:'手動'});

/* =========================================================================
   ダメージステップ（マスタールール2・1103当時裁定）
   出典：ダメステマニュアル 2026-05-01（原案 ohkami / 製作 さばえ）

     ① 開始時        … 「戦闘を行った時」の誘発。リバース効果もここで発動宣言
     ② ダメージ計算前  … 裏側守備をリバース。攻守変動フリーチェーンはここまで
     ③ ダメージ計算時  … ⅰ効果処理（オネスト・カルート）→ ⅱ攻守確定 →
                        ⅲダメージ確定 → ⅳダメージ発生 → ⅴ戦闘破壊確定
                        発動できるのは ⅰ のみ。ⅱ以降は自動処理
     ④ ダメージ計算後  … 「ダメージ計算後」指定・戦闘ダメージ起点の誘発
     ⑤ 追加誘発解決    … 戦闘破壊されたモンスターが場を離れ、それを起点とする誘発
     ⑥ 終了時        … 「ダメージステップ終了時に○○する」効果

   フラグの意味
     quickMod  … フリーチェーンの攻守変動を発動できるか（②まで）
     dsOnly    … ダメージステップ限定の効果を発動できるか（③-ⅰまで）
     counter   … カウンター罠を発動できるか
     destroyed … 戦闘破壊が確定しているか（③-ⅴ以降）
                 確定したモンスターは永続効果を出さず、効果の対象にも取れない
   ========================================================================= */
const DAMAGE_STEPS = [
  { key:'start',  jp:'① ダメージステップ開始時', quickMod:true,  dsOnly:true,  counter:true,  destroyed:false },
  { key:'before', jp:'② ダメージ計算前',         quickMod:true,  dsOnly:true,  counter:true,  destroyed:false },
  { key:'calc',   jp:'③ ダメージ計算時',         quickMod:false, dsOnly:true,  counter:true,  destroyed:true  },
  { key:'after',  jp:'④ ダメージ計算後',         quickMod:false, dsOnly:false, counter:true,  destroyed:true  },
  { key:'leave',  jp:'⑤ 追加誘発解決',           quickMod:false, dsOnly:false, counter:true,  destroyed:true  },
  { key:'end',    jp:'⑥ ダメージステップ終了時', quickMod:false, dsOnly:false, counter:true,  destroyed:true  },
];
function dsInfo(key){ return DAMAGE_STEPS.find(d=>d.key===key) || DAMAGE_STEPS[0]; }

/* 攻撃の進行状態。null なら戦闘中ではない。 */
function startBattle(p, atkIdx, target){
  gameState.battle = {
    player:p, atkIdx, target,
    step:'start',
    flipped:false,      // ②ダメージ計算前にリバースしたか
    flippedCard:null,   // リバースしたモンスターの実体（⑤で場を離れても追う）
    flipResolved:false, // ⑤でリバース効果を処理したか
    resolved:false,     // ③ダメージ計算を行ったか
    battled:false,      // ③-ⅱに入り「戦闘を行った」が確定したか
    defPosAtCalc:null,  // ③-ⅱ突入時の攻撃対象の表示形式
    cleaned:false,      // ⑤で戦闘破壊モンスターを場から取り除いたか
  };
}
function battleStepIndex(){
  const b = gameState.battle;
  return b ? DAMAGE_STEPS.findIndex(d=>d.key===b.step) : -1;
}

/* いま攻守増減を発動できるか。
   フリーチェーンの攻守変動は②ダメージ計算前まで。
   オネスト・カルートのような「ダメージステップ限定の効果」は
   ③-ⅰ ダメージ計算時まで発動できる（damageStepOnly:true を宣言する）。 */
function canModifyNow(){
  const b = gameState.battle;
  if(!b) return true;                 // 戦闘中でなければ制限なし
  const info = dsInfo(b.step);
  if(ACTIVE_SCRIPT && ACTIVE_SCRIPT.damageStepOnly) return info.dsOnly;
  return info.quickMod;
}
/* 戦闘破壊が確定しているモンスターか。
   確定後は永続効果を出さず、効果の対象にも取れない（③-ⅴ以降）。 */
function battleDestroyConfirmed(card){
  return !!(card && card.battleDestroyed);
}
/* 場に残ったままの戦闘破壊確定モンスターがあるか */
function hasPendingBattleDestroy(){
  return gameState.players.some(P=>(P.mz||[]).some(c=>c && c.battleDestroyed));
}

/* =========================================================================
   同一タイミングで複数の誘発効果が発動した場合のチェーン処理順（SEGOC）
   ダメステマニュアルの原則：
     1. ターンプレイヤーの強制の誘発効果
     2. 非ターンプレイヤーの強制の誘発効果
     3. ターンプレイヤーの任意の誘発効果
     4. 非ターンプレイヤーの任意の誘発効果
   同じ区分の中の順番は、そのカードのコントローラーが決められる。
   ========================================================================= */
/* 公開領域の強制の誘発即時効果は、チェーン1のカードに対し
   必ずチェーン2として強制的に介入する。そのため、カウンター罠を
   チェーン1に対して発動することはできない（当時裁定）。 */
function forcedQuickWaiting(){
  return continuousSources().some(src => src.sc.forcedQuick === true);
}
function canActivateCounterTrap(){
  const chain = gameState.chain || [];
  if(chain.length !== 1) return true;        // チェーン1以外は通常どおり
  return !forcedQuickWaiting();
}

function segocRank(entry, turnPlayer){
  const forced = entry.forced ? 0 : 2;
  const nonTP  = (entry.player === turnPlayer) ? 0 : 1;
  return forced + nonTP;               // 0=TP強制 1=非TP強制 2=TP任意 3=非TP任意
}
/* entries: [{player, forced, name, ...}] を処理順に並べ替える。
   同順位内は元の並び（＝コントローラーの指定順）を保つ安定ソート。 */
function orderSimultaneous(entries, turnPlayer){
  const tp = (turnPlayer != null) ? turnPlayer : gameState.activePlayer;
  return entries
    .map((e,i)=>({e, i, r:segocRank(e, tp)}))
    .sort((a,b)=> a.r - b.r || a.i - b.i)
    .map(x=>x.e);
}

/* ②でリバースした攻撃対象を探す。
   ⑤の時点で墓地や除外に移動していても、リバース効果はフィールドで
   発動した扱いになるため、盤面外まで含めて追跡する。 */
function flippedDefender(b, fo){
  const P = gameState.players[fo];
  const onField = (P.mz||[])[b.target];
  if(onField) return onField;
  if(b.flippedCard) return b.flippedCard;
  return null;
}

/* ダメージステップを1段階進める。各段階で必要な処理と誘発を挟む。 */
function advanceDamageStep(){
  const b = gameState.battle;
  if(!b) return;
  const i = battleStepIndex();
  if(i >= DAMAGE_STEPS.length-1){ endBattle(); return; }

  // 次の段階へ進み、その段階に「入った時」の処理を行う
  b.step = DAMAGE_STEPS[i+1].key;
  enterDamageStep();
}

/* 現在の段階に入った時の自動処理を行う */
function enterDamageStep(){
  const b = gameState.battle;
  if(!b) return;

  /* ① ダメージステップ開始時に誘発する効果（カタストル・グラン・モール等） */
  if(b.step==='start'){
    if(afterDamageStep('start')){ DS_PENDING_UI = true; return; }
  }

  /* ② ダメージ計算前：裏側守備モンスターをリバースする（効果はまだ発動しない） */
  if(b.step==='before' && !b.flipped && b.target!=='direct'){
    const fo = b.player===0?1:0;
    const def = gameState.players[fo].mz[b.target];
    if(def && def.face==='down'){
      act({type:"FX_SET_STATE", player:fo, zone:'mz', index:b.target,
           face:'up', reason:'ダメージ計算前のリバース'});
      b.flipped = true;
      b.flippedCard = gameState.players[fo].mz[b.target] || def;
      showToast("裏側守備モンスターをリバース（効果は⑤追加誘発解決で発動）");
    }
  }

  /* ③ ダメージ計算時：実際に計算する */
  if(b.step==='calc' && !b.resolved){
    /* ③-ⅱ 攻守確定（戦闘突入）。
       この時点で「戦闘を行った」が確定し、以降に攻撃対象が消えても
       《剣闘獣》等の条件を満たす。表示形式もここの値を参照する。 */
    b.battled = true;
    if(b.target !== 'direct'){
      const def = gameState.players[b.player===0?1:0].mz[b.target];
      b.defPosAtCalc = def ? (def.face==='down' ? 'down' : def.pos) : null;
    }
    /* ③-ⅲ〜ⅴ ダメージ発生と戦闘破壊確定。破壊は確定するだけで場には残る */
    act({type:"ATTACK", player:b.player, atkIdx:b.atkIdx, target:b.target});
    b.resolved = true;
  }

  /* ⑤ 追加誘発解決：戦闘破壊されたモンスターが場を離れ、それを起点に誘発する。
     リバース効果もここで発動・処理する。②でリバースした事実があれば、
     この時点での存在場所を問わずフィールドで発動した扱いになる（当時裁定）。 */
  if(b.step==='leave'){
    /* まず戦闘破壊が確定したモンスターが実際に場を離れる */
    if(!b.cleaned){
      b.cleaned = true;
      act({type:"BATTLE_CLEANUP"});
    }
    /* 割拠・御前による墓地送りはCBを作らずここで処理する。
       その後にリバース効果を処理するため、スキルドレインを貫通する。 */
    if(enforceExclusions()){ DS_PENDING_UI = true; return; }
    if(b.flipped && !b.flipResolved){
      b.flipResolved = true;
      const fo = b.player===0?1:0;
      const def = flippedDefender(b, fo);
      if(def){
        const nm = cardName(def);
        const sc = CARD_SCRIPTS[nm];
        if(sc && sc.passive && sc.passive.onFlip){
          if(emitEvent("onFlip", {player:fo, name:nm})) DS_PENDING_UI = true;
          renderBattle(); return;
        }
      }
    }
    if(afterDamageStep()){ DS_PENDING_UI = true; return; }
  }

  /* ④ ダメージ計算後：「ダメージ計算後」指定と戦闘ダメージ起点の誘発 */
  if(b.step==='after'){
    if(afterDamageStep('after')){ DS_PENDING_UI = true; return; }
  }

  renderBattle();
}

function endBattle(){
  const b = gameState.battle;
  const foe = b ? (b.player===0?1:0) : null;
  // ⑤を経ずに戦闘を終えた場合でも、破壊確定モンスターを場に残さない
  if(b && !b.cleaned && hasPendingBattleDestroy()) act({type:"BATTLE_CLEANUP"});
  gameState.battle = null;
  closeSheet();
  render();
  // 戦闘の結果を受けて相手が撃てるようになることがある
  if(foe!=null) offerReactAfter(foe);
}

/* 戦闘の進行画面。今どの段階かと、そこで何ができるかを出す。 */
function renderBattle(){
  const b = gameState.battle;
  if(!b){ closeSheet(); render(); return; }
  const info = dsInfo(b.step);
  const P = gameState.players[b.player];
  const oppP = gameState.players[b.player===0?1:0];
  const atk = P.mz[b.atkIdx];
  const def = (b.target!=='direct') ? oppP.mz[b.target] : null;
  const foe = b.player===0?1:0;

  const steps = DAMAGE_STEPS.map((d,i)=>{
    const cur = d.key===b.step;
    const done = i < battleStepIndex();
    return `<span class="ds-step ${cur?'on':''} ${done?'done':''}">${i+1}</span>`;
  }).join('<span class="ds-arrow">›</span>');

  const atkTxt = atk ? `${cardName(atk)}（攻${curATK(atk)}）` : '—';
  const defTxt = def ? `${cardName(def)}（${def.pos==='def'?'守'+curDEF(def):'攻'+curATK(def)}）`
                     : (b.target==='direct' ? '直接攻撃' : '—');

  const modNote = info.canMod
    ? `<span class="ds-ok">攻守増減が使えます</span>`
    : `<span class="ds-ng">攻守増減はもう使えません</span>`;

  const myN = reactableCards(b.player).length;
  const foeN = reactableCards(foe).length;
  const reactRow = (myN || foeN) ? `
    <div class="act-label">この段階で割り込む</div>
    <div class="act-grid">
      ${foeN?`<div class="act" style="background:var(--trap);color:#120a1f;border-color:var(--trap)"
        onclick="closeSheet();openReactFor(${foe})">${nameOf(foe)} ${foeN}枚</div>`:''}
      ${myN?`<div class="act" onclick="closeSheet();openReactFor(${b.player})">自分 ${myN}枚</div>`:''}
    </div>` : "";

  const last = gameState.lastBattle;
  const result = (b.resolved && last) ? `
    <div class="ds-result">
      ${last.damage?`ダメージ ${last.damage} → ${nameOf(last.toPlayer)}`:'ダメージなし'}
      ${last.destroyedDef?' ／ 相手モンスター破壊':''}
      ${last.destroyedAtk?' ／ 自分モンスター破壊':''}
    </div>` : "";

  sheet.innerHTML = `<div class="grip"></div>
    <div class="ds-bar">${steps}</div>
    <h3 style="margin-bottom:4px">${info.jp}</h3>
    <div class="ds-vs">${atkTxt}<span class="ds-x">▶</span>${defTxt}</div>
    <div class="ds-note">${modNote}</div>
    ${result}
    ${reactRow}
    <div class="act-grid wide">
      <div class="act fx" onclick="advanceDamageStep()">
        ${b.step==='end' ? '戦闘を終える' : '次へ ▸ '+dsInfo(DAMAGE_STEPS[battleStepIndex()+1].key).jp}</div>
      ${b.step==='start' ? `<div class="act" onclick="cancelBattle()">攻撃を取りやめる</div>` : ''}
      ${b.step!=='start' ? `<div class="act" onclick="skipToEnd()">まとめて処理する</div>` : ''}
    </div>`;
  veil.classList.add("on");
  render();
}
function cancelBattle(){
  const b = gameState.battle;
  if(b){
    const P = gameState.players[b.player];
    if(P.mz[b.atkIdx]) P.mz[b.atkIdx].attacked = false;
  }
  gameState.battle = null;
  closeSheet(); render();
  showToast("攻撃を取りやめました");
}
/* 残りの段階を一気に処理する（テンポ重視の時用）。
   誘発の確認が出たらそこで止まる。 */
let DS_PENDING_UI = false;
function skipToEnd(){
  let guard = 0;
  while(gameState.battle && guard++ < 8){
    const before = gameState.battle.step;
    DS_PENDING_UI = false;
    advanceDamageStep();
    if(!gameState.battle) break;
    if(DS_PENDING_UI) break;                      // 誘発の確認が出たら止める
    if(gameState.battle.step === before) break;
  }
}

function activateFromHand(i){
  const p = gameState.activePlayer;

  const c = P.hand[i]; const db = dbOf(c);
  const nm = db.n||"";

  if(to==="field" && P.field){ showToast("フィールドゾーンが埋まっています"); return; }
  closeSheet();
  act({type:"MOVE", player:p, from:"hand", fromIndex:i, to, face:"up"});
  // 場に出した「後」の位置を取る（先に取ると -1 になり、自身を墓地へ送れない）
  const P2 = gameState.players[p];
  const idx = (to==="field") ? 0 : P2.sz.length-1;

  logIt(gameState, `<b>${nm}</b> を発動`);

/* ---- 新プリミティブを使う UI ラッパ ---- */
/* このモンスターの通常召喚に必要なリリース数。
   レベル5-6は1体、7以上は2体。特例は tributeOverride で調整する。 */
function tributesNeeded(db, p){
  const lv = db.lv || 0;
  let n = lv >= 7 ? 2 : (lv >= 5 ? 1 : 0);
  // 歯車街：「アンティーク・ギア」の必要リリースを1体少なくできる
  if(n > 0 && String(db.n||'').indexOf('古代の機械') >= 0 && gearTownActive()) n -= 1;
  return Math.max(0, n);
}

/* リリース数を選べるカードの選択肢。
   神獣王バルバロスは 0体（元々の攻撃力1900）／通常の2体／3体（相手の場を全破壊）。 */
const TRIBUTE_OPTIONS = {
  '神獣王バルバロス': [
    {n:0, label:'リリースなしで召喚（元々の攻撃力1900）'},
    {n:2, label:'2体リリースして召喚'},
    {n:3, label:'3体リリースして召喚（相手フィールドを全破壊）'},
  ],
};
function tributeOptionsFor(db, p){
  const opts = TRIBUTE_OPTIONS[String(db.n||'')];
  if(!opts) return null;
  const avail = tributeCandidates(p).length;
  const usable = opts.filter(o=>o.n <= avail);
  return usable.length > 1 ? usable : null;   // 選択肢が1つなら聞かない
}
function gearTownActive(){
  return gameState.players.some(P=>P.field && P.field.face==='up' &&
    dbOf(P.field).n === '歯車街');
}

/* リリース候補（自分フィールドのモンスター） */
function tributeCandidates(p){
  return API.fieldCards({zone:'mz', player:p, filter:x=>x.card && !x.card.cannotTribute});
}

function doNormalSummon(i, pos){
  const p = gameState.activePlayer;
  const db = CARD_DB[gameState.players[p].hand[i]?.id] || {};
  // リリース数を選べるカードは、まず方法を選んでもらう
  const opts = tributeOptionsFor(db, p);
  if(opts){
    API.selectCard(`${db.n}：召喚方法`,
      opts.map((o,k)=>({p, zone:'declare', index:k, card:null, db:{n:o.label}, n:o.n})),
      pick=>{
        if(pick.n === 0){ finishNormalSummon(i, pos, 0); return; }
        pickTributes(p, pick.n, [], ()=>finishNormalSummon(i, pos, pick.n), db);
      });
    return;
  }
  const need = tributesNeeded(db, p);
  if(need > 0){
    // 先にリリースするモンスターを選ばせてから召喚する
    pickTributes(p, need, [], ()=>finishNormalSummon(i, pos, need), db);
    return;
  }
  finishNormalSummon(i, pos, 0);
}

/* need 体になるまでリリース対象を選ばせる */
function pickTributes(p, need, chosen, onDone, db){
  const left = tributeCandidates(p).filter(x=>chosen.indexOf(x.card) < 0);
  if(chosen.length >= need){
    // 選び終わったので実際にリリースする（添字がずれないよう実体で消す）
    chosen.forEach(c=>{
      const loc = locateCard(c);
      if(loc) act({type:"FX_TO_GRAVE", player:loc.p, zone:loc.zone, index:loc.index,
                   reason:"アドバンス召喚のリリース", byDestroy:false});
    });
    onDone();
    return;
  }
  if(left.length < need - chosen.length){
    showToast(`リリースできるモンスターが足りません（${need}体必要）`);
    render(); return;
  }
  API.selectCard(`${db.n||'アドバンス召喚'}：リリースするモンスター（${chosen.length+1}/${need}）`,
    left, x=>{ chosen.push(x.card); pickTributes(p, need, chosen, onDone, db); });
}

function fromHand(i, to, face, pos){
  // ゾーン制限チェック
  const p = gameState.activePlayer;
  const P = gameState.players[p];
  if(ZONE_LIMITS[to] && P[to].length>=ZONE_LIMITS[to] && to!=="field"){
    showToast(`${zoneJp(to)}ゾーンは${ZONE_LIMITS[to]}枚までです`); return;
  }
  if(to==="field" && P.field){ showToast("フィールド魔法ゾーンは1枚までです"); return; }
  const nm = (CARD_DB[P.hand[i]?.id]||{}).n || "";
  act({type:"MOVE", player:p, from:"hand", fromIndex:i, to, face:face||"up", pos:pos||"atk"});
  closeSheet();
  if(to==="mz" && (face||"up")==="up" && nm){
    // 召喚に対して激流葬・奈落などを撃てるので確認する
    askChain(`${nm} の召喚`, ()=>offerSummonTrigger(p, nm));

/* 手札から魔法罠を発動：ゾーンへ置いてからチェーンに積む */
function handActivate(i){
  const p = gameState.activePlayer;
  const P = gameState.players[p];
  const c = P.hand[i]; const db = dbOf(c);
  const ss = spellSpeed(db);
  if(!canChainOnto(ss)){ alert(`スペルスピードが足りません（このカードSS${ss}）`); return; }
  const to = db.sub==="フィールド" ? "field" : "sz";
  if(to==="sz" && P.sz.length>=ZONE_LIMITS.sz){ alert("魔法罠ゾーンは5枚までです"); return; }
  if(to==="field" && P.field){ alert("フィールド魔法ゾーンは1枚までです"); return; }
  act({type:"MOVE", player:p, from:"hand", fromIndex:i, to, face:"up"});
  const idx = to==="field" ? 0 : P.sz.length-1;
  act({type:"CHAIN_ADD", player:p, cardId:c.id, name:db.n, ss, from:to, index:idx});
  closeSheet();
  openChain();
}

/* 場のカードをタップ（一人回し用：両サイドとも操作可） */
function openZone(p, zone, idx){
  const P = gameState.players[p];
  const c = zoneCard(P, zone, idx); if(!c) return;
  const db = dbOf(c);
  const isMon = db.k==='m';
  const faceUp = c.face==='up';
  const canAttack = isMon && faceUp && c.pos==='atk';
  const R = rules();
  const ph = phaseJp(gameState.phase);
  const blockedBtn = (label, why)=>
    `<div class="act blocked" onclick="showToast('${why}')">${label}<span class="bk">${ph}不可</span></div>`;

  // 攻撃（表側攻撃表示モンスター、かつバトルフェイズのみ）
  const already = !!c.attacked;
  const attack = !canAttack ? ""
    : (!R.attack ? blockedBtn("攻撃宣言", whyBlocked('attack'))
      : already  ? blockedBtn("攻撃宣言", "このモンスターは既に攻撃しています")
      : `<div class="act" onclick="beginAttack(${p},${idx})">攻撃宣言</div>`);
  // 無効化・攻撃済みの状態表示
  const flags = [];
  if(c.attacked) flags.push('攻撃済');
  if(c.negated)  flags.push('無効');
  const flagNote = flags.length ? `<div class="flag-note">${flags.join(' / ')}</div>` : "";

  // 効果発動。自動処理できるカードは⚡付きで最優先に出す
  const nm = db.n||"";
  const eff = hasEffect(nm);
  const keep = (db.sub==="永続" || db.sub==="フィールド" || db.sub==="装備");
  const canAct = canActivateNow(db);
  const actWhy = `${ph}では通常魔法・起動効果は発動できません（速攻魔法・罠のみ）`;
  const autoAct = !eff ? ""
    : (canAct
        ? `<div class="act fx" onclick="activateFromZone(${p},'${zone}',${idx})">⚡ 効果を発動（自動処理）</div>`
        : blockedBtn("⚡ 効果を発動", actWhy));
  // カウンター操作（魔力カウンター等）
  const ctNow = c.counters ? Object.entries(c.counters).map(([k,v])=>`${k}${v}`).join(" / ") : "";
  // 攻守の増減（継続効果）
  const modNow = hasMod(c) ? `（現在 攻${curATK(c)}/守${curDEF(c)}）` : "";
  const modRow = (isMon && faceUp) ? `
    <div class="act-label">攻守の増減${modNow}</div>
    <div class="act-grid">
      <div class="act" onclick="openModMenu(${p},'${zone}',${idx})">数値を変更…</div>

    </div>` : "";

  const counterRow = `
    <div class="act-label">カウンター${ctNow?`（現在：${ctNow}）`:""}</div>
    <div class="act-grid">

      <div class="act" onclick="closeSheet();act({type:'COUNTER_REMOVE',player:${p},zone:'${zone}',index:${idx},kind:'魔力',n:1})">魔力 −1</div>
      <div class="act" onclick="openCounterMenu(${p},'${zone}',${idx})">他のカウンター…</div>

    </div>`;

  // エクシーズ素材の取り除き
  const detach = (zone==="mz" && c.xyz && c.xyz.length)
    ? `<div class="act" onclick="closeSheet();act({type:'FX_DETACH',player:${p},mzIndex:${idx},reason:'効果コスト'})">素材を1つ取り除く（残${c.xyz.length}）</div>`
    : "";
  const activate = !(!isMon || faceUp) ? ""
    : (canAct
        ? `<div class="act" onclick="chainAddFromZone(${p},'${zone}',${idx})">効果を発動（チェーンへ）</div>`
        : blockedBtn("効果を発動（チェーンへ）", actWhy));

  const state = `
    ${c.face==='down'?`<div class="act" onclick="zAct('FLIP',${p},'${zone}',${idx})">表にする（反転）</div>`:""}
    ${isMon?`<div class="act" onclick="zAct('TOGGLE_POS',${p},'${zone}',${idx})">表示形式を変更</div>`:""}
    ${isMon&&faceUp?`<div class="act" onclick="closeSheet();act({type:'FX_SET_STATE',player:${p},zone:'${zone}',index:${idx},face:'down',pos:'def',reason:'裏側守備に'})">裏側守備にする</div>`:""}
    ${isMon&&!faceUp?`<div class="act" onclick="closeSheet();doFlipUp(${p},'${zone}',${idx},'def')">表にする（守備）</div>`:""}
    ${isMon&&!faceUp?`<div class="act" onclick="closeSheet();doFlipUp(${p},'${zone}',${idx},'atk')">反転召喚（攻撃）</div>`:""}`;
  const move = `
    <div class="act" onclick="zMove(${p},'${zone}',${idx},'grave')">墓地へ</div>
    <div class="act" onclick="zMove(${p},'${zone}',${idx},'banish')">除外</div>
    <div class="act" onclick="zMove(${p},'${zone}',${idx},'hand')">手札へ</div>
    <div class="act" onclick="zMove(${p},'${zone}',${idx},'deck')">デッキ上へ</div>`;

  const manual = `<div class="act" onclick="closeSheet();openPrimitives(${p},'${zone}',${idx},${jsStr(db.n||'')})">手動で効果処理…</div>`;
  const primary = autoAct + detach + attack + activate + manual;
  const hasPrimary = primary.trim().length>0;
  const hasState = state.trim().length>0;
  sheet.innerHTML = metaHead(db) +
    `<div class="phase-note">${ph}：${R.note}${db.k!=='m'?`<span class="ss-tag">SS${spellSpeedOf(db)}</span>`:""}</div>` + flagNote +
    (eff?`<div class="fx-note">このカードは効果を自動処理できます${clNote(p, db.n)}</div>`:"") +
    (hasPrimary ? `<div class="act-label">アクション</div><div class="act-grid">${primary}</div>` : "") +

}

/* 場のカードの効果を自動処理。セット状態なら表にしてから発動 */
function activateFromZone(p, zone, idx){
  const P = gameState.players[p];
  const c = zoneCard(P, zone, idx); if(!c) return;
  const db = dbOf(c);
  const nm = db.n||"";
  closeSheet();
  if(c.face==='down'){
    act({type:"FX_SET_STATE", player:p, zone, index:idx, face:"up", reason:"発動"});
  }
  const keep = (db.sub==="永続" || db.sub==="フィールド" || db.sub==="装備" || db.k==='m');
  logIt(gameState, `<b>${nm}</b> の効果を発動`);
  render();
  askChain(`${nm} の効果発動`, ()=>{ runEffect(p, nm, {zone, index:idx, keep}); render(); });
}
function zAct(type,p,zone,index){ act({type, player:p, zone, index}); closeSheet(); }
function zMove(p,zone,idx,to){
  const P=gameState.players[p];
  if(ZONE_LIMITS[to] && to!=="field" && P[to].length>=ZONE_LIMITS[to]){ alert(`${zoneJp(to)}は${ZONE_LIMITS[to]}枚まで`); return; }
  act({type:"MOVE", player:p, from:zone, fromIndex:idx, to, face:to==="deck"?"down":"up"});
  closeSheet();
}

/* ================= 攻撃（戦闘専用UI） ================= */
function beginAttack(p, atkIdx){
  const oppP = gameState.players[p===0?1:0];
  const atkCard0 = gameState.players[p].mz[atkIdx];
  const atkDB = dbOf(atkCard0);
  const aATK = curATK(atkCard0);
  // 対象候補：相手モンスター（表側／裏側とも）＋直接攻撃（相手モンスターが0なら）
  let targets = "";
  oppP.mz.forEach((c,i)=>{
    const db=dbOf(c);
    const faceUp = c.face==='up';
    let cmp="", name;
    if(faceUp){
      const defending = c.pos==='def';
      const dVal = defending ? curDEF(c) : curATK(c);
      name = `${db.n}`;
      // 結果プレビュー
      let out;
      if(defending){
        out = aATK>dVal ? "破壊" : aATK<dVal ? `反射${dVal-aATK}` : "変化なし";
      } else {
        out = aATK>dVal ? `破壊+${aATK-dVal}` : aATK<dVal ? `自壊-${dVal-aATK}` : "相打ち";
      }
      cmp = `<span style="font-size:10px;color:var(--text-dim)"> ${defending?'守':'攻'}${dVal} → <b style="color:var(--gold-hi)">${out}</b></span>`;
    } else {
      name = "裏側のカード";
      cmp = `<span style="font-size:10px;color:var(--text-dim)"> 裏守備（要リバース処理）</span>`;
    }
    targets += `<div class="act" style="justify-content:flex-start;text-align:left" onclick="doAttack(${p},${atkIdx},${i})">${name}${cmp}</div>`;
  });
  const directOK = oppP.mz.length===0;
  const direct = directOK
    ? `<div class="act" onclick="doAttack(${p},${atkIdx},'direct')">直接攻撃（${aATK}ダメージ）</div>`
    : `<div class="act" style="opacity:.4">直接攻撃（相手モンスターがいる）</div>`;
  // 攻撃宣言時は相手の伏せに注意（1103はここが読み合いの山場）
  const rp = p===0?1:0;
  const rn = reactableCards(rp).length;
  const warn = rn
    ? `<div class="react-warn" onclick="openReact()">
         ${nameOf(rp)}は伏せカードを${rn}枚持っています — タップして割り込み
       </div>` : "";
  sheet.innerHTML = `<div class="grip"></div>
    <div class="bt-row"><span class="a-atk">${atkDB.n}</span><span class="vs">攻 ${aATK} で攻撃</span></div>
    ${warn}
    <div class="meta" style="margin-bottom:10px;text-align:center">対象を選ぶと戦闘処理・ダメージまで自動反映します（1103準拠）</div>
    ${targets? `<div class="act-label">相手モンスターへ</div><div class="act-grid wide">${targets}</div>`:""}
    <div class="act-label">プレイヤーへ</div><div class="act-grid">${direct}</div>
    <button class="close" onclick="closeSheet()">やめる</button>`;
  veil.classList.add("on");
}


/* 相手が発動できるカードを持っていれば、その場で促す。

function offerReactAfter(foe){

      <div class="act-grid wide">

             onclick="closeSheet();openReactFor(${foe})">発動する</div>
        <div class="act" onclick="closeSheet()">発動しない</div>

/* ダメージ計算後の誘発をまとめて処理する。
   直前の戦闘内容(gs.lastBattle)を見て、該当するカードだけ候補に出す。 */
/* 戦闘に参加したカードか判定する。
   破壊されて墓地に行くと実体が変わるので、名前と持ち主でも照合する。 */
function inBattle(ctx, b){
  if(!b) return false;
  if(b.atkCard===ctx.card || b.defCard===ctx.card) return true;
  const nm = cardName(ctx.card);
  if(ctx.p===b.atkOwner && nm===b.atkName && b.destroyedAtk) return true;
  if(ctx.p===b.defOwner && nm===b.defName && b.destroyedDef) return true;
  if(ctx.player===b.atkOwner && nm===b.atkName && b.destroyedAtk) return true;
  if(ctx.player===b.defOwner && nm===b.defName && b.destroyedDef) return true;
  return false;
}

/* ダメージステップ中の誘発候補を集めて提示する。
   stepKey ごとに担当する効果が違うので、二重提示にならないよう振り分ける。
     'start'  ① ダメージステップ開始時（カタストル・グラン・モール等）
     'after'  ④ ダメージ計算後（ゴーズ・メロウガイスト等、戦闘ダメージ起点）
     'leave'  ⑤ 追加誘発解決（戦闘破壊した/された・墓地へ送られた・リクルーター）
   スクリプトは dsTiming で宣言する。未指定は ⑤ を既定とする。 */
function afterDamageStep(stepKey){
  const want = stepKey || 'leave';
  const lb = gameState.lastBattle;
  if(!lb) return false;
  const cands = [];
  [0,1].forEach(p=>{
    const P = gameState.players[p];
    const scan = (zone, arr)=>{
      (arr||[]).forEach((c,i)=>{
        if(!c) return;
        const nm = dbOf(c).n;
        const sc = CARD_SCRIPTS[nm];
        const h = sc && sc.passive && sc.passive.onDamageStep;
        if(!h) return;
        if((sc.dsTiming || 'leave') !== want) return;
        const ctx = makeContext(p, c, zone, i, "onDamageStep", {battle:lb, step:want});
        let ok=false;
        try{ ok = h(ctx); }catch(e){ ok=false; }
        if(ok) cands.push({p, zone, index:i, card:c, name:nm});
      });
    };
    scan('mz', P.mz);
    scan('grave', P.grave);
  });
  if(!cands.length){ return false; }
  setTimeout(()=>{
    const rows = cands.map((c,i)=>
      `<div class="act pick-row" onclick="__dsPick(${i})">
         <span class="pk-nm">${c.name}</span>
         <span class="pk-sub">${nameOf(c.p)}・${zoneJp(c.zone)}</span>
       </div>`).join("");
    sheet.innerHTML = `<div class="grip"></div>
      <h3 style="margin-bottom:4px">${dsInfo(want).jp}</h3>
      <div class="meta" style="margin-bottom:10px">誘発する効果があります。発動しますか？</div>
      <div class="pick-list">${rows}</div>
      <button class="close" onclick="__dsSkip()">発動しない</button>`;
    DS_CANDS = cands;
    veil.classList.add("on");
  }, 60);
  return true;
}
let DS_CANDS=[], DS_AFTER=null;
function __dsPick(i){
  const c = DS_CANDS[i]; DS_CANDS=[];
  closeSheet();
  if(c) runScript(c.name, c.p, c.zone, c.index, {battle:gameState.lastBattle});
  const f=DS_AFTER; DS_AFTER=null; if(f) f();
}
function __dsSkip(){
  DS_CANDS=[]; closeSheet();
  const f=DS_AFTER; DS_AFTER=null; if(f) f();
}


function doAttack(p, atkIdx, target){
  closeSheet();
  const atkName = cardName(gameState.players[p].mz[atkIdx]) || "モンスター";
  const foe = p===0?1:0;
  const go = ()=>{
    // 攻撃宣言が通ったらダメージステップに入る（5段階を順に進める）
    if(gameState.players[p].mz[atkIdx]) gameState.players[p].mz[atkIdx].attacked = true;
    startBattle(p, atkIdx, target);
    renderBattle();
  };
  // 攻撃宣言に誘発するカード（ミラーフォース・次元幽閉など）を先に提示
  EVT_AFTER = go;
  if(!emitEvent("onAttackDeclare", {player:p, atkIdx, target, name:atkName})){
    EVT_AFTER = null;
    askChain(`${atkName} の攻撃宣言`, go);
  }
}

/* ================= チェーン（手動・スペルスピード判定） ================= */
/* SS判定：カウンター罠=3、速攻魔法/通常罠/永続罠=2、それ以外(通常/永続/装備/フィールド魔法・モンスター効果)=1 */
function spellSpeed(db){
  if(db.k==='t'){ return db.sub==='カウンター' ? 3 : 2; }      // 罠は最低SS2、カウンターはSS3
  if(db.k==='s'){ return db.sub==='速攻' ? 2 : 1; }            // 速攻魔法のみSS2
  return 1;                                                     // モンスター効果は簡易的にSS1扱い
}
/* チェーンに新しく積めるか：既存の一番上のSS以上でなければ乗せられない */
function canChainOnto(ss){
  if(!gameState.chain.length) return true;
  const top = gameState.chain[gameState.chain.length-1];
  return ss >= top.ss;
}
function chainAddFromZone(p, zone, idx){
  const c = zoneCard(gameState.players[p], zone, idx);
  const db = dbOf(c);
  const ss = spellSpeed(db);
  if(!canChainOnto(ss)){
    alert(`スペルスピードが足りません（このカードSS${ss} / 現在チェーン上はSS${gameState.chain[gameState.chain.length-1].ss}）`);
    return;
  }
  // 表側でなければ発動時に表にする（セット→発動）
  if(c.face==='down'){ c.face='up'; }
  act({type:"CHAIN_ADD", player:p, cardId:c.id, name:db.n, ss, from:zone, index:idx});
  closeSheet();
  openChain();
}
function chainAddFromHand(i){
  const p = gameState.activePlayer;
  const c = gameState.players[p].hand[i];
  const db = dbOf(c);
  const ss = spellSpeed(db);
  if(!canChainOnto(ss)){
    alert(`スペルスピードが足りません（このカードSS${ss}）`);
    return;
  }
  act({type:"CHAIN_ADD", player:p, cardId:c.id, name:db.n, ss, from:"hand", index:i});
  closeSheet();
  openChain();
}
/* チェーンパネル：積んだ順を見せ、逆順に1つずつ解決。
   次に解決するリンク（＝一番上＝末尾）を強調し、次のアクションを明示する。 */
function openChain(){
  const ch = gameState.chain;
  if(!ch.length){
    sheet.innerHTML = `<div class="grip"></div><h3>チェーン</h3>
      <div class="act-label">チェーンは積まれていません</div>
      <div class="meta" style="margin-bottom:12px">場・手札のカードの「効果を発動（チェーンへ）」で積みます。<br>速攻魔法・罠は相手ターンでも積めます（スペルスピード判定あり）。</div>
      <button class="close" onclick="closeSheet()">閉じる</button>`;
    veil.classList.add("on"); return;
  }
  const topIdx = ch.length-1;              // 次に解決するリンク
  const topLink = ch[topIdx];

  // チェーン1が下、最後に積んだリンクが上。次に解決するもの＝上を resolving 表示。
  let rows = "";
  for(let i=ch.length-1;i>=0;i--){
    const link = ch[i];
    const resolving = i===topIdx;
    const order = resolving ? "次に解決" : `${topIdx-i+1}番目に解決`;
    rows += `<div class="chain-link ${resolving?'resolving':''}">
      <span class="cl-no">${i+1}</span>
      <span class="cl-nm">${link.name}</span>
      <span class="cl-ss">SS${link.ss}</span>
      <span class="cl-who">${nameOf(link.player)}</span>
      <span class="cl-tag">${order}</span>
    </div>`;
  }

  const nextHint = `<div class="chain-next-hint">▶ 次に解決：チェーン${topIdx+1}「${topLink.name}」<br><span style="font-size:10px;color:var(--text-dim);font-weight:400">効果は手動で処理してから下のボタンで解決</span></div>`;

  sheet.innerHTML = `<div class="grip"></div>
    <h3 style="margin-bottom:8px">チェーン処理（${ch.length}）</h3>
    <div class="meta" style="margin-bottom:8px">チェーン1が最初に積まれた効果。解決は<b style="color:var(--gold-hi)">上（最後）から逆順</b>に1つずつ。</div>
    <div class="chain-list">${rows}</div>
    ${nextHint}
    <div class="act-grid wide">
      <div class="act" style="background:var(--spell);color:#0d0a06;border-color:var(--spell)" onclick="resolveChainStep()">チェーン${topIdx+1}「${topLink.name}」を解決 ▸</div>
    </div>
    <div class="act-label">その他</div>
    <div class="act-grid">
      <div class="act" onclick="closeSheet()">保留（閉じる）</div>
      <div class="act warn" onclick="if(confirm('チェーンを全て取り消します')){act({type:'CHAIN_CLEAR'});closeSheet();}">全て取消</div>
    </div>`;
  veil.classList.add("on");
}
/* 1つ解決して、残りがあれば次の解決画面を続けて出す（テンポ重視） */
function resolveChainStep(){
  act({type:'CHAIN_RESOLVE_TOP'});
  if(gameState.chain.length){ openChain(); }   // 続けて次を解決
  else { closeSheet(); }                        // 全解決したら閉じる
}

/* 山札系（デッキ/墓地/除外/EX）を開く */
function openPile(p, zone){
  const P = gameState.players[p];
  const list = P[zone];
  const canSee = zone!=="deck" || p===gameState.activePlayer; // デッキ中身は本来非公開だが操作台として自分のみ閲覧可
  let items = list.map((c,i)=>{
    const db=dbOf(c);
    const label = (zone==="deck" && p!==gameState.activePlayer) ? "（裏）" : (db.n||"?");
    return `<div class="act" onclick="pileAct(${p},'${zone}',${i})">${label}</div>`;
  }).join("") || `<div class="meta">カードなし</div>`;
  const head = `<div class="grip"></div><h3 style="margin-bottom:10px">${nameOf(p)} · ${zoneJp(zone)}（${list.length}）</h3>`;
  const tools = zone==="deck" && p===gameState.activePlayer
    ? `<div class="act-grid" style="margin-bottom:10px">
         <div class="act" onclick="act({type:'DRAW',player:${p},n:1});closeSheet()">1枚ドロー</div>
         <div class="act" onclick="act({type:'SHUFFLE',player:${p}});openPile(${p},'deck')">シャッフル</div>
       </div>`
    : "";
  sheet.innerHTML = head + tools +
    `<div class="act-label">カードをタップで手札／場へ</div>
     <div class="act-grid">${items}</div>
     <button class="close" onclick="closeSheet()">閉じる</button>`;
  veil.classList.add("on");
}
function pileAct(p, zone, i){
  const c = gameState.players[p][zone][i];
  const db = dbOf(c);
  const nm = db.n||"";
  const isMon = db.k==='m';
  // 墓地で発動できる効果を持つカードは⚡で出す
  // スクリプト宣言 or 効果テキスト推定で、このゾーンから発動できるか判定
  const sc = CARD_SCRIPTS[nm];
  const canHere = canActivateFromZone(db, zone);
  const graveFx = canHere
    ? (sc
        ? `<div class="act fx" onclick="closeSheet();runScript(${jsStr(nm)},${p},'${zone}',${i})">⚡ ${zoneJp(zone)}で効果を発動</div>`
        : `<div class="act fx" onclick="closeSheet();openPrimitives(${p},'${zone}',${i},${jsStr(nm)})">⚡ ${zoneJp(zone)}で効果を発動（手動）</div>`)
    : ((zone==="grave" && hasEffect(nm))
        ? `<div class="act fx" onclick="closeSheet();runEffect(${p},${jsStr(nm)},{zone:'grave',index:${i},keep:true})">⚡ 墓地で効果を発動</div>`
        : "");
  const ssBtn = isMon
    ? `<div class="act" onclick="closeSheet();act({type:'FX_SPECIAL_SUMMON',player:${p},from:'${zone}',fromIndex:${i},pos:'atk',reason:'${zoneJp(zone)}から'})">特殊召喚（攻撃）</div>
       <div class="act" onclick="closeSheet();act({type:'FX_SPECIAL_SUMMON',player:${p},from:'${zone}',fromIndex:${i},pos:'def',reason:'${zoneJp(zone)}から'})">特殊召喚（守備）</div>`
    : "";
  sheet.innerHTML = metaHead(db)+
    (graveFx?`<div class="act-label">効果</div><div class="act-grid wide">${graveFx}</div>`:"") +
    (ssBtn?`<div class="act-label">召喚</div><div class="act-grid">${ssBtn}</div>`:"") +
    `<div class="act-label">${zoneJp(zone)}から移動</div>
     <div class="act-grid">
       <div class="act" onclick="pileMove(${p},'${zone}',${i},'hand')">手札へ</div>

function pileMove(p,zone,i,to,face,pos){

/* テストデッキを組む。実データが無い名前は飛ばし、
   40枚に満たない場合はカードデータから適当なカードで埋める。 */
function buildTestDeck(){
  const main=[], ex=[], miss=[];
  TEST_DECK.cards.forEach(e=>{
    if(!e.q) return;
    const idx = findCardIndex(e.n);
    if(idx<0){ miss.push(e.n); return; }
    for(let i=0;i<e.q;i++){
      const card = {id:idx, face:"down", pos:"atk"};
      if(CARD_DB[idx].ex) ex.push(card); else main.push(card);
    }
  });
  // EXデッキ（シンクロ・エクシーズ）
  (TEST_DECK.ex||[]).forEach(e=>{
    if(!e.q) return;
    const idx = findCardIndex(e.n);
    if(idx<0){ miss.push(e.n); return; }
    for(let i=0;i<e.q;i++) ex.push({id:idx, face:"down", pos:"atk"});
  });
  // EXが空ならカードデータからシンクロを拾って入れる（お試し用）
  if(!ex.length){
    const syn = [];
    CARD_DB.forEach((c,i)=>{
      if(c && c.ex && syn.length<10 && (c.st||[]).indexOf('シンクロ')>=0) syn.push(i);
    });
    syn.forEach(i=>ex.push({id:i, face:"down", pos:"atk"}));
  }
  // 40枚に足りなければ通常モンスター等で補充（ダミーDB時のフォールバック）
  if(main.length < 40){
    const filler = [];
    CARD_DB.forEach((c,i)=>{ if(c && !c.ex && filler.length<200) filler.push(i); });
    let fi = 0;
    while(main.length < 40 && filler.length){
      main.push({id:filler[fi % filler.length], face:"down", pos:"atk"});
      fi++;
    }
  }
  return {main, ex, side:[], miss, violations:[]};
}

/* テストデッキで即開始（両プレイヤーに配って手札を引く）
   1103は先攻ドローありなので、ドローフェイズから始める。 */
function startTestDuel(bothSides, firstPlayer){
  const parsed = buildTestDeck();
  if(!parsed.main.length){ showToast("カードデータが読み込まれていません"); return; }
  closeSheet();
  act({type:"LOAD_DECK", player:0, deck:parsed.main.slice(), ex:parsed.ex.slice()});
  act({type:"SHUFFLE", player:0});
  act({type:"DRAW", player:0, n:5, initial:true});
  if(bothSides){
    const p2 = buildTestDeck();
    act({type:"LOAD_DECK", player:1, deck:p2.main, ex:p2.ex});
    act({type:"SHUFFLE", player:1});
    act({type:"DRAW", player:1, n:5, initial:true});
  }
  // 先攻を設定してドローフェイズから開始
  const fp = (firstPlayer===1) ? 1 : 0;
  gameState.activePlayer = fp;
  gameState.firstPlayer  = fp;
  gameState.turn  = 1;
  gameState.phase = "draw";
  gameState.drawnThisTurn = false;
  logIt(gameState, `<b>先攻：${nameOf(fp)}</b>（1103は先攻ドローあり）`);
  render();
  showToast(`テストデッキで開始（先攻：${nameOf(fp)}）`);
}
/* index.html(1103デッキビルダー) と同じ localStorage を読む。
   保存形式: key "deck1103:<名前>" → {name, cards:[{n,q}], side:[{n,q}], date}
   編集中デッキ: key "work1103:current" → 同形式 */
const DECK_PREFIX = 'deck1103:';
const WORK_KEY    = 'work1103:current';
function LS(){ try{ return window.localStorage; }catch(e){ return null; } }

function listSavedDecks(){
  const out=[]; const ls=LS(); if(!ls) return out;
  try{
    for(let i=0;i<ls.length;i++){
      const k=ls.key(i);
      if(k && k.indexOf(DECK_PREFIX)===0){
        try{ const d=JSON.parse(ls.getItem(k)); if(d && d.cards) out.push(d); }catch(e){}
      }
    }
  }catch(e){}
  out.sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  return out;
}
function getWorkDeck(){
  const ls=LS(); if(!ls) return null;
  try{
    const raw=ls.getItem(WORK_KEY); if(!raw) return null;
    const d=JSON.parse(raw);
    if(d && d.cards && d.cards.length) return d;
  }catch(e){}
  return null;
}
/* {cards:[{n,q}]} → 山札配列。保存デッキは既に1103上限が適用済みなのでそのまま採用 */
function cardsToDeck(cards){
  const main=[], ex=[], miss=[];
  (cards||[]).forEach(e=>{
    const idx = findCardIndex(e.n);
    if(idx<0){ miss.push(e.n); return; }
    const q = e.q||1;
    for(let i=0;i<q;i++){
      const card={id:idx, face:"down", pos:"atk"};
      if(CARD_DB[idx].ex) ex.push(card); else main.push(card);
    }
  });
  return {main, ex, side:[], miss, violations:[]};
}
