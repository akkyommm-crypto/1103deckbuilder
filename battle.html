</div>

<!-- ===== 下部ドック：既定は折りたたみ。タップで展開 ===== -->
<div class="dock collapsed" id="dock">
  <!-- 常時見えるのはこの1行だけ（フェーズ＋次へ＋戻す） -->
  <div class="dock-bar" id="dockBar"></div>
  <!-- 展開時に出る詳細 -->
  <div class="dock-body" id="dockBody">
    <div class="dock-actions" id="dockActions"></div>
    <div class="guide" id="guide"></div>
    <div class="turnlog" id="turnlog"></div>
    <button class="log-toggle" id="logToggle" onclick="toggleLog()">ログを開く ▾</button>
    <div class="log" id="log" hidden></div>
  </div>
</div>

<!-- action modal -->
<div class="veil" id="veil"><div class="sheet" id="sheet"></div></div>

<script>
/* =========================================================================
   DUEL FIELD — 2人ホットシート対戦アプリ（土台）
   全状態は gameState に集約。applyAction(gameState, action) だけが状態を変更する。
   描画は render() が gameState を読むだけ（DOM から状態を書き換えない）。
   → 将来: action を相手に送り、双方が同じ applyAction を実行すればオンライン対戦化できる。
   ========================================================================= */

/* ---- ダミーカードデータ（起動時に index.html の完全版へ差し替わる）----
   実データは boot() が index.html の <script id="carddata"> から読み込む。
   各カード: {n,k,atk,def,lv,ra,at,st,ex,sub,e,c,lm?}
*/
const DUMMY_DB = [
  {n:"サイバー・ドラゴン", k:"m", atk:2100, def:1600, lv:5, ra:"機械", at:"光", st:["効果"], ex:false, sub:"", e:"相手フィールドにのみモンスターが存在する場合、このカードはリリースなしで召喚できる。", c:"70095154"},
  {n:"死者蘇生", k:"s", ra:"", at:"", st:[], ex:false, sub:"", e:"自分または相手の墓地のモンスター1体を対象として発動できる。そのモンスターを自分フィールドに特殊召喚する。", c:"83764718"},
  {n:"聖なるバリア －ミラーフォース－", k:"t", ra:"", at:"", st:[], ex:false, sub:"", e:"相手モンスターの攻撃宣言時に発動できる。相手フィールドの攻撃表示モンスターを全て破壊する。", c:"44095762"},
  {n:"E・HERO エアーマン", k:"m", atk:1800, def:300, lv:4, ra:"戦士", at:"風", st:["効果"], ex:false, sub:"", e:"このカードが召喚に成功した時、以下の効果から1つを選択して発動できる。①自分フィールドのHEROの数まで相手にダメージ。②デッキからHEROモンスター1体を手札に加える。", c:"22103890"},
  {n:"増殖するG", k:"m", atk:500, def:200, lv:2, ra:"昆虫", at:"地", st:["効果"], ex:false, sub:"", e:"このカードを手札から捨てて発動できる。このターン、相手が特殊召喚するたびに自分は1枚ドローする。", c:"90953320"},
  {n:"灰流うらら", k:"m", atk:0, def:1800, lv:3, ra:"アンデット", at:"炎", st:["チューナー","効果"], ex:false, sub:"", e:"デッキから手札・墓地・フィールドに加える効果、特殊召喚する効果を無効にする。", c:"14558127"},
  {n:"サンダー・ボルト", k:"s", ra:"", at:"", st:[], ex:false, sub:"", e:"相手フィールドのモンスターを全て破壊する。", c:"71413901"},
  {n:"激流葬", k:"t", ra:"", at:"", st:[], ex:false, sub:"", e:"モンスターが召喚・反転召喚・特殊召喚された時に発動できる。フィールドのモンスターを全て破壊する。", c:"90351981"},
  {n:"ブラック・ホール", k:"s", ra:"", at:"", st:[], ex:false, sub:"", e:"フィールドのモンスターを全て破壊する。", c:"83764719"},
  {n:"サイクロン", k:"s", ra:"", at:"", st:[], ex:false, sub:"速攻", e:"フィールドの魔法・罠カード1枚を対象として発動できる。そのカードを破壊する。", c:"05318639"},
];
let CARD_DB = DUMMY_DB.slice();
const IMG_BASE = "images/cards_small/";
const IMG_BACK = "images/card_back.webp";

/* -------------------- 定数 -------------------- */
const PHASES = [
  {id:"draw", jp:"ドロー"}, {id:"standby", jp:"スタンバイ"},
  {id:"main1", jp:"メイン1"}, {id:"battle", jp:"バトル"},
  {id:"main2", jp:"メイン2"}, {id:"end", jp:"エンド"},
];
const ZONE_LIMITS = { mz:5, sz:5, field:1 };
const PNAME = ["プレイヤー I", "プレイヤー II"];

/* -------------------- gameState -------------------- */
/* players[p] = {lp, hand[], deck[], mz[], sz[], field, grave[], banish[], ex[]}
   各ゾーンは "配置カード" の配列。カード＝{id(DB index), face:'up'|'down', pos:'atk'|'def'} */
let gameState = null;

function makePlayer(){
  return {
    lp:8000, hand:[], deck:[], mz:[], sz:[], field:null, grave:[], banish:[], ex:[],
    normalSummonUsed:false,   // 通常召喚権（1ターン1回）
    ssHistory:[],             // このターンの特殊召喚履歴 [{name, from, turn}]
    graveHistory:[],          // このターンの墓地送り履歴 [{name, from, turn}]
    effectFlags:{},           // 永続的なフラグ（1ターン1度の使用済み等）
    temporaryFlags:{},        // ターン終了で消えるフラグ
  };
}
function newGame(){
  // 1103環境は先攻ドローあり。ターン1もドローフェイズから始める。
  return {
    turn:1, phase:"draw", activePlayer:0, firstPlayer:0,
    players:[makePlayer(), makePlayer()],
    log:[], chain:[],
    drawnThisTurn:false,
    priority:0,        // 優先権を持つプレイヤー
    pending:[],        // 発動待ち効果 [{player, name, note}]
    reserved:[],       // 予約効果（このターン終了時など）[{player, name, at, note}]
    scriptLog:[],      // カードスクリプトの処理トレース（デバッガー用）
    lastBattle:null,   // 直前の戦闘（ダメージ計算後の誘発効果が参照する）
    battle:null,       // 進行中の戦闘（ダメージステップの5段階を管理する）
    loser:null,        // 敗北したプレイヤー（LP0・デッキ切れ）
    uidSeq:0,          // 装備の紐付けに使う通し番号
  };
}

/* -------------------- applyAction --------------------
   全ての状態変化はここを通す。副作用は gameState と log のみ。 */
function applyAction(gs, a){
  const P = gs.players[a.player ?? gs.activePlayer];
  switch(a.type){

    case "SET_PHASE":
      gs.phase = a.phase;
      logIt(gs, `${nameOf(gs.activePlayer)}：${phaseJp(a.phase)}へ`);
      break;

    case "PASS_TURN": {
      // ターン終了時の予約効果を消化
      const due = gs.reserved.filter(r=>r.at==="endPhase" && r.turn===gs.turn);
      due.forEach(r=>logIt(gs, `予約効果：${r.name}（${nameOf(r.player)}）`));
      gs.reserved = gs.reserved.filter(r=>!(r.at==="endPhase" && r.turn===gs.turn));
      gs.activePlayer = gs.activePlayer === 0 ? 1 : 0;
      gs.turn += 1;
      gs.phase = "draw";
      gs.drawnThisTurn = false;
      gs.lastBattle = null;
      gs.battle = null;
      clearExpiredMods(gs, 'endTurn');
      gs.priority = gs.activePlayer;
      // 召喚権・攻撃済み・ターン中履歴をリセット
      gs.players.forEach(pl=>{
        pl.normalSummonUsed = false;
        pl.ssHistory = [];
        pl.graveHistory = [];
        pl.temporaryFlags = {};
        pl.mz.forEach(c=>{ if(c) c.attacked = false; });
      });
      logIt(gs, `<b>ターン ${gs.turn}</b> — ${nameOf(gs.activePlayer)}の手番（先攻ドローあり）`);
      break;
    }

    case "LP":
      P.lp = Math.max(0, P.lp + a.delta);
      logIt(gs, `${nameOf(a.player)} LP ${a.delta>0?"+":""}${a.delta} → ${P.lp}`);
      if(P.lp===0 && gs.loser==null){
        gs.loser = a.player ?? gs.activePlayer;
        logIt(gs, `<b>${nameOf(gs.loser)} のライフが0 — 敗北</b>`);
      }
      break;

    case "DRAW": {
      const n = a.n ?? 1;
      // デッキが空の状態でドローしようとしたら敗北
      if(!P.deck.length && n>0){
        gs.loser = a.player ?? gs.activePlayer;
        logIt(gs, `<b>${nameOf(gs.loser)} はデッキからドローできない — 敗北</b>`);
        break;
      }
      for(let i=0;i<n;i++){
        if(!P.deck.length) break;
        const c = P.deck.shift();
        c.face = 'up';           // 手札は常に表向き（タップ不要で内容が読める）
        c.pos  = 'atk';
        P.hand.push(c);
      }
      // ドローフェイズの通常ドローだけを記録する。
      // 初手を配る時（a.initial）や複数枚まとめてのドローは通常ドローに数えない。
      if(gs.phase==="draw" && !a.initial && (a.n??1)===1
         && (a.player ?? gs.activePlayer)===gs.activePlayer) gs.drawnThisTurn = true;
      logIt(gs, `${nameOf(a.player)}：${n}枚ドロー`);
      break;
    }

    case "LOAD_DECK":
      P.deck = a.deck;            // [{id,face,pos}...]
      P.ex   = a.ex || [];
      logIt(gs, `${nameOf(a.player)}：デッキ ${a.deck.length}枚 / EX ${(a.ex||[]).length}枚 読込`);
      break;

    case "SHUFFLE":
      shuffle(P.deck);
      logIt(gs, `${nameOf(a.player)}：デッキシャッフル`);
      break;

    case "MOVE": {
      // from/to は "hand","mz","sz","field","grave","banish","deck","ex"
      const card = removeFrom(P, a.from, a.fromIndex);
      if(!card) break;
      if(a.face) card.face = a.face;
      if(a.pos)  card.pos  = a.pos;
      placeInto(P, a.to, card, a.deckPos);
      logIt(gs, `${nameOf(a.player)}：${cardName(card)} を ${zoneJp(a.from)}→${zoneJp(a.to)}${a.face==='down'?'（裏）':''}${a.pos==='def'?'（守備）':''}`);
      break;
    }

    case "FLIP": {
      const card = zoneCard(P, a.zone, a.index);
      if(card){ card.face = card.face==='up'?'down':'up'; logIt(gs, `${nameOf(a.player)}：${cardName(card)} を反転`); }
      break;
    }

    case "TOGGLE_POS": {
      const card = zoneCard(P, a.zone, a.index);
      if(card){ card.pos = card.pos==='atk'?'def':'atk'; logIt(gs, `${nameOf(a.player)}：${cardName(card)} 表示形式変更`); }
      break;
    }

    case "ATTACK": {
      gs.lastBattle = null;   // 直前の戦闘の記録は破棄してから新しい戦闘を行う
      // 攻撃したモンスターに攻撃済みフラグを立てる（1ターン1回制限の管理）
      if(P.mz[a.atkIdx]) P.mz[a.atkIdx].attacked = true;
      const atkCard = P.mz[a.atkIdx];
      if(!atkCard){ break; }
      const atkDB = dbOf(atkCard);
      const oppP = gs.players[a.player===0?1:0];
      const aATK = a.atkOverride!=null ? a.atkOverride : curATK(atkCard);

      if(a.target==='direct'){
        const dmgDirect = applyBattleDamageFilters({
          to:a.player===0?1:0, amount:aATK, atkCard, defCard:null,
          atkOwner:a.player, defOwner:a.player===0?1:0, direct:true});
        oppP.lp = Math.max(0, oppP.lp - dmgDirect);
        gs.lastBattle = {player:a.player, atkIdx:a.atkIdx, target:'direct', damage:dmgDirect, toPlayer:a.player===0?1:0};
        logIt(gs, `<b>攻撃</b> ${cardName(atkCard)}(${aATK}) が直接攻撃 → ${nameOf(a.player===0?1:0)} に ${dmgDirect} ダメージ（LP ${oppP.lp}）`);
        break;
      }

      const defCard = oppP.mz[a.target];
      if(!defCard){ break; }
      const defDB = dbOf(defCard);
      const defending = defCard.pos==='def';
      const dVal = a.defOverride!=null ? a.defOverride : (defending ? curDEF(defCard) : curATK(defCard));

      /* 戦闘破壊耐性（置換効果）を判定する。
         a.noDestroyAtk / a.noDestroyDef で個別に指定でき、
         指定が無ければカードの耐性フラグとスクリプト宣言から自動判定する。 */
      const protAtk = a.noDestroyAtk!=null ? a.noDestroyAtk : battleProof(atkCard);
      const protDef = a.noDestroyDef!=null ? a.noDestroyDef : battleProof(defCard);

      /* ③-ⅴ 戦闘破壊確定。
         ここでは破壊を「確定」させるだけで、実際に場を離れるのは
         ⑤ 追加誘発解決タイミング（BATTLE_CLEANUP）。
         確定したモンスターは永続効果を出さず、効果の対象にも取れなくなる。 */
      const killDef = ()=>{
        if(protDef){ logIt(gs, `${cardName(defCard)} は戦闘では破壊されない`); return false; }
        defCard.battleDestroyed = true;
        return true;
      };
      const killAtk = ()=>{
        if(protAtk){ logIt(gs, `${cardName(atkCard)} は戦闘では破壊されない`); return false; }
        atkCard.battleDestroyed = true;
        return true;
      };

      let msg = `<b>戦闘</b> ${cardName(atkCard)}(攻${aATK}) vs ${cardName(defCard)}(${defending?'守':'攻'}${dVal})：`;
      let destroyedAtk=false, destroyedDef=false, dmgTo=null, dmgVal=0;

      /* ③-ⅳ ダメージ発生。天空の聖域のような介入効果をここで通す */
      const dealDamage = (to, raw)=>{
        const v = applyBattleDamageFilters({
          to, amount:raw, atkCard, defCard,
          atkOwner:a.player, defOwner:a.player===0?1:0, direct:false});
        const T = gs.players[to];
        T.lp = Math.max(0, T.lp - v);
        return v;
      };
      if(defending){
        if(aATK > dVal){ destroyedDef = killDef(); msg += destroyedDef?`守備モンスター破壊`:`破壊されず`; }
        else if(aATK < dVal){ dmgTo=a.player; dmgVal=dealDamage(a.player, dVal-aATK);
          msg += `反射ダメージ ${dmgVal} → ${nameOf(a.player)}（LP ${P.lp}）`; }
        else { msg += `変化なし`; }
      } else {
        if(aATK > dVal){
          destroyedDef = killDef();
          dmgTo=a.player===0?1:0; dmgVal=dealDamage(dmgTo, aATK-dVal);
          msg += `${destroyedDef?'相手モンスター破壊':'破壊されず'}＋${dmgVal}ダメージ（LP ${oppP.lp}）`;
        }
        else if(aATK < dVal){
          destroyedAtk = killAtk();
          dmgTo=a.player; dmgVal=dealDamage(a.player, dVal-aATK);
          msg += `${destroyedAtk?'自分モンスター破壊':'破壊されず'}＋${dmgVal}ダメージ（LP ${P.lp}）`;
        }
        else { destroyedAtk=killAtk(); destroyedDef=killDef(); msg += `相打ち`; }
      }
      logIt(gs, msg);
      /* ダメージ計算後の誘発効果（異次元の女戦士・ゴブリンゾンビ等）が参照する */
      gs.lastBattle = {
        player:a.player, atkIdx:a.atkIdx, target:a.target,
        atkCard, defCard, destroyedAtk, destroyedDef,
        // 破壊されると墓地では別オブジェクトになるため、名前でも照合できるようにする
        atkName: cardName(atkCard), defName: cardName(defCard),
        atkOwner: a.player, defOwner: a.player===0?1:0,
        damage:dmgVal, toPlayer:dmgTo
      };
      break;
    }

    /* ---- チェーン（手動） ---- */
    /* ⑤ 追加誘発解決：戦闘破壊が確定したモンスターが実際にフィールドを離れる。
       ここで初めて墓地へ送られ、「墓地へ送られた」「フィールドから離れた」を
       トリガーとする効果が誘発できるようになる。 */
    case "BATTLE_CLEANUP": {
      for(let pi=0; pi<2; pi++){
        const PP = gs.players[pi];
        for(let i=(PP.mz||[]).length-1; i>=0; i--){
          const c = PP.mz[i];
          if(!c || !c.battleDestroyed) continue;
          dropXyzMaterials(PP, c); dropEquips(PP, c);
          PP.mz.splice(i,1);
          delete c.battleDestroyed;
          pushZone(PP.grave, c);
          const putB = PP.grave[PP.grave.length-1];
          if(putB) putB.graveInfo = {turn:gs.turn, from:'mz', byDestroy:true};
          logIt(gs, `${cardName(c)} が戦闘破壊されて墓地へ`);
        }
      }
      break;
    }
    case "CHAIN_ADD": {
      // a: {player, from:'hand'|'mz'|'sz'|'field', index, ss}
      gs.chain.push({ player:a.player, cardId:a.cardId, name:a.name, ss:a.ss, from:a.from, index:a.index });
      logIt(gs, `チェーン${gs.chain.length}：${nameOf(a.player)} が ${a.name}（SS${a.ss}）を発動`);
      break;
    }
    case "CHAIN_RESOLVE_TOP": {
      // 逆順解決：末尾（最後に積んだ＝一番上）から1つ処理して取り除く
      if(!gs.chain.length) break;
      const link = gs.chain.pop();
      logIt(gs, `解決：チェーン${gs.chain.length+1} ${link.name}（効果は手動で処理してください）`);
      break;
    }
    case "CHAIN_CLEAR": {
      gs.chain = [];
      logIt(gs, `チェーンをクリア`);
      break;
    }

    /* ================= 効果処理プリミティブ =================
       全ての効果はこれらの組み合わせで表現する。applyAction を通るので
       スナップショット／Undo／ログが自動的に効く。 */

    /* 指定ゾーンのカードを墓地へ（破壊・墓地送り共通）
       a:{player, zone:'mz'|'sz'|'field', index, reason} */
    case "FX_TO_GRAVE": {
      const card = removeFrom(P, a.zone, a.index);
      if(!card) break;
      dropXyzMaterials(P, card); dropEquips(P, card);
      pushZone(P.grave, card);
      /* いつ・どこから墓地へ来たかを控える。
         「破壊され墓地へ送られたターンのエンドフェイズ」の判定に使う。 */
      const putG = P.grave[P.grave.length-1];
      if(putG) putG.graveInfo = {turn:gs.turn, from:a.zone,
        byDestroy: a.byDestroy !== false && (a.zone==='mz' || a.zone==='sz' || a.zone==='field')};
      P.graveHistory.push({name:cardName(card), from:a.zone, turn:gs.turn});
      logIt(gs, `${a.reason||"効果"}：${nameOf(a.player)}の ${cardName(card)} を墓地へ`);
      break;
    }

    /* 複数まとめて墓地へ（全体破壊用）。a:{player, zone, reason} */
    case "FX_WIPE_ZONE": {
      const arr = P[a.zone] || [];
      const names = arr.map(c=>cardName(c));
      while(arr.length){ const w=arr.pop(); dropXyzMaterials(P,w); dropEquips(P,w); pushZone(P.grave, w); }
      if(names.length) logIt(gs, `${a.reason||"効果"}：${nameOf(a.player)}の ${names.join("・")} を破壊`);
      break;
    }

    /* 墓地/除外/デッキ/手札 から フィールドへ特殊召喚
       a:{player, from, fromIndex, pos, reason} */
    case "FX_SPECIAL_SUMMON": {
      if(P.mz.length >= ZONE_LIMITS.mz){ logIt(gs, `モンスターゾーンが一杯です`); break; }
      const card = removeFrom(P, a.from, a.fromIndex);
      if(!card) break;
      card.face='up'; card.pos = a.pos||'atk'; card.attacked=false;
      P.mz.push(card);
      P.ssHistory.push({name:cardName(card), from:a.from, turn:gs.turn});
      logIt(gs, `${a.reason||"効果"}：${cardName(card)} を特殊召喚（${card.pos==='def'?'守備':'攻撃'}）`);
      break;
    }

    /* デッキ→手札（サーチ）。a:{player, deckIndex, reason} */
    case "FX_SEARCH": {
      const card = removeFrom(P, "deck", a.deckIndex);
      if(!card) break;
      card.face='up';
      P.hand.push(card);
      shuffle(P.deck);
      logIt(gs, `${a.reason||"効果"}：${cardName(card)} を手札に加えた（デッキシャッフル）`);
      break;
    }

    /* デッキ→墓地（落とす）。a:{player, deckIndex, reason} */
    case "FX_MILL": {
      const card = removeFrom(P, "deck", a.deckIndex);
      if(!card) break;
      pushZone(P.grave, card);
      const putM = P.grave[P.grave.length-1];
      if(putM) putM.graveInfo = {turn:gs.turn, from:'deck', byDestroy:false};
      shuffle(P.deck);
      logIt(gs, `${a.reason||"効果"}：${cardName(card)} をデッキから墓地へ`);
      break;
    }

    /* デッキトップから n 枚墓地へ。a:{player, n, reason} */
    case "FX_MILL_TOP": {
      const n = a.n||1; const names=[];
      for(let i=0;i<n;i++){
        if(!P.deck.length) break;
        const c=P.deck.shift(); names.push(cardName(c));
        pushZone(P.grave, c);
        const putT = P.grave[P.grave.length-1];
        if(putT) putT.graveInfo = {turn:gs.turn, from:'deck', byDestroy:false};
      }
      logIt(gs, `${a.reason||"効果"}：デッキトップ ${names.join("・")||"0枚"} を墓地へ`);
      break;
    }

    /* フィールド→手札（バウンス）。a:{player, zone, index, reason} */
    case "FX_BOUNCE": {
      const card = removeFrom(P, a.zone, a.index);
      if(!card) break;
      dropXyzMaterials(P, card); dropEquips(P, card);
      if(card.token){ logIt(gs, `${cardName(card)} は消滅した`); break; }  // トークンは手札に戻らない
      card.face='up'; card.pos='atk';
      P.hand.push(card);
      logIt(gs, `${a.reason||"効果"}：${cardName(card)} を手札に戻した`);
      break;
    }

    /* 除外。a:{player, zone, index, reason} */
    case "FX_BANISH": {
      const card = removeFrom(P, a.zone, a.index);
      if(!card) break;
      dropXyzMaterials(P, card); dropEquips(P, card);
      pushZone(P.banish, card);
      logIt(gs, `${a.reason||"効果"}：${cardName(card)} を除外`);
      break;
    }

    /* 手札を捨てる（コスト）。a:{player, handIndex, reason} */
    case "FX_DISCARD": {
      const card = removeFrom(P, "hand", a.handIndex);
      if(!card) break;
      pushZone(P.grave, card);
      /* 暗黒界の判定材料。誰の効果で捨てられたかを記録する。
         pushZone は reset() でカードの状態を落とすので、置いた後に付ける。
         byEffect が false（手札制限などのルール処理）なら暗黒界は誘発しない。 */
      const put = P.grave[P.grave.length-1];
      if(put) put.discardInfo = a.byEffect === false ? null
        : {byEffect:true, byPlayer:(a.byPlayer != null ? a.byPlayer : a.player), turn:gs.turn};
      logIt(gs, `${a.reason||"コスト"}：${cardName(card)} を手札から捨てた`);
      break;
    }

    /* 手札→デッキトップ。a:{player, handIndex, reason} */
    case "FX_HAND_TO_TOP": {
      const card = removeFrom(P, "hand", a.handIndex);
      if(!card) break;
      card.face='down';
      P.deck.unshift(card);
      logIt(gs, `${a.reason||"効果"}：${cardName(card)} をデッキトップへ`);
      break;
    }

    /* 表示形式・表裏の指定変更。a:{player, zone, index, face?, pos?} */
    case "FX_SET_STATE": {
      const card = zoneCard(P, a.zone, a.index);
      if(!card) break;
      if(a.face) card.face = a.face;
      if(a.pos)  card.pos  = a.pos;
      logIt(gs, `${a.reason||"効果"}：${cardName(card)} を${a.face==='down'?'裏側':''}${a.pos==='def'?'守備表示':a.pos==='atk'?'攻撃表示':''}に`);
      break;
    }

    /* 発動したカード自身を墓地へ（通常魔法・罠の処理後） */
    case "FX_SELF_TO_GRAVE": {
      const card = removeFrom(P, a.zone, a.index);
      if(!card) break;
      pushZone(P.grave, card);
      logIt(gs, `${cardName(card)} は墓地へ`);
      break;
    }

    /* EXデッキから特殊召喚し、素材を処理する
       a:{player, exIndex, materials:[mzIndex...], kind:'synchro'|'xyz'|'fusion', pos} */
    case "FX_EX_SUMMON": {
      const exCard = P.ex[a.exIndex];
      if(!exCard){ break; }
      if(P.mz.length - a.materials.length >= ZONE_LIMITS.mz){
        logIt(gs, `モンスターゾーンが足りません`); break;
      }
      const db = CARD_DB[exCard.id]||{};
      // 素材を場から取り除く（大きい添字から消してズレを防ぐ）
      const mats = a.materials.slice().sort((x,y)=>y-x);
      const matCards = [];
      mats.forEach(mi=>{
        const c = P.mz.splice(mi,1)[0];
        if(c) matCards.push(c);
      });
      const matNames = matCards.map(c=>cardName(c)).reverse();
      // EXデッキから取り出して場へ
      P.ex.splice(a.exIndex,1);
      exCard.face = 'up';
      exCard.pos  = a.pos || 'atk';
      if(a.kind === 'xyz'){
        // エクシーズは素材をカードの下に重ねる
        exCard.xyz = matCards.map(c=>reset(c));
      } else {
        // シンクロ・融合は素材を墓地へ
        matCards.forEach(c=>pushZone(P.grave, c));
      }
      P.mz.push(exCard);
      const kindJa = {synchro:"シンクロ召喚", xyz:"エクシーズ召喚", fusion:"融合召喚"}[a.kind]||"特殊召喚";
      logIt(gs, `<b>${kindJa}</b>：${matNames.join(" ＋ ")} → ${cardName(exCard)}`);
      break;
    }

    /* エクシーズ素材を1つ取り除く（効果コスト）
       a:{player, mzIndex, reason} */
    case "FX_DETACH": {
      const c = P.mz[a.mzIndex];
      if(!c || !c.xyz || !c.xyz.length){ logIt(gs, `エクシーズ素材がありません`); break; }
      const m = c.xyz.shift();
      pushZone(P.grave, m);
      logIt(gs, `${a.reason||"効果"}：${cardName(c)} の素材 ${cardName(m)} を取り除いた（残${c.xyz.length}）`);
      break;
    }

    /* ===== 追加プリミティブ ===== */

    /* 通常召喚（召喚権を消費）。a:{player, handIndex, pos} */
    case "NORMAL_SUMMON": {
      if(P.normalSummonUsed){ logIt(gs, `このターンは既に通常召喚しています`); break; }
      if(P.mz.length >= ZONE_LIMITS.mz){ logIt(gs, `モンスターゾーンが一杯です`); break; }
      const card = removeFrom(P, "hand", a.handIndex);
      if(!card) break;
      card.face='up'; card.pos=a.pos||'atk'; card.attacked=false;
      card.tributeCount = a.tributes || 0;   // 妥協召喚の判定に使う
      P.mz.push(card);
      P.normalSummonUsed = true;
      logIt(gs, `<b>通常召喚</b>：${cardName(card)}（${card.pos==='def'?'守備':'攻撃'}）`);
      break;
    }

    /* セット（モンスター）。召喚権を消費。a:{player, handIndex} */
    case "SET_MONSTER": {
      if(P.normalSummonUsed){ logIt(gs, `このターンは既に通常召喚しています`); break; }
      if(P.mz.length >= ZONE_LIMITS.mz){ logIt(gs, `モンスターゾーンが一杯です`); break; }
      const card = removeFrom(P, "hand", a.handIndex);
      if(!card) break;
      card.face='down'; card.pos='def'; card.attacked=false;
      P.mz.push(card);
      P.normalSummonUsed = true;
      logIt(gs, `セット：モンスターを裏側守備表示で置いた`);
      break;
    }

    /* セット（魔法・罠）。a:{player, handIndex, toField} */
    case "SET_ST": {
      const zone = a.toField ? "field" : "sz";
      if(zone==="sz" && P.sz.length >= ZONE_LIMITS.sz){ logIt(gs, `魔法・罠ゾーンが一杯です`); break; }
      if(zone==="field" && P.field){ logIt(gs, `フィールドゾーンが埋まっています`); break; }
      const card = removeFrom(P, "hand", a.handIndex);
      if(!card) break;
      card.face='down'; card.pos='atk';
      card.setTurn = gs.turn;          // 罠はセットしたターンには発動できない
      if(zone==="field") P.field = card; else P.sz.push(card);
      logIt(gs, `セット：カードを伏せた`);
      break;
    }

    /* デッキへ戻す。a:{player, zone, index, toBottom} */
    case "FX_RETURN_DECK": {
      const card = removeFrom(P, a.zone, a.index);
      if(!card) break;
      dropXyzMaterials(P, card);
      if(card.token){ logIt(gs, `${cardName(card)} は消滅した`); break; }
      card.face='down'; card.pos='atk';
      if(a.toBottom) P.deck.push(card); else P.deck.unshift(card);
      logIt(gs, `${a.reason||"効果"}：${cardName(card)} をデッキ${a.toBottom?"ボトム":"トップ"}へ`);
      break;
    }

    /* 無効化フラグを立てる（裁定はプレイヤーが行う。アプリは状態を保持する）
       a:{player, zone, index, reason} */
    case "FX_NEGATE": {
      const card = zoneCard(P, a.zone, a.index);
      if(!card) break;
      card.negated = true;
      logIt(gs, `${a.reason||"効果"}：${cardName(card)} の効果を無効化`);
      break;
    }

    /* エクシーズ素材として重ねる。a:{player, targetMz, from, fromIndex} */
    case "FX_OVERLAY": {
      const target = P.mz[a.targetMz];
      if(!target){ logIt(gs, `重ねる先が見つかりません`); break; }
      const card = removeFrom(P, a.from, a.fromIndex);
      if(!card) break;
      target.xyz = target.xyz || [];
      if(card.token){ logIt(gs, `トークンはエクシーズ素材にできません`); break; }
      pushZone(target.xyz, card);
      logIt(gs, `${cardName(card)} を ${cardName(target)} の素材として重ねた`);
      break;
    }

    /* 優先権の移動。a:{to} */
    case "SET_PRIORITY":
      gs.priority = a.to;
      logIt(gs, `優先権：${nameOf(a.to)}`);
      break;

    /* 発動待ち効果の登録／消化。a:{player, name, note} */
    case "PENDING_ADD":
      gs.pending.push({player:a.player, name:a.name, note:a.note||""});
      logIt(gs, `発動待ち：${a.name}（${nameOf(a.player)}）`);
      break;
    case "PENDING_RESOLVE": {
      const item = gs.pending.splice(a.index,1)[0];
      if(item) logIt(gs, `発動待ちを処理：${item.name}`);
      break;
    }
    case "PENDING_CLEAR":
      gs.pending = [];
      logIt(gs, `発動待ちをクリア`);
      break;

    /* 予約効果（このターンのエンドフェイズに戻す等）。a:{player, name, at, note} */
    case "RESERVE_ADD":
      gs.reserved.push({player:a.player, name:a.name, at:a.at||"endPhase", turn:gs.turn, note:a.note||""});
      logIt(gs, `予約：${a.name}（${a.at==="endPhase"?"エンドフェイズ":a.at}）`);
      break;
    case "RESERVE_REMOVE": {
      const r = gs.reserved.splice(a.index,1)[0];
      if(r) logIt(gs, `予約を解除：${r.name}`);
      break;
    }

    /* 攻撃済みフラグ操作（1ターン1回制限の管理）。a:{player, mzIndex, value} */
    case "SET_ATTACKED": {
      const c = P.mz[a.mzIndex];
      if(c) c.attacked = !!a.value;
      break;
    }

    /* ===== カウンター（魔力カウンター等）=====
       カードに任意名のカウンターを乗せる。a:{player, zone, index, kind, n} */
    case "COUNTER_ADD": {
      const card = zoneCard(P, a.zone, a.index);
      if(!card) break;
      card.counters = card.counters || {};
      const kind = a.kind || "魔力";
      card.counters[kind] = (card.counters[kind]||0) + (a.n||1);
      logIt(gs, `${cardName(card)} に${kind}カウンターを${a.n||1}つ置いた（計${card.counters[kind]}）`);
      break;
    }
    case "COUNTER_REMOVE": {
      const card = zoneCard(P, a.zone, a.index);
      if(!card || !card.counters) break;
      const kind = a.kind || "魔力";
      const cur = card.counters[kind]||0;
      const take = Math.min(cur, a.n||1);
      card.counters[kind] = cur - take;
      if(card.counters[kind]<=0) delete card.counters[kind];
      logIt(gs, `${cardName(card)} から${kind}カウンターを${take}つ取り除いた（残${card.counters[kind]||0}）`);
      break;
    }
    case "COUNTER_CLEAR": {
      const card = zoneCard(P, a.zone, a.index);
      if(!card) break;
      delete card.counters;
      logIt(gs, `${cardName(card)} のカウンターを全て取り除いた`);
      break;
    }

    /* ===== トークン =====
       トークンは CARD_DB に無い仮想カード。tokenDef を直接持つ。
       a:{player, name, atk, def, lv, ra, at, pos, n} */
    case "TOKEN_CREATE": {
      const n = a.n || 1;
      for(let i=0;i<n;i++){
        if(P.mz.length >= ZONE_LIMITS.mz){ logIt(gs, `モンスターゾーンが一杯です`); break; }
        P.mz.push({
          id: -1,                       // DBに存在しない印
          token: {
            n: a.name || "トークン",
            k: 'm', atk: a.atk||0, def: a.def||0, lv: a.lv||1,
            ra: a.ra||"", at: a.at||"", st:["トークン"], c: null
          },
          face:'up', pos: a.pos||'atk', attacked:false
        });
      }
      logIt(gs, `<b>${a.name||"トークン"}</b> を${n}体特殊召喚（攻${a.atk||0}/守${a.def||0}）`);
      break;
    }


    /* ===== 攻守の増減（継続効果）=====
       EDOPro の EFFECT_UPDATE_ATTACK 相当。
       card.mods に修正値を積み、期間が来たら自動で消える。
       a:{player, zone, index, atk, def, until, label} */
    case "MOD_ADD": {
      const card = zoneCard(P, a.zone, a.index);
      if(!card) break;
      card.mods = card.mods || [];
      card.mods.push({
        atk: a.atk||0, def: a.def||0,
        until: a.until || 'endTurn',      // endTurn / endPhase / permanent
        label: a.label || '効果',
        turn: gs.turn
      });
      const parts=[];
      if(a.atk) parts.push(`攻${a.atk>0?'+':''}${a.atk}`);
      if(a.def) parts.push(`守${a.def>0?'+':''}${a.def}`);
      logIt(gs, `${a.label||'効果'}：${cardName(card)} ${parts.join(' ')}（${modUntilJp(a.until||'endTurn')}）`);
      break;
    }
    /* 攻守を特定の値にする（半分にする・0にする等） */
    case "MOD_SET": {
      const card = zoneCard(P, a.zone, a.index);
      if(!card) break;
      const db = dbOf(card);
      card.mods = card.mods || [];
      if(a.atk!=null) card.mods.push({atk:a.atk-(db.atk||0), def:0, until:a.until||'endTurn', label:a.label||'効果', turn:gs.turn});
      if(a.def!=null) card.mods.push({atk:0, def:a.def-(db.def||0), until:a.until||'endTurn', label:a.label||'効果', turn:gs.turn});
      logIt(gs, `${a.label||'効果'}：${cardName(card)} を攻${a.atk??'—'}/守${a.def??'—'}に`);
      break;
    }
    case "MOD_CLEAR": {
      const card = zoneCard(P, a.zone, a.index);
      if(!card) break;
      delete card.mods;
      logIt(gs, `${cardName(card)} の攻守修正を解除`);
      break;
    }


    /* ===== 装備魔法（どのモンスターに装備しているかを保持） =====
       a:{player, szIndex, targetP, targetMz} */
    case "FX_EQUIP": {
      const eq = P.sz[a.szIndex];
      if(!eq){ break; }
      const T = gs.players[a.targetP];
      const mon = T.mz[a.targetMz];
      if(!mon){ logIt(gs, `装備先が見つかりません`); break; }
      // 循環参照を作らないよう、カード実体ではなく識別子で結ぶ
      eq.equipUid = eq.equipUid || (++gs.uidSeq);
      mon.uid = mon.uid || (++gs.uidSeq);
      eq.equipTo = { p:a.targetP, uid:mon.uid };
      mon.equippedBy = mon.equippedBy || [];
      if(mon.equippedBy.indexOf(eq.equipUid)<0) mon.equippedBy.push(eq.equipUid);
      logIt(gs, `${cardName(eq)} を ${cardName(mon)} に装備`);
      break;
    }
    /* 装備を外す（装備モンスターが場を離れた時など） */
    case "FX_UNEQUIP": {
      const eq = P.sz[a.szIndex];
      if(!eq) break;
      if(eq.equipTo){
        const T = gs.players[eq.equipTo.p];
        const mon = (T.mz||[]).find(m=>m && m.uid===eq.equipTo.uid);
        if(mon && mon.equippedBy) mon.equippedBy = mon.equippedBy.filter(u=>u!==eq.equipUid);
      }
      delete eq.equipTo;
      logIt(gs, `${cardName(eq)} の装備を解除`);
      break;
    }

    /* ===== 儀式召喚 =====
       a:{player, handIndex, tributes:[{p,zone,index}], pos} */
    case "FX_RITUAL_SUMMON": {
      if(P.mz.length - (a.tributes||[]).filter(t=>t.zone==='mz').length >= ZONE_LIMITS.mz){
        logIt(gs, `モンスターゾーンが足りません`); break;
      }
      // リリースを先に処理（後ろから消して添字ズレを防ぐ）
      const trs = (a.tributes||[]).slice().sort((x,y)=>y.index-x.index);
      const names=[];
      trs.forEach(t=>{
        const TP = gs.players[t.p];
        const arr = t.zone==='hand' ? TP.hand : TP.mz;
        const c = arr.splice(t.index,1)[0];
        if(c){ names.push(cardName(c)); dropXyzMaterials(TP, c); pushZone(TP.grave, c); }
      });
      const card = removeFrom(P, "hand", a.handIndex);
      if(!card) break;
      card.face='up'; card.pos=a.pos||'atk'; card.attacked=false;
      P.mz.push(card);
      P.ssHistory.push({name:cardName(card), from:'ritual', turn:gs.turn});
      logIt(gs, `<b>儀式召喚</b>：${names.join('・')} をリリースして ${cardName(card)} を特殊召喚`);
      break;
    }

    /* ===== デッキ切れ判定 ===== */
    case "CHECK_DECKOUT": {
      const who = a.player;
      if(gs.players[who].deck.length===0){
        logIt(gs, `<b>${nameOf(who)} はデッキが0枚</b> — 次のドローで敗北します`);
      }
      break;
    }

    case "RESET":
      Object.assign(gs, newGame());
      logIt(gs, "盤面をリセット");
      break;
  }
  return gs;
}

/* -------------------- ゾーン操作ヘルパ -------------------- */
function removeFrom(P, zone, idx){
  if(zone==="field"){ const c=P.field; P.field=null; return c; }
  const arr = P[zone]; if(!arr) return null;
  return arr.splice(idx,1)[0];
}
function placeInto(P, zone, card, deckPos){
  // トークンは場以外へ移動できない（消滅する）
  if(card && card.token && zone!=="mz"){ return; }
  if(zone==="field"){ P.field = card; return; }
  const arr = P[zone];
  if(zone==="deck"){
    card.face='down'; card.pos='atk';
    if(deckPos==="bottom") arr.push(card); else arr.unshift(card);
    return;
  }
  // 手札・墓地・除外は常に表向きで扱う（手札はタップせず読めるように）
  if(zone==="hand" || zone==="grave" || zone==="banish"){ card.face='up'; card.pos='atk'; }
  arr.push(card);
}
function zoneCard(P, zone, idx){ return zone==="field" ? P.field : P[zone]?.[idx]; }
/* 墓地・除外へ送る際にカードの表示状態を正規化 */
function reset(card){
  // トークンは場を離れると消滅する（墓地に残らない）
  if(card && card.token) return null;
  return { id:card.id, face:'up', pos:'atk' };
}
/* 墓地・除外へ送る共通処理。トークンなら消滅させる */
function pushZone(arr, card){ const r = reset(card); if(r) arr.push(r); }
/* 場を離れるカードが持つエクシーズ素材を墓地へ送る（本体処理の前に呼ぶ） */
/* =========================================================================
   継続効果レイヤー（ocgcore の EFFECT_TYPE_SINGLE / FIELD 相当）
   攻守はカードに書き込まず、参照するたびに層を重ねて計算する。
   適用順：元々の数値 → setBase → set → update（増減） → setFinal
   これにより フィールド魔法の全体強化・スキルドレイン・ガンテツ等が
   同じ経路に乗り、カードが場を離れれば自動的に効果が消える。

   スクリプト側の書き方：
     defineScript("ガチガチガンテツ", {
       continuous:{
         scope:'ownMonsters',            // self / ownMonsters / oppMonsters / allMonsters
         from:['mz'],                    // 効果元として有効なゾーン（既定 mz/sz/field）
         apply(target, self){            // 戻り値は下記キーの組み合わせ
           return { atk:200, def:200 };  // atk/def=増減, setAtk/setDef, setBaseAtk, setFinalAtk
         }
       }
     });
   ========================================================================= */

/* カード実体がいまどこにあるかを引く */
function locateCard(card){
  if(!card) return null;
  for(let p=0; p<2; p++){
    const P = gameState.players[p];
    if(P.field === card) return {p, zone:'field', index:0};
    for(const z of ['mz','sz']){
      const i = (P[z]||[]).indexOf(card);
      if(i >= 0) return {p, zone:z, index:i};
    }
  }
  return null;
}

/* 場に表側で存在し、継続効果を持つカードを列挙する。
   スキルドレイン等は魔法＆罠ゾーンからモンスターの効果を無効にするので、
   先に mz 以外を集めてから、無効化されていないモンスターを足す2段階で求める。 */
function gs2Turn(){ return gameState.turn; }
function collectSources(zones, skipNegated){
  const out = [];
  for(let p=0; p<2; p++){
    const P = gameState.players[p];
    const push = (card, zone, index)=>{
      if(!card || card.face !== 'up') return;
      if(card.negated) return;                    // 個別に効果を無効にされている
      if(card.negatedUntilTurn === gs2Turn()) return;   // 聖杯などによる一時的な無効化
      if(battleDestroyConfirmed(card)) return;    // 戦闘破壊が確定している
      if(skipNegated && effectNegatedBy(out, card, {p, zone})) return;
      const sc = CARD_SCRIPTS[dbOf(card).n];
      if(!sc || !sc.continuous) return;
      const from = sc.continuous.from || ['mz','sz','field'];
      if(from.indexOf(zone) < 0) return;
      out.push({p, zone, index, card, sc});
    };
    if(zones.indexOf('mz') >= 0) (P.mz||[]).forEach((c,i)=>push(c,'mz',i));
    if(zones.indexOf('sz') >= 0) (P.sz||[]).forEach((c,i)=>push(c,'sz',i));
    if(zones.indexOf('field') >= 0) push(P.field, 'field', 0);
  }
  return out;
}
function continuousSources(){
  // 魔法＆罠ゾーンとフィールドゾーンの継続効果を先に確定させる
  const outer = collectSources(['sz','field'], false);
  // その上で、無効化されていないモンスターの継続効果を足す
  const inner = collectSources(['mz'], true).filter(x=>!effectNegatedBy(outer, x.card, x));
  return outer.concat(inner);
}

/* 与えられた効果元の集合が、対象カードの効果を無効にしているか */
function effectNegatedBy(sources, card, loc){
  return sources.some(src=>{
    const f = src.sc.continuous && src.sc.continuous.negateEffect;
    if(typeof f !== 'function') return false;
    if(!continuousReaches(src.sc.continuous.scope||'self', src.p, loc, src.card, card)) return false;
    try{ return !!f(card, src.card); }catch(e){ return false; }
  });
}

/* このカードの効果が無効化されているか（スキルドレイン・デモンズ・チェーン等） */
function effectNegated(card){
  if(!card) return false;
  if(card.negated) return true;
  // ターン終了時までの一時的な無効化（禁じられた聖杯など）
  if(card.negatedUntilTurn != null && card.negatedUntilTurn === gameState.turn) return true;
  const loc = locateCard(card);
  if(!loc) return false;
  return effectNegatedBy(collectSources(['sz','field'], false), card, loc);
}

/* このモンスターが攻撃宣言できないか */
function cannotAttackNow(card){
  if(!card) return false;
  if(card.cannotAttack) return true;
  const loc = locateCard(card);
  if(!loc) return false;
  return continuousSources().some(src=>{
    const f = src.sc.continuous && src.sc.continuous.cannotAttack;
    if(typeof f !== 'function') return false;
    if(!continuousReaches(src.sc.continuous.scope||'self', src.p, loc, src.card, card)) return false;
    try{ return !!f(card, src.card); }catch(e){ return false; }
  });
}

/* 攻撃可能な場合に攻撃しなければならないか（カラクリ） */
function mustAttackNow(card){
  if(!card) return false;
  const loc = locateCard(card);
  if(!loc) return false;
  return continuousSources().some(src=>{
    const f = src.sc.continuous && src.sc.continuous.mustAttack;
    if(typeof f !== 'function') return false;
    if(!continuousReaches(src.sc.continuous.scope||'self', src.p, loc, src.card, card)) return false;
    try{ return !!f(card, src.card); }catch(e){ return false; }
  });
}

/* 裏側でセットできない状態か（聖なる輝き） */
function mustSetFaceUp(){
  return continuousSources().some(src=>{
    const f = src.sc.continuous && src.sc.continuous.noFaceDownSet;
    if(typeof f !== 'function') return false;
    try{ return !!f(); }catch(e){ return false; }
  });
}

/* scope が対象カードに届いているか */
function continuousReaches(scope, srcP, tgtLoc, src, target){
  switch(scope){
    case 'self':        return src === target;
    case 'ownMonsters': return tgtLoc.p === srcP && tgtLoc.zone === 'mz';
    case 'oppMonsters': return tgtLoc.p !== srcP && tgtLoc.zone === 'mz';
    case 'allMonsters': return tgtLoc.zone === 'mz';
    default:            return false;
  }
}

/* 戦闘ダメージに介入する継続効果を適用する。
   ③-ⅳ ダメージ発生の直前に呼ばれ、最終的なダメージ量を返す。
   info = {to, amount, atkCard, defCard, atkOwner, defOwner} */
function applyBattleDamageFilters(info){
  let amount = info.amount;
  continuousSources().forEach(src=>{
    const f = src.sc.continuous && src.sc.continuous.battleDamage;
    if(typeof f !== 'function') return;
    let r = null;
    try{ r = f(Object.assign({}, info, {amount, srcPlayer:src.p, self:src.card})); }
    catch(e){ return; }
    if(typeof r === 'number') amount = Math.max(0, r);
  });
  return amount;
}

/* 対象カードに掛かっている継続効果を層ごとに集める */
function collectContinuous(card){
  const layers = { setBase:[], set:[], update:[], setFinal:[] };
  const loc = locateCard(card);
  if(!loc) return layers;
  continuousSources().forEach(src=>{
    const cont = src.sc.continuous;
    if(!continuousReaches(cont.scope||'self', src.p, loc, src.card, card)) return;
    let r = null;
    try{ r = cont.apply(card, src.card, {p:src.p, loc}); }
    catch(e){ return; }                 // スクリプトの例外で盤面を壊さない
    if(!r) return;
    const tag = src.sc.name;
    if(r.setBaseAtk!=null || r.setBaseDef!=null) layers.setBase.push({...r, src:tag});
    if(r.setAtk!=null     || r.setDef!=null)     layers.set.push({...r, src:tag});
    if(r.atk!=null        || r.def!=null)        layers.update.push({...r, src:tag});
    if(r.setFinalAtk!=null|| r.setFinalDef!=null)layers.setFinal.push({...r, src:tag});
  });
  return layers;
}

/* 修正値と継続効果を含めた攻撃力・守備力を返す */
function curStat(card, key){
  const db = dbOf(card);
  const Base = key==='atk' ? 'setBaseAtk' : 'setBaseDef';
  const Set_ = key==='atk' ? 'setAtk'     : 'setDef';
  const Fin  = key==='atk' ? 'setFinalAtk': 'setFinalDef';
  const L = collectContinuous(card);
  let v = db[key] || 0;
  L.setBase.forEach(l=>{ if(l[Base]!=null) v = l[Base]; });
  L.set    .forEach(l=>{ if(l[Set_]!=null) v = l[Set_]; });
  // 一時修正値（オネスト・突進など）は増減層に入る
  (card.mods||[]).forEach(m=>{ v += (m[key]||0); });
  L.update .forEach(l=>{ if(l[key]!=null) v += l[key]; });
  L.setFinal.forEach(l=>{ if(l[Fin]!=null) v = l[Fin]; });
  return Math.max(0, v);
}
function curATK(card){ return curStat(card, 'atk'); }
function curDEF(card){ return curStat(card, 'def'); }

/* 修正を含めた現在のレベル（ランク）。
   スポーアやレベル・スティーラーが card.lvMod を増減させる。
   エクシーズのランクは変動しないので lvMod は付かない前提。 */
function curLV(card){
  if(!card) return 0;
  const base = dbOf(card).lv || 0;
  return Math.max(0, base + (card.lvMod || 0));
}

/* =========================================================================
   対象を取る／取らない と「効果の対象にならない」耐性
   ocgcore の EFFECT_FLAG_CARD_TARGET / EFFECT_CANNOT_BE_EFFECT_TARGET 相当。
   スクリプトに targets:true を書いたものだけが対象耐性のチェックを受ける。
   ========================================================================= */
let ACTIVE_SCRIPT = null;              // 実行中のスクリプト（対象判定に使う）

/* 対象耐性を持つか。スクリプトの continuous.immuneToTarget を優先し、
   無ければ効果テキストから自身への耐性を推定する。 */
const TARGET_IMMUNE_CACHE = new Map();
function targetImmune(card){
  if(!card || card.face !== 'up') return false;
  const db = dbOf(card);
  const nm = db.n; if(!nm) return false;
  // 他のカードから与えられている耐性
  const loc = locateCard(card);
  if(loc){
    for(const src of continuousSources()){
      const cont = src.sc.continuous;
      if(!cont.immuneToTarget) continue;
      if(!continuousReaches(cont.scope||'self', src.p, loc, src.card, card)) continue;
      let r = false;
      try{ r = cont.immuneToTarget(card, src.card); }catch(e){ r = false; }
      if(r) return true;
    }
  }
  // 自身のテキストによる耐性
  if(TARGET_IMMUNE_CACHE.has(nm)) return TARGET_IMMUNE_CACHE.get(nm);
  const e = String(db.e||"") + String(db.e0||"");
  const v = /このカードは[^。]*効果の対象にならない/.test(e);
  TARGET_IMMUNE_CACHE.set(nm, v);
  return v;
}

/* 対象を取る効果の候補から、耐性を持つカードを除く */
function filterTargetable(cands){
  if(!Array.isArray(cands)) return cands;
  return cands.filter(x=>{
    if(!x || !x.card) return true;
    // 対象耐性は場のカードにのみ意味がある
    if(x.zone !== 'mz' && x.zone !== 'sz' && x.zone !== 'field') return true;
    if(battleDestroyConfirmed(x.card)) return false;   // 戦闘破壊確定は対象に取れない
    return !targetImmune(x.card);
  });
}

/* 修正値が入っているか */
function hasMod(card){ return !!(card && card.mods && card.mods.length); }
function modUntilJp(u){
  return ({endTurn:'このターン', endPhase:'このフェイズ', permanent:'永続'})[u] || 'このターン';
}
/* 期間切れの修正値を掃除する */
function clearExpiredMods(gs, when){
  gs.players.forEach(P=>{
    ['mz','sz'].forEach(z=>{
      (P[z]||[]).forEach(c=>{
        if(!c || !c.mods) return;
        c.mods = c.mods.filter(m=>{
          if(m.until==='permanent') return true;
          if(when==='endTurn')  return m.until!=='endTurn' && m.until!=='endPhase';
          if(when==='endPhase') return m.until!=='endPhase';
          return true;
        });
        if(!c.mods.length) delete c.mods;
      });
    });
  });
}

/* 戦闘では破壊されないカードか判定する。
   スクリプトに battleProof:true があればそれを使う。
   無ければ効果テキストから推定する（マシュマロン等）。 */
const BATTLE_PROOF_CACHE = new Map();
function battleProof(card){
  if(!card) return false;
  if(card.battleProof) return true;          // 効果で一時的に付与された場合
  const db = dbOf(card);
  const nm = db.n; if(!nm) return false;
  const sc = CARD_SCRIPTS[nm];
  if(sc && sc.battleProof!=null) return !!sc.battleProof;
  if(BATTLE_PROOF_CACHE.has(nm)) return BATTLE_PROOF_CACHE.get(nm);
  const e = String(db.e||"") + String(db.e0||"");
  const proof = /戦闘では破壊されない|戦闘で破壊されない|戦闘によっては破壊されない/.test(e);
  BATTLE_PROOF_CACHE.set(nm, proof);
  return proof;
}

/* 装備モンスターが場を離れた時、付いている装備魔法を墓地へ送る */
function dropEquips(P, card){
  if(!card || !card.equippedBy || !card.equippedBy.length) return;
  const uids = card.equippedBy.slice();
  card.equippedBy = [];
  // 両者の魔法罠ゾーンから、このモンスターに付いている装備を探して墓地へ送る
  (gameState.players||[]).forEach(PP=>{
    for(let i=PP.sz.length-1;i>=0;i--){
      const eq = PP.sz[i];
      if(eq && eq.equipUid && uids.indexOf(eq.equipUid)>=0){
        delete eq.equipTo;
        PP.sz.splice(i,1);
        pushZone(PP.grave, eq);
      }
    }
  });
}

function dropXyzMaterials(P, card){
  if(card && card.xyz && card.xyz.length){
    card.xyz.forEach(m=>pushZone(P.grave, m));
    card.xyz = [];
  }
}

/* -------------------- ログ / 名前 -------------------- */
function logIt(gs, msg){ gs.log.unshift({t:Date.now(), msg}); if(gs.log.length>60) gs.log.pop(); }
function nameOf(p){ return PNAME[p]; }
function phaseJp(id){ return (PHASES.find(x=>x.id===id)||{}).jp || id; }
function zoneJp(z){ return {hand:"手札",mz:"モンスター",sz:"魔法罠",field:"フィールド",grave:"墓地",banish:"除外",deck:"デッキ",ex:"EX"}[z]||z; }
function cardName(card){ return card?.token ? card.token.n : (CARD_DB[card.id]?.n || "カード"); }
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } }

/* =========================================================================
   RENDER — gameState を読んで描画するだけ
   ========================================================================= */
function render(){
  const gs = gameState;
  const view = gs.activePlayer;          // 手番プレイヤー視点
  const opp  = view===0?1:0;
  const P = gs.players[view];
  const curIdx = PHASES.findIndex(x=>x.id===gs.phase);
  const chN = gs.chain.length;

  const fp = gs.firstPlayer ?? 0;

  /* ===== 極小ステータスバー（常時表示はこれだけ） ===== */
  const rp = view===0?1:0;
  const reactN = reactableCards(rp).length;
  const warn = (gs.loser!=null)
    ? `<span class="sb-warn trap">${nameOf(gs.loser===0?1:0)} の勝利</span>`
    : gs.battle
    ? `<span class="sb-battle">${dsInfo(gs.battle.step).jp}</span>`
    : (chN
        ? `<span class="sb-warn">チェーン${chN}</span>`
        : (gs.phase==="battle" && reactN ? `<span class="sb-warn trap">伏せ${reactN}</span>` : ""));
  document.getElementById("statusbar").innerHTML =
    `<span class="sb-turn">T${gs.turn} ${nameOf(view)}${view===fp?"(先)":""}</span>` +
    `<span class="sb-phase">${phaseJp(gs.phase)}</span>${warn}` +
    `<span class="sb-lp"><span class="me">${P.lp}</span><span class="op">${gs.players[opp].lp}</span></span>`;

  /* ===== guide strip：今のフェーズ＋できること（ドック展開時のみ見える） ===== */
  document.getElementById("guide").innerHTML = guideHTML(gs, view, curIdx, chN);

  /* ===== board：相手を上、手番を下 ===== */
  document.getElementById("board").innerHTML =
    sideHTML(opp, true) + sideHTML(view, false);

  /* ===== hand（手番のみ表向き） ===== */
  // デッキも場も空＝まだ開始していない時だけ、開始への導線を出す。
  // デュエル中に手札を使い切っただけの時は邪魔なので出さない。
  const notStarted = !P.hand.length && !P.deck.length && !P.mz.length && !P.sz.length && !P.grave.length;
  document.getElementById("hand").innerHTML = P.hand.map((c,i)=>
    cardHTML(c, "hcard", `openHand(${i})`, true)
  ).join("") || (notStarted
    ? `<div class="hand-empty">
        <span>手札なし</span>
        <button class="he-btn" onclick="startTestDuel(true)">テストデッキですぐ開始</button>
        <button class="he-btn ghost" onclick="openDeckLoad('saved')">デッキを読み込む</button>
      </div>`
    : `<div class="hand-empty"><span>手札なし</span></div>`);

  /* ===== このターンにやったこと ===== */
  const tl = document.getElementById("turnlog");
  tl.innerHTML = `<span class="tl-lab">このターン</span>` +
    (turnActions.length
      ? turnActions.slice(-12).map(c=>`<span class="tl-chip">${c}</span>`).join("")
      : `<span class="tl-empty">まだ操作なし</span>`);

  /* ===== full log ===== */
  document.getElementById("log").innerHTML = gs.log.map(l=>`<div class="li">${l.msg}</div>`).join("");

  /* ===== チェーンは常時スタック表示 ===== */
  renderChainStack(gs);

  /* ===== 下部ドック ===== */
  renderDock(gs, curIdx, chN);
}

/* ---- guide strip HTML ---- */
function guideHTML(gs, view, curIdx, chN){
  const P = gs.players[view];
  const loaded = P.deck.length>0 || P.hand.length>0 || P.mz.length>0 || P.sz.length>0 || P.grave.length>0;
  const phase = gs.phase;
  const R = PHASE_RULES[phase] || PHASE_RULES.main1;
  const cans = [];
  if(!loaded){
    cans.push(`<span class="g-can">テストデッキ or 保存デッキで開始</span>`);
  } else {
    if(R.draw){
      cans.push(gs.drawnThisTurn
        ? `<span class="g-can mute">ドロー済み</span>`
        : `<span class="g-can">ドロー可${gs.turn===1?"（先攻ドローあり）":""}</span>`);
    }
    if(R.normalSummon) cans.push(`<span class="g-can">通常召喚/セット</span>`);
    if(R.activateS1)   cans.push(`<span class="g-can">魔法罠 発動/セット</span>`);
    if(R.exSummon && P.ex.length) cans.push(`<span class="g-can">EX召喚可</span>`);
    if(R.attack){
      const canAtk = P.mz.some(c=>c && c.face==='up' && c.pos==='atk');
      cans.push(`<span class="g-can ${canAtk?'':'mute'}">攻撃宣言${canAtk?'':'（表側攻撃なし）'}</span>`);
    }
    // どのフェーズでも速攻魔法・罠は撃てる
    cans.push(`<span class="g-can mute">速攻魔法・罠（SS2+）</span>`);
    if(phase==="end"){
      const over = P.hand.length - 7;
      cans.push(over>0
        ? `<span class="g-can react">手札を${over}枚捨てる</span>`
        : `<span class="g-can mute">手札${P.hand.length}枚（調整不要）</span>`);
    }
    const rp = view===0?1:0;
    const rn = reactableCards(rp).length;
    if(rn) cans.push(`<span class="g-can react">${nameOf(rp)}は${rn}枚撃てる</span>`);
  }
  const chainWarn = chN
    ? `<span class="g-chainwarn">チェーン ${chN} 解決待ち</span>` : "";
  return `<span class="g-phase">${phaseJp(phase)}</span>${cans.join("")}${chainWarn}`;
}

/* ---- 下部ドック HTML ---- */
function renderDock(gs, curIdx, chN){
  const atEnd = gs.phase==="end";
  const nextPh = curIdx < PHASES.length-1 ? PHASES[curIdx+1].jp : null;
  const prevDisabled = curIdx<=0;
  const canUndo = HISTORY.length>0;
  const P = gs.players[gs.activePlayer];
  const exN = P.ex.length;
  const inMain = (gs.phase==="main1"||gs.phase==="main2");
  const drawDone = (gs.phase==="draw" && gs.drawnThisTurn);
  const rp = gs.activePlayer===0 ? 1 : 0;
  const reactN = reactableCards(rp).length;
  // 手番側も速攻魔法などをチェーンできるので、その導線も用意する
  const myReactN = reactableCards(gs.activePlayer).length;

  /* ===== 常時見える1行：フェーズ送り＋Undo＋展開 =====
     盤面を最大化するため、ここ以外は折りたたむ。 */
  // ドローフェイズは「ドロー」が唯一の主要行動なので、畳んだままでも押せる位置に出す
  const drawInBar = (gs.phase==="draw" && !gs.drawnThisTurn)
    ? `<button class="d-draw pulse" onclick="doDraw()" title="1枚ドロー">ドロー</button>` : "";
  // 相手が発動できるカードを持っている時は、畳んだままでも押せる位置に出す。
  // （自分のターン中に相手が手札誘発を撃つ導線がこれ）
  const reactInBar = reactN
    ? `<button class="d-icon react pulse" onclick="openReact()" title="${nameOf(rp)}が発動できる${reactN}枚">⚡<span class="kb">${reactN}</span></button>` : "";
  // 自分がチェーンできるカードを持っている時のボタン（速攻魔法・罠など）
  const myReactBtn = myReactN
    ? `<button class="d-act myreact" onclick="openReactFor(${gs.activePlayer})">自分<b>${myReactN}</b></button>` : "";
  const bar = `
    <button class="d-prev" onclick="doPhasePrev()" ${prevDisabled?'disabled':''}>◂</button>
    ${drawInBar}${reactInBar}
    ${atEnd
      ? `<button class="d-next endturn" onclick="doPass()">ターン終了</button>`
      : `<button class="d-next primary" onclick="doPhaseNext()" title="${phaseJp(gs.phase)}から${nextPh||""}へ">${nextPh||"次へ"} ▸</button>`}
    <button class="d-icon undo" onclick="undo()" ${canUndo?'':'disabled'} title="1つ戻す">↺</button>
    <button class="d-icon" onclick="toggleDock()" id="dockToggle" title="詳細">${DOCK_OPEN?'▾':'▴'}</button>`;

  /* ===== 展開時の詳細アクション ===== */
  const exBtn = (exN && inMain)
    ? `<button class="d-act" onclick="openExDeck(${gs.activePlayer})">EX<span class="kb">${exN}</span></button>`
    : "";
  const reactBtn = reactN
    ? `<button class="d-act react" onclick="openReact()">相手<span class="kb">${reactN}</span></button>`
    : "";
  const canDrawNow = rules().draw && !gs.drawnThisTurn;
  const drawCls = canDrawNow ? "d-act gold pulse" : (drawDone ? "d-act" : "d-act");
  const drawLabel = drawDone ? "ドロー済" : "ドロー";
  const drawClick = canDrawNow ? "doDraw()" : `showToast('${phaseJp(gs.phase)}では通常ドローできません')`;
  const actRow = `
    <button class="${drawCls}" onclick="${drawClick}">${drawLabel}</button>
    ${exBtn}${reactBtn}${myReactBtn}
    <button class="d-act" onclick="openChain()">チェーン${chN?`<span class="kb">${chN}</span>`:""}</button>

/* =========================================================================
   画面の実高さを測って CSS 変数に入れる。
   Android の一部ブラウザで dvh が効かず、カードサイズの上限計算が
   丸ごと無効になって盤面がドックを押し出す問題への対策。
   ========================================================================= */
function syncViewportHeight(){
  try{
    // visualViewport があればそれが最も正確（アドレスバーの伸縮に追従する）
    const h = (window.visualViewport && window.visualViewport.height) || window.innerHeight;
    if(h && h > 200){
      document.documentElement.style.setProperty('--appvh', h + 'px');
    }
  }catch(e){}
}
function initViewportSync(){
  syncViewportHeight();
  if(!window.addEventListener) return;
  window.addEventListener('resize', syncViewportHeight, {passive:true});
  window.addEventListener('orientationchange', ()=>setTimeout(syncViewportHeight, 200), {passive:true});
  if(window.visualViewport && window.visualViewport.addEventListener){
    window.visualViewport.addEventListener('resize', syncViewportHeight, {passive:true});
  }
  // 起動直後はアドレスバーの高さが確定しないことがあるので少し遅れて再計測する
  setTimeout(syncViewportHeight, 300);
  setTimeout(syncViewportHeight, 1000);
}

/* =========================================================================
   スワイプでフェーズ送り（盤面を左右にスワイプ）
   ボタンを増やさずに操作ステップを減らすため。
   ========================================================================= */
function initSwipe(){
  const el = document.getElementById("board");
  if(!el || !el.addEventListener) return;
  let x0=null, y0=null, t0=0;
  el.addEventListener("touchstart", e=>{
    if(e.touches.length!==1) return;
    x0=e.touches[0].clientX; y0=e.touches[0].clientY; t0=Date.now();
  }, {passive:true});
  el.addEventListener("touchend", e=>{
    if(x0===null) return;
    const t=e.changedTouches[0];
    const dx=t.clientX-x0, dy=t.clientY-y0, dt=Date.now()-t0;
    x0=null;
    // 横方向が縦の2倍以上、かつ十分な距離と速さのときだけフェーズ送り
    if(dt<600 && Math.abs(dx)>60 && Math.abs(dx)>Math.abs(dy)*2){
      if(dx<0) doPhaseNext(); else doPhasePrev();
      showToast(phaseJp(gameState.phase));
    }
  }, {passive:true});
}

/* チェーンスタックの常時表示 */
function renderChainStack(gs){
  const el = document.getElementById("chainstack");
  if(!el) return;
  if(!gs.chain.length){ el.hidden = true; el.innerHTML=""; return; }
  el.hidden = false;
  const rows = gs.chain.map((lk,i)=>{
    const top = i===gs.chain.length-1;
    return `<span class="cs-link ${top?'top':''}">${i+1}. ${lk.name}<small>SS${lk.ss}</small></span>`;
  }).reverse().join("");
  el.innerHTML = `<span class="cs-lab">チェーン</span>${rows}
    <button class="cs-go" onclick="resolveChainStep()">解決 ▸</button>`;
}

/* 場外（フィールド/墓地/除外/デッキ/EX）の行。
   相手側は盤面の一番上、自分側は一番下に置く。 */
function pileRowHTML(p, isOpp){
  const P = gameState.players[p];
  const chip = (zone, label)=>{
    if(zone==='field'){
      const c=P.field;
      const nm = c ? cardName(c) : '';
      return `<button class="pchip ${c?'has':''}" onclick="openZone(${p},'field',0)">
        <span class="pc-lab">${label}</span>
        <span class="pc-n">${c?'1':'—'}</span>
        ${c?`<span class="pc-nm">${nm}</span>`:''}
      </button>`;
    }
    const n = P[zone].length;
    // EXは自分だけ召喚画面へ、それ以外は中身一覧へ
    const onclick = (zone==='ex' && !isOpp) ? `openExDeck(${p})` : `openPile(${p},'${zone}')`;
    const ready = (zone==='ex' && !isOpp && n) ? 'ready' : '';
    return `<button class="pchip ${n?'has':''} ${ready}" onclick="${onclick}">
      <span class="pc-lab">${label}</span>
      <span class="pc-n">${n||'—'}</span>
    </button>`;
  };
  return `<div class="pilebar">
    ${chip('field','フィールド')}
    ${chip('grave','墓地')}
    ${chip('banish','除外')}
    ${chip('deck','デッキ')}
    ${chip('ex','EX')}
  </div>`;
}

function zoneRowHTML(p, label, zone, count, isOpp){
  const P = gameState.players[p];
  let cells = "";
  for(let i=0;i<count;i++){
    const c = P[zone][i];
    cells += c
      ? `<div class="slot">${cardHTML(c,"", `openZone(${p},'${zone}',${i})`, !isOpp || c.face==='up')}</div>`
      : `<div class="slot"><span class="ph">${label}</span></div>`;
  }
  return `<div class="zrow"><div class="lab">${label}</div><div class="slots ${zone}">${cells}</div></div>`;
}
function pileSlot(p, zone, label, isOpp){
  const P = gameState.players[p];
  if(zone==="field"){
    const c=P.field;
    return `<div class="pile"><div class="slot field">${ c ? cardHTML(c,"",`openZone(${p},'field',0)`, !isOpp||c.face==='up') : `<span class="ph">${label}</span>`}</div><span class="pile-lab">${label}</span></div>`;
  }
  const n = P[zone].length;
  const top = P[zone][n-1];
  // EXデッキは召喚画面を開く（自分のみ）
  const onclick = (zone==="ex" && !isOpp) ? `openExDeck(${p})` : `openPile(${p},'${zone}')`;
  return `<div class="pile"><div class="slot ${zone==='ex'&&!isOpp&&n?'ex-ready':''}" onclick="${onclick}">
    ${ n ? cardHTML(top,"", onclick, zone!=="deck" && zone!=="ex") : `<span class="ph">${label}</span>` }
    ${ n>0 ? `<span class="pile-n">${n}</span>`:"" }
  </div><span class="pile-lab">${label}</span></div>`;
}

/* 1枚のカード描画。faceUp=false なら裏面 */
function cardHTML(c, extra, onclick, faceUp){
  const db = dbOf(c);
  const kcls = db.k ? `k-${db.k}` : "";
  const setDown = c.face==='down';
  const defRot  = (db.k==='m' && c.pos==='def') ? 'set-mon' : '';
  if(!faceUp || setDown){
    // 裏側でも守備表示なら横向きにする（裏側守備と裏側攻撃を区別する）
    return `<div class="card facedown ${extra} ${defRot}" onclick="${onclick}">
      <img src="${IMG_BACK}" onerror="this.style.display='none'">
    </div>`;
  }
  const badge = db.k==='m' ? (db.lv?`Lv${db.lv}`:"M") : db.k==='s' ? "魔" : db.k==='t' ? "罠" : "";
  const xyzN = (c.xyz && c.xyz.length) ? `<span class="xyz-n">${c.xyz.length}</span>` : "";
  // カウンター（魔力カウンター等）の表示
  // 攻守が変動していたら盤面に出す
  const modBadge = (hasMod(c) && db.k==='m' && faceUp)
    ? `<span class="mod-n">${curATK(c)}<small>/${curDEF(c)}</small></span>` : "";
  const ctSum = c.counters ? Object.values(c.counters).reduce((a,b)=>a+b,0) : 0;
  const ctN = ctSum ? `<span class="ct-n" title="${Object.entries(c.counters).map(([k,v])=>k+v).join(' ')}">${ctSum}</span>` : "";
  // トークンは画像が無いので専用表示にする
  if(c.token){
    return `<div class="card k-m token ${extra} ${defRot}" onclick="${onclick}">
      <span class="badge">Lv${db.lv||1}</span>
      ${ctN}
      <div class="tk-body"><span class="tk-mark">◈</span><span class="tk-atk">${db.atk||0}</span></div>
      <div class="nm">${db.n||"トークン"}</div>
    </div>`;
  }
  return `<div class="card ${kcls} ${extra} ${defRot}" onclick="${onclick}">
    <img src="${IMG_BASE}${db.c}.webp" onerror="this.style.display='none'">
    ${badge?`<span class="badge">${badge}</span>`:""}
    ${xyzN}${ctN}${modBadge}
    <div class="nm">${db.n||""}</div>
  </div>`;
}

/* HTML属性内(onclick="...")に安全に埋め込めるJS文字列リテラルを作る。
   JSON.stringify はダブルクォートを出すため属性が壊れる。
   シングルクォート括りにし、危険な文字を実体参照/エスケープする。 */
function jsStr(v){
  return "'" + String(v)
    .replace(/\\/g, "\\\\")
    .replace(/'/g, "\\'")
    .replace(/"/g, "&quot;")
    .replace(/\n/g, "\\n")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;") + "'";
}
/* 配列・オブジェクトを属性内に埋め込む（ダブルクォートを実体参照化） */
function jsVal(v){
  return JSON.stringify(v).replace(/"/g, "&quot;");
}

/* ---- 対象選択のための共通ピッカー ---------------------------------- */
/* PICK: 一覧から1枚選ばせる。cards=[{label, sub, onPick}] */
function openPick(title, note, items, onCancel){
  if(!items.length){
    showToast("対象がありません");
    if(onCancel) onCancel();
    return;
  }
  const rows = items.map((it,i)=>
    `<div class="act pick-row" onclick="__pick(${i})">
       <span class="pk-nm">${it.label}</span>
       ${it.sub?`<span class="pk-sub">${it.sub}</span>`:""}
     </div>`).join("");
  PICK_ITEMS = items; PICK_CANCEL = onCancel||null;
  sheet.innerHTML = `<div class="grip"></div>
    <h3 style="margin-bottom:4px">${title}</h3>
    ${note?`<div class="meta" style="margin-bottom:10px">${note}</div>`:""}
    <div class="pick-list">${rows}</div>
    <button class="close" onclick="__pickCancel()">やめる</button>`;
  veil.classList.add("on");
}
let PICK_ITEMS=[], PICK_CANCEL=null;
function __pick(i){
  const it = PICK_ITEMS[i];
  PICK_ITEMS=[]; PICK_CANCEL=null;
  closeSheet();
  if(it && it.onPick) it.onPick();
}
function __pickCancel(){
  const cb = PICK_CANCEL;
  PICK_ITEMS=[]; PICK_CANCEL=null;
  closeSheet();
  if(cb) cb();
}

/* ---- フィルタ（index.html の soloAutoMatch と同仕様） ---------------- */
function autoMatch(f){
  return function(c){
    if(!c) return false;
    if(c.ex) return false;
    if(f.tk==='m' && c.k!=='m') return false;
    if(f.tk==='s' && c.k!=='s') return false;
    if(f.tk==='t' && c.k!=='t') return false;
    if(f.tk==='st' && !(c.k==='s'||c.k==='t')) return false;
    if(f.lvmax!=null && !(c.k==='m'&&c.lv!=null&&c.lv<=f.lvmax)) return false;
    if(f.lvmin!=null && !(c.k==='m'&&c.lv!=null&&c.lv>=f.lvmin)) return false;
    if(f.lv!=null && !(c.k==='m'&&c.lv===f.lv)) return false;
    if(f.at && c.at!==f.at) return false;
    if(f.ra && c.ra!==f.ra) return false;
    if(f.normal && (c.st||[]).indexOf('通常')<0) return false;
    if(f.tuner && (c.st||[]).indexOf('チューナー')<0) return false;
    if(f.atkmax!=null && !(c.atk!=null&&c.atk<=f.atkmax)) return false;
    if(f.defmax!=null && !(c.def!=null&&c.def<=f.defmax)) return false;
    if(f.arch && String(c.n).indexOf(f.arch)<0) return false;
    if(f.exclude && c.n===f.exclude) return false;
    return true;
  };
}

/* ---- ゾーン参照ヘルパ ---------------------------------------------- */
function myP(){ return gameState.players[gameState.activePlayer]; }
function oppIdx(p){ return p===0?1:0; }
function dbOf(c){ return (c && c.token) ? c.token : (CARD_DB[c?.id]||{}); }
function labelOf(c){ const d=dbOf(c); return d.n||"カード"; }
function subOf(c){
  const d=dbOf(c);
  if(d.k==='m') return `${d.at||''}/${d.ra||''} Lv${d.lv||'-'} 攻${d.atk??'-'}`;
  return d.k==='s' ? `魔法${d.sub?'・'+d.sub:''}` : `罠${d.sub?'・'+d.sub:''}`;
}
/* デッキから条件に合うカードの位置一覧 */
function deckMatches(p, filt){
  const P = gameState.players[p]; const out=[];
  P.deck.forEach((c,i)=>{ if(filt(dbOf(c))) out.push({i, c}); });
  return out;
}
function graveMatches(p, filt){
  const P = gameState.players[p]; const out=[];
  P.grave.forEach((c,i)=>{ if(filt(dbOf(c))) out.push({i, c}); });
  return out;
}

/* ---- 宣言テーブルの実行（search / recruit / mill） ------------------- */
function runAutoEffect(p, srcName, ent, selfLoc){
  const filtBase = autoMatch(ent.f);
  const filt = (cc)=>{
    if(!cc || cc.ex) return false;
    if(ent.op==='recruit' && cc.k!=='m') return false;
    return filtBase(cc);
  };
  const P = gameState.players[p];
  if(ent.op==='recruit' && P.mz.length>=ZONE_LIMITS.mz){ showToast("モンスターゾーンが一杯です"); return; }
  const cands = deckMatches(p, filt);
  if(!cands.length){ showToast("対象がデッキにありません"); return; }
  const opJa = {search:"サーチ", mill:"墓地へ送る", recruit:"特殊召喚"}[ent.op];
  openPick(`${srcName}：${opJa}する対象`, `デッキ ${cands.length}枚が該当`,
    cands.map(({i,c})=>({
      label: labelOf(c), sub: subOf(c),
      onPick: ()=>{
        if(ent.op==='search')      act({type:"FX_SEARCH", player:p, deckIndex:i, reason:srcName});
        else if(ent.op==='mill')   act({type:"FX_MILL",   player:p, deckIndex:i, reason:srcName});
        else                       act({type:"FX_SPECIAL_SUMMON", player:p, from:"deck", fromIndex:i, pos:"atk", reason:srcName});
        afterEffect(p, selfLoc, srcName);
      }
    })));
}

/* 魔法・罠が効果を出し終えたら墓地へ送る */
function afterEffect(p, selfLoc, srcName){
  if(!selfLoc) return;
  if(selfLoc.keep) return;                 // 永続・フィールドは残す
  act({type:"FX_SELF_TO_GRAVE", player:p, zone:selfLoc.zone, index:selfLoc.index});
}

/* =========================================================================
   1103環境の汎用カード個別スクリプト
   fn(p, selfLoc) : p=発動プレイヤー, selfLoc={zone,index,keep?}
   対象選択が要るものは openPick を使う。全て act() 経由なので Undo 可。
   ========================================================================= */
const CARD_EFFECT = {

  /* ---------- 全体除去 ---------- */
  "サンダー・ボルト": function(p, loc){
    const o = oppIdx(p);
    act({type:"FX_WIPE_ZONE", player:o, zone:"mz", reason:"サンダー・ボルト"});
    afterEffect(p, loc, "サンダー・ボルト");
  },
  "ブラック・ホール": function(p, loc){
    act({type:"FX_WIPE_ZONE", player:0, zone:"mz", reason:"ブラック・ホール"});
    act({type:"FX_WIPE_ZONE", player:1, zone:"mz", reason:"ブラック・ホール"});
    afterEffect(p, loc, "ブラック・ホール");
  },
  "激流葬": function(p, loc){
    act({type:"FX_WIPE_ZONE", player:0, zone:"mz", reason:"激流葬"});
    act({type:"FX_WIPE_ZONE", player:1, zone:"mz", reason:"激流葬"});
    afterEffect(p, loc, "激流葬");
  },
  "聖なるバリア －ミラーフォース－": function(p, loc){
    const o = oppIdx(p);
    const P = gameState.players[o];
    const atkPos = [];
    P.mz.forEach((c,i)=>{ if(c.face==='up' && c.pos==='atk') atkPos.push(i); });
    if(!atkPos.length){ showToast("相手に攻撃表示モンスターがいません"); return; }
    // 後ろから消す（インデックスずれ防止）
    atkPos.slice().reverse().forEach(i=>{
      act({type:"FX_TO_GRAVE", player:o, zone:"mz", index:i, reason:"ミラーフォース"});
    });
    afterEffect(p, loc, "ミラーフォース");
  },
