<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>DUEL FIELD — 1103 Hot-Seat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --bg:#120d08; --bg-2:#161007; --surface:#1e1710; --surface-2:#292015; --surface-3:#352a1b;
  --line:rgba(201,162,75,0.22); --line-hi:rgba(201,162,75,0.45);
  --ink:#f0e7d2; --text-dim:#a2937c;
  --gold:#c9a24b; --gold-hi:#e4c06a; --gold-ink:#14100a;
  --parchment:#e9e4d6; --card-brown:#c9a24b; --card-brown-dk:#a8863d;
  --edge:rgba(201,162,75,0.22); --edge-dk:rgba(201,162,75,0.45);
  --panel:#12141c; --panel-lo:#1a1d28;
  --mon:#d29a3a; --spell:#35b08e; --trap:#9d6ede;
  --mon-normal:#d4b158; --mon-effect:#e08544; --mon-ritual:#6f9ff0;
  --mon-fusion:#a97fe8; --mon-synchro:#ece9e2; --mon-xyz:#8d8d9c;
  --forbidden:#ef6b5e; --limited:#e3a94f; --semi:#74a8ec;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  background:
    radial-gradient(120% 80% at 50% -10%, rgba(201,162,75,0.07), transparent 60%),
    var(--bg);
  color:var(--ink);
  font-family:"Zen Kaku Gothic New",system-ui,sans-serif;
  font-size:14px; line-height:1.5;
  display:flex; flex-direction:column; overflow:hidden;
  /* 端末により dvh が使えないことがあるので3段構えにする。
     最後の --appvh は JS が実測して入れるので最も確実。 */
  height:100vh;
  height:100dvh;
  height:var(--appvh, 100dvh);
}
h1,h2,h3,.mincho{font-family:"Shippori Mincho",serif}
button{font-family:inherit;color:inherit;cursor:pointer}

/* ---------- top bar ---------- */
/* ---------- 極小ステータスバー（常時表示はこれだけ） ---------- */
.statusbar{
  flex:0 0 auto; display:flex; align-items:center; gap:8px;
  padding:4px 10px; border-bottom:1px solid var(--line);
  background:var(--bg-2); min-height:26px; font-size:11px; overflow:hidden;
}
.sb-turn{font-family:"Shippori Mincho",serif;font-weight:800;font-size:12px;color:var(--gold-hi);white-space:nowrap}
.sb-phase{
  font-size:10.5px;font-weight:700;color:var(--gold-ink);background:var(--gold);
  padding:2px 8px;border-radius:2px;white-space:nowrap;letter-spacing:.04em;
}
.sb-lp{margin-left:auto;display:flex;gap:8px;align-items:center;white-space:nowrap}
.sb-lp b{font-family:"Shippori Mincho",serif;font-size:12px}
.sb-lp .me{color:var(--gold-hi)}
.sb-lp .op{color:var(--text-dim)}
.sb-warn{font-size:10px;font-weight:700;color:#0d0a06;background:var(--spell);
  padding:2px 7px;border-radius:9px;white-space:nowrap;animation:pulse 1.1s ease-in-out infinite}
.sb-warn.trap{background:var(--trap);color:#120a1f}
header{
  display:none;
}
header .brand{font-family:"Shippori Mincho",serif;font-weight:800;letter-spacing:.14em;font-size:15px;color:var(--gold-hi)}
header .brand small{display:block;font-size:9px;letter-spacing:.34em;color:var(--text-dim);font-weight:400;font-family:"Zen Kaku Gothic New"}
header .spacer{flex:1}
.turn-flag{
  font-family:"Shippori Mincho",serif;font-weight:700;font-size:13px;
  padding:5px 14px;border:1px solid var(--line-hi);border-radius:2px;
  background:var(--surface-2);letter-spacing:.08em;white-space:nowrap;
}
.turn-flag b{color:var(--gold-hi)}

/* ---------- phase strip ---------- */

.phase{
  flex:0 0 auto; padding:7px 12px; font-size:11px; letter-spacing:.04em;
  border:1px solid var(--line); border-radius:4px; background:transparent;
  color:var(--text-dim); white-space:nowrap; display:flex; align-items:center;
}
.phase.on{background:var(--gold);color:var(--gold-ink);border-color:var(--gold-hi);
  font-weight:800;font-size:12px;box-shadow:0 0 12px rgba(201,162,75,0.25)}
.phase.done{color:var(--gold);border-color:var(--edge-dk)}

.phase-next:active{background:var(--surface-3)}

/* ---------- guide strip（今やるべきこと）---------- */
.guide{
  flex:0 0 auto; display:flex; align-items:center; gap:6px; flex-wrap:wrap;
  padding:7px 2px 0; min-height:30px;
}
.guide .g-phase{
  font-family:"Shippori Mincho",serif; font-weight:800; font-size:13px;
  color:var(--gold-ink); background:var(--gold); border:1px solid var(--gold-hi);
  padding:3px 11px; border-radius:3px; letter-spacing:.06em; white-space:nowrap;
}
.guide .g-can{
  font-size:10.5px; color:var(--gold-hi); border:1px solid var(--edge-dk);
  padding:3px 9px; border-radius:11px; white-space:nowrap; background:rgba(201,162,75,0.06);
}
.guide .g-can.mute{color:var(--text-dim); border-color:var(--line); background:transparent}
.guide .g-chainwarn{
  margin-left:auto; font-size:11px; font-weight:700; color:#0d0a06;
  background:var(--spell); padding:4px 11px; border-radius:12px; white-space:nowrap;
  animation:pulse 1.1s ease-in-out infinite;
}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}

/* header menu button */
.hdr-btn{
  width:34px;height:30px;border:1px solid var(--line-hi);border-radius:3px;
  background:var(--surface-2);color:var(--gold-hi);font-size:17px;line-height:1;font-weight:700;
}
.hdr-btn:active{background:var(--surface-3)}

/* ---------- board ---------- */
.board{
  flex:1 1 auto; min-height:0;          /* ← これが無いと縮まずドックが画面外に出る */
  overflow-y:auto; -webkit-overflow-scrolling:touch;
  padding:6px 8px 2px; display:flex; flex-direction:column; gap:5px;
}
/* 単位が効かない環境でも盤面が伸び切らないようにする保険。
   ここが効くとカードは小さくなるが、ドックは必ず画面内に残る。 */
.side{flex:0 1 auto; min-height:0}
.side .slot{min-height:34px}
.side{
  border:1px solid var(--line); border-radius:4px; padding:4px 5px 5px;
  background:linear-gradient(var(--surface),var(--bg-2));
}
.side.opp{border-color:rgba(157,110,222,0.28)}
.side.active-side{border-color:var(--gold-hi);box-shadow:0 0 0 1px var(--gold-hi) inset, 0 0 22px rgba(201,162,75,0.08)}
.side-head{display:flex;align-items:center;gap:6px;margin-bottom:4px;min-height:20px}
.side-name{font-family:"Shippori Mincho",serif;font-weight:700;letter-spacing:.04em;font-size:11px}
.side-tag{font-size:8px;letter-spacing:.18em;color:var(--text-dim)}
.lp-box{margin-left:auto;display:flex;align-items:center;gap:4px}
.lp-val{font-family:"Shippori Mincho",serif;font-weight:800;font-size:15px;min-width:54px;text-align:right;letter-spacing:.02em}
.lp-val.low{color:var(--forbidden)}
.lp-btn{
  width:22px;height:22px;line-height:1;border:1px solid var(--line);border-radius:2px;
  background:var(--surface-2);color:var(--ink);font-size:12px;font-weight:700;
}
.lp-btn:active{background:var(--surface-3)}

.zones{display:flex;flex-direction:column;gap:4px}
.zrow{display:grid;grid-template-columns:16px 1fr;gap:4px;align-items:start}
.zrow .lab{font-size:7.5px;letter-spacing:.02em;color:var(--text-dim);text-align:center;
  writing-mode:vertical-rl;text-orientation:upright;padding-top:2px;justify-self:center}
.slots{display:grid;gap:4px;justify-items:center}
.slots > *{width:100%;max-width:94px}
.slots.mz,.slots.sz{grid-template-columns:repeat(5,1fr)}
.slots.line5{grid-template-columns:repeat(5,1fr)}
.pile{display:flex;flex-direction:column;align-items:stretch;gap:3px}
.pile .slot{width:100%}
.pile-lab{font-size:7.5px;letter-spacing:.04em;color:var(--text-dim);text-align:center}
.pile-n{
  position:absolute;bottom:2px;right:2px;z-index:4;min-width:16px;text-align:center;
  font-size:9px;font-weight:800;padding:1px 3px;border-radius:8px;
  background:var(--gold-ink);color:var(--gold-hi);border:1px solid var(--edge-dk);
}
.slot{
  aspect-ratio:59/86;
  /* 幅が広い端末でカードが巨大化しないよう上限を設ける（縦を節約） */
  /* 盤面6行(自分3+相手3)＋固定UIが1画面に収まる高さを画面から逆算する。
     これによりスクロールせずに全体を把握できる。 */
  /* 場外をチップ化して空いた分、モンスター/魔法罠を大きく表示する。
     4行(自分2+相手2)＋固定UIが1画面に収まる高さを画面から逆算。 */
  /* 場外をチップ化して空いた分、モンスター/魔法罠を大きく表示する。
     内訳: 固定UI約175 + 場外チップ2段64 + サイド枠66 + 余白5 ≒ 310px を差し引き、
     残りを主要4行(自分2+相手2)で分ける。 */
  max-height:clamp(50px, calc((100vh - 330px) / 4), 132px);
  max-height:clamp(50px, calc((100dvh - 330px) / 4), 132px);
  max-height:clamp(50px, calc((var(--appvh, 100dvh) - 330px) / 4), 132px);
  border:1px dashed var(--line); border-radius:3px;
  background:rgba(0,0,0,0.18); display:flex;align-items:center;justify-content:center;
  position:relative; overflow:hidden;
}
.slot.field{aspect-ratio:59/86}
.slot .ph{font-size:8px;color:var(--text-dim);letter-spacing:.1em}

/* ---------- card ---------- */
.card{
  width:100%;height:100%;border-radius:3px;position:relative;overflow:hidden;
  border:1px solid var(--edge-dk); background:var(--surface-3);
  display:flex;flex-direction:column;justify-content:flex-end;cursor:pointer;
}
.card.def{aspect-ratio:auto}
.card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.card .nm{
  position:relative;z-index:2;font-size:8px;line-height:1.15;padding:2px 3px;
  background:linear-gradient(transparent,rgba(0,0,0,0.82));color:var(--parchment);
  max-height:50%;overflow:hidden;font-weight:500;
}
.card.set-mon{transform:rotate(90deg) scale(.92)} /*守備表示は横向き */
.card .badge{
  position:absolute;top:2px;left:2px;z-index:3;font-size:7px;letter-spacing:.06em;
  padding:1px 4px;border-radius:2px;background:var(--gold);color:var(--gold-ink);font-weight:700;
}
.card.k-s .badge{background:var(--spell)}
.card.k-t .badge{background:var(--trap)}
.card.facedown{background:#0d0a06}
.card.facedown img{opacity:.96}

/* ---------- hand ---------- */
.handbar{
  flex:0 0 auto; min-height:0; border-top:1px solid var(--line);
  background:linear-gradient(var(--bg-2),var(--surface));
}

.hand{display:flex;gap:5px;overflow-x:auto;padding:5px 8px;align-items:flex-start;max-height:22vh}
.hand .hcard{
  flex:0 0 52px; aspect-ratio:59/86;
  max-height:14vh;
  max-height:14dvh;
  max-height:calc(var(--appvh, 100dvh) * 0.14);
}
.hand .hcard .nm{font-size:9px}

/* ---------- controls ---------- */

.btn{
  flex:0 0 auto; padding:9px 14px; border-radius:3px; font-size:12px; font-weight:700;
  letter-spacing:.04em; border:1px solid var(--line-hi); background:var(--surface-2); color:var(--ink);
}
.btn:active{background:var(--surface-3)}
.btn.gold{background:var(--gold);color:var(--gold-ink);border-color:var(--gold-hi)}
.btn.ghost{background:transparent}

/* ---------- log ---------- */
.log{
  flex:0 0 auto; max-height:82px; overflow-y:auto; padding:6px 12px 10px;
  border-top:1px solid var(--line); background:var(--bg); font-size:10.5px; color:var(--text-dim);
}
.log .li{padding:1px 0;border-bottom:1px solid rgba(201,162,75,0.06)}
.log .li b{color:var(--gold-hi);font-weight:700}

/* ---------- modal (bottom sheet) ---------- */
.veil{
  position:fixed;inset:0;background:rgba(6,4,2,0.72);backdrop-filter:blur(3px);
  display:none;align-items:flex-end;justify-content:center;z-index:50;
}
.veil.on{display:flex}
.sheet{
  width:100%;max-width:520px;max-height:88vh; max-height:88dvh; max-height:calc(var(--appvh, 100dvh) * 0.88);overflow-y:auto;
  border:1px solid var(--line-hi);border-bottom:none;
  border-radius:14px 14px 0 0;background:linear-gradient(var(--surface),var(--bg-2));
  padding:14px 16px calc(16px + env(safe-area-inset-bottom,0));
  animation:sheetup .18s ease-out;
}
@keyframes sheetup{from{transform:translateY(14px);opacity:.4}to{transform:translateY(0);opacity:1}}
.sheet .grip{width:38px;height:4px;border-radius:2px;background:var(--line-hi);margin:0 auto 12px}
/* card preview header inside sheet */
.sheet-card{display:flex;gap:12px;margin-bottom:14px;align-items:flex-start}
.sheet-thumb{flex:0 0 66px;aspect-ratio:59/86;border-radius:5px;overflow:hidden;
  border:1px solid var(--edge-dk);background:var(--surface-3);position:relative}
.sheet-thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.sheet-info{flex:1;min-width:0}
.sheet h3{margin:0 0 5px;font-size:16px;letter-spacing:.03em;color:var(--gold-hi);line-height:1.25}
.sheet .meta{font-size:11px;color:var(--text-dim);line-height:1.6}
.sheet .eff{font-size:11.5px;color:var(--ink);background:rgba(0,0,0,0.22);border:1px solid var(--line);
  border-radius:4px;padding:9px 11px;margin-bottom:14px;max-height:130px;overflow-y:auto;white-space:pre-wrap;line-height:1.55}
.act-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.act-grid.wide{grid-template-columns:1fr}
.act-label{font-size:9px;letter-spacing:.18em;color:var(--text-dim);margin:14px 2px 7px;text-transform:none}
.act-label:first-of-type{margin-top:0}
.act{padding:13px 10px;border:1px solid var(--line);border-radius:5px;background:var(--surface-2);
  font-size:13px;text-align:center;font-weight:600;min-height:46px;display:flex;align-items:center;justify-content:center}
.act:active{background:var(--surface-3)}
.act.warn{border-color:var(--forbidden);color:var(--forbidden)}
/* chain */
.chain-list{display:flex;flex-direction:column;gap:5px;margin-bottom:6px}
.chain-link{display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:5px;
  border:1px solid var(--line);background:var(--surface-2)}
.chain-link.top{border-color:var(--gold-hi);box-shadow:0 0 10px rgba(201,162,75,0.18)}
.chain-link .cl-no{font-family:"Shippori Mincho",serif;font-weight:800;color:var(--gold-hi);min-width:18px}
.chain-link .cl-nm{flex:1;font-size:13px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chain-link .cl-ss{font-size:10px;color:var(--spell);font-weight:700}
.chain-link .cl-who{font-size:9px;color:var(--text-dim);letter-spacing:.06em}
.chain-badge{display:inline-block;min-width:16px;text-align:center;font-size:10px;font-weight:800;
  padding:1px 5px;border-radius:8px;background:var(--spell);color:#0d0a06;margin-left:5px}
.sheet .close{margin-top:14px;width:100%;padding:14px;text-align:center;background:transparent;
  border:1px solid var(--line);border-radius:6px;color:var(--text-dim);font-size:13px;font-weight:600}

textarea{
  width:100%;min-height:120px;background:rgba(0,0,0,0.28);border:1px solid var(--line);
  border-radius:3px;color:var(--ink);font-family:"Zen Kaku Gothic New";font-size:12px;padding:10px;resize:vertical;
}
.sub{font-size:10px;color:var(--text-dim);margin:6px 0 2px;letter-spacing:.04em}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tab-title{font-size:10px;letter-spacing:.2em;color:var(--text-dim);margin:2px 0 8px}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}

/* ---------- このターンにやったこと ---------- */
.turnlog{
  flex:0 0 auto; display:flex; gap:5px; align-items:center; overflow-x:auto;
  padding:5px 2px 0; min-height:26px;
}
.turnlog .tl-lab{font-size:9px;letter-spacing:.16em;color:var(--text-dim);white-space:nowrap;flex:0 0 auto}
.turnlog .tl-chip{
  flex:0 0 auto; font-size:10.5px; color:var(--ink); background:var(--surface-2);
  border:1px solid var(--line); border-radius:11px; padding:3px 10px; white-space:nowrap;
}
.turnlog .tl-empty{font-size:10px;color:var(--text-dim)}

/* ---------- collapsible log ---------- */

.log-toggle{
  width:100%; text-align:left; padding:5px 2px; font-size:10px; letter-spacing:.06em;
  color:var(--text-dim); background:transparent; border:none;
}
.log-toggle:active{color:var(--gold-hi)}
.log{max-height:120px}

/* ---------- 下部ドック（既定は折りたたみ） ---------- */
.dock{
  flex:0 0 auto; border-top:1px solid var(--line-hi);
  background:linear-gradient(var(--surface),var(--bg-2));
  padding:5px 8px calc(5px + env(safe-area-inset-bottom,0));
  display:flex; flex-direction:column; gap:5px;
  box-shadow:0 -6px 18px rgba(0,0,0,0.35);
}
/* 常時見える1行。文字数で折り返して縦に伸びないよう厳しく固定する。 */
.dock-bar{
  display:flex; align-items:stretch; gap:4px;
  height:46px; min-height:46px; max-height:46px;
}
.dock-bar > *{
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  line-height:1; padding-top:0; padding-bottom:0;
  display:flex; align-items:center; justify-content:center;
}
/* 展開時のみ出る詳細 */
.dock-body{display:flex; flex-direction:column; gap:5px; overflow:hidden;
  max-height:50vh; max-height:50dvh; max-height:calc(var(--appvh, 100dvh) * 0.5); transition:max-height .18s ease, opacity .18s ease, margin .18s ease; opacity:1}
.dock.collapsed .dock-body{max-height:0; opacity:0; margin:0; pointer-events:none}
.dock-actions{display:flex; align-items:stretch; gap:4px; min-height:44px}
.dock-actions > *{white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0}
/* 展開ハンドル */
.d-more{
  flex:0 0 auto; min-width:34px; padding:0 6px; border-radius:5px; font-size:15px; line-height:1;
  border:1px solid var(--line-hi); background:var(--surface-2); color:var(--gold-hi);
  display:flex; align-items:center; justify-content:center;
}
.d-more:active{background:var(--surface-3)}

/* フェーズ行：戻る / 現在フェーズ表示 / 進む */
.d-prev,.d-next{
  flex:0 0 auto; min-width:38px; padding:0 10px; border-radius:5px; font-size:12px; font-weight:700;
  border:1px solid var(--line-hi); background:var(--surface-2); color:var(--ink);
  display:flex; align-items:center; justify-content:center; letter-spacing:.03em;
}
.d-prev:active,.d-next:active{background:var(--surface-3)}
.d-next.primary{
  flex:1 1 auto; min-width:0; background:var(--gold); color:var(--gold-ink); border-color:var(--gold-hi);
  font-size:13.5px; font-weight:800; letter-spacing:.03em;
  box-shadow:0 0 14px rgba(201,162,75,0.2);
}
.d-next.endturn{background:var(--surface-2);color:var(--gold-hi);border-color:var(--line-hi)}
.d-phase-cur{
  flex:1 1 auto; display:flex; flex-direction:column; align-items:center; justify-content:center;
  border:1px solid var(--line); border-radius:5px; background:rgba(201,162,75,0.05);
  padding:4px 8px; min-width:0;
}
.d-phase-cur .cur{font-family:"Shippori Mincho",serif;font-weight:800;font-size:14px;color:var(--gold-hi);letter-spacing:.06em}
.d-phase-cur .nxt{font-size:9px;color:var(--text-dim);letter-spacing:.06em;margin-top:1px}

/* アクション行 */
.d-act{
  flex:1 1 0; min-width:0; padding:11px 6px; border-radius:5px; font-size:12px; font-weight:700;
  border:1px solid var(--line); background:var(--surface-2); color:var(--ink);
  display:flex; align-items:center; justify-content:center; gap:4px; min-height:46px; letter-spacing:.02em;
}
.d-act:active{background:var(--surface-3)}
.d-act.gold{background:var(--gold);color:var(--gold-ink);border-color:var(--gold-hi)}
.d-act.undo{color:var(--gold-hi);border-color:var(--line-hi)}
.d-act:disabled{opacity:.34}
.d-act .kb{font-size:10px;font-weight:800;padding:1px 6px;border-radius:9px;background:var(--spell);color:#0d0a06}

/* チェーン解決の強調表示 */
.chain-link.resolving{border-color:var(--spell);box-shadow:0 0 12px rgba(53,176,142,0.3);background:rgba(53,176,142,0.08)}
.chain-next-hint{
  font-size:12px;font-weight:700;color:var(--spell);text-align:center;
  padding:8px;margin:2px 0 8px;border:1px dashed var(--spell);border-radius:5px;background:rgba(53,176,142,0.06);
}
.chain-link .cl-tag{font-size:9px;color:var(--text-dim);letter-spacing:.04em;margin-left:4px}

/* battle step sheet */
.bt-row{display:flex;align-items:center;justify-content:center;gap:10px;margin:6px 0 12px;
  font-family:"Shippori Mincho",serif;font-size:15px}
.bt-row .vs{color:var(--text-dim);font-size:12px}
.bt-row .a-atk{color:var(--mon-effect);font-weight:800}
.bt-row .a-def{color:var(--spell);font-weight:800}
.bt-outcome{font-size:12px;text-align:center;color:var(--gold-hi);margin-bottom:10px}

/* ---------- LP 計算機 ---------- */
.lp-val{border:none;background:transparent;padding:2px 4px;border-radius:3px}
.lp-val:active{background:var(--surface-3)}
.lp-now{font-size:11.5px;color:var(--text-dim);margin-bottom:10px}
.lp-now b{color:var(--gold-hi);font-size:14px;font-family:"Shippori Mincho",serif}
.lp-prev{color:var(--forbidden);font-weight:700}
.lp-prev.up{color:var(--spell)}
.lp-display{
  font-family:"Shippori Mincho",serif;font-weight:800;font-size:30px;text-align:right;
  padding:10px 14px;border:1px solid var(--line-hi);border-radius:6px;
  background:rgba(0,0,0,0.3);color:var(--gold-hi);margin-bottom:10px;letter-spacing:.04em;
}
.lp-quickrow{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}
.lp-quick{
  flex:1 1 auto;min-width:56px;padding:8px 4px;font-size:12px;font-weight:700;
  border:1px solid var(--line);border-radius:4px;background:var(--surface-2);color:var(--ink);
}
.lp-quick:active{background:var(--surface-3)}
.lp-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px}
.lp-key{
  padding:15px 4px;font-size:18px;font-weight:700;font-family:"Shippori Mincho",serif;
  border:1px solid var(--line);border-radius:5px;background:var(--surface-2);color:var(--ink);
}
.lp-key:active{background:var(--surface-3)}
.lp-ops{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:6px}
.lp-op{
  padding:15px 8px;font-size:14px;font-weight:800;border-radius:6px;letter-spacing:.04em;
  border:1px solid var(--line-hi);
}
.lp-op.dmg{background:var(--forbidden);color:#1a0b09;border-color:var(--forbidden)}
.lp-op.heal{background:var(--spell);color:#07130f;border-color:var(--spell)}
.lp-op:active{filter:brightness(.88)}

/* ---------- デッキ読込 ---------- */
.dl-tabs{display:flex;gap:6px;margin-bottom:12px}
.dl-tab{
  flex:1 1 0;padding:10px 8px;font-size:12.5px;font-weight:700;border-radius:5px;
  border:1px solid var(--line);background:transparent;color:var(--text-dim);
}
.dl-tab.on{background:var(--gold);color:var(--gold-ink);border-color:var(--gold-hi)}
.dl-list{display:flex;flex-direction:column;gap:6px;max-height:46vh;max-height:46dvh;max-height:calc(var(--appvh, 100dvh) * 0.46);overflow-y:auto}
.dl-item{
  display:flex;align-items:center;gap:10px;padding:13px 12px;border-radius:5px;
  border:1px solid var(--line);background:var(--surface-2);min-height:48px;
}
.dl-item:active{background:var(--surface-3)}
.dl-nm{flex:1;min-width:0;font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dl-badge{margin-left:7px;font-size:9px;font-weight:800;padding:2px 6px;border-radius:8px;
  background:var(--spell);color:#0d0a06;letter-spacing:.04em}
.dl-n{font-size:11px;color:var(--gold-hi);white-space:nowrap;text-align:right}
.dl-n small{display:block;font-size:9px;color:var(--text-dim)}

/* ---------- 効果処理UI ---------- */
.act.fx{
  background:linear-gradient(var(--spell),#2a8e73); color:#07130f;
  border-color:var(--spell); font-weight:800; letter-spacing:.03em;
}
.act.fx:active{filter:brightness(.9)}
.fx-note{
  font-size:10.5px;color:var(--spell);border:1px dashed var(--spell);border-radius:5px;
  padding:6px 10px;margin-bottom:10px;background:rgba(53,176,142,.07);text-align:center;font-weight:600;
}
.pick-list{display:flex;flex-direction:column;gap:6px;max-height:52vh;max-height:52dvh;max-height:calc(var(--appvh, 100dvh) * 0.52);overflow-y:auto;margin-bottom:4px}
.pick-row{justify-content:flex-start!important;text-align:left;gap:10px;padding:12px 12px}
.pk-nm{flex:1;min-width:0;font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pk-sub{font-size:10px;color:var(--text-dim);white-space:nowrap}

/* ---------- 手札が空のときの導線 ---------- */
.hand-empty{
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:6px 4px;
}
.hand-empty>span{font-size:11px;color:var(--text-dim);margin-right:2px}
.he-btn{
  padding:10px 14px;border-radius:5px;font-size:12px;font-weight:700;
  background:var(--gold);color:var(--gold-ink);border:1px solid var(--gold-hi);
}
.he-btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.he-btn:active{filter:brightness(.9)}
.dl-item.test{border-color:var(--spell);background:rgba(53,176,142,.08)}
.dl-badge.test{background:var(--gold);color:var(--gold-ink)}

/* ---------- EX / エクシーズ ---------- */
.xyz-n{
  position:absolute;bottom:2px;left:2px;z-index:4;min-width:15px;text-align:center;
  font-size:9px;font-weight:800;padding:1px 4px;border-radius:8px;
  background:var(--spell);color:#07130f;border:1px solid rgba(0,0,0,.3);
}
.slot.ex-ready{border-color:var(--spell);box-shadow:0 0 8px rgba(53,176,142,.28)}
.pick-row.dim{opacity:.42}
.pick-row.dim .pk-sub{color:var(--forbidden)}

/* ---------- 相手ターン割り込み ---------- */
.d-act.react{border-color:var(--trap);color:var(--trap);font-weight:800}
.d-act.react .kb{background:var(--trap);color:#120a1f}
.g-can.react{border-color:var(--trap);color:var(--trap);background:rgba(157,110,222,.10)}
.react-warn{
  font-size:11.5px;font-weight:700;color:var(--trap);text-align:center;
  padding:9px 10px;margin:0 0 10px;border:1px dashed var(--trap);border-radius:5px;
  background:rgba(157,110,222,.10);
}
.react-warn:active{background:rgba(157,110,222,.18)}
.rk-zone{
  margin-left:6px;font-size:9px;font-weight:800;padding:1px 5px;border-radius:7px;
  background:var(--spell);color:#07130f;
}
.rk-set{
  margin-left:6px;font-size:9px;font-weight:800;padding:1px 5px;border-radius:7px;
  background:var(--trap);color:#120a1f;
}

.fp-mark{
  display:inline-block;margin-left:5px;font-size:8.5px;font-weight:800;
  padding:1px 5px;border-radius:8px;background:var(--gold);color:var(--gold-ink);
  vertical-align:middle;letter-spacing:.04em;
}
.d-act.pulse{animation:dpulse 1.4s ease-in-out infinite}
@keyframes dpulse{0%,100%{box-shadow:0 0 0 0 rgba(201,162,75,.5)}50%{box-shadow:0 0 0 5px rgba(201,162,75,0)}}

/* ---------- フェーズ制限の表示 ---------- */
.phase-note{
  font-size:10.5px;color:var(--gold-hi);background:rgba(201,162,75,.07);
  border:1px solid var(--edge-dk);border-radius:4px;padding:5px 9px;margin-bottom:9px;
  display:flex;align-items:center;gap:6px;
}
.ss-tag{margin-left:auto;font-size:9px;font-weight:800;padding:1px 6px;border-radius:8px;
  background:var(--surface-3);color:var(--ink);letter-spacing:.04em}
.act.blocked{opacity:.4;position:relative}
.act.blocked .bk{
  margin-left:6px;font-size:8.5px;font-weight:800;padding:1px 5px;border-radius:7px;
  background:var(--forbidden);color:#1a0b09;white-space:nowrap;
}
/* ドローフェイズ用のバー内ドローボタン */
.d-draw{
  flex:0 0 auto; padding:0 10px; border-radius:5px; font-size:12.5px; font-weight:800;
  background:var(--gold); color:var(--gold-ink); border:1px solid var(--gold-hi);
  letter-spacing:.04em; white-space:nowrap;
}
.d-draw:active{filter:brightness(.9)}

/* ---------- チェーン常時スタック ---------- */
.chainstack{
  flex:0 0 auto; display:flex; align-items:center; gap:5px; overflow-x:auto;
  padding:5px 8px; border-top:1px solid var(--spell);
  background:rgba(53,176,142,.10);
}
.cs-lab{font-size:9px;letter-spacing:.1em;color:var(--spell);font-weight:800;white-space:nowrap;flex:0 0 auto}
.cs-link{
  flex:0 0 auto;font-size:10.5px;padding:3px 9px;border-radius:11px;white-space:nowrap;
  border:1px solid var(--line);background:var(--surface-2);color:var(--ink);
}
.cs-link small{margin-left:5px;font-size:8.5px;color:var(--text-dim)}
.cs-link.top{border-color:var(--spell);background:rgba(53,176,142,.2);font-weight:700}
.cs-go{
  margin-left:auto;flex:0 0 auto;font-size:11px;font-weight:800;padding:5px 12px;border-radius:5px;
  background:var(--spell);color:#07130f;border:1px solid var(--spell);white-space:nowrap;
}
/* 状態フラグ表示 */
.flag-note{
  font-size:10px;font-weight:700;color:var(--forbidden);
  border:1px solid var(--forbidden);border-radius:4px;padding:4px 9px;margin-bottom:8px;text-align:center;
}
/* 状態インスペクタ */
.state-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-bottom:10px}
.state-cell{border:1px solid var(--line);border-radius:4px;padding:6px 8px;background:var(--surface-2)}
.state-cell .k{font-size:8.5px;letter-spacing:.1em;color:var(--text-dim);display:block}
.state-cell .v{font-size:12px;font-weight:700;color:var(--gold-hi)}
.state-cell .v.off{color:var(--text-dim)}

/* ---------- スクリプトデバッガー ---------- */
.dbg-list{max-height:46vh;max-height:46dvh;max-height:calc(var(--appvh, 100dvh) * 0.46);overflow-y:auto;margin-bottom:10px}
.dbg-entry{border:1px solid var(--line);border-radius:5px;padding:8px 10px;margin-bottom:6px;background:var(--surface-2)}
.dbg-name{font-family:"Shippori Mincho",serif;font-weight:800;font-size:12.5px;color:var(--gold-hi);margin-bottom:4px}
.dbg-step{font-size:11px;color:var(--ink);padding:1px 0}
.dbg-step.ng{color:var(--forbidden)}

/* ---------- トークン / カウンター ---------- */
.card.token{
  background:linear-gradient(155deg,#2a2320,#1a1512);
  border-color:var(--edge-dk);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
}
.card.token .tk-body{display:flex;flex-direction:column;align-items:center;gap:1px;pointer-events:none}
.card.token .tk-mark{font-size:20px;color:var(--gold-hi);line-height:1;opacity:.75}
.card.token .tk-atk{font-family:"Shippori Mincho",serif;font-size:11px;font-weight:800;color:var(--mon)}
.ct-n{
  position:absolute;top:2px;left:2px;z-index:4;min-width:15px;text-align:center;
  font-size:9px;font-weight:800;padding:1px 4px;border-radius:8px;
  background:var(--trap);color:#120a1f;border:1px solid rgba(0,0,0,.35);
}
.ct-list{display:flex;flex-direction:column;gap:5px;max-height:44vh;max-height:44dvh;max-height:calc(var(--appvh, 100dvh) * 0.44);overflow-y:auto;margin-bottom:10px}
.ct-row{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:5px;padding:7px 10px;background:var(--surface-2)}
.ct-name{flex:1;font-size:12.5px}
.ct-name b{margin-left:8px;color:var(--gold-hi);font-size:14px;font-family:"Shippori Mincho",serif}
.ct-btn{
  width:38px;height:34px;border:1px solid var(--line-hi);border-radius:4px;
  background:var(--surface-3);color:var(--ink);font-size:16px;font-weight:800;
}
.ct-btn.add{background:var(--gold);color:var(--gold-ink);border-color:var(--gold-hi)}

/* ---------- デッキトップめくり ---------- */
.dt-ctl{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.dt-nums{display:flex;gap:4px;flex-wrap:wrap}
.dt-n{
  min-width:30px;height:30px;border-radius:4px;font-size:12px;font-weight:700;
  border:1px solid var(--line);background:var(--surface-2);color:var(--ink);
}
.dt-n.on{background:var(--gold);color:var(--gold-ink);border-color:var(--gold-hi)}
.dt-n:active{filter:brightness(.9)}
.pk-idx{
  flex:0 0 auto;width:18px;height:18px;line-height:18px;text-align:center;
  font-size:9.5px;font-weight:800;border-radius:9px;
  background:var(--surface-3);color:var(--text-dim);margin-right:2px;
}

/* ---------- 場外ゾーン（コンパクトなチップ列） ---------- */
.pilebar{
  display:grid; grid-template-columns:repeat(5,1fr); gap:4px;
  margin-top:2px;
}
.pchip{
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px;
  min-height:30px; padding:3px 2px; border-radius:4px;
  border:1px solid var(--line); background:rgba(0,0,0,.22); color:var(--text-dim);
  overflow:hidden;
}
.pchip.has{border-color:var(--line-hi); background:var(--surface-2); color:var(--ink)}
.pchip.ready{border-color:var(--spell); box-shadow:0 0 6px rgba(53,176,142,.25)}
.pchip:active{background:var(--surface-3)}
.pc-lab{font-size:8px; letter-spacing:.02em; line-height:1; white-space:nowrap;
  overflow:hidden; text-overflow:ellipsis; max-width:100%}
.pc-n{font-family:"Shippori Mincho",serif; font-weight:800; font-size:13px; line-height:1.1;
  color:var(--gold-hi)}
.pchip:not(.has) .pc-n{color:var(--text-dim); font-size:11px}
.pc-nm{font-size:7.5px; line-height:1; white-space:nowrap; overflow:hidden;
  text-overflow:ellipsis; max-width:100%; color:var(--gold-hi)}

/* ---------- カードを表側でめくって選ぶ ---------- */
.rv-grid{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:12px}
.rv-card{
  flex:0 0 auto;width:88px;padding:0;border:1px solid var(--line-hi);border-radius:5px;
  background:var(--surface-2);overflow:hidden;display:flex;flex-direction:column;
}
.rv-card:active{border-color:var(--gold-hi)}
.rv-card img{width:100%;aspect-ratio:59/86;object-fit:cover;display:block}
.rv-nm{font-size:9.5px;padding:4px 3px;color:var(--ink);line-height:1.25;
  display:block;word-break:break-word}
/* 条件警告 */
.warn-note{
  font-size:11.5px;font-weight:700;color:var(--forbidden);
  border:1px dashed var(--forbidden);border-radius:5px;padding:8px 10px;margin-bottom:10px;
  background:rgba(200,80,60,.07);
}
/* 対象の公開 */
.tg-reveal{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:10px;
  border:1px solid var(--line-hi);border-radius:5px;padding:7px 9px;background:var(--surface-2)}
.tgr-lab{font-size:9px;letter-spacing:.14em;color:var(--text-dim)}
.tgr-card{font-size:12px;font-weight:700;color:var(--gold-hi)}
.tgr-card small{margin-left:5px;font-size:9px;font-weight:400;color:var(--text-dim)}

/* 常時バー内の割り込みボタン（相手が撃てる時だけ出る） */
.d-react{
  flex:0 0 auto; padding:0 10px; border-radius:5px; font-size:11.5px; font-weight:800; gap:3px;
  background:var(--trap); color:#120a1f; border:1px solid var(--trap);
  letter-spacing:.02em; white-space:nowrap;
}
.d-react:active{filter:brightness(.9)}
.d-react b{font-size:14px;font-family:"Shippori Mincho",serif}
.d-act.myreact b{font-size:14px;margin-left:3px;font-family:"Shippori Mincho",serif}

/* 自分側のチェーンボタン */
.d-act.myreact{border-color:var(--spell);color:var(--spell);font-weight:800}

/* 狭い画面ではラベルを削ってアイコン寄りにする */
@media (max-width:359px){
  .dock-bar{gap:3px}
  .d-prev,.d-more{min-width:30px;padding:0 4px}
  .d-draw{padding:0 8px;font-size:12px}
  .d-react{padding:0 7px;font-size:11px}
  .d-next.primary{font-size:12.5px;letter-spacing:0}
}

/* ---------- ドックのアイコンボタン ---------- */
.d-icon{
  flex:0 0 auto; width:40px; min-width:40px; padding:11px 0; border-radius:5px;
  font-size:15px; line-height:1; font-weight:700; position:relative;
  border:1px solid var(--line-hi); background:var(--surface-2); color:var(--gold-hi);
  display:flex; align-items:center; justify-content:center;
}
.d-icon:active{background:var(--surface-3)}
.d-icon:disabled{opacity:.32}
.d-icon.react{border-color:var(--trap); color:var(--trap); background:rgba(157,110,222,.12)}
.d-icon .kb{
  position:absolute; top:1px; right:1px; min-width:14px; height:14px; line-height:14px;
  font-size:9px; font-weight:800; padding:0 3px; border-radius:7px;
  background:var(--trap); color:#120a1f;
}
/* 常時バーの文字が詰まらないようにする */
.dock-bar{flex-wrap:nowrap}
.d-next{min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.d-draw{flex:0 0 auto; padding:11px 12px; font-size:12px}
/* 展開時のボタンも詰まりにくく */
.dock-actions{flex-wrap:wrap}
.d-act{min-width:0; font-size:11.5px; padding:10px 4px}
.d-act .kb{margin-left:3px}

/* ---------- 攻守の増減 ---------- */
.mod-n{
  position:absolute; bottom:2px; right:2px; z-index:4;
  font-size:9px; font-weight:800; padding:1px 4px; border-radius:7px;
  background:var(--mon); color:#1a1206; border:1px solid rgba(0,0,0,.35);
}
.mod-n small{font-size:7.5px; font-weight:600; opacity:.8}
.mod-now{font-size:12px;color:var(--text-dim);margin-bottom:8px}
.mod-now b{color:var(--mon);font-family:"Shippori Mincho",serif;font-size:14px}
.mod-list{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:10px}
.mod-chip{font-size:10px;padding:2px 8px;border-radius:10px;border:1px solid var(--line);
  background:var(--surface-2);color:var(--ink)}
.mod-chip small{margin-left:5px;color:var(--text-dim);font-size:8.5px}
.mod-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-bottom:8px}
.mod-b{padding:10px 2px;border-radius:4px;font-size:12px;font-weight:700;
  border:1px solid var(--line);background:var(--surface-2);color:var(--ink)}
.mod-b.up{color:var(--spell);border-color:rgba(53,176,142,.4)}
.mod-b.dn{color:var(--forbidden);border-color:rgba(200,80,60,.4)}
.mod-b:active{background:var(--surface-3)}

/* ---------- ダメージステップ ---------- */
.ds-bar{display:flex;align-items:center;justify-content:center;gap:2px;margin-bottom:10px}
.ds-step{
  width:22px;height:22px;line-height:22px;text-align:center;border-radius:11px;
  font-size:10px;font-weight:800;border:1px solid var(--line);
  background:var(--surface-2);color:var(--text-dim);
}
.ds-step.done{border-color:var(--edge-dk);color:var(--gold-hi);opacity:.55}
.ds-step.on{background:var(--gold);color:var(--gold-ink);border-color:var(--gold-hi);
  box-shadow:0 0 8px rgba(201,162,75,.35)}
.ds-arrow{color:var(--text-dim);font-size:10px}
.ds-vs{
  display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;
  font-family:"Shippori Mincho",serif;font-size:13px;margin-bottom:8px;
}
.ds-x{color:var(--forbidden);font-size:11px}
.ds-note{text-align:center;margin-bottom:10px}
.ds-ok{font-size:10.5px;color:var(--spell);border:1px solid var(--spell);
  border-radius:10px;padding:2px 10px;background:rgba(53,176,142,.08)}
.ds-ng{font-size:10.5px;color:var(--text-dim);border:1px solid var(--line);
  border-radius:10px;padding:2px 10px}
.ds-result{
  font-size:12px;font-weight:700;color:var(--gold-hi);text-align:center;
  border:1px solid var(--edge-dk);border-radius:5px;padding:8px;margin-bottom:10px;
  background:rgba(201,162,75,.07);
}
/* ステータスバーの戦闘表示 */
.sb-battle{
  font-size:10px;font-weight:800;color:#0d0a06;background:var(--mon);
  padding:2px 7px;border-radius:9px;white-space:nowrap;
}

/* ---------- toast ---------- */
.toast{

<body>

<!-- 盤面が主役。上部の常時表示は極小のステータスバー1本だけ -->

<div class="board" id="board"></div>

<!-- チェーンは積まれている間ずっと見える -->
