/* 手札から n 枚捨てさせる（順に選択） */
function pickDiscard(p, n, reason, done){
  const P=gameState.players[p];
  if(n<=0 || !P.hand.length){ if(done) done(); return; }
  openPick(`${reason}：捨てる手札を選ぶ（あと${n}枚）`, "",
    P.hand.map((c,i)=>({
      label: labelOf(c), sub: subOf(c),
      onPick: ()=>{
        act({type:"FX_DISCARD", player:p, handIndex:i, reason});
        pickDiscard(p, n-1, reason, done);
      }
    })), done);
}

/* =========================================================================
   EXデッキ召喚（シンクロ / エクシーズ / 融合）
   1103環境はシンクロが主力。エクシーズは9期以降のカードプール用。
   ========================================================================= */
function exKind(db){
  const st = db.st||[];
  if(st.indexOf('シンクロ')>=0) return 'synchro';
  if(st.indexOf('エクシーズ')>=0) return 'xyz';
  if(st.indexOf('融合')>=0) return 'fusion';
  return null;
}
function isTuner(db){ return (db.st||[]).indexOf('チューナー')>=0; }

/* 場の表側モンスター（素材候補）を集める */
function materialCandidates(p){
  const P = gameState.players[p];
  const out = [];
  P.mz.forEach((c,i)=>{
    if(c.face!=='up') return;          // 裏側は素材にできない
    const db = dbOf(c);
    out.push({i, c, db, lv: curLV(c), tuner: isTuner(db)});
  });
  return out;
}

/* =========================================================================
   素材条件パーサ（ocgcore の material filter 相当）
   効果テキスト1行目の素材指定を構造化し、場のモンスターと突き合わせる。
   例）恐竜族レベル4モンスター×2 / 戦士族チューナー＋チューナー以外の「六武衆」モンスター1体以上
   ========================================================================= */

/* 長い種族名から先に判定する。「鳥獣族」が「獣族」に誤マッチするのを防ぐ。 */
const MAT_RACES = ['幻神獣','創造神','サイキック','アンデット','魔法使い','獣戦士','鳥獣',
                   'ドラゴン','爬虫類','悪魔','天使','昆虫','恐竜','海竜','機械','戦士',
                   '岩石','植物','獣','魚','雷','炎','水','風','地']
                  .sort((a,b)=>b.length-a.length);
const MAT_ATTRS = ['光','闇','地','水','炎','風','神'];

/* 旧融合の「砦を守る翼竜＋フェアリー・ドラゴン」のように
   括弧なしでカード名が並ぶ形式を解決するための名前集合 */
let MAT_NAMES = null;
function buildMaterialNameSet(){
  MAT_NAMES = new Set();
  (CARD_DB||[]).forEach(c=>{ if(c && c.n) MAT_NAMES.add(c.n); });
}

/* --- 1スロット分の条件を解析する --- */
function parseSlot(text){
  const s = String(text).trim();
  if(!s) return null;
  if(MAT_NAMES && MAT_NAMES.has(s)) return { count:{min:1,max:1}, nameExact:s };
  const q = { count:{min:1, max:1} };
  let m;
  if((m = s.match(/(\d+)\s*体以上/)))      { q.count = {min:+m[1], max:99}; }
  else if((m = s.match(/(\d+)\s*体まで/))) { q.count = {min:0,     max:+m[1]}; }
  else if((m = s.match(/(\d+)\s*体/)))     { q.count = {min:+m[1], max:+m[1]}; }
  if(/以上/.test(s) && !/レベル\s*\d+\s*以上/.test(s) && q.count.max === q.count.min){
    q.count = {min:q.count.min, max:99};
  }
  // 「チューナー以外」が先に来るので順序に注意
  if(/チューナー以外/.test(s))  q.tuner = false;
  else if(/チューナー/.test(s)) q.tuner = true;

  const nm = s.match(/「([^」]+)」/);
  if(nm){
    const rest = s.replace(/「[^」]+」/,'')
                  .replace(/と名のついた|モンスター|カード|\d+体以上|\d+体|の|＋/g,'').trim();
    if(!rest && !/と名のついた|モンスター/.test(s.replace(/「[^」]+」/,'')))
      q.nameExact = nm[1];
    else
      q.nameIncludes = nm[1];
  }
  for(const r of MAT_RACES){ if(s.indexOf(r+'族')>=0){ q.race = r; break; } }
  for(const a of MAT_ATTRS){ if(s.indexOf(a+'属性')>=0){ q.attr = a; break; } }
  if((m = s.match(/レベル\s*(\d+)\s*以上/)))      q.lvMin = +m[1];
  else if((m = s.match(/レベル\s*(\d+)\s*以下/))) q.lvMax = +m[1];
  else if((m = s.match(/レベル\s*(\d+)/)))        { q.lvMin = +m[1]; q.lvMax = +m[1]; }

  if(/通常モンスター/.test(s))                      q.isNormal  = true;
  if(/[Ss]モンスター|シンクロモンスター/.test(s))    q.isSynchro = true;
  if(/[Xx]モンスター|エクシーズモンスター/.test(s))  q.isXyz     = true;
  if(/融合モンスター/.test(s))                      q.isFusion  = true;
  if(/デュアルモンスター/.test(s))                  q.isDual    = true;
  return q;
}

/* --- カードDBエントリが1スロットの条件を満たすか --- */
function slotMatches(db, q, lv){
  const st = db.st || [];
  const LV = (lv != null) ? lv : (db.lv || 0);
  if(q.nameExact    && db.n !== q.nameExact) return false;
  if(q.nameIncludes && String(db.n||'').indexOf(q.nameIncludes) < 0) return false;
  if(q.race  && db.ra !== q.race) return false;
  if(q.attr  && db.at !== q.attr) return false;
  if(q.lvMin != null && LV < q.lvMin) return false;
  if(q.lvMax != null && LV > q.lvMax) return false;
  if(q.tuner === true  && st.indexOf('チューナー') < 0) return false;
  if(q.tuner === false && st.indexOf('チューナー') >= 0) return false;
  if(q.isNormal  && st.indexOf('通常')       < 0) return false;
  if(q.isSynchro && st.indexOf('シンクロ')   < 0) return false;
  if(q.isXyz     && st.indexOf('エクシーズ') < 0) return false;
  if(q.isFusion  && st.indexOf('融合')       < 0) return false;
  if(q.isDual    && st.indexOf('デュアル')   < 0) return false;
  return true;
}

/* --- 素材指定行を解析して {type, slots} を返す（カード名でキャッシュ） --- */
const MAT_SPEC_CACHE = new Map();
function parseMaterialSpec(db){
  if(!db || !db.n) return null;
  if(MAT_SPEC_CACHE.has(db.n)) return MAT_SPEC_CACHE.get(db.n);
  const spec = buildMaterialSpec(db);
  MAT_SPEC_CACHE.set(db.n, spec);
  return spec;
}
function buildMaterialSpec(db){
  const type = exKind(db);
  if(!type) return null;
  const line = String(db.e||'').split('\n')[0].trim();
  if(!line) return null;

  // 「×N」形式（エクシーズ・一部融合）→ 同一条件をN個
  let m = line.match(/^(.*?)\s*[×x]\s*(\d+)\s*(体以上)?\s*$/);
  if(m){
    const q = parseSlot(m[1]);
    if(!q) return null;
    q.count = m[3] ? {min:+m[2], max:99} : {min:+m[2], max:+m[2]};
    return {type, slots:[q], raw:line};
  }
  // 「A＋B」形式（シンクロ・融合）
  if(line.indexOf('＋')>=0 || line.indexOf('+')>=0){
    const slots = line.split(/[＋+]/).map(x=>x.trim()).filter(Boolean)
                      .map(parseSlot).filter(Boolean);
    if(slots.length) return {type, slots, raw:line};
  }
  // 1行目が素材指定でない（特殊召喚限定モンスター等）
  // → 条件不明として通し、UI側で手動選択に回す
  return {type, slots:null, raw:line, permissive:true};
}

/* --- 候補から条件を満たす組み合わせを列挙する ---
   totalLv を渡すとレベル合計の一致も要求する（シンクロ用） */
function findMaterialCombos(cands, spec, totalLv, limit){
  const out = [], LIM = limit || 60;
  (function rec(si, used, picked){
    if(out.length >= LIM) return;
    if(si >= spec.slots.length){
      if(totalLv != null && picked.reduce((s,x)=>s+(x.lv||0),0) !== totalLv) return;
      if(picked.length) out.push(picked.slice());
      return;
    }
    const q = spec.slots[si];
    const pool = cands.filter(c => !used.has(c.i) && slotMatches(c.db, q, c.lv));
    const maxN = Math.min(q.count.max, pool.length);
    for(let n = q.count.min; n <= maxN; n++){
      if(n === 0){ rec(si+1, used, picked); continue; }
      combinations(pool, n).forEach(set=>{
        if(out.length >= LIM) return;
        set.forEach(c=>used.add(c.i));
        rec(si+1, used, picked.concat(set));
        set.forEach(c=>used.delete(c.i));
      });
    }
  })(0, new Set(), []);
  const seen = new Set(), uniq = [];
  out.forEach(set=>{
    const key = set.map(x=>x.i).sort((a,b)=>a-b).join(',');
    if(seen.has(key)) return;
    seen.add(key); uniq.push(set);
  });
  return uniq;
}

/* --- EX召喚の候補を統一的に求める ---
   戻り値 {permissive, combos:[{materials:[mzIndex], label}]} */
function exCombos(p, db){
  const spec = parseMaterialSpec(db);
  if(!spec) return {permissive:true, combos:[], why:"EXモンスターではありません"};
  if(spec.permissive) return {permissive:true, combos:[], spec};
  const kind = spec.type;
  const totalLv = (kind === 'synchro') ? (db.lv||0) : null;
  const sets = findMaterialCombos(materialCandidates(p), spec, totalLv);
  return {
    permissive:false, spec,
    combos: sets.map(set=>({
      materials: set.map(x=>x.i),
      label: set.map(x=>`${x.db.n}(Lv${x.lv})`).join(" ＋ ")
    }))
  };
}

function combinations(arr, k){
  const res=[];
  (function rec(start, cur){
    if(cur.length===k){ res.push(cur.slice()); return; }
    for(let i=start;i<arr.length;i++){ cur.push(arr[i]); rec(i+1,cur); cur.pop(); }
  })(0,[]);
  return res;
}

/* EXデッキを開いて召喚可能なモンスターを提示 */
function openExDeck(p){
  const P = gameState.players[p];
  if(!rules().exSummon){
    sheet.innerHTML = `<div class="grip"></div><h3>エクストラデッキ</h3>
      <div class="phase-note">${phaseJp(gameState.phase)}：${rules().note}</div>
      <div class="meta" style="margin:10px 0 12px">${whyBlocked('exSummon')}<br>
        メインフェイズに進んでから召喚してください。</div>
      <button class="close" onclick="closeSheet()">閉じる</button>`;
    veil.classList.add("on"); return;
  }
  if(!P.ex.length){
    sheet.innerHTML = `<div class="grip"></div><h3>エクストラデッキ</h3>
      <div class="meta" style="margin-bottom:12px">EXデッキにカードがありません。<br>
      デッキビルダーでEXデッキを組むと、ここから召喚できます。</div>
      <button class="close" onclick="closeSheet()">閉じる</button>`;
    veil.classList.add("on"); return;
  }
  const rows = P.ex.map((c,i)=>{
    const db = dbOf(c);
    const kind = exKind(db);
    const kindJa = {synchro:"シンクロ", xyz:"エクシーズ", fusion:"融合"}[kind] || "EX";
    // 召喚可能かを判定
    let ok=false, why="";
    const res = exCombos(p, db);
    if(res.permissive){
      ok = true;   // 素材条件を読み取れないカードは手動選択に回す
      why = "素材を手動で選びます";
    } else {
      ok = res.combos.length > 0;
      why = ok ? "" : `素材条件：${res.spec.raw}`;
    }
    return `<div class="act pick-row ${ok?'':'dim'}" onclick="${ok?`exSummonPick(${p},${i})`:`showToast('${why}')`}">
      <span class="pk-nm">${db.n}</span>
      <span class="pk-sub">${kindJa} ${kind==='xyz'?`ランク${db.lv}`:`Lv${db.lv||'-'}`} 攻${db.atk??'-'}${ok?'':' ・'+why}</span>
    </div>`;
  }).join("");
  sheet.innerHTML = `<div class="grip"></div>
    <h3 style="margin-bottom:4px">エクストラデッキ（${P.ex.length}）</h3>
    <div class="meta" style="margin-bottom:10px">召喚できるものが選択できます。素材は自動で判定します。</div>
    <div class="pick-list">${rows}</div>
    <button class="close" onclick="closeSheet()">閉じる</button>`;
  veil.classList.add("on");
}

/* EXモンスターを選んだあと、素材の組み合わせを選ばせる */
function exSummonPick(p, exIndex){
  const P = gameState.players[p];
  const c = P.ex[exIndex]; const db = dbOf(c);
  const kind = exKind(db);
  const res = exCombos(p, db);
  if(res.permissive){
    // 素材条件を読み取れないカードは場から手動で選ぶ
    exFusionPick(p, exIndex);
    return;
  }
  const combos = res.combos;
  if(!combos.length){ showToast(`素材条件：${res.spec.raw}`); return; }
  if(combos.length===1){
    doExSummon(p, exIndex, combos[0].materials, kind);
    return;
  }
  openPick(`${db.n}：使用する素材を選ぶ`, `${combos.length}通りの組み合わせ`,
    combos.map(cb=>({
      label: cb.label, sub:"",
      onPick: ()=>doExSummon(p, exIndex, cb.materials, kind)
    })));
}

/* 融合：素材を順にタップして選ぶ */
let FUSION_SEL = [];
function exFusionPick(p, exIndex){
  FUSION_SEL = [];
  fusionStep(p, exIndex);
}
function fusionStep(p, exIndex){
  const P = gameState.players[p];
  const db = dbOf(P.ex[exIndex]);
  const cands = materialCandidates(p).filter(x=>FUSION_SEL.indexOf(x.i)<0);
  const chosen = FUSION_SEL.map(i=>{
    const cc = P.mz[i]; return cc ? dbOf(cc).n : "?";
  });
  const items = cands.map(x=>({
    label: x.db.n, sub:`Lv${x.lv} 攻${x.db.atk??'-'}`,
    onPick: ()=>{ FUSION_SEL.push(x.i); fusionStep(p, exIndex); }
  }));
  // 確定ボタンを先頭に
  if(FUSION_SEL.length>=2){
    items.unshift({
      label:`▶ この ${FUSION_SEL.length}体で融合召喚する`, sub:chosen.join(" ＋ "),
      onPick: ()=>doExSummon(p, exIndex, FUSION_SEL.slice(), 'fusion')
    });
  }
  openPick(`${db.n}：融合素材を選ぶ`,
    FUSION_SEL.length?`選択中：${chosen.join(" ＋ ")}`:"場のモンスターを2体以上タップ",
    items);
}

function doExSummon(p, exIndex, materials, kind){
  const P = gameState.players[p];
  const db = dbOf(P.ex[exIndex]);
  closeSheet();
  // 表示形式を選ばせる（守備で出したい場面もあるため）
  sheet.innerHTML = `<div class="grip"></div>
    <h3 style="margin-bottom:6px">${db.n}</h3>
    <div class="meta" style="margin-bottom:12px">表示形式を選んでください</div>
    <div class="act-grid">
      <div class="act fx" onclick="closeSheet();act({type:'FX_EX_SUMMON',player:${p},exIndex:${exIndex},materials:${jsVal(materials)},kind:'${kind}',pos:'atk'})">攻撃表示</div>
      <div class="act" onclick="closeSheet();act({type:'FX_EX_SUMMON',player:${p},exIndex:${exIndex},materials:${jsVal(materials)},kind:'${kind}',pos:'def'})">守備表示</div>
    </div>
    <button class="close" onclick="closeSheet()">やめる</button>`;
  veil.classList.add("on");
}

/* =========================================================================
   墓地・手札発動の自動判別
   スクリプト未実装のカードでも、効果テキストから発動場所を推定して
   相手ターン中の割り込み候補に載せる。
   誤判定してもプレイヤーが選ばなければ発動しないので実害はない。
   ========================================================================= */
const GRAVE_PATTERNS = [
  /墓地(に存在する|の)?この(カード|１枚)を(ゲームから)?除外(して|し、|する事で|し)/,
  /自分の墓地からこのカードを(ゲームから)?除外/,
  /このカードが墓地に存在する場合.*発動/,
  /墓地のこのカードを/,
  /このカードを除外して発動/,
  /自分の墓地の(この)?カードを除外して発動/,
];
const HAND_PATTERNS = [
  /手札からこのカードを(墓地へ)?捨て(て|る事で)/,
  /このカードを手札から(墓地へ)?捨て(て|る事で)/,
  /手札の?この(カード|１枚)を(墓地へ)?捨て/,
  /このカードを手札から(墓地へ)?送(り|って)/,
  /このカードを手札から特殊召喚(する事が)?でき/,   // 極星獣タングニョースト等
  /手札からこのカードを特殊召喚/,
  /このカードは手札から特殊召喚(する事が)?でき/,
];
/* 相手ターンでも撃てる文言（誘発即時的なタイミング） */
const QUICK_PATTERNS = [
  /相手ターン(に|中)/,
  /相手メインフェイズ/,
  /戦闘によって破壊され墓地へ送られた時/,
  /戦闘で破壊され墓地へ送られた場合/,
  /破壊され墓地へ送られた時/,
  /ダメージ計算(時|前|後)/,
  /攻撃(宣言)?(対象に選択された)?時/,
  /攻撃対象に選択された時/,
  /攻撃を無効/,
  /直接攻撃宣言時/,
  /ダメージ計算(前|時|後)/,
  /相手が.*発動した時/,
  /相手のターン/,
  /特殊召喚(に成功|された)時/,
  /召喚・反転召喚・特殊召喚(に成功|された)時/,
  /このカードが.*選択された時/,
  /バトルフェイズ/,
];

/* テキストから発動可能ゾーンを推定する。結果はキャッシュする。 */
const ACT_ZONE_CACHE = new Map();
function detectActivateZones(db){
  if(!db || !db.n) return null;
  if(ACT_ZONE_CACHE.has(db.n)) return ACT_ZONE_CACHE.get(db.n);
  const e = String(db.e||"") + " " + String(db.e0||"");
  const zones = [];
  if(GRAVE_PATTERNS.some(r=>r.test(e))) zones.push('grave');
  if(HAND_PATTERNS.some(r=>r.test(e)))  zones.push('hand');
  const quick = QUICK_PATTERNS.some(r=>r.test(e));
  const res = zones.length ? {zones, quick} : null;
  ACT_ZONE_CACHE.set(db.n, res);
  return res;
}

/* カードが指定ゾーンから発動できるか（スクリプト宣言 → テキスト推定の順） */
/* 表側で場に残っている魔法・罠が、いま発動できる効果を持っているか。
   スキルドレインや天空の聖域のように永続効果しか持たないカードは、
   場に出た後に「発動」する場面がないのでチェーン候補にしない。 */
const FIELD_ACT_CACHE = new Map();
function hasFieldActivatableEffect(card){
  const db = dbOf(card);
  if(!db || !db.n) return false;
  const sc = CARD_SCRIPTS[db.n];
  if(sc){
    /* スクリプトのある魔法・罠は、fieldIgnition を宣言したものだけが
       表側で場に残ったまま効果を発動できる。
       スキルドレインや天空の聖域のように、カードの発動が済んだ後は
       永続効果が適用されるだけのカードを候補から外す。 */
    if(!sc.resolve) return false;
    if(!sc.fieldIgnition) return false;
    // 発動回数を使い切っていれば出さない
    const loc = locateCard(card);
    if(sc.countLimit && countLeft(loc ? loc.p : 0, db.n, sc) <= 0) return false;
    return true;
  }
  if(FIELD_ACT_CACHE.has(db.n)) return FIELD_ACT_CACHE.get(db.n);
  const e = String(db.e||"") + " " + String(db.e0||"");
  // 「〜して発動できる」「〜する事ができる」など、能動的な発動を示す表現があるか
  const v = /発動(できる|する事ができる|して|し、)/.test(e) ||
            /1ターンに1度/.test(e) ||
            /事で|事により/.test(e);
  FIELD_ACT_CACHE.set(db.n, v);
  return v;
}

function canActivateFromZone(db, zone){
  const sc = CARD_SCRIPTS[db.n];
  if(sc){
    if(!sc.activateFrom) return false;
    return sc.activateFrom.indexOf(zone) >= 0;
  }
  const det = detectActivateZones(db);
  return !!(det && det.zones.indexOf(zone) >= 0);
}
/* 相手ターン中にも撃てるか */
function isQuickFromZone(db){
  const sc = CARD_SCRIPTS[db.n];
  if(sc) return sc.quickEffect !== false;
  const det = detectActivateZones(db);
  return !!(det && det.quick);
}

/* 相手ターン中に発動できる自分のカードを集める。
   1103は伏せの読み合いが肝なので、非手番側の罠・速攻魔法をすぐ撃てるようにする。
   返り値: [{p, zone, index, db, ss}] */
/* 相手ターン中に発動できる自分のカードを集める。
   魔法罠ゾーンだけでなく、スクリプトが activateFrom で宣言した場所
   （墓地・手札・除外など）も対象にする。
   例：ネクロ・ガードナー（墓地で除外して発動）、手札誘発。 */
function reactableCards(p){
  const P = gameState.players[p];
  const out = [];
  const seen = new Set();

  /* ① 魔法・罠ゾーン
     伏せカード … 罠と速攻魔法だけが相手ターンに発動できる。
                  ただし罠はセットしたターンには発動できない。
     表側カード … 既に適用されている永続効果は「発動」ではないので候補にしない。
                  起動効果や誘発即時効果を持つものだけを出す。 */
  P.sz.forEach((c,i)=>{
    const db = dbOf(c);
    const isTrap  = db.k==='t';
    const isQuick = db.k==='s' && db.sub==='速攻';
    if(c.face === 'down'){
      if(!isTrap && !isQuick) return;                 // 伏せた通常魔法は発動できない
      if(isTrap && c.setTurn === gameState.turn) return;  // セットしたターンの罠は不可
      out.push({p, zone:'sz', index:i, db, ss: isTrap ? (db.sub==='カウンター'?3:2) : 2});
      seen.add('sz:'+i);
      return;
    }
    // 表側で場に残っているカードは、発動できる効果を持つ場合だけ
    if(!hasFieldActivatableEffect(c)) return;
    out.push({p, zone:'sz', index:i, db, ss: isTrap ? (db.sub==='カウンター'?3:2) : (isQuick?2:1)});
    seen.add('sz:'+i);
  });
  if(P.field && P.field.face === 'up' && hasFieldActivatableEffect(P.field)){
    out.push({p, zone:'field', index:0, db:dbOf(P.field), ss:1});
  }

  /* ①' 手札の速攻魔法。自分のターンでも相手のターンでもチェーンできる。
     （手札から直接発動できるのは速攻魔法だけ。通常魔法はセットが必要） */
  P.hand.forEach((c,i)=>{
    const db = dbOf(c);
    if(db.k==='s' && db.sub==='速攻'){
      out.push({p, zone:'hand', index:i, db, ss:2, fromHand:true});
    }
  });

  /* ② 墓地・手札などから発動できるカード
     スクリプトが activateFrom を宣言していればそれを使う。
     未実装カードは効果テキストから推定する（誤検出しても選ばなければ発動しない）。 */
  const zones = ['grave','hand','banish','mz'];
  zones.forEach(zone=>{
    const arr = zone==='mz' ? P.mz : P[zone];
    (arr||[]).forEach((c,i)=>{
      if(!c) return;
      const db = dbOf(c);
      if(!canActivateFromZone(db, zone)) return;
      if(!isQuickFromZone(db)) return;          // 相手ターンに撃てないものは除く
      const sc = CARD_SCRIPTS[db.n];
      if(sc && sc.countLimit && countLeft(p, db.n, sc) <= 0) return;   // 使用済みは出さない
      // スクリプトがあれば発動条件も確認する
      if(sc && sc.condition){
        const ctx = makeContext(p, c, zone, i, "react", {});
        let ok = true;
        try{ ok = sc.condition(ctx); }catch(e){ ok = false; }
        if(!ok) return;
      }
      out.push({p, zone, index:i, db,
                ss: sc ? (sc.priority||2) : 2,
                script: !!sc});
    });
  });
  return out;
}

/* 非手番プレイヤー（＝相手ターン中の自分）の番号 */
function reactingPlayer(){ return gameState.activePlayer===0 ? 1 : 0; }

/* 指定プレイヤーの割り込みパネルを開く（チェーンを重ねる時に使う） */
function openReactFor(p){ openReact(p); }

/* 相手ターン中の割り込みパネル。p を渡すとそのプレイヤー視点で開く。 */
function openReact(forceP){
  const rp = (forceP===0||forceP===1) ? forceP : reactingPlayer();
  const list = reactableCards(rp);
  if(!list.length){
    sheet.innerHTML = `<div class="grip"></div>
      <h3 style="margin-bottom:6px">${nameOf(rp)}の割り込み</h3>
      <div class="meta" style="margin-bottom:12px">
        発動できる伏せカードがありません。<br>
        罠・速攻魔法を伏せていると、ここから相手ターン中に発動できます。</div>
      <button class="close" onclick="closeSheet()">閉じる</button>`;
    veil.classList.add("on"); return;
  }
  const rows = list.map(it=>{
    const P = gameState.players[rp];
    const card = it.zone==='field' ? P.field : (P[it.zone]||[])[it.index];
    const hidden = card && card.face==='down' && (it.zone==='sz'||it.zone==='field');
    const eff = hasEffect(it.db.n);
    // 発動場所を明示する（墓地・手札からの発動が分かるように）
    const where = it.zone==='sz'||it.zone==='field' ? "" :
      `<span class="rk-zone">${zoneJp(it.zone)}</span>`;
    const kind = it.db.k==='t'?'罠' : it.db.k==='s'?'魔法' : 'モンスター';
    const auto = it.script ? ' ⚡自動' : (eff ? ' ⚡' : ' 手動');
    return `<div class="act pick-row" onclick="reactActivate(${rp},'${it.zone}',${it.index})">
      <span class="pk-nm">${it.db.n}${hidden?'<span class="rk-set">伏</span>':''}${where}</span>
      <span class="pk-sub">${kind}${it.db.sub?'・'+it.db.sub:''} SS${it.ss}${auto}</span>
    </div>`;
  }).join("");
  sheet.innerHTML = `<div class="grip"></div>
    <h3 style="margin-bottom:4px">${nameOf(rp)}の割り込み</h3>
    <div class="meta" style="margin-bottom:10px">
      相手ターン中に発動できるカードです。タップすると表側にしてチェーンに積みます。</div>
    <div class="pick-list">${rows}</div>
    <button class="close" onclick="closeSheet()">閉じる</button>`;
  veil.classList.add("on");
}

/* 割り込み発動：表side にしてチェーンへ積む（効果があれば自動処理も選べる） */
function reactActivate(p, zone, index){
  const P = gameState.players[p];
  const card = zone==='field' ? P.field : (P[zone]||[])[index];
  if(!card){ showToast("カードがありません"); return; }
  const db = dbOf(card);
  const nm = db.n||"";
  // 手札の速攻魔法は、魔法罠ゾーンに置いてから発動する
  if(zone==='hand' && db.k==='s' && db.sub==='速攻'){
    if(P.sz.length >= ZONE_LIMITS.sz){ showToast("魔法・罠ゾーンが一杯です"); return; }
    closeSheet();
    act({type:"MOVE", player:p, from:"hand", fromIndex:index, to:"sz", face:"up"});
    const ni = gameState.players[p].sz.length-1;
    reactActivate(p, 'sz', ni);
    return;
  }
  const eff = hasEffect(nm);
  const sc  = CARD_SCRIPTS[nm];
  const ss  = sc && sc.priority ? sc.priority
            : (db.k==='t' ? (db.sub==='カウンター'?3:2) : (db.sub==='速攻'?2:1));
  closeSheet();
  // 場に伏せてあるカードだけ表にする（墓地・手札からの発動は不要）
  if(card.face==='down' && (zone==='sz' || zone==='field' )){
    act({type:"FX_SET_STATE", player:p, zone, index, face:"up", reason:"発動"});
  }
  // チェーンに積む
  act({type:"CHAIN_ADD", player:p, cardId:card.id, name:nm, ss, from:zone, index});
  // 解決方法を選ばせる。スクリプトが無くても手動パレットで処理できる。
  setTimeout(()=>{
    const auto = eff
      ? `<div class="act fx" onclick="closeSheet();resolveReact(${p},'${zone}',${index},${jsStr(nm)})">⚡ 解決して効果を処理</div>`
      : "";
    const eff_txt = db.e ? `<div class="eff">${String(db.e).replace(/\n/g,"<br>")}</div>` : "";
    // 相手がさらにチェーンできるかを調べて案内する
    const foe = p===0?1:0;
    const foeN = reactableCards(foe).length;
    const foeRow = foeN
      ? `<div class="react-warn" onclick="closeSheet();openReactFor(${foe})">
           ${nameOf(foe)}は ${foeN}枚 チェーンできます — タップして発動
         </div>` : "";
    sheet.innerHTML = `<div class="grip"></div>
      <h3 style="margin-bottom:4px">${nm}</h3>
      <div class="meta" style="margin-bottom:8px">チェーン${gameState.chain.length}に積みました（${zoneJp(zone)}から発動）。<br>
        ${foeN?"相手のチェーンを確認してから解決してください。":"相手がチェーンしないなら解決できます。"}</div>
      ${foeRow}
      ${eff_txt}
      <div class="act-grid wide">
        ${auto}
        <div class="act" onclick="closeSheet();manualResolveReact(${p},'${zone}',${index},${jsStr(nm)})">手動で処理する…</div>
        <div class="act" onclick="closeSheet();openChain()">チェーンを確認する</div>
      </div>`;
    veil.classList.add("on");
  }, 60);
}
/* スクリプトが無いカードを手動で解決する。
   チェーンを解決してから汎用パレットを開き、コストの除外/墓地送りも案内する。 */
function manualResolveReact(p, zone, index, nm){
  if(gameState.chain.length) act({type:"CHAIN_RESOLVE_TOP"});
  openPrimitives(p, zone, index, nm);
}
/* 割り込みカードを解決して効果まで処理する */
function resolveReact(p, zone, index, nm){
  // チェーンから取り除く
  if(gameState.chain.length) act({type:"CHAIN_RESOLVE_TOP"});
  const db = CARD_DB[findCardIndex(nm)]||{};
  const keep = (db.sub==="永続" || db.sub==="フィールド" || db.sub==="装備");
  runEffect(p, nm, {zone, index, keep});
  render();
}
/* =========================================================================
   フェーズごとの行動制限（1103準拠）
   ドローフェイズ／スタンバイは通常召喚も攻撃もできず、
   撃てるのはスペルスピード2以上（速攻魔法・罠）だけ。
   ========================================================================= */
const PHASE_RULES = {
  draw:    { draw:true,  normalSummon:false, setCard:false, activateS1:false, attack:false, exSummon:false,
             note:"ドロー／速攻魔法・罠のみ" },
  standby: { draw:false, normalSummon:false, setCard:false, activateS1:false, attack:false, exSummon:false,
             note:"速攻魔法・罠のみ" },
  main1:   { draw:false, normalSummon:true,  setCard:true,  activateS1:true,  attack:false, exSummon:true,
             note:"召喚・セット・発動" },
  battle:  { draw:false, normalSummon:false, setCard:false, activateS1:false, attack:true,  exSummon:false,
             note:"攻撃宣言／速攻魔法・罠" },
  main2:   { draw:false, normalSummon:true,  setCard:true,  activateS1:true,  attack:false, exSummon:true,
             note:"召喚・セット・発動" },
  end:     { draw:false, normalSummon:false, setCard:false, activateS1:false, attack:false, exSummon:false,
             note:"手札7枚調整／速攻魔法・罠" },
};
function rules(){ return PHASE_RULES[gameState.phase] || PHASE_RULES.main1; }
/* スペルスピード判定 */
function spellSpeedOf(db){
  if(!db) return 1;
  if(db.k==='t') return db.sub==='カウンター' ? 3 : 2;
  if(db.k==='s' && db.sub==='速攻') return 2;
  return 1;
}
/* そのカードが今のフェーズで発動できるか。
   スペルスピード2以上（速攻魔法・罠）はいつでも発動できる。 */
function canActivateNow(db){
  if(spellSpeedOf(db) >= 2) return true;
  return rules().activateS1;
}
/* 制限に引っかかった時の理由文 */
function whyBlocked(what){
  const ph = phaseJp(gameState.phase);
  const msg = {
    normalSummon:`${ph}では通常召喚できません`,
    setCard:`${ph}ではセットできません`,
    activateS1:`${ph}では通常魔法・起動効果は発動できません（速攻魔法・罠のみ）`,
    attack:`${ph}では攻撃できません`,
    exSummon:`${ph}ではEX召喚できません`,
  };
  return msg[what] || `${ph}ではその操作はできません`;
}

/* =========================================================================
   Step11-13: カードスクリプト基盤 / イベントシステム / デバッガー

   設計:
   - スクリプトは gameState を直接触らない。必ず API 経由。
   - API は内部で act()（=applyAction）を呼ぶので Undo/Redo が効く。
   - スクリプトは UI/DOM を触らない。対象選択は API が担当する。
   - 処理の各段階は scriptLog に記録され、デバッガーで追える。
   ========================================================================= */

/* =========================================================================
   回数制限（EDOPro の SetCountLimit 相当）
   スクリプトに countLimit を書くだけで「1ターンに1度」等を自動管理する。
     countLimit: 1                    → 1ターンに1度
     countLimit: {n:1, scope:'duel'}  → デュエル中に1度
   キーはカード名。同名カード共通で数える（OCGの「このカード名の」に相当）。
   ========================================================================= */
function countKey(name){ return 'cl:'+name; }
function countUsed(p, name, scope){
  const P = gameState.players[p];
  const store = (scope==='duel') ? P.effectFlags : P.temporaryFlags;
  return store[countKey(name)] || 0;
}
function countLeft(p, name, sc){
  if(!sc || !sc.countLimit) return Infinity;
  const cl = (typeof sc.countLimit==='number') ? {n:sc.countLimit} : sc.countLimit;
  return (cl.n||1) - countUsed(p, name, cl.scope);
}
function countConsume(p, name, sc){
  if(!sc || !sc.countLimit) return;
  const cl = (typeof sc.countLimit==='number') ? {n:sc.countLimit} : sc.countLimit;
  const P = gameState.players[p];
  const store = (cl.scope==='duel') ? P.effectFlags : P.temporaryFlags;
  store[countKey(name)] = (store[countKey(name)]||0) + 1;
}
function countLimitJp(sc){
  if(!sc || !sc.countLimit) return "";
  const cl = (typeof sc.countLimit==='number') ? {n:sc.countLimit} : sc.countLimit;
  const n = cl.n||1;
  return (cl.scope==='duel') ? `デュエル中に${n}度` : `1ターンに${n}度`;
}

/* ---- デバッガー用トレース ---- */
function traceStart(name){
  gameState.scriptLog = gameState.scriptLog || [];
  gameState.scriptLog.unshift({name, t:Date.now(), steps:[]});
  if(gameState.scriptLog.length>20) gameState.scriptLog.pop();
}
function trace(msg, ok){
  const cur = (gameState.scriptLog||[])[0];
  if(cur) cur.steps.push({msg, ok: ok!==false});
}

/* ---- context を組み立てる ---- */
function makeContext(p, card, zone, index, eventName, extra){
  const gs = gameState;
  return Object.assign({
    gameState: gs,
    player: p,
    opponent: p===0?1:0,
    card, zone, index,
    phase: gs.phase,
    turn: gs.turn,
    chainDepth: gs.chain.length,
    priority: gs.priority,
    eventName: eventName||null,
    targetCandidates: [],
    selectedTargets: [],
    reason: "",
    debug: [],
  }, extra||{});
}

/* =========================================================================
   共通API（スクリプトが使える唯一の手段）
   すべて act() 経由なので Undo が効く。
   ========================================================================= */
/* 手札の候補を集める。発動元が手札のカード自身なら、それは候補から除く。 */
function handCandidates(ctx, filter){
  const P = gameState.players[ctx.player];
  return P.hand.map((c,i)=>({p:ctx.player, zone:'hand', index:i, card:c, db:dbOf(c)}))
    .filter(x=>!(ctx.zone==='hand' && x.card===ctx.card))
    .filter(x=>!filter || filter(x));
}

/* 対象のカード名を伏せるべきか。
   場（モンスター/魔法罠/フィールド）に裏側で置かれている時だけ隠す。
   デッキ・墓地・除外・手札から選ぶ場合は内容が見えないと選択できない。 */
function isHiddenTarget(t){
  if(!t || !t.card) return false;
  if(t.card.face !== 'down') return false;
  return t.zone==='mz' || t.zone==='sz' || t.zone==='field';
}

/* 対象の現在位置を解決する。
   効果処理中に他のカードが動くと添字がずれるため、
   記録しておいたカード実体から探し直す。 */
function resolveTarget(t){
  if(!t) return null;
  const P = gameState.players[t.p];
  if(t.zone === 'field'){
    return (P.field && (!t.card || P.field===t.card)) ? {p:t.p, zone:'field', index:0, card:P.field} : null;
  }
  const arr = P[t.zone] || [];
  if(t.card){
    const i = arr.indexOf(t.card);
    if(i < 0) return null;              // 既に場を離れている
    return {p:t.p, zone:t.zone, index:i, card:t.card};
  }
  return (t.index < arr.length) ? {p:t.p, zone:t.zone, index:t.index, card:arr[t.index]} : null;
}

const API = {
  /* --- 情報取得（読み取り専用） --- */
  me(ctx){ return gameState.players[ctx.player]; },
  foe(ctx){ return gameState.players[ctx.opponent]; },
  db(card){ return dbOf(card); },
  /* 場のカードを列挙 [{p, zone, index, card, db}] */
  fieldCards(opts){
    const o = opts||{};
    const out=[];
    [0,1].forEach(p=>{
      if(o.player!=null && o.player!==p) return;
      const P=gameState.players[p];
      if(o.zone==null || o.zone==='mz') P.mz.forEach((c,i)=>out.push({p,zone:'mz',index:i,card:c,db:dbOf(c)}));
      if(o.zone==null || o.zone==='sz') P.sz.forEach((c,i)=>out.push({p,zone:'sz',index:i,card:c,db:dbOf(c)}));
      if((o.zone==null || o.zone==='field') && P.field) out.push({p,zone:'field',index:0,card:P.field,db:dbOf(P.field)});
    });
    return o.filter ? out.filter(o.filter) : out;
  },
  pileCards(p, zone, filter){
    const arr = gameState.players[p][zone]||[];

  destroy(t, reason){ const r=resolveTarget(t); if(!r){ trace(`destroy: 対象が場にない`, false); return; }

    trace(`changePosition: ${labelOf(r.card)} → ${pos}`); act({type:"FX_SET_STATE", player:r.p, zone:r.zone, index:r.index, pos, reason}); },

    trace(`flip: ${labelOf(r.card)} → ${face}`); act({type:"FX_SET_STATE", player:r.p, zone:r.zone, index:r.index, face, reason}); },

    trace(`negate: ${labelOf(r.card)}`); act({type:"FX_NEGATE", player:r.p, zone:r.zone, index:r.index, reason}); },

  detachMaterial(p, mzIndex, reason){ trace(`detach: mz[${mzIndex}]`); act({type:"FX_DETACH", player:p, mzIndex, reason}); },

  countCounter(t, kind){

  /* --- トークン --- */
  createToken(p, def, n){

  damageLP(p, amount){ trace(`damage: ${nameOf(p)} -${amount}`); act({type:"LP", player:p, delta:-Math.abs(amount)}); },
  recoverLP(p, amount){ trace(`recover: ${nameOf(p)} +${amount}`); act({type:"LP", player:p, delta:Math.abs(amount)}); },
  payCost(p, amount){ trace(`payCost: ${amount}`); act({type:"LP", player:p, delta:-Math.abs(amount)}); },
  /* コントロール奪取（強奪など）。場のカードを相手の場へ移す */
  changeControl(t, toPlayer, reason){
    trace(`changeControl: ${labelOf(t.card)} → ${nameOf(toPlayer)}`);
    snapshot();
    const P = gameState.players[t.p];
    const arr = t.zone==='field' ? null : P[t.zone];
    let card;
    if(t.zone==='field'){ card = P.field; P.field=null; }
    else { card = arr.splice(t.index,1)[0]; }

    act({type:"CHAIN_ADD", player:p, cardId:card?card.id:0, name, ss, from:zone, index});

  registerPendingEffect(p, name, note){ trace(`pending: ${name}`); act({type:"PENDING_ADD", player:p, name, note}); },
  registerReserveEffect(p, name, at, note){ trace(`reserve: ${name}@${at}`); act({type:"RESERVE_ADD", player:p, name, at, note}); },

    const P = gameState.players[p];
    (temporary ? P.temporaryFlags : P.effectFlags)[key] = val;

  /* --- 選択（UI担当。スクリプトはコールバックを受け取るだけ） --- */
  selectCard(title, candidates, onPick, note){
    // 対象を取る効果（targets:true）の場合のみ、対象耐性を持つカードを除く
    if(ACTIVE_SCRIPT && ACTIVE_SCRIPT.targets === true){
      const before = (candidates||[]).length;
      candidates = filterTargetable(candidates);
      if(candidates.length < before) trace(`対象耐性により ${before-candidates.length}枚を除外`);
      if(!candidates.length){ showToast("対象にできるカードがありません"); render(); return; }
    }
    trace(`selectCard: ${candidates.length}件`);
    if(!candidates.length){ trace(`対象なし`, false); showToast("対象がありません"); return; }
    openPick(title, note||"", candidates.map(t=>({
      // 名前を隠すのは「場に伏せてあるカード」だけ。
      // デッキ・墓地・手札から選ぶ時は内容が見えないと選べない。
      label: isHiddenTarget(t) ? "裏側のカード" : labelOf(t.card),
      sub: `${nameOf(t.p)}・${zoneJp(t.zone)}`,
      onPick: ()=>{ trace(`選択: ${labelOf(t.card)}`); onPick(t); }
    })));
  },
  selectPlayer(title, onPick){
    openPick(title, "", [0,1].map(p=>({
      label: nameOf(p), sub:"", onPick: ()=>onPick(p)
    })));
  },
  selectZone(title, p, zones, onPick){
    openPick(title, "", zones.map(z=>({label: zoneJp(z), sub:"", onPick: ()=>onPick(z)})));
  },
  confirm(title, message, onYes, onNo){
    sheet.innerHTML = `<div class="grip"></div>
      <h3 style="margin-bottom:6px">${title}</h3>
      <div class="meta" style="margin-bottom:12px">${message}</div>
      <div class="act-grid">
        <div class="act fx" onclick="__cfmYes()">はい</div>
        <div class="act" onclick="__cfmNo()">いいえ</div>
      </div>`;
    CFM_YES = onYes||null; CFM_NO = onNo||null;
    veil.classList.add("on");

let CFM_YES=null, CFM_NO=null;
function __cfmYes(){ const f=CFM_YES; CFM_YES=CFM_NO=null; closeSheet(); if(f) f(); }
function __cfmNo(){  const f=CFM_NO;  CFM_YES=CFM_NO=null; closeSheet(); if(f) f(); }

/* =========================================================================
   カードスクリプト定義
   condition / selectTargets / resolve / afterResolve / passive
   ========================================================================= */
const CARD_SCRIPTS = {};
/* 登録ヘルパ。name をキーにする（このアプリはカード名で引くため） */
function defineScript(name, def){ CARD_SCRIPTS[name] = Object.assign({name}, def); }

/* 自身を墓地へ送る標準の後処理（通常魔法・通常罠） */
function selfToGrave(ctx){
  if(!ctx.zone || ctx.keep) return;
  // 効果処理中に他のカードが場を離れると添字がずれるので、
  // 記録しておいたカード実体を探し直してから墓地へ送る。
  const P = gameState.players[ctx.player];
  let idx = ctx.index;
  if(ctx.card){
    const arr = ctx.zone==='field' ? (P.field?[P.field]:[]) : (P[ctx.zone]||[]);
    const found = arr.indexOf(ctx.card);
    if(found >= 0) idx = found;
    else {
      // 実体が見つからない＝既に場を離れている
      trace(`afterResolve: 自身は既に場にない`);
      return;
    }
  }
  trace(`afterResolve: 自身を墓地へ`);
  act({type:"FX_SELF_TO_GRAVE", player:ctx.player, zone:ctx.zone, index:idx});
}

/* ---- スクリプト実行（発動条件 → 対象選択 → 解決 → 後処理） ---- */
function runScript(name, p, zone, index, opts){
  const sc = CARD_SCRIPTS[name];
  if(!sc) return false;
  const P = gameState.players[p];
  const card = zone ? zoneCard(P, zone, index) : null;
  const ctx = makeContext(p, card, zone, index, "activate", opts||{});
  ACTIVE_SCRIPT = sc;                  // 対象耐性の判定に使う
  SCRIPT_ZONE = zone;                  // 「墓地で発動する効果」の判定に使う
  traceStart(name);
  // カウンター罠の発動を通知する（豊穣のアルテミス等が反応する）
  if(dbOf(card).sub === 'カウンター') emitEvent("onCounterTrap", {player:p, name});

  /* EDOPro に倣った処理順：
     発動条件 → 回数制限 → コスト → 対象選択 → チェーン確認 → 解決 → 後処理 */
  const finish = ()=>{
    if(sc.afterResolve) sc.afterResolve(ctx); else selfToGrave(ctx);
    trace(`解決終了`);
    ACTIVE_SCRIPT = null;
    SCRIPT_PHASE = null;
    SCRIPT_ZONE = null;
    render();
  };
  const doResolve = ()=>{ SCRIPT_PHASE = 'resolve'; sc.resolve(ctx); SCRIPT_PHASE = null; finish(); };
  const doTarget = ()=>{
    if(sc.selectTargets){
      sc.selectTargets(ctx, (targets)=>{
        ctx.selectedTargets = targets||[];
        trace(`対象確定：${ctx.selectedTargets.map(t=>t&&t.card?labelOf(t.card):'—').join("、")||"なし"}`);
        confirmTargets(ctx, name, doResolve);
      });
    } else {
      confirmTargets(ctx, name, doResolve);
    }
  };
  /* コストは対象より先に払う。払えなければ発動できない。 */
  const doCost = ()=>{
    countConsume(p, name, sc);          // 回数を消費（発動時点で消費する）
    if(sc.cost){
      trace(`コスト支払い`);
      SCRIPT_PHASE = 'cost';
      sc.cost(ctx, (ok)=>{
        SCRIPT_PHASE = null;
        if(ok===false){ trace(`コストを払えない`, false); showToast("コストを払えません"); render(); return; }
        doTarget();
      });
    } else {
      doTarget();
    }
  };
  const proceed = doCost;

  // 回数制限
  if(sc.countLimit && countLeft(p, name, sc) <= 0){
    trace(`回数制限：${countLimitJp(sc)}まで`, false);
    showToast(`${name} は${countLimitJp(sc)}までです`);
    render();
    return true;
  }

  // 発動タイミング。窓が開いていなければ警告を出す
  const tm = timingCheck(sc);
  if(!tm.ok){
    trace(`発動タイミング NG：${tm.why}`, false);
    render();
    askForce(name, tm.why, proceed);
    return true;
  }

  // 発動条件。満たさなくても警告を出して手動発動できる（裁定はプレイヤーが判断）
  if(sc.condition){
    let ok=false;
    try{ ok = sc.condition(ctx); }catch(e){ ok=false; ctx.reason='条件判定でエラー'; }
    if(!ok){
      trace(`発動条件 NG：${ctx.reason||"条件を満たしていません"}`, false);
      render();
      askForce(name, ctx.reason||"発動条件を満たしていません", proceed);
      return true;
    }
  }
  trace(`発動条件 OK`);
  proceed();
  return true;
}

/* =========================================================================
   発動タイミングの判定
   「召喚に成功した時」のように発動できる瞬間が決まっている効果は、
   その窓が開いている間だけ素直に発動できるようにする。
   窓が閉じていても askForce で強行できる（裁定はプレイヤーが判断する）。

   スクリプト側は timing で宣言する。省略時は passive のフックから推定する。
     'summon'      召喚・特殊召喚に成功した時
     'flip'        リバースした時
     'damageStep'  ダメージステップ中
     'counterTrap' カウンター罠が発動した時
     'mainPhase'   自分のメインフェイズ
     'standby'     スタンバイフェイズ
     'endPhase'    エンドフェイズ
     'free'        いつでも（制限なし）
   ========================================================================= */
const TIMING_JP = {
  summon:'モンスターの召喚・特殊召喚に成功した時',
  flip:'モンスターがリバースした時',
  damageStep:'ダメージステップ中',
  counterTrap:'カウンター罠が発動した時',
  mainPhase:'自分のメインフェイズ',
  standby:'スタンバイフェイズ',
  endPhase:'エンドフェイズ',
  free:'いつでも',
};

/* スクリプトが発動できるタイミングの一覧 */
function scriptTimings(sc){
  if(sc.timing) return [].concat(sc.timing);
  const pv = sc.passive || {};
  const t = [];
  if(pv.onNormalSummon || pv.onSpecialSummon) t.push('summon');
  if(pv.onFlip)        t.push('flip');
  if(pv.onDamageStep)  t.push('damageStep');
  if(pv.onCounterTrap) t.push('counterTrap');
  // 手札・墓地からの発動を宣言しているカードは起動効果も持つので制限しない
  if(sc.activateFrom && sc.activateFrom.length) t.push('free');
  if(pv.onSendToGrave) t.push('free');
  return t.length ? t : ['free'];
}

/* いま開いているタイミングの一覧 */
function currentTimings(){
  const gs = gameState;
  const out = ['free'];
  const w = gs.timingWindow;
  if(w && w.turn === gs.turn) out.push(w.kind);
  if(gs.battle) out.push('damageStep');
  if(gs.phase === 'main1' || gs.phase === 'main2') out.push('mainPhase');
  if(gs.phase === 'standby') out.push('standby');
  if(gs.phase === 'end')     out.push('endPhase');
  return out;
}

/* このスクリプトを素直に発動できるか。駄目なら理由を返す。 */
function timingCheck(sc){
  const want = scriptTimings(sc);
  if(want.indexOf('free') >= 0) return {ok:true};
  const now = currentTimings();
  if(want.some(t=>now.indexOf(t) >= 0)) return {ok:true};
  const jp = want.map(t=>TIMING_JP[t] || t).join('、または');
  return {ok:false, why:`このカードは「${jp}」に発動します`};
}

/* 条件を満たさない時に「それでも発動する」かを尋ねる */
function askForce(name, reason, onYes){

      <h3 style="margin-bottom:6px">${name}</h3>
      <div class="warn-note">${reason}</div>

        正しいと判断できる場合はそのまま発動できます。</div>
      <div class="act-grid wide">
        <div class="act fx" onclick="__forceYes()">それでも発動する</div>
        <div class="act" onclick="__forceNo()">やめる</div>
      </div>`;
    FORCE_CB = onYes||null;
    veil.classList.add("on");
  }, 40);
}
let FORCE_CB=null;

function __forceNo(){ FORCE_CB=null; closeSheet(); showToast("発動を取りやめました"); }

/* 対象を公開して、相手にチェーンの機会を与える */
function confirmTargets(ctx, name, onResolve){
  const foe = ctx.player===0?1:0;

  const tg = (ctx.selectedTargets||[]).filter(t=>t&&t.card);

        tg.map(t=>`<span class="tgr-card">${labelOf(t.card)}<small>${nameOf(t.p)}</small></span>`).join("")
      }</div>`
    : "";
  // 相手が撃てるものが無ければそのまま解決する
  if(!foeN){ if(tg.length) trace(`対象を公開`); onResolve(); return; }
  setTimeout(()=>{
    sheet.innerHTML = `<div class="grip"></div>
      <h3 style="margin-bottom:6px">${name} を発動</h3>

        チェーンしますか？</div>
      <div class="act-grid wide">
        <div class="act" style="background:var(--trap);color:#120a1f;border-color:var(--trap)"
             onclick="closeSheet();openReactFor(${foe})">${nameOf(foe)}がチェーンする</div>
        <div class="act fx" onclick="__tgResolve()">チェーンしない（解決）</div>
      </div>`;
    TG_RESOLVE = onResolve;
    veil.classList.add("on");
  }, 40);
}

/* =========================================================================
   イベントシステム
   イベント発火 → 該当スクリプトの passive を評価 → 候補提示
   ========================================================================= */
const EVENTS = [
  "onDraw","onSummon","onNormalSummon","onSpecialSummon","onSet","onFlip",
  "onAttackDeclare","onDamageStep","onBattleDestroy","onSendToGrave","onDestroy",
  "onRemove","onChainStart","onChainResolve","onEndPhase","onStandbyPhase",
  "onPhaseChange","onTurnStart","onTurnEnd","onLPChange","onTargetDeclared","onCardActivate"
];

/* 発火候補を集める。場・手札・墓地のカードでハンドラを持つものを探す */
function collectHandlers(eventName, evt){
  const out = [];
  [0,1].forEach(p=>{
    const P = gameState.players[p];
    const scan = (zone, arr)=>{
      (arr||[]).forEach((c,i)=>{
        if(!c) return;
        const nm = dbOf(c).n;
        const sc = CARD_SCRIPTS[nm];
        const h  = sc && sc.passive && sc.passive[eventName];
        if(!h) return;
        if(sc.countLimit && countLeft(p, nm, sc) <= 0) return;   // 使用済みは出さない
        const ctx = makeContext(p, c, zone, i, eventName, {event:evt||{}});
        // 条件を満たすものだけ候補にする
        let ok = true;
        try{ ok = h(ctx); }catch(e){ ok = false; }
        if(ok) out.push({p, zone, index:i, card:c, name:nm, ctx});
      });
    };
    scan('mz', P.mz); scan('sz', P.sz);
    if(P.field) scan('field', [P.field]);
    scan('hand', P.hand); scan('grave', P.grave);
  });
  return out;
}

/* イベント発火。候補があればプレイヤーに提示する（自動発動はしない） */
function emitEvent(eventName, evt){
  const cands = collectHandlers(eventName, evt);
  if(!cands.length) return false;
  // 強制誘発（EDOPro の TRIGGER_F 相当）は確認せずそのまま処理する
  const forced = cands.filter(c=>{
    const sc = CARD_SCRIPTS[c.name];
    return sc && sc.forced;
  });
  if(forced.length===cands.length && forced.length===1){
    const c = forced[0];
    runScript(c.name, c.p, c.zone, c.index, {event:c.ctx.event});
    return true;
  }
  // 相手の誘発を優先して出す（激流葬・奈落など）
  const rp = reactingPlayer();
  cands.sort((a,b)=> (a.p===rp?-1:1) - (b.p===rp?-1:1));
  setTimeout(()=>{
    const rows = cands.map((c,i)=>
      `<div class="act pick-row" onclick="__evtPick(${i})">
         <span class="pk-nm">${c.name}</span>
         <span class="pk-sub">${nameOf(c.p)}・${zoneJp(c.zone)}</span>
       </div>`).join("");
    sheet.innerHTML = `<div class="grip"></div>
      <h3 style="margin-bottom:4px">${eventJp(eventName)}</h3>
      <div class="meta" style="margin-bottom:10px">発動できるカードがあります。使用しますか？</div>
      <div class="pick-list">${rows}</div>
      <button class="close" onclick="__evtSkip()">発動しない</button>`;
    EVT_CANDS = cands;
    veil.classList.add("on");
  }, 60);
  return true;
}
let EVT_CANDS = [], EVT_AFTER = null;
function __evtPick(i){
  const c = EVT_CANDS[i]; EVT_CANDS=[];
  closeSheet();
  if(!c) return;
  // 誘発効果もチェーンに積む。相手がチェーンする余地を残すため、
  // ここで即解決せず reactActivate と同じ経路を通す。
  reactActivate(c.p, c.zone, c.index);
}
function __evtSkip(){
  EVT_CANDS=[]; closeSheet();
  const f = EVT_AFTER; EVT_AFTER=null;
  if(f) f();
}
function eventJp(e){
  return ({
    onDraw:"ドロー時", onSummon:"召喚時", onNormalSummon:"通常召喚時",
    onSpecialSummon:"特殊召喚時", onSet:"セット時", onFlip:"反転時",
    onAttackDeclare:"攻撃宣言時", onDamageStep:"ダメージステップ", onBattleDestroy:"戦闘破壊時",
    onSendToGrave:"墓地へ送られた時", onDestroy:"破壊された時", onRemove:"場を離れた時",
    onChainStart:"チェーン開始", onChainResolve:"チェーン解決", onEndPhase:"エンドフェイズ",
    onStandbyPhase:"スタンバイフェイズ", onPhaseChange:"フェーズ変更", onTurnStart:"ターン開始",
    onTurnEnd:"ターン終了", onLPChange:"LP変動", onTargetDeclared:"対象宣言", onCardActivate:"カード発動"
  })[e] || e;
}

    const mons = API.pileCards(ctx.player,'grave',x=>x.db.k==='m');

/* ---- 神の宣告（LP半分でカウンター） ---- */
defineScript("神の宣告", {
  type:"counter", priority:3,
  condition(ctx){
    const lp = API.me(ctx).lp;
    if(lp<=1){ ctx.reason = "LPが足りません"; return false; }
    return true;
  },
  cost(ctx, done){
    const P = API.me(ctx);
    const half = Math.floor(P.lp/2);
    API.payCost(ctx.player, P.lp - half);
    done(true);
  },
  resolve(ctx){
    API.log("神の宣告：LPを半分払って発動を無効にした");
    API.registerPendingEffect(ctx.player, "神の宣告で無効化", "対象の発動を無効にして破壊してください");
  },
  passive:{
    onNormalSummon(ctx){ return ctx.card.face==='down' && ctx.zone==='sz'; },
    onSpecialSummon(ctx){ return ctx.card.face==='down' && ctx.zone==='sz'; },
    onCardActivate(ctx){ return ctx.card.face==='down' && ctx.zone==='sz'; },
  }
});

/* ---- カオス・ソーサラー（除外して特殊召喚する上級） ---- */
defineScript("カオス・ソーサラー", {
  countLimit:1,
  type:"monster", priority:1, quickEffect:false,
  activateFrom:["hand"],
  condition(ctx){
    // 手札からの特殊召喚（光1体＋闇1体を除外）
    if(ctx.zone==='hand'){
      const g = API.pileCards(ctx.player,'grave',x=>x.db.k==='m');
      const light = g.filter(x=>x.db.at==='光');
      const dark  = g.filter(x=>x.db.at==='闇');
      if(!light.length || !dark.length){
        ctx.reason = "墓地に光属性と闇属性のモンスターが必要です"; return false;
      }
      if(API.me(ctx).mz.length>=ZONE_LIMITS.mz){ ctx.reason="モンスターゾーンが一杯です"; return false; }
      return true;
    }
    // 場での起動効果（表側モンスター1体を除外）
    if(!API.fieldCards({zone:'mz', filter:x=>x.card.face==='up'}).length){
      ctx.reason = "除外する表側表示モンスターがいません"; return false;
    }
    return true;
  },
  selectTargets(ctx, done){
    if(ctx.zone==='hand'){
      // 光→闇の順に除外するモンスターを選ぶ
      const light = API.pileCards(ctx.player,'grave',x=>x.db.k==='m' && x.db.at==='光');
      API.selectCard("カオス・ソーサラー：除外する光属性", light, l=>{
        const dark = API.pileCards(ctx.player,'grave',x=>x.db.k==='m' && x.db.at==='闇' && x.card!==l.card);
        API.selectCard("カオス・ソーサラー：除外する闇属性", dark, d=>done([l,d]));
      });
      return;
    }
    API.selectCard("カオス・ソーサラー：除外する表側モンスター",
      API.fieldCards({zone:'mz', filter:x=>x.card.face==='up'}), t=>done([t]));
  },
  resolve(ctx){
    if(ctx.zone==='hand'){
      ctx.selectedTargets.forEach(t=>API.banish(t, "カオス・ソーサラー（コスト）"));
      API.specialSummon(ctx.player, 'hand', ctx.index, 'atk', "カオス・ソーサラー");
      return;
    }
    ctx.selectedTargets.forEach(t=>API.banish(t, "カオス・ソーサラー"));
    API.log("カオス・ソーサラー：この効果を発動したターン攻撃できない");
  },
  afterResolve(){}
});

/* ---- アーカナイト・マジシャン（S召喚時に魔力2つ／取り除いて破壊） ---- */
defineScript("アーカナイト・マジシャン", {
  timing:["summon","free"],     // S召喚時のカウンターと、カウンターを使う起動効果
  type:"synchro", priority:1, quickEffect:false,
  condition(ctx){
    if(ctx.zone!=='mz'){ ctx.reason = "フィールドで発動します"; return false; }
    // 自分フィールドのどこかに魔力カウンターがあればよい
    const has = API.fieldCards({player:ctx.player})
      .some(x=>x.card.counters && (x.card.counters['魔力']||0)>0);
    if(!has){ ctx.reason = "自分フィールドに魔力カウンターがありません"; return false; }

/* ---- 氷結界の龍 ブリューナク（手札を捨てた数だけバウンス） ---- */
defineScript("氷結界の龍 ブリューナク", {
  countLimit:1,
  type:"synchro", priority:1, quickEffect:false,
  condition(ctx){
    if(ctx.zone!=='mz'){ ctx.reason = "フィールドで発動します"; return false; }
    if(!API.me(ctx).hand.length){ ctx.reason = "捨てる手札がありません"; return false; }
    if(!API.fieldCards({player:ctx.opponent}).length){ ctx.reason = "相手フィールドにカードがありません"; return false; }
    return true;
  },
  selectTargets(ctx, done){
    // 手札を1枚捨てるごとに相手カード1枚を対象にする
    const picks=[];
    const step=()=>{
      const hand = API.me(ctx).hand.map((c,i)=>({p:ctx.player,zone:'hand',index:i,card:c,db:dbOf(c)}));
      const foe  = API.fieldCards({player:ctx.opponent}).filter(x=>picks.every(pk=>pk.t.card!==x.card));
      if(!hand.length || !foe.length){ done(picks); return; }
      API.selectCard(`ブリューナク：捨てる手札（${picks.length+1}枚目・任意）`, hand, h=>{
        API.selectCard("ブリューナク：手札に戻す相手のカード", foe, t=>{
          picks.push({h, t}); step();
        });
      }, picks.length? "閉じると確定" : "");
    };
    step();
  },
  resolve(ctx){
    const picks = ctx.selectedTargets||[];
    // 先にコストをまとめて捨てる（添字ずれを避けるため後ろから）
    picks.map(pk=>pk.h).sort((a,b)=>b.index-a.index)
      .forEach(h=>API.discard(ctx.player, h.index, "ブリューナク（コスト）"));
    picks.forEach(pk=>API.returnToHand(pk.t, "氷結界の龍 ブリューナク"));
  },
  afterResolve(){}
});

/* ---- 異次元の女戦士（戦闘したモンスターをまとめて除外） ---- */
defineScript("異次元の女戦士", {
  type:"monster", priority:1,
  condition(ctx){
    const b = ctx.battle || gameState.lastBattle;
    if(!inBattle(ctx, b)){
      ctx.reason = "このカードが戦闘を行ったダメージ計算後に発動します"; return false;
    }
    return true;
  },
  resolve(ctx){
    const b = ctx.battle || gameState.lastBattle; if(!b) return;
    // 自分が攻撃側だったか守備側だったかを名前でも判定する
    const iWasAtk = (b.atkCard===ctx.card) ||
                    (ctx.player===b.atkOwner && cardName(ctx.card)===b.atkName);
    const foe = iWasAtk ? b.defCard : b.atkCard;
    const fp  = iWasAtk ? b.defOwner : b.atkOwner;
    if(foe){
      const arr = gameState.players[fp].mz;
      const i = arr.indexOf(foe);
      if(i>=0) API.banish({p:fp, zone:'mz', index:i, card:foe}, "異次元の女戦士");
      else {
        // 既に墓地なら墓地から除外する
        const gi = gameState.players[fp].grave.findIndex(c=>cardName(c)===cardName(foe));
        if(gi>=0) API.banish({p:fp, zone:'grave', index:gi, card:gameState.players[fp].grave[gi]}, "異次元の女戦士");
      }
    }
    // 自身が場に残っていれば除外、既に墓地なら墓地から除外する
    const mi = gameState.players[ctx.player].mz.indexOf(ctx.card);
    if(mi>=0){ API.banish({p:ctx.player, zone:'mz', index:mi, card:ctx.card}, "異次元の女戦士"); }
    else {
      const gi = gameState.players[ctx.player].grave.indexOf(ctx.card);
      if(gi>=0) API.banish({p:ctx.player, zone:'grave', index:gi, card:ctx.card}, "異次元の女戦士");
    }
  },
  afterResolve(){},
  passive:{
    onDamageStep(ctx){
      const b = ctx.battle||{};
      // 戦闘で破壊されて墓地にいても、その戦闘に参加していれば誘発する
      return inBattle(ctx, b);
    }
  }
});

  damageStepOnly:true,          // ③-ⅰ ダメージ計算時まで発動できる
  type:"monster", priority:2,
  activateFrom:["hand"],
  condition(ctx){
    if(ctx.zone!=='hand'){ ctx.reason = "手札から発動します"; return false; }
    const light = API.fieldCards({zone:'mz', player:ctx.player,
      filter:x=>x.card.face==='up' && x.db.at==='光'});
    if(!light.length){ ctx.reason = "自分フィールドに表側の光属性モンスターがいません"; return false; }
    if(gameState.phase!=='battle'){ ctx.reason = "ダメージステップに発動します"; return false; }
    return true;
  },
  selectTargets(ctx, done){
    const light = API.fieldCards({zone:'mz', player:ctx.player,
      filter:x=>x.card.face==='up' && x.db.at==='光'});
    API.selectCard("オネスト：攻撃力を上げる光属性", light, me=>{
      const foes = API.fieldCards({zone:'mz', player:ctx.opponent, filter:x=>x.card.face==='up'});
      if(!foes.length){ done([me]); return; }
      API.selectCard("オネスト：戦闘している相手モンスター", foes, foe=>done([me, foe]));
    });
  },
  resolve(ctx){
    const [me, foe] = ctx.selectedTargets;
    if(!me) return;
    const add = foe ? API.curAtk(foe) : 0;
    API.modAtk(me, add, 0, 'endTurn', 'オネスト');
    API.log(`オネスト：${labelOf(me.card)} の攻撃力が ${add} アップ`);
  },
  afterResolve(ctx){ API.discard(ctx.player, ctx.index, "オネスト"); }
});

/* ---- N・グラン・モール（戦闘時にお互い手札へ戻る） ---- */
defineScript("N・グラン・モール", {
  dsTiming:"start",              // ① ダメージステップ開始時
  type:"monster", priority:1,
  condition(ctx){
    const b = ctx.battle || gameState.lastBattle;
    if(!inBattle(ctx, b)){
      ctx.reason = "このカードが戦闘を行う時に発動します"; return false;
    }
    return true;
  },
  resolve(ctx){
    const b = ctx.battle || gameState.lastBattle; if(!b) return;
    const iWasAtk = (b.atkCard===ctx.card) ||
                    (ctx.player===b.atkOwner && cardName(ctx.card)===b.atkName);
    const foe = iWasAtk ? b.defCard : b.atkCard;
    const fp  = iWasAtk ? b.defOwner : b.atkOwner;
    if(foe){
      const i = gameState.players[fp].mz.indexOf(foe);
      if(i>=0) API.returnToHand({p:fp, zone:'mz', index:i, card:foe}, "N・グラン・モール");
    }
    const mi = gameState.players[ctx.player].mz.indexOf(ctx.card);
    if(mi>=0) API.returnToHand({p:ctx.player, zone:'mz', index:mi, card:ctx.card}, "N・グラン・モール");
  },
  afterResolve(){},
  passive:{
    onDamageStep(ctx){
      const b = ctx.battle||{};
      return (b.atkCard===ctx.card || b.defCard===ctx.card);
    }
  }
});

defineScript("ダーク・アームド・ドラゴン", {

  condition(ctx){
    if(ctx.zone==='hand'){
      const dark = API.pileCards(ctx.player,'grave',x=>x.db.k==='m' && x.db.at==='闇');
      if(dark.length!==3){ ctx.reason = `墓地の闇属性がちょうど3体の時のみ特殊召喚できます（現在${dark.length}体）`; return false; }
      if(API.me(ctx).mz.length>=ZONE_LIMITS.mz){ ctx.reason="モンスターゾーンが一杯です"; return false; }
      return true;
    }
    const dark = API.pileCards(ctx.player,'grave',x=>x.db.k==='m' && x.db.at==='闇');
    if(!dark.length){ ctx.reason = "墓地に闇属性モンスターがいません"; return false; }

      API.selectCard("ダークアームド：破壊するフィールドのカード", API.fieldCards(), t=>done([d,t]));

      API.specialSummon(ctx.player, 'hand', ctx.index, 'atk', "ダーク・アームド・ドラゴン");
      return;

});

/* ---- ゴッドバードアタック ---- */
defineScript("ゴッドバードアタック", {
  type:"trap", priority:2,
  condition(ctx){
    const birds = API.fieldCards({zone:'mz', player:ctx.player, filter:x=>x.db.ra==='鳥獣'});
    if(!birds.length){ ctx.reason = "リリースする鳥獣族がいません"; return false; }
    if(!API.fieldCards().length){ ctx.reason = "破壊する対象がありません"; return false; }
    return true;
  },
  selectTargets(ctx, done){
    const birds = API.fieldCards({zone:'mz', player:ctx.player, filter:x=>x.db.ra==='鳥獣'});
    API.selectCard("ゴッドバードアタック：リリースする鳥獣族", birds, r=>{
      const picks=[];
      const step=()=>{
        const left = API.fieldCards().filter(x=>x.card!==r.card && picks.every(pk=>pk.card!==x.card));
        if(picks.length>=2 || !left.length){ done([r].concat(picks)); return; }
        API.selectCard(`ゴッドバードアタック：破壊するカード（${picks.length+1}/2）`, left,
          t=>{ picks.push(t); step(); });
      };
      step();
    });
  },
  resolve(ctx){
    const [r, ...targets]=ctx.selectedTargets;
    if(r) API.sendToGrave(r, "ゴッドバードアタック（リリース）");
    targets.forEach(t=>API.destroy(t, "ゴッドバードアタック"));
  }
});

/* ---- 名推理 ---- */
defineScript("名推理", {
  type:"spell", priority:1, quickEffect:false,
  condition(ctx){
    if(!API.me(ctx).deck.length){ ctx.reason = "デッキが空です"; return false; }
    return true;
  },
  resolve(ctx){
    const lv = parseInt(prompt("相手が宣言するレベル（1〜12）","4")||"4",10);
    API.log(`名推理：相手はレベル${lv}を宣言`);
    // 通常召喚可能なモンスターが出るまでめくる
    const P = gameState.players[ctx.player];
    let hit=null, flipped=0;
    while(P.deck.length && flipped<40){
      const top = P.deck[0];
      const db = dbOf(top);
      flipped++;
      if(db.k==='m' && !db.ex){ hit=db; break; }
      API.millTop(ctx.player, 1, "名推理");
    }
    if(!hit){ API.log("名推理：通常召喚可能なモンスターが出なかった"); return; }
    if(hit.lv===lv){
      API.log(`名推理：レベル${hit.lv}で的中 → ${hit.n} は墓地へ`);
      API.millTop(ctx.player, 1, "名推理（的中）");
    } else {
      API.log(`名推理：レベル${hit.lv}で外れ → ${hit.n} を特殊召喚`);
      API.specialSummon(ctx.player, 'deck', 0, 'atk', "名推理");
    }
  }
});

defineScript("血の代償", {
  fieldIgnition:true,          // 表側で場に残ったまま効果を発動できる
  type:"continuous-trap", priority:2,
  condition(ctx){
    if(API.me(ctx).lp<500){ ctx.reason = "LPが500未満です"; return false; }

/* =========================================================================
   効果テキストから誘発タイミングを推定する
   スクリプト未実装のカードでも「今このカードが誘発する」と分かれば
   プレイヤーに提示できる。判定は保守的にし、確実な文言だけを拾う。
   ========================================================================= */
const TRIGGER_PATTERNS = [
  /* 墓地へ送られた時（フィールドから／どこからでも） */
  { key:'onSendToGrave', zone:['grave'],
    re:/(フィールド上?から)?墓地へ送られた(時|場合)/, jp:'墓地へ送られた時' },
  /* 破壊された時（戦闘・効果を問わない） */
  { key:'onDestroy', zone:['grave'],
    re:/(?<!戦闘によって)破壊され(て墓地へ送られ)?た(時|場合)/, jp:'破壊された時' },
  /* 戦闘で破壊された時 */
  { key:'onBattleDestroy', zone:['grave'],
    re:/戦闘に?よって破壊され|戦闘で破壊され/, jp:'戦闘で破壊された時' },
  /* リバース */
  { key:'onFlip', zone:['mz'],
    re:/リバースした(時|場合)|反転召喚に成功した(時|場合)|リバース：/, jp:'リバースした時' },
  /* 召喚成功時 */
  { key:'onSummon', zone:['mz'],
    re:/(召喚|反転召喚|特殊召喚)に成功した(時|場合)/, jp:'召喚に成功した時' },
  /* 場を離れた時 */
  { key:'onRemove', zone:['grave','banish'],
    re:/フィールド上?を離れた(時|場合)/, jp:'フィールドを離れた時' },
  /* スタンバイフェイズ */
  { key:'onStandby', zone:['mz','sz','field','grave'],
    re:/スタンバイフェイズ(時|に)/, jp:'スタンバイフェイズ' },
  /* エンドフェイズ */
  { key:'onEndPhase', zone:['mz','sz','field','grave'],
    re:/エンドフェイズ(時|に)/, jp:'エンドフェイズ' },
];

/* カードの誘発タイミングを返す（キャッシュ付き） */
const TRIGGER_CACHE = new Map();
function detectTriggers(db){
  if(!db || !db.n) return [];
  if(TRIGGER_CACHE.has(db.n)) return TRIGGER_CACHE.get(db.n);
  const e = String(db.e||"") + "\n" + String(db.e0||"");
  const out = [];
  TRIGGER_PATTERNS.forEach(t=>{
    try{ if(t.re.test(e)) out.push(t); }catch(err){}
  });
  TRIGGER_CACHE.set(db.n, out);
  return out;
}

/* いま起きた出来事に反応しうるカードを、テキストから推定して集める。
   evt: {key, player, card}  key は TRIGGER_PATTERNS の key
   返り値: [{p, zone, index, card, db, jp, script}] */
function detectedTriggerCards(evtKey, evt){
  const out = [];
  [0,1].forEach(p=>{
    const P = gameState.players[p];
    const scan = (zone, arr)=>{
      (arr||[]).forEach((c,i)=>{
        if(!c) return;
        const db = dbOf(c);
        if(!db.n) return;
        // スクリプトが同じ誘発を持っているならそちらに任せる
        const sc = CARD_SCRIPTS[db.n];
        if(sc && sc.passive) return;
        const hits = detectTriggers(db).filter(t=>t.key===evtKey && t.zone.indexOf(zone)>=0);
        if(!hits.length) return;
        // 自分自身が対象の出来事なら、そのカードに限定する
        if(evt && evt.card && evt.card !== c && evt.selfOnly) return;
        out.push({p, zone, index:i, card:c, db, jp:hits[0].jp, script:false});
      });
    };
    scan('mz', P.mz); scan('sz', P.sz);
    if(P.field) scan('field', [P.field]);
    scan('grave', P.grave); scan('hand', P.hand); scan('banish', P.banish);
  });
  return out;
}

/* 推定した誘発をプレイヤーに提示する。
   自動では発動せず、使うかどうかは必ず人が選ぶ。 */
function offerDetectedTriggers(evtKey, evt, after){
  const cands = detectedTriggerCards(evtKey, evt);
  if(!cands.length){ if(after) after(); return false; }
  DTRG_AFTER = after || null;
  setTimeout(()=>{
    const rows = cands.map((c,i)=>
      `<div class="act pick-row" onclick="__dtrgPick(${i})">
         <span class="pk-nm">${c.db.n}</span>
         <span class="pk-sub">${nameOf(c.p)}・${zoneJp(c.zone)}／${c.jp}</span>
       </div>`).join("");
    const jp = (TRIGGER_PATTERNS.find(t=>t.key===evtKey)||{}).jp || "誘発";
    sheet.innerHTML = `<div class="grip"></div>
      <h3 style="margin-bottom:4px">${jp}</h3>
      <div class="meta" style="margin-bottom:10px">
        効果テキストから、この場面で発動できそうなカードを見つけました。<br>
        処理内容は手動になります（誤検出なら「発動しない」を選んでください）。</div>
      <div class="pick-list">${rows}</div>
      <button class="close" onclick="__dtrgSkip()">発動しない</button>`;
    DTRG_CANDS = cands;
    veil.classList.add("on");
  }, 80);
  return true;
}
let DTRG_CANDS=[], DTRG_AFTER=null;
function __dtrgPick(i){
  const c = DTRG_CANDS[i]; DTRG_CANDS=[];
  closeSheet();
  const f = DTRG_AFTER; DTRG_AFTER=null;
  if(c){
    // スクリプトがあればそれを、無ければ効果テキストを見せて手動処理
    if(CARD_SCRIPTS[c.db.n]) runScript(c.db.n, c.p, c.zone, c.index, {});
    else openManualEffect(c);
  }
  if(f) f();
}
function __dtrgSkip(){
  DTRG_CANDS=[]; closeSheet();
  const f=DTRG_AFTER; DTRG_AFTER=null; if(f) f();
}

/* 効果テキストを見せて、汎用パレットで手動処理させる */
function openManualEffect(c){
  const e = String(c.db.e||"").replace(/\n/g,"<br>");
  sheet.innerHTML = `<div class="grip"></div>
    <h3 style="margin-bottom:4px">${c.db.n}</h3>
    <div class="meta" style="margin-bottom:8px">${c.jp}に発動する効果です。内容を確認して処理してください。</div>
    <div class="eff">${e}</div>
    <div class="act-grid wide">
      <div class="act fx" onclick="closeSheet();openPrimitives(${c.p},'${c.zone}',${c.index},${jsStr(c.db.n)})">効果処理パレットを開く</div>
      <div class="act" onclick="closeSheet()">閉じる</div>
    </div>`;
  veil.classList.add("on");
}

/* 回数制限の残りを短く表示する */
function clNote(p, name){
  const sc = CARD_SCRIPTS[name];
  if(!sc || !sc.countLimit) return "";
  const left = countLeft(p, name, sc);
  const jp = countLimitJp(sc);
  return left>0 ? `（${jp}／残り${left}）` : `（${jp}／使用済み）`;
}

function hasEffect(name){
  return !!(CARD_SCRIPTS[name] || CARD_EFFECT[name] || AUTO_EFFECT[name]);
}
/* 発動トリガ種別（召喚時 / 起動）。宣言テーブルのみ持つ */
function effectTrigger(name){
  const e = AUTO_EFFECT[name];
  return e ? e.trig : "ignition";
}
/* 効果を実行する。selfLoc={zone,index,keep} */
function runEffect(p, name, selfLoc){
  // ① カードスクリプト（Step11の正式基盤）を最優先
  if(CARD_SCRIPTS[name]){
    const loc = selfLoc||{};
    return runScript(name, p, loc.zone, loc.index, {keep:loc.keep});
  }
  // ② 旧・個別実装 ③ 宣言テーブル の順にフォールバック
  const fn = CARD_EFFECT[name];
  if(fn){ fn(p, selfLoc); return true; }
  const ent = AUTO_EFFECT[name];
  if(ent){ runAutoEffect(p, name, ent, selfLoc); return true; }
  return false;
}

/* =========================================================================
   【ライトロード】関連
   自分エンドフェイズのデッキ削りは強制効果なので endPhaseMill で宣言し、
   resolveEndPhaseMills() が確認なしで自動処理する。
   ========================================================================= */

/* ---- 削るだけのライトロード ---- */
[['ライトロード・パラディン ジェイン', 2],
 ['ライトロード・マジシャン ライラ',   3],
 ['ライトロード・モンク エイリン',     3],
 ['ライトロード・ドルイド オルクス',   2],
 ['ライトロード・スピリット シャイア', 2],
 ['ライトロード・ドラゴン グラゴニス', 3],
].forEach(([nm, n])=>{
  if(!CARD_SCRIPTS[nm]) defineScript(nm, { endPhaseMill:n });
});

/* ---- ライトロード・パラディン ジェイン ----
   相手モンスターに攻撃するダメージステップの間、攻撃力が300アップする。 */
CARD_SCRIPTS['ライトロード・パラディン ジェイン'].continuous = {
  scope:'self', from:['mz'],
  apply(target, self){
    const b = gameState.battle;
    if(!b || b.target === 'direct') return null;
    if((gameState.players[b.player].mz||[])[b.atkIdx] !== self) return null;
    return { atk:300 };
  }
};

/* ---- ライトロード・ドルイド オルクス ----
   「ライトロード」モンスターを魔法・罠・効果モンスターの効果の対象にできない。 */
CARD_SCRIPTS['ライトロード・ドルイド オルクス'].continuous = Object.assign(
  { scope:'allMonsters', from:['mz'], apply(){ return null; },
    immuneToTarget(target){
      return String(dbOf(target).n||'').indexOf('ライトロード') >= 0;
    } },
  {});

/* ---- ライトロード・スピリット シャイア ----
   攻撃力は、自分の墓地の「ライトロード」モンスターの種類×300アップする。 */
CARD_SCRIPTS['ライトロード・スピリット シャイア'].continuous = {
  scope:'self', from:['mz'],
  apply(target, self, info){
    const n = lightswornKinds(info.p);
    return n ? { atk:n*300 } : null;
  }
};
/* ---- ライトロード・ドラゴン グラゴニス（攻守とも上がる） ---- */
CARD_SCRIPTS['ライトロード・ドラゴン グラゴニス'].continuous = {
  scope:'self', from:['mz'],
  apply(target, self, info){
    const n = lightswornKinds(info.p);
    return n ? { atk:n*300, def:n*300 } : null;
  }
};
/* 自分の墓地の「ライトロード」モンスターの種類数 */
function lightswornKinds(p){
  const set = new Set();
  (gameState.players[p].grave||[]).forEach(c=>{
    const db = dbOf(c);
    if(db.k==='m' && String(db.n||'').indexOf('ライトロード')>=0) set.add(db.n);
  });
  return set.size;
}

/* ---- ライトロード・モンク エイリン ----
   守備表示モンスターを攻撃したダメージ計算前に、そのモンスターをデッキに戻す。 */
CARD_SCRIPTS['ライトロード・モンク エイリン'] = Object.assign(
  CARD_SCRIPTS['ライトロード・モンク エイリン'], {
  type:"monster", priority:1, dsTiming:"start", targets:false,
  condition(ctx){
    const b = gameState.battle;
    if(!b || b.target === 'direct'){ ctx.reason = "守備表示モンスターへの攻撃時に発動します"; return false; }
    if((gameState.players[b.player].mz||[])[b.atkIdx] !== ctx.card){
      ctx.reason = "このカードが攻撃する場合に発動します"; return false;
    }
    const def = (gameState.players[b.player===0?1:0].mz||[])[b.target];
    if(!def || def.pos !== 'def'){ ctx.reason = "攻撃対象が守備表示ではありません"; return false; }
    return true;
  },
  resolve(ctx){
    const b = gameState.battle;
    const fo = b.player===0?1:0;
    const def = (gameState.players[fo].mz||[])[b.target];
    if(!def){ API.log("攻撃対象が場にないため不発"); return; }
    API.returnToDeck({p:fo, zone:'mz', index:b.target, card:def}, false,
                     "ライトロード・モンク エイリン");
    endBattle();
  },
  afterResolve(){},
  passive:{
    onDamageStep(ctx){
      const b = gameState.battle;
      if(!b || b.target === 'direct') return false;
      if((gameState.players[b.player].mz||[])[b.atkIdx] !== ctx.card) return false;
      const def = (gameState.players[b.player===0?1:0].mz||[])[b.target];
      return !!(def && def.pos === 'def');
    }
  }
});

/* ---- ライトロード・マジシャン ライラ ----
   自分の表側攻撃表示のこのカードを守備表示にし、相手の魔法・罠1枚を破壊する。 */

/* ---- 光の召集 ----
   自分の手札を全て捨て、その枚数だけ墓地から光属性モンスターを手札に加える。 */
defineScript("光の召集", {
  type:"spell", priority:1,
  condition(ctx){
    if(!API.pileCards(ctx.player,'hand',x=>x.card!==ctx.card).length){
      ctx.reason = "捨てる手札がありません"; return false;
    }
    return true;
  },
  resolve(ctx){
    const P = gameState.players[ctx.player];
    let n = 0;
    for(let i=(P.hand||[]).length-1; i>=0; i--){
      API.discard(ctx.player, i, "光の召集", {byPlayer:ctx.player}); n++;
    }
    const pick = (left)=>{
      if(left <= 0){ render(); return; }
      const cands = API.pileCards(ctx.player,'grave',x=>x.db.k==='m' && x.db.at==='光');
      if(!cands.length){ API.log("墓地に光属性モンスターがいません"); render(); return; }
      API.selectCard(`光の召集：手札に加える光属性モンスター（残り${left}）`, cands, x=>{
        API.returnToHand(x, "光の召集");
        pick(left-1);
      }, "選ばない場合は閉じてください");
    };
    pick(n);
  }
});

  if(!tgInDeck(ctx.player, dbOf(ctx.card).n).length){
    ctx.reason = "デッキに他の「TG」モンスターがいません"; return false;
  }
  return true;

function makeTgEndSearch(nm, extra){
  return Object.assign({
    type:"monster", priority:1,
    activateFrom:["grave"],
    condition: tgEndSearchCondition,
    selectTargets(ctx, done){
      API.selectCard(`${nm}：手札に加える「TG」`,
        tgInDeck(ctx.player, dbOf(ctx.card).n), t=>done([t]));

    resolve(ctx){

/* =========================================================================
   ネクロバレーの墓地ロック
   公式裁定にもとづき、次の2つを分けて判定する。

   ① お互いに墓地のカードを除外できない
      効果・コスト・召喚条件のいずれであっても除外できない。

   ② 「墓地のカードへ及ぶ効果」は無効化され、適用されない
      ここでいう「墓地のカードへ及ぶ効果」とは
        ・墓地に存在するカードが墓地から離れる効果（蘇生・サルベージ・デッキ戻し）
        ・墓地のカードの種族／属性を変更する効果
      を指す。**効果による処理のみ**が対象で、コストや召喚条件による
      墓地からの移動は（除外を除いて）無効化されない。

   無効化されないもの
      ・墓地のカードを参照するだけの効果
      ・種族／属性以外を変える効果（カード名扱い・通常モンスター扱いなど）
      ・効果を無効にするだけの効果
      ・墓地以外にも及ぶ効果の、墓地以外の部分（トリシューラの手札・場への除外など）

   ③ 【1103当時裁定】墓地で発動する効果は無効化されない
      「墓地のカードに及ぶ効果」とは、他の場所にあるカードが墓地のカードへ
      作用する効果を指す。墓地のカード自身が墓地で発動する効果は
      「墓地で発動する効果」であり、この制限を受けない。
        例）暗黒界の龍神 グラファ／暗黒界の尖兵 ベージ／暗黒界の武神 ゴルド／
            ゾンビキャリア／グローアップ・バルブ／マシンナーズ・フォートレス
      これは後年の裁定変更で「墓地から離れる効果」として扱われるようになったが、
      1103環境では当時の裁定に従い、墓地からの自己特殊召喚などができる。
      ※ ただし①の除外は別条項なので、墓地で発動する効果であっても
        墓地のカードを除外することはできない（馬頭鬼・スポーアなど）。
   ========================================================================= */

/* 1103当時裁定を使うか。false にすると現行裁定（墓地で発動する効果も止まる）になる。 */
const RULING_1103_GRAVE_ACTIVATION = true;

/* ネクロバレー等の墓地ロックが適用されているか */
function necrovalleyLocked(){
  return continuousSources().some(src=>{
    const f = src.sc.continuous && src.sc.continuous.graveLock;
    if(typeof f !== 'function') return false;
    try{ return !!f(); }catch(e){ return false; }
  });
}

/* スクリプト処理のどの段階にいるか。コストと効果で扱いが変わる。 */
let SCRIPT_PHASE = null;      // 'cost' | 'resolve' | null
/* いま発動しているスクリプトがどのゾーンから発動したか。
   'grave' なら「墓地で発動する効果」として扱う。 */
let SCRIPT_ZONE = null;

/* 墓地のカードを動かせるか判定する。
   kind: 'banish'（除外）| 'leave'（蘇生・サルベージ・デッキ戻し）
   戻り値 true なら止められている。 */
function graveMoveBlocked(zone, kind){
  if(zone !== 'grave') return false;
  if(!necrovalleyLocked()) return false;
  if(ACTIVE_SCRIPT && ACTIVE_SCRIPT.ignoresNecrovalley) return false;
  // 除外はコスト・召喚条件でも不可
  if(kind === 'banish') return true;
  // それ以外は「効果による処理」のみ無効化される
  if(SCRIPT_PHASE !== 'resolve') return false;
  // 1103当時裁定：墓地で発動する効果は「墓地のカードに及ぶ効果」ではない
  if(RULING_1103_GRAVE_ACTIVATION && SCRIPT_ZONE === 'grave') return false;
  return true;
}

/* 止められたことを伝える */
function reportGraveLock(kind){
  const jp = kind === 'banish'
    ? "ネクロバレー：墓地のカードは除外できません"
    : "ネクロバレー：墓地のカードに及ぶ効果は適用されません";
  trace(jp, false);
  logIt(gameState, jp);
  showToast(jp);
}

/* 攻撃中の「古代の機械」により、相手が魔法・罠を発動できない状態か */

    const f = src.sc.continuous && src.sc.continuous.lockOpponentSpells;
    if(typeof f !== 'function') return false;
    try{ return !!f(src.card, src.card); }catch(e){ return false; }

/* ---- 超融合 ----
   手札を1枚捨てて発動。自分・相手フィールドから融合素材を墓地へ送り、
   その融合モンスターをEXデッキから融合召喚する。 */
defineScript("超融合", {
  type:"spell", priority:2, quickEffect:true,
  condition(ctx){
    if(!API.pileCards(ctx.player,'hand',x=>x.card!==ctx.card).length){
      ctx.reason = "捨てる手札がありません"; return false;
    }
    if(!superPolyOptions(ctx.player).length){
      ctx.reason = "素材が揃った融合モンスターがいません"; return false;
    }
    return true;
  },
  cost(ctx, done){
    API.selectCard("超融合：コストで捨てる手札",
      API.pileCards(ctx.player,'hand',x=>x.card!==ctx.card), x=>{
        API.discard(ctx.player, x.index, "超融合（コスト）");
        done(true);
      });
  },
  selectTargets(ctx, done){
    const opts = superPolyOptions(ctx.player);
    API.selectCard("超融合：融合召喚するモンスター", opts.map(o=>o.ex), pick=>{
      const o = opts.find(x=>x.ex.card === pick.card);
      done([{ex:o.ex, mats:o.combos[0]}]);
    }, "自分・相手フィールドの両方から素材にできます");
  },
  resolve(ctx){
    const t = ctx.selectedTargets[0];
    if(!t) return;
    const n = t.mats.length;
    t.mats.slice().reverse().forEach(m=>API.sendToGrave(m, "超融合（素材）"));
    const P = gameState.players[ctx.player];
    const ei = (P.ex||[]).indexOf(t.ex.card);
    if(ei >= 0){
      API.specialSummon(ctx.player,'ex',ei,'atk',"超融合");
      const put = P.mz[P.mz.length-1];
      if(put) put.fusionMaterialCount = n;   // キメラテックの元々の攻撃力に使う
    }
  }
});
/* 自分・相手フィールドの表側モンスターから融合できる組み合わせを探す */
function superPolyOptions(p){
  const P = gameState.players[p];
  const pool = [];
  API.fieldCards({zone:'mz', filter:x=>x.card && x.card.face==='up'}).forEach(x=>{
    pool.push({i:pool.length, p:x.p, zone:'mz', index:x.index,
               card:x.card, db:x.db, lv:curLV(x.card)});
  });
  const out = [];
  (P.ex||[]).forEach((c,ei)=>{
    const db = dbOf(c);
    if((db.st||[]).indexOf('融合') < 0) return;
    const spec = parseMaterialSpec(db);
    if(!spec || !spec.slots) return;
    const combos = findMaterialCombos(pool, spec, null, 5);
    if(combos.length) out.push({ex:{p, zone:'ex', index:ei, card:c, db}, combos});
  });
  return out;
}

/* ---- 魔導戦士 ブレイカー ----
   ① 召喚に成功した場合、このカードに魔力カウンターを1つ置く（最大1つ）。
   ② 攻撃力は魔力カウンターの数×300アップする。
   ③ 魔力カウンターを1つ取り除き、フィールドの魔法・罠1枚を対象として破壊する。

   ①と③を1つのスクリプトで扱うため、カウンターの有無と
   召喚直後かどうかで動作を切り替える。 */
defineScript("魔導戦士 ブレイカー", {
  timing:["summon","free"],      // ①は召喚時、③は起動効果
  type:"monster", priority:1,
  condition(ctx){
    if(ctx.zone !== 'mz'){ ctx.reason = "フィールドで発動します"; return false; }
    if(breakerMode(ctx) === 'charge') return true;
    if(!breakerCounters(ctx)){ ctx.reason = "魔力カウンターが乗っていません"; return false; }
    if(!API.fieldCards({zone:'sz', filter:x=>x.card}).length){
      ctx.reason = "フィールドに魔法・罠カードがありません"; return false;
    }
    return true;
  },
  /* ③はカウンターを取り除くのがコスト。対象選択より前に払う。 */
  cost(ctx, done){
    if(breakerMode(ctx) === 'charge'){ done(true); return; }
    API.removeCounter({p:ctx.player, zone:'mz', index:ctx.index}, '魔力', 1);
    done(true);
  },
  selectTargets(ctx, done){
    if(breakerMode(ctx) === 'charge'){ done([]); return; }
    // 対象を取るので、公開後に相手がチェーンできる（confirmTargets が処理する）
    API.selectCard("魔導戦士 ブレイカー：破壊する魔法・罠",
      API.fieldCards({zone:'sz', filter:x=>x.card}), t=>done([t]),
      "裏側のカードも選べます");
  },
  targets:true,
  resolve(ctx){
    if(breakerMode(ctx) === 'charge'){
      API.addCounter({p:ctx.player, zone:'mz', index:ctx.index}, '魔力', 1);
      API.log("魔導戦士 ブレイカー：魔力カウンターを1つ置いた");
      return;
    }
    const t = ctx.selectedTargets[0];
    if(!t){ API.log("対象が場にないため不発"); return; }
    API.destroy(t, "魔導戦士 ブレイカー");
  },
  afterResolve(){},
  /* ② 魔力カウンター1つにつき攻撃力300アップ */
  continuous:{
    scope:'self', from:['mz'],
    apply(target, self){
      const n = counterCountOf(self, '魔力');
      return n ? { atk:n*300 } : null;
    }
  },
  passive:{ onNormalSummon(ctx){ return ctx.zone==='mz'; } }
});

/* カウンターを置く段階か、取り除いて破壊する段階かを判定する */
function breakerMode(ctx){
  const n = breakerCounters(ctx);
  if(n > 0) return 'break';                       // 既に乗っていれば破壊効果
  const w = gameState.timingWindow;
  if(w && w.kind === 'summon' && w.turn === gameState.turn) return 'charge';
  return 'break';                                 // カウンターが無ければ条件で弾く
}
function breakerCounters(ctx){
  return counterCountOf(ctx.card, '魔力');
}

/* カード実体に乗っているカウンターの数を数える */
function counterCountOf(card, kind){
  if(!card || !card.counters) return 0;
  return card.counters[kind || '魔力'] || 0;
}

/* ---- 神獣王バルバロス ----
   ① リリースなしで通常召喚できる。
   ② その方法で召喚した場合、このカードの「元々の攻撃力」は1900になる。
   ③ モンスター3体をリリースして召喚することもできる。
   ④ ③の方法で召喚に成功した場合、相手フィールドのカードを全て破壊する。

   ②は自身の効果なので、スキルドレイン等で効果を無効にされると
   元々の攻撃力3000に戻る。継続効果レイヤーの setBaseAtk 層に乗せることで
   この挙動が自動的に得られる。 */
defineScript("神獣王バルバロス", {
  timing:["summon"],
  type:"monster", priority:1,
  condition(ctx){
    if(ctx.zone !== 'mz'){ ctx.reason = "フィールドで発動します"; return false; }
    return true;
  },
  /* 召喚時のリリース数から自動で判定する（doNormalSummon が記録している） */

      API.log("神獣王バルバロス：元々の攻撃力が1900になった");

    const foes = API.fieldCards({player:ctx.opponent, filter:x=>x.card});
    if(!foes.length){ API.log("相手フィールドにカードがありません"); return; }
    API.destroyAll('mz', ctx.opponent, "神獣王バルバロス");
    API.destroyAll('sz', ctx.opponent, "神獣王バルバロス");
    API.log("神獣王バルバロス：相手フィールドのカードを全て破壊");
  },
  afterResolve(){},
  /* ② 元々の攻撃力を書き換える層。効果が無効なら適用されない。 */
  continuous:{
    scope:'self', from:['mz'],
    apply(target, self){
      return self.barbarosNoTribute ? { setBaseAtk:1900 } : null;
    }
  },
  passive:{ onNormalSummon(ctx){ return ctx.zone==='mz'; } }
});

   「カードの効果によって手札から墓地へ捨てられた場合」に誘発する。

/* 暗黒界の誘発条件。自分の効果で捨てられたなら 'self'、相手なら 'opponent'、
   誘発しないなら null を返す。 */
function darkWorldDiscard(ctx){
  const info = ctx.card && ctx.card.discardInfo;
  if(!info || !info.byEffect) return null;
  return info.byPlayer === ctx.player ? 'self' : 'opponent';
}

      ctx.reason = "墓地に悪魔族モンスターがいません"; return false;

/* ---- カラクリ将軍 無零 ----
   ① S召喚に成功した時、デッキから「カラクリ」1体を特殊召喚する。
   ② 1ターンに1度、フィールドのモンスター1体の表示形式を変更する。 */
defineScript("カラクリ将軍 無零", {
  timing:["summon","free"],     // S召喚時の特殊召喚と、1ターンに1度の表示形式変更
  countLimit:1,
  type:"monster", priority:1,
  condition(ctx){
    if(ctx.zone !== 'mz'){ ctx.reason = "フィールドで発動します"; return false; }
    if(!API.fieldCards({zone:'mz', filter:x=>x.card}).length){
      ctx.reason = "フィールドにモンスターがいません"; return false;
    }
    return true;
  },
  selectTargets(ctx, done){
    API.selectCard("カラクリ将軍 無零：表示形式を変更するモンスター",
      API.fieldCards({zone:'mz', filter:x=>x.card}), t=>done([t]));
  },
  resolve(ctx){
    const t = ctx.selectedTargets[0];
    if(t) togglePosition(t, "カラクリ将軍 無零");
  },
  afterResolve(){},
  passive:{
    onSpecialSummon(ctx){
      const ev = ctx.event || {};
      return ctx.zone==='mz' && ev.kind==='synchro' && ev.card === ctx.card &&
             karakuriInDeck(ctx.player).length > 0;
    }
  }
});
function karakuriInDeck(p){
  return API.pileCards(p,'deck',
    x=>x.db.k==='m' && !x.db.ex && String(x.db.n||'').indexOf('カラクリ')>=0);
}

/* 表示形式を変更し、「カラクリ」なら変更イベントを通知する */
function togglePosition(t, reason){
  const r = resolveTarget(t);
  if(!r || !r.card) return;
  const wasKarakuri = String(dbOf(r.card).n||'').indexOf('カラクリ') >= 0;
  act({type:"TOGGLE_POS", player:r.p, zone:r.zone, index:r.index, reason});
  if(wasKarakuri) emitEvent("onKarakuriPositionChange", {player:r.p, card:r.card});
}

function karakuriInGrave(p){

/* ---- カラクリ解体新書 ----
   「カラクリ」の表示形式が変更される度にカラクリカウンターを1つ置く（最大2つ）。
   フィールドのこのカードを墓地へ送り、カウンターの数だけドローする。 */
defineScript("カラクリ解体新書", {
  fieldIgnition:true,          // 表側で場に残ったまま効果を発動できる
  type:"spell", priority:1,
  condition(ctx){
    if(ctx.zone !== 'sz'){ ctx.reason = "フィールドで発動します"; return false; }
    const n = API.countCounter({p:ctx.player, zone:'sz', index:ctx.index}, 'カラクリ');
    if(!n){ ctx.reason = "カラクリカウンターが乗っていません"; return false; }
    return true;
  },
  cost(ctx, done){
    ctx.bookCount = API.countCounter({p:ctx.player, zone:'sz', index:ctx.index}, 'カラクリ');
    API.sendToGrave({p:ctx.player, zone:'sz', index:ctx.index, card:ctx.card},
                    "カラクリ解体新書（コスト）");
    done(true);
  },
  resolve(ctx){
    if(ctx.bookCount) API.draw(ctx.player, ctx.bookCount, "カラクリ解体新書");
  },
  afterResolve(){},
  passive:{
    /* 「カラクリ」の表示形式が変わったらカウンターを置く（最大2つ） */
    onKarakuriPositionChange(ctx){
      if(ctx.zone !== 'sz') return false;
      const at = {p:ctx.player, zone:'sz', index:ctx.index};
      if(API.countCounter(at, 'カラクリ') >= 2) return false;
      API.addCounter(at, 'カラクリ', 1);
      return false;      // 自動処理なのでチェーンには乗せない
    }
  }
});

/* ---- 光の護封壁 ----
   1000の倍数のライフを払って発動。払った数値以下の攻撃力を持つ
   相手モンスターは攻撃できない。 */
defineScript("光の護封壁", {
  type:"trap", priority:2,
  condition(ctx){
    if(API.me(ctx).lp < 1000){ ctx.reason = "1000以上のライフが必要です"; return false; }
    return true;
  },
  cost(ctx, done){
    const P = API.me(ctx);
    const max = Math.floor(P.lp / 1000);
    const opts = [];
    for(let i=1; i<=max; i++) opts.push({p:ctx.player, zone:'declare', index:i,
      card:null, db:{n:`${i*1000} ライフを払う`}, amount:i*1000});
    API.selectCard("光の護封壁：支払うライフ", opts, pick=>{
      API.payCost(ctx.player, pick.amount, "光の護封壁");
      ctx.wallValue = pick.amount;
      done(true);
    });
  },
  resolve(ctx){
    const loc = API.fieldCards({zone:'sz', player:ctx.player, filter:x=>x.card===ctx.card})[0];
    if(loc) loc.card.wallValue = ctx.wallValue || 0;
    API.log(`光の護封壁：攻撃力${ctx.wallValue}以下の相手モンスターは攻撃できない`);
  },
  afterResolve(){},          // 永続罠なので場に残る
  continuous:{
    scope:'oppMonsters', from:['sz'],
    apply(){ return null; },
    cannotAttack(target, self){ return curATK(target) <= (self.wallValue || 0); }
  }
});

/* ---- 精神操作 ----
   相手モンスター1体のコントロールをエンドフェイズまで得る。
   得たモンスターは攻撃宣言できず、リリースできない。 */
defineScript("精神操作", {
  type:"spell", priority:1, targets:true,
  condition(ctx){
    if(!API.fieldCards({zone:'mz', player:ctx.opponent, filter:x=>x.card}).length){
      ctx.reason = "相手フィールドにモンスターがいません"; return false;
    }
    return true;
  },
  selectTargets(ctx, done){
    API.selectCard("精神操作：コントロールを得るモンスター",
      API.fieldCards({zone:'mz', player:ctx.opponent, filter:x=>x.card}), t=>done([t]));
  },
  resolve(ctx){
    const t = ctx.selectedTargets[0];
    if(!t){ API.log("対象が場にないため不発"); return; }
    API.changeControl(t, ctx.player, "精神操作");
    // 移動先のモンスターに制約を付ける
    const P = gameState.players[ctx.player];
    const moved = P.mz[P.mz.length-1];
    if(moved){ moved.cannotAttack = true; moved.cannotTribute = true; }
    API.registerReserveEffect(ctx.player, "精神操作：エンドにコントロールを返す",
      "endPhase", "コントロールを相手に戻す");
  }
});

/* ---- 闇の誘惑 ----
   デッキから2枚ドローし、その後手札の闇属性モンスター1体を除外する。
   手札に闇属性モンスターが無い場合、手札を全て墓地へ送る。 */
defineScript("闇の誘惑", {
  type:"spell", priority:1,
  condition(ctx){
    if((API.me(ctx).deck||[]).length < 2){ ctx.reason = "デッキが2枚未満です"; return false; }
    return true;
  },
  resolve(ctx){
    API.draw(ctx.player, 2, "闇の誘惑");
    const darks = API.pileCards(ctx.player,'hand',x=>x.db.k==='m' && x.db.at==='闇');
    if(!darks.length){
      const P = gameState.players[ctx.player];
      API.log("手札に闇属性モンスターがないため、手札を全て墓地へ送る");
      for(let i=(P.hand||[]).length-1; i>=0; i--)
        API.discard(ctx.player, i, "闇の誘惑（手札全て）");
      render(); return;
    }
    API.selectCard("闇の誘惑：除外する闇属性モンスター", darks, x=>{
      API.banish(x, "闇の誘惑"); render();
    });
  }
});

/* ---- 手札抹殺 ----
   手札があるプレイヤーは全て捨て、それぞれ捨てた枚数分ドローする。 */
defineScript("手札抹殺", {
  type:"spell", priority:1,
  condition(){ return true; },
  resolve(ctx){
    // 自身は既に発動して場にあるので、手札から除いて数える
    const counts = [0,1].map(p=>(gameState.players[p].hand||[]).length);
    [0,1].forEach(p=>{
      const P = gameState.players[p];
      for(let i=(P.hand||[]).length-1; i>=0; i--)
        API.discard(p, i, "手札抹殺");
    });
    [0,1].forEach(p=>{ if(counts[p]) API.draw(p, counts[p], "手札抹殺"); });
  }
});
