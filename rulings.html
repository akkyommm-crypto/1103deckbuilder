 ブリューナク』の効果で、自分フィールドのカードを手札へ戻す対象に選べるか。","answer":"選べる。旧テキストは『フィールド上のカード』を対象にしており相手フィールド限定ではなかった。対象が相手フィールドのカードのみに変更されたのは2016年12月17日のルール改訂以降。","verdict":"can","status":"historical_source_confirmed","confidence":"high","historicalScope":"1103","cards":["氷結界の龍 ブリューナク"],"tags":["ブリューナク","旧テキスト","自分のカード","対象","1103差分"],"steps":["1103用旧テキストでブリューナクの効果を発動する。","捨てた枚数に応じてフィールド上のカードを対象に選ぶ。","自分・相手のどちらのフィールドのカードでも適法な対象として扱う。","選んだカードを持ち主の手札へ戻す。"],"deckTip":"自分の永続魔法・召喚時カードを回収して再利用するなど、現代版ではできない動きが1103では可能。","simulator":{"ruleKey":"mr2_brionac_targets_both_players_field","expected":"1103_profile -> own_or_opponent_field_cards_are_valid_targets","engineGap":true,"implementationNote":"1103カードプロファイルのtargetFilterをFIELD_ANY_CONTROLLERにする。"},"sourceRefs":["SRC-BRIONAC-REVISION"],"reviewNote":"KONAMI公式改訂ページが対象を相手フィールドのみに変更したことを明示。"},{"id":"R1103-VENUS-002","layer":"card","title":"創造の代行者 ヴィーナスは球体がある限り同一ターンに何度でも発動できる","question":"『創造の代行者 ヴィーナス』の効果は、同じターンに複数回発動できるか。","answer":"できる。手札またはデッキに特殊召喚可能な『神聖なる球体』が存在し、500LPを払える限り、同じターン中に繰り返し発動できる。","verdict":"can","status":"official_current_consistent","confidence":"high","historicalScope":"1103","cards":["創造の代行者 ヴィーナス","神聖なる球体"],"tags":["創造の代行者 ヴィーナス","神聖なる球体","複数回発動","LPコスト","起動効果"],"steps":["500LPを払ってヴィーナスの効果を発動する。","手札・デッキから神聖なる球体1体を特殊召喚する。","まだ球体と500LP以上の支払い余地があれば、同じターンに再度ヴィーナスの効果を発動できる。"],"deckTip":"ヴィーナス1枚から球体を連続展開できるため、ガチガチガンテツやシンクロ素材を一気に用意できる。","simulator":{"ruleKey":"venus_repeatable_activated_effect_no_opt","expected":"while_sphere_available_and_lp>=500 -> venus_may_activate_again","engineGap":true,"implementationNote":"カード名・個体どちらのonce-per-turn制限も設定しない。空撃ち判定とLPコストだけ確認する。"},"sourceRefs":["SRC-VENUS-OFFICIAL","SRC-1103-MAJOR-RULINGS"],"reviewNote":"現行公式補足で複数回発動を明記。1103資料の空撃ち裁定とも矛盾しない。"},{"id":"R1103-GORZ-001","layer":"card","title":"相手がコントロールする手札・墓地のカードによるダメージでもゴーズは出せる","question":"自分フィールドにカードが存在しない時、相手がコントロールする手札または墓地のカードの効果でダメージを受けた。冥府の使者ゴーズを特殊召喚できるか。","answer":"特殊召喚できる。ダメージを与えたカードがフィールド上に存在する必要はなく、相手がコントロールするカードの効果によるダメージであれば条件を満たす。","verdict":"can","status":"historical_source_confirmed","confidence":"medium","historicalScope":"1103","cards":["冥府の使者ゴーズ"],"tags":["ゴーズ","効果ダメージ","手札","墓地","手札誘発"],"steps":["自分フィールドにカードがないことを確認する。","相手がコントロールするカードの効果でダメージを受ける。","ダメージを与えたカードの現在位置ではなく、その効果のコントローラーを参照してゴーズの誘発条件を判定する。"],"deckTip":"バーン系の手札・墓地発動効果に対してもゴーズを構えられる。","simulator":{"ruleKey":"gorz_damage_source_controller_snapshot","expected":"empty_field + damage_from_opponent_controlled_effect -> gorz_trigger","engineGap":true,"implementationNote":"ダメージイベントにeffectControllerを保存し、発生源カードの現在領域と切り離して判定する。"},"sourceRefs":["SRC-1103-MAJOR-RULINGS"],"reviewNote":"1103裁定まとめで確認。旧公式FAQ・保存版を取得できれば一次資料確認済みに昇格する。"},{"id":"R1103-GORZ-002","layer":"interaction","title":"魂を削る死霊の直接攻撃で手札がゴーズ1枚だけの場合","question":"魂を削る死霊の直接攻撃で戦闘ダメージを受け、手札が冥府の使者ゴーズ1枚だけだった。死霊の手札破壊とゴーズはどの順で処理するか。","answer":"死霊の強制効果がチェーン1、ゴーズの手札誘発がチェーン2となる。先にゴーズが特殊召喚されて手札が0枚になるため、死霊の手札を捨てる処理は行えない。その後、戦闘ダメージで出たゴーズならカイエントークン生成効果を別のチェーンで発動する。","verdict":"conditional","status":"historical_source_confirmed","confidence":"medium","historicalScope":"1103","cards":["冥府の使者ゴーズ","魂を削る死霊"],"tags":["ゴーズ","魂を削る死霊","戦闘ダメージ","同時誘発","チェーン順"],"steps":["戦闘ダメージを受ける。","死霊の強制誘発をチェーン1に置く。","手札のゴーズをチェーン2に置く。","チェーン2でゴーズを特殊召喚し、手札が0枚になる。","チェーン1の死霊は捨てる手札がなく処理できない。","別チェーンでゴーズのカイエントークン生成を処理する。"],"deckTip":"死霊の直撃に対してゴーズ1枚を残している場合、ゴーズ自身が先に手札から離れるためランダムハンデスを回避できる。","simulator":{"ruleKey":"gorz_reaper_damage_trigger_order","expected":"battle_damage -> reaper_CL1 + gorz_CL2 -> gorz_summon -> reaper_no_hand -> gorz_token_trigger","engineGap":true,"implementationNote":"ダメージ後の同時誘発を公開領域の強制効果→手札誘発の順序で構築し、ゴーズの追加効果は特殊召喚成功後の別イベントとして予約する。"},"sourceRefs":["SRC-1103-MAJOR-RULINGS"],"reviewNote":"1103裁定まとめで確認。旧公式FAQ・保存版を取得できれば一次資料確認済みに昇格する。"},{"id":"R1103-GORZ-003","layer":"interaction","title":"ダメージステップのゴーズに神の警告は使える","question":"戦闘ダメージを受けて冥府の使者ゴーズの自身を特殊召喚する効果が発動した。ダメージステップ中でも神の警告を発動できるか。","answer":"発動できる。神の警告はモンスターを特殊召喚する効果の発動を無効にするため、ダメージステップ中のゴーズの効果にも直接チェーンできる。","verdict":"can","status":"historical_source_confirmed","confidence":"medium","historicalScope":"1103","cards":["冥府の使者ゴーズ","神の警告"],"tags":["ゴーズ","神の警告","ダメージステップ","特殊召喚を含む効果","発動無効"],"steps":["戦闘ダメージ後にゴーズの手札誘発を発動する。","その効果に神の警告を直接チェーンする。","警告でゴーズの効果の発動を無効にして破壊する。"],"deckTip":"ゴーズ対策として警告はダメステでも機能する。奈落など召喚成功後に発動する罠とは扱いが違う。","simulator":{"ruleKey":"solemn_warning_vs_gorz_in_damage_step","expected":"gorz_effect_activation_in_damage_step -> solemn_warning_legal","engineGap":true,"implementationNote":"ダメージステップのカード発動可否を単純な罠可否で判定せず、「発動無効系」の例外カテゴリを持たせる。"},"sourceRefs":["SRC-1103-MAJOR-RULINGS"],"reviewNote":"1103裁定まとめで確認。旧公式FAQ・保存版を取得できれば一次資料確認済みに昇格する。"},{"id":"R1103-GORZ-004","layer":"interaction","title":"群雄割拠中はゴーズ本体を出せてもカイエントークンを出せない場合がある","question":"群雄割拠が適用中で、自分フィールドにカードがない状態から戦闘ダメージで冥府の使者ゴーズを特殊召喚した。カイエントークンも特殊召喚できるか。","answer":"ゴーズ本体の特殊召喚は可能だが、ゴーズが悪魔族でカイエントークンが天使族のため、群雄割拠適用中はトークンの特殊召喚処理を行えない。","verdict":"conditional","status":"historical_source_confirmed","confidence":"medium","historicalScope":"1103","cards":["冥府の使者ゴーズ","群雄割拠"],"tags":["ゴーズ","カイエントークン","群雄割拠","種族制限","特殊召喚制限"],"steps":["自分フィールドが空なのでゴーズを特殊召喚する。","ゴーズがフィールドに存在した状態でカイエントークン生成効果を処理する。","群雄割拠により悪魔族以外を出せないため天使族トークンは特殊召喚しない。"],"deckTip":"永続的な種族制限下では「ゴーズが出せる＝トークンまで出せる」ではない。","simulator":{"ruleKey":"gorz_token_under_rivalry","expected":"gorz_summoned_under_rivalry -> kai_en_summon_blocked_by_type_lock","engineGap":true,"implementationNote":"ゴーズ本体と追加トークンを別の特殊召喚イベントとして適法性判定する。"},"sourceRefs":["SRC-1103-MAJOR-RULINGS"],"reviewNote":"1103裁定まとめで確認。旧公式FAQ・保存版を取得できれば一次資料確認済みに昇格する。"},{"id":"R1103-GORZ-005","layer":"card","title":"ダメージステップ中の効果ダメージでもゴーズは誘発する","question":"ダメージステップ中に相手カードの効果によって効果ダメージを受けた。自分フィールドにカードがなければ冥府の使者ゴーズを特殊召喚できるか。","answer":"特殊召喚できる。ゴーズのダメージを受けた時の効果は、戦闘ダメージだけでなくダメージステップ中に発生した効果ダメージでも条件を満たす。","verdict":"can","status":"historical_source_confirmed","confidence":"medium","historicalScope":"1103","cards":["冥府の使者ゴーズ"],"tags":["ゴーズ","効果ダメージ","ダメージステップ","手札誘発"],"steps":["ダメージステップ中に相手効果でダメージを受ける。","自分フィールドにカードが存在しないことを確認する。","ダメージ発生後の誘発タイミングでゴーズを発動する。"], ict":"can","status":"historical_source_confirmed","confidence":"medium","historicalScope":"1103","cards":["魂を削る死霊","サイクロン"],"tags":["魂を削る死霊","サイクロン","装備魔法","対象","発動無効ではない"],"steps":["装備魔法が死霊を対象に発動する。","チェーンしてサイクロンで装備魔法を破壊する。","装備魔法の発動自体は無効になっていない。","チェーン処理後、対象に取られた死霊が表側なら自壊する。"],"deckTip":"サイクロンで対象カードを消しても「発動無効」ではない点を利用・注意する。","simulator":{"ruleKey":"spirit_reaper_target_source_destroyed_not_negated","expected":"targeting_card_destroyed_without_activation_negation -> reaper_self_destroy","engineGap":true,"implementationNote":"効果発生源の破壊と発動無効を別ステータスで管理し、targetイベントを維持する。"},"sourceRefs":["SRC-1103-MAJOR-RULINGS"],"reviewNote":"1103裁定まとめで確認。旧公式FAQ・保存版を取得できれば一次資料確認済みに昇格する。"},{"id":"R1103-REAPER-005","layer":"card","title":"魂を削る死霊の対象自壊はチェーンブロックを作らない","question":"魂を削る死霊が対象を取る効果の処理後に自身の効果で破壊される場合、その破壊効果にチェーンできるか。","answer":"できない。対象に取られたことによる自壊はチェーンブロックを作らず、対象に取った効果の処理が終わった直後に適用される。","verdict":"cannot","status":"historical_source_confirmed","confidence":"medium","historicalScope":"1103","cards":["魂を削る死霊"],"tags":["魂を削る死霊","自壊","チェーンブロックを作らない","即時適用"],"steps":["対象を取る効果を解決する。","死霊が表側表示でフィールドに残っているか確認する。","条件を満たしていればチェーンを作らず直ちに破壊する。"],"deckTip":"死霊の自壊にスターダスト等を直接チェーンするような処理はしない。","simulator":{"ruleKey":"spirit_reaper_self_destroy_non_chain","expected":"targeting_effect_resolved -> immediate_non_chain_self_destroy","engineGap":true,"implementationNote":"解決後state-based checkとして実装し、新規チェーンリンクを作らない。"},"sourceRefs":["SRC-1103-MAJOR-RULINGS"],"reviewNote":"1103裁定まとめで確認。旧公式FAQ・保存版を取得できれば一次資料確認済みに昇格する。"},{"id":"R1103-REAPER-006","layer":"interaction","title":"死霊を対象に手札へ戻す効果を使うと自壊しない","question":"魂を削る死霊を対象に手札へ戻す効果を発動し、その効果で死霊が手札へ戻った。自壊効果は適用されるか。","answer":"適用されない。対象を取った効果の解決後には死霊がフィールドに存在しないため、フィールド上での自壊処理を行えない。","verdict":"cannot","status":"historical_source_confirmed","confidence":"medium","historicalScope":"1103","cards":["魂を削る死霊"],"tags":["魂を削る死霊","バウンス","対象","自壊","領域移動"],"steps":["死霊を対象にバウンス効果を発動する。","効果解決で死霊を手札へ戻す。","解決後の自壊確認時にはフィールドに存在しないため破壊処理を行わない。"],"deckTip":"対象を取る除去でも、先に場を離すタイプなら の成功を後半処理の実行条件として保持し、対象の表示形式を解決時に再確認する。"},"sourceRefs":["SRC-1103-MAJOR-RULINGS"],"reviewNote":"1103裁定まとめで確認。旧公式FAQ・保存版を取得できれば一次資料確認済みに昇格する。"},{"id":"R1103-DARKWORLDLIGHTNING-002","layer":"card","title":"手札0枚では暗黒界の雷を発動できない","question":"自分の手札が0枚の時、フィールドにセットカードが存在していれば暗黒界の雷を発動できるか。","answer":"発動できない。効果処理で手札を1枚捨てることが必要なため、発動時点でその処理を行えないことが確定している状態では発動できない。","verdict":"cannot","status":"historical_source_confirmed","confidence":"medium","historicalScope":"1103","cards":["暗黒界の雷"],"tags":["暗黒界の雷","空打ち","手札0枚","発動条件"],"steps":["発動時点の自分の手札枚数を確認する。","0枚なら後半の「手札を1枚捨てる」処理を行えない。","発動自体を不許可にする。"],"deckTip":"暗黒界の捨てトリガー目的でも手札0枚から雷を先に撃つことはできない。","simulator":{"ruleKey":"dark_world_lightning_requires_hand_card","expected":"hand_count_zero -> activation_illegal","engineGap":true,"implementationNote":"発動可否チェックに手札1枚以上を要求する。"},"sourceRefs":["SRC-1103-MAJOR-RULINGS"],"reviewNote":"1103裁定まとめで確認。旧公式FAQ・保存版を取得できれば一次資料確認済みに昇格する。"},{"id":"R1103-MINDCRUSH-001","layer":"interaction","title":"サーチ解決後は通常召喚より先にマインドクラッシュを撃てる","question":"増援などのサーチ効果が解決した直後、ターンプレイヤーは加えたモンスターをすぐ通常召喚してマインドクラッシュを避けられるか。","answer":"避けられない。チェーン解決後にターンプレイヤーが優先権を持つが、通常召喚などスペルスピードを持たない行動を行う前には相手へクイックエフェクトの発動機会を渡す必要があり、相手はそこでマインドクラッシュを発動できる。","verdict":"cannot","status":"historical_source_confirmed","confidence":"medium","historicalScope":"1103","cards":["マインドクラッシュ","増援"],"tags":["マインドクラッシュ","サーチ","優先権","クイックエフェクト","通常召喚"],"steps":["サーチ効果のチェーン処理を完了する。","ターンプレイヤーが優先権を得る。","通常召喚などの行動へ移る前に相手へ応答機会を渡す。","相手はサーチしたカード名を宣言してマインドクラッシュを発動できる。"],"deckTip":"サーチしたカードを即座に召喚してマイクラから逃げる、という操作は1103でもできない。","simulator":{"ruleKey":"priority_after_chain_before_ignitionless_action","expected":"chain_end -> turn_player_priority -> pass_for_non_fast_action -> opponent_mind_crush_window","engineGap":true,"implementationNote":"チェーン終了直後から通常召喚へ直行せず、クイックエフェクト応答パスを必須化する。"},"sourceRefs":["SRC-1103-MAJOR-RULINGS"],"reviewNote":"1103裁定まとめで確認。旧公式FAQ・保存版を取得できれば一次資料確認済みに昇格する。"},{"id":"R1103-MINDCRUSH-002","layer":"card","title":"1103では禁止カード名の宣言は可能だが存在しないカード名は宣言できない","question":"マインドクラッシュで、現在の禁止カードや、その時点でOCGに存在しないカード名を宣言できるか。","answer":"当時の運用では、OCGに実在する禁止カードのカード名は宣言できる。一方、その時点でOCGに存在しない架空・未登場のカード名は宣言できない。","verdict":"conditional","status":"historical_source_confirmed","confidence":"medium","historicalScope":"1103","cards":["マインドクラッシュ"],"tags":["マインドクラッシュ","カード名宣言","禁止カード","1103当時","カードプール"],"steps":["宣言候補が1103時点でOCGに存在する正式なカード名か確認する。","実在カードなら禁止指定であっても宣言を許可する。","未登場・存在しない名称なら宣言を不許可にする。"],"deckTip":"1103専用ツールではカード名候補を2011年8月までのOCGカードプールに固定すると誤宣言を防げる。","simulator":{"ruleKey":"mind_crush_historical_name_legality","expected":"existing_ocg_name_even_banned -> legal; nonexistent_name -> illegal","engineGap":true,"implementationNote":"カード名入力を1103カードプールDBで検証し、禁止・制限状態とは独立して宣言可否を判定する。"},"sourceRefs":["SRC-1103-MAJOR-RULINGS"],"reviewNote":"1103裁定まとめで確認。旧公式FAQ・保存版を取得できれば一次資料確認済みに昇格する。"},{"id":"R1103-BOTTOMLESS-001","layer":"interaction","title":"レスキューラビット等で同時に複数体出た場合の奈落","question":"レスキューラビット、異次元からの帰還、真炎の爆発などで複数体のモンスターが同時に特殊召喚され、その中に攻撃力1500以上が複数いる。奈落の落とし穴を発動した場合どうなるか。","answer":"同時に特殊召喚された相手モンスターのうち、奈落の条件を満たす攻撃力1500以上のモンスターをまとめて破壊し除外する。","verdict":"conditional","status":"historical_source_confirmed","confidence":"medium","historicalScope":"1103","cards":["奈落の落とし穴","レスキューラビット"],"tags":["奈落の落とし穴","同時特殊召喚","レスキューラビット","複数破壊","除外"],"steps":["1つの効果処理で複数体を同時に特殊召喚する。","その召喚イベントに攻撃力1500以上が含まれるため奈落を発動する。","解決時、その同時召喚グループ内で条件を満たすモンスターを破壊して除外する。"],"deckTip":"ラビットから攻撃力1500以上の恐竜2体を並べた場合、奈落1枚で両方処理され得る。","simulator":{"ruleKey":"bottomless_simultaneous_summon_group","expected":"simultaneous_summon_group -> bottomless_affects_all_qualifying_members","engineGap":true,"implementationNote":"召喚イベントにsimultaneousGroupIdとメンバーを保持し、1体だけを対象のように処理しない。"},"sourceRefs":["SRC-1103-MAJOR-RULINGS"],"reviewNote":"1103裁定まとめで確認。旧公式FAQ・保存版を取得できれば一次資料確認済みに昇格する。"},{"id":"R1103-BOTTOMLESS-002","layer":"card","title":"裏側表示で特殊召喚されたモンスターには奈落を発動できない","question":"浅すぎた墓穴などでモンスターが裏側守備表示で特殊召喚された。奈落の落とし穴を発動できるか。","answer":"発動できない。裏側表示では奈落が参照する攻撃力1500以上であることを公開情報として確認できず、発動条件を満たさない。"," 札を確認して処理","question":"1103当時、「マインドクラッシュ」で宣言したカードが相手手札にあるかどうかはどのように確認するか。","answer":"当時資料では基本的に相手手札を確認して該当カードを捨てる。ただし公開領域にそのカードの採用可能最大枚数が既に見えているなど、手札に存在し得ないことが明白なら手札確認はできない。","verdict":"conditional","status":"historical_source_confirmed","confidence":"medium","historicalScope":"1103","cards":["マインドクラッシュ"],"tags":["マインドクラッシュ","手札確認","公開情報","旧運用"],"steps":["宣言カードが相手手札に存在し得るか公開情報から確認する。","存在可能なら1103運用として相手手札を確認する。","存在すれば全て捨てさせる。"],"deckTip":"現行の運用感覚で処理を省略せず、1103大会では採用ルールを揃える。","simulator":{"ruleKey":"mr2_mind_crush_hand_verification","expected":"declared_card_possible -> verify_hand -> discard_matches","engineGap":true,"implementationNote":"対人UIでは非公開情報の公開イベントとして扱い、AI内部情報を通常画面へ漏らさない。"},"sourceRefs":["SRC-1103-MAJOR-RULINGS"],"reviewNote":"1103当時に近いマスタールール2裁定を整理した歴史資料に基づく。可能なら旧公式FAQ保存版で追加照合する。"},{"id":"R1103-MINDCRUSH-004","layer":"card","title":"どちらか一方でも手札0枚ならマインドクラッシュは発動不可","question":"自分または相手のどちらかの手札が0枚の時、「マインドクラッシュ」を発動できるか。","answer":"できない。1103当時裁定では、発動時点で双方が1枚以上の手札を持っている必要がある。","verdict":"cannot","status":"historical_source_confirmed","confidence":"medium","historicalScope":"1103","cards":["マインドクラッシュ"],"tags":["マインドクラッシュ","発動条件","手札0枚"],"steps":["発動時に自分手札枚数を確認する。","相手手札枚数も確認する。","どちらかが0枚なら発動不可とする。"],"deckTip":"空撃ち防止だけでなく、自分のランダム捨て処理可能性も含め双方の手札が必要。","simulator":{"ruleKey":"mind_crush_requires_both_players_have_hand","expected":"self_hand>0 && opponent_hand>0 required_to_activate","engineGap":false,"implementationNote":"発動合法性チェックへ双方の手札枚数条件を追加する。"},"sourceRefs":["SRC-1103-MAJOR-RULINGS"],"reviewNote":"1103当時に近いマスタールール2裁定を整理した歴史資料に基づく。可能なら旧公式FAQ保存版で追加照合する。"},{"id":"R1103-MINDCRUSH-005","layer":"card","title":"解決時に自分の手札が0枚でも相手の宣言カードは捨てさせる","question":"「マインドクラッシュ」の発動後、チェーンの結果として解決時に自分の手札が0枚になった場合、相手手札の宣言カードを捨てさせられるか。","answer":"できる。相手に宣言カードがあれば捨てさせる。なかった場合、自分の手札が0枚なのでランダムに捨てる処理は行えない。","verdict":"conditional","status":"historical_source_confirmed","confidence":"medium","historicalScope":"1103","cards":["マインドクラッシュ"],"tags":["マインドクラッシュ","解決時","自分手札0枚","部分処理"],"steps":["発動時は双 。 この時《天空騎士パーシアス》が戦闘ダメージを与えた場合、効果は無効化されますか？","answer":"同時に発動した効果でチェーンを積む場合、その順番はルールで決められています。 ｢『自分の強制効果』『相手の強制効果』『自分の任意効果』『相手の任意効果｣の順番で積む』」「同類ならば、プレイヤーが順を決める」です。ここで言う自分とはターンプレイヤーの事を指します。 つまり、順番は必ず「チェーン１：《天空騎士パーシアス》」「チェーン２：《門前払い》」となります。 逆順処理により、《天空騎士パーシアス》の効果は《天空騎士パーシアス》が手札に戻っての発動になり、《スキルドレイン》に無効化されません。","verdict":"conditional","status":"historical_wiki_reviewed","confidence":"low","historicalScope":"1103","cards":["スキルドレイン"],"tags":["Wiki旧FAQ","1103","意味レビュー済み","公式一次資料未確認"],"steps":[],"deckTip":"","sourceRefs":["SRC-WIKI-DBD8C5159F8A"],"reviewNote":"残り部分一致204件の意味レビューで既存裁定とは別件と判定。候補ID WIKI-DBD8C5159F8A。旧Wiki記録として追加し、公式一次資料の確認は継続する。"},{"id":"R1103-WIKI-EE8304FE968A","layer":"wiki_reviewed","title":"《スキルドレイン》《門前払い》が両方とも相手の場で発動しています。 この時《首領・ザルーグ》が戦闘ダメージを与えた場合、効果は無効化されますか？","question":"《スキルドレイン》《門前払い》が両方とも相手の場で発動しています。 この時《首領・ザルーグ》が戦闘ダメージを与えた場合、効果は無効化されますか？","answer":"《門前払い》は強制効果、《首領・ザルーグ》は任意効果です。 つまり必ず「チェーン１：《門前払い》」「チェーン２：《首領・ザルーグ》」となります。 逆順処理で《首領・ザルーグ》はフィールド上で効果を発動するので《スキルドレイン》に無効化されます。","verdict":"conditional","status":"historical_wiki_reviewed","confidence":"low","historicalScope":"1103","cards":["スキルドレイン"],"tags":["Wiki旧FAQ","1103","意味レビュー済み","公式一次資料未確認"],"steps":[],"deckTip":"","sourceRefs":["SRC-WIKI-EE8304FE968A"],"reviewNote":"残り部分一致204件の意味レビューで既存裁定とは別件と判定。候補ID WIKI-EE8304FE968A。旧Wiki記録として追加し、公式一次資料の確認は継続する。"},{"id":"R1103-WIKI-DAC84AAEDFDA","layer":"wiki_reviewed","title":"《スキルドレイン》発動中に《ならず者傭兵部隊》の効果を発動しました。それにチェーンして《リミット・リバース》を発動し、効果を発動した《なら…","question":"《スキルドレイン》発動中に《ならず者傭兵部隊》の効果を発動しました。それにチェーンして《リミット・リバース》を発動し、効果を発動した《ならず者傭兵部隊》を特殊召喚した場合、《ならず者傭兵部隊》の効果は無効になりますか？","answer":"いいえ、効果の発動後に一度フィールドから離れているため無効になりません。(09/05/12)","verdict":"cannot","status":"historical_wiki_reviewed","confidence":"low","historicalScope":"1103","cards":["スキルドレイン"],"tags":["Wiki旧FAQ","1103","意味レビュー済み","公式一次資料未確認"],"steps":[],"deckTip":"","sourceRefs":["SRC-WIKI-DAC84AAEDFDA"],"reviewNote":"残り部分一致204件の意味レビューで既存裁定とは別件と判定。候補ID WIKI-DAC84AAEDFDA。旧Wiki記録として追加し、公式一次資料の確認は継続する。"},{"id":"R1103-WIK "1103","意味レビュー済み","公式一次資料未確認"],"steps":[],"deckTip":"","sourceRefs":["SRC-WIKI-3FEA98873BA9"],"reviewNote":"残り部分一致204件の意味レビューで既存裁定とは別件と判定。候補ID WIKI-3FEA98873BA9。旧Wiki記録として追加し、公式一次資料の確認は継続する。"},{"id":"R1103-WIKI-A8493057B446","layer":"wiki_reviewed","title":"自分フィールド上に《アンデット・スカル・デーモン》が表側表示で存在します。 《リミット・リバース》を発動し、墓地の《魂を削る死霊》を特殊召…","question":"自分フィールド上に《アンデット・スカル・デーモン》が表側表示で存在します。 《リミット・リバース》を発動し、墓地の《魂を削る死霊》を特殊召喚しました。 《魂を削る死霊》は破壊されますか？","answer":"いいえ、破壊されません。(11/03/16)","verdict":"cannot","status":"historical_wiki_reviewed","confidence":"low","historicalScope":"1103","cards":["魂を削る死霊"],"tags":["Wiki旧FAQ","1103","意味レビュー済み","公式一次資料未確認"],"steps":[],"deckTip":"","sourceRefs":["SRC-WIKI-A8493057B446"],"reviewNote":"残り部分一致204件の意味レビューで既存裁定とは別件と判定。候補ID WIKI-A8493057B446。旧Wiki記録として追加し、公式一次資料の確認は継続する。"}]};</script>
<script src="wiki-rulings.js"></script>
<script>
const LABELS={
 verdict:{can:'できる',cannot:'できない',conditional:'条件付き',investigating:'調査中'},
 confidence:{high:'高',medium:'中',low:'要確認'},
 status:{historical_source_confirmed:'当時資料あり',secondary_confirmed:'二次確認',needs_primary_source:'一次資料待ち',researching:'調査中',historical_disputed:'当時裁定不確定',official_current_consistent:'現行公式と一致',historical_wiki_reviewed:'旧Wiki確認・意味レビュー済み',historical_wiki_snapshot:'旧Wiki記録',historical_wiki_investigating:'旧Wiki上で調整中'}
};
const state={data:null,query:'',mode:'all',selected:null,favorites:new Set(),recent:[],cards:[],focus:false,suggestIndex:-1};
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const norm=v=>String(v??'').normalize('NFKC').toLowerCase().replace(/\s+/g,' ').trim();

function loadLocal(){
  try{
    state.favorites=new Set(JSON.parse(localStorage.getItem('r1103:favs')||'[]'));
    state.recent=JSON.parse(localStorage.getItem('r1103:recent')||'[]').slice(0,30);
  }catch(_){state.favorites=new Set();state.recent=[]}
}
function saveFavs(){try{localStorage.setItem('r1103:favs',JSON.stringify([...state.favorites]))}catch(_){}}
function saveRecent(){try{localStorage.setItem('r1103:recent',JSON.stringify(state.recent.slice(0,30)))}catch(_){}}
function makeIndex(r){return norm([r.title,r.question,r.answer,...(r.cards||[]),...(r.tags||[])].join(' '))}
function verdictBadge(r){return `<span class="verdict v-${esc(r.verdict)}">${esc(LABELS.verdict[r.verdict]||r.verdict)}</span>`}
function layerBadge(r){if(r.layer==='historical_wiki')return '<span class="source-badge wiki">旧Wiki</span>';if(r.layer==='wiki_reviewed')return '<span class="source-badge reviewed">旧Wiki・レビュー済</span>';return '<span class="source-badge curated">厳選</span>'}
function highlight(text){
  const raw=String(text??''), q=norm(state.query);
  if(!q) return esc(raw);
  const tokens=q.split(' ').filter(Boolean).sort((a,b)=>b.length-a.length);
  if(!tokens.length) return esc(raw);
  let safe=esc(raw);
  for(const t of tokens){
    if(t.length<2) continue;
    const needle=t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
    safe=safe.replace(new RegExp(`(${needle})`,'ig'),'<mark>$1</mark>');
  }
  return safe;
}
function match(r){
  const tokens=norm(state.query).split(' ').filter(Boolean);
  if(state.mode==='fav'&&!state.favorites.has(r.id)) return false;
  if(state.mode==='recent'&&!state.recent.includes(r.id)) return false;
  if(state.mode==='all'&&!tokens.length&&r.layer==='historical_wiki') return false;
  return tokens.every(t=>r.__index.includes(t));
}
function score(r){
  const q=norm(state.query); if(!q) return 0;
  let s=r.layer==='historical_wiki'?0:r.layer==='wiki_reviewed'?35:70;
  if((r.cards||[]).some(c=>norm(c)===q)) s+=180;
  else if((r.cards||[]).some(c=>norm(c).includes(q))) s+=100;
  if(norm(r.title).includes(q)) s+=90;
  if((r.tags||[]).some(t=>norm(t).includes(q))) s+=45;
  if(norm(r.question).includes(q)) s+=35;
  if(norm(r.answer).includes(q)) s+=25;
  return s;
}
function modeRows(){
  let rows=state.data.rulings.filter(match);
  if(state.mode==='recent'&&!state.query){
    const pos=new Map(state.recent.map((id,i)=>[id,i]));
    rows.sort((a,b)=>(pos.get(a.id)??999)-(pos.get(b.id)??999));
  }else if(state.query){
    rows=[...rows].sort((a,b)=>score(b)-score(a));
  }
  return rows;
}
function renderModes(){
  document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===state.mode));
  $('allCount').textContent=state.data?state.data.rulings.length:'';
  $('favCount').textContent=state.favorites.size||'';
  $('recentCount').textContent=state.recent.length||'';
  $('listTitle').textContent=state.mode==='fav'?'保存した裁定':state.mode==='recent'?'最近見た裁定':'裁定一覧';
}
function setMode(mode){
  state.mode=mode; renderModes(); renderQuick(); renderList(); hideSuggest();
  if(innerWidth<=900) showListMobile();
  if(mode==='all'&&innerWidth<=900) setTimeout(()=>$('searchInput').focus(),40);
}
function renderQuick(){
  if(!state.data){return}
  let ids=[];
  let title='';
  if(state.mode==='all'){
    ids=[...state.favorites,...state.recent].filter((x,i,a)=>a.indexOf(x)===i).slice(0,10);
    title='すぐ開く';
  }else if(state.mode==='fav'){
    ids=[...state.favorites].slice(0,12); title='保存した裁定';
  }else{
    ids=state.recent.slice(0,12); title='最近見た裁定';
  }
  const items=ids.map(id=>state.data.rulings.find(r=>r.id===id)).filter(Boolean);
  if(!items.length){$('quick').classList.remove('visible');$('quick').innerHTML='';return}
  $('quick').classList.add('visible');
  $('quick').innerHTML=`<div class="quick-head"><b>${title}</b><span>${items.length}件</span></div><div class="quick-items">${
    items.map(r=>`<button class="quick-btn" data-id="${esc(r.id)}"><b>${state.favorites.has(r.id)?'★ ':''}${esc(r.title)}</b><span>${esc((r.cards||[]).join(' / ')||'共通ルール')}</span></button>`).join('')
  }</div>`;
  $('quick').querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>selectRuling(b.dataset.id,true));
}
function renderList(){
  const rows=modeRows();
  const maxRender=state.query?300:220;
  const shown=rows.slice(0,maxRender);
  const defaultReviewed=state.mode==='all'&&!norm(state.query);
  $('resultSummary').textContent=rows.length>maxRender?`${rows.length}件（上位${maxRender}件表示）`:`${rows.length}件${defaultReviewed?'・レビュー済み':''}`;
  if(!rows.length){
    const msg=state.mode==='fav'?'保存した裁定はありません。':state.mode==='recent'?'まだ閲覧履歴がありません。':'別のカード名や状況で検索してください。';
    $('resultList').innerHTML=`<div class="empty"><div><b>該当する裁定がありません</b>${msg}</div></div>`;
    return;
  }
  $('resultList').innerHTML=shown.map(r=>`
    <button class="result ${r.id===state.selected?'active':''} ${r.layer==='historical_wiki'?'is-wiki':r.layer==='wiki_reviewed'?'is-reviewed':''}" data-id="${esc(r.id)}">
      <div class="result-top"><h3>${state.favorites.has(r.id)?'<span class="favstar">★</span> ':''}${highlight(r.title)}</h3><div style="display:flex;gap:5px;align-items:center">${layerBadge(r)}${verdictBadge(r)}</div></div>
      <p class="result-q">${highlight(r.question)}</p>
      <p class="result-a">→ ${highlight(r.answer)}</p>
      <div class="cardline">${esc((r.cards||[]).join(' / ')||'共通ルール')}</div>
    </button>`).join('');
  $('resultList').querySelectorAll('.result').forEach(b=>b.onclick=()=>selectRuling(b.dataset.id,true));
}
function sourceById(id){return state.data.sources.find(s=>s.id===id)}
function relatedFor(r){
  const cards=new Set((r.cards||[]).map(norm)), tags=new Set((r.tags||[]).map(norm));
  return state.data.rulings
    .filter(x=>x.id!==r.id&&((x.cards||[]).some(c=>cards.has(norm(c)))||(x.tags||[]).some(t=>tags.has(norm(t)))))
    .map(x=>({r:x,s:(x.cards||[]).filter(c=>cards.has(norm(c))).length*5+(x.tags||[]).filter(t=>tags.has(norm(t))).length}))
    .sort((a,b)=>b.s-a.s).slice(0,7).map(x=>x.r);
}
function remember(id){
  state.recent=[id,...state.recent.filter(x=>x!==id)].slice(0,30);
  saveRecent(); renderModes();
}
function showListMobile(){
  document.body.classList.remove('detail-open');
  $('detailPanel').classList.remove('mobile-open');
  $('resultsPanel').classList.remove('mobile-hidden');
}
function selectRuling(id,updateHash){
  const r=state.data.rulings.find(x=>x.id===id); if(!r)return;
  state.selected=id; remember(id);
  if(updateHash&&location.hash!==`#${encodeURIComponent(id)}`)history.pushState({ruling:id},'',`#${encodeURIComponent(id)}`);
  renderList(); renderQuick(); renderDetail(r);
  $('detailPanel').classList.add('mobile-open');$('resultsPanel').classList.add('mobile-hidden');document.body.classList.add('detail-open');
  if(innerWidth<=900)scrollTo({top:0,behavior:'smooth'});
}
function setQuery(q){
  $('searchInput').value=q;state.query=q;state.mode='all';renderModes();renderQuick();renderList();hideSuggest();
  if(innerWidth<=900){showListMobile();scrollTo({top:0,behavior:'smooth'})}
}
function toggleFavorite(id){
  state.favorites.has(id)?state.favorites.delete(id):state.favorites.add(id);
  saveFavs();renderModes();renderQuick();renderList();
  const r=state.data.rulings.find(x=>x.id===id);if(r)renderDetail(r);
}
async function copyRuling(r,button){
  const txt=`【${r.title}】\nQ：${r.question}\nA：${r.answer}`;
  try{await navigator.clipboard.writeText(txt);button.textContent='コピー済み';setTimeout(()=>button.textContent='裁定をコピー',1000)}
  catch(_){button.textContent='コピー不可'}
}
function renderDetail(r){
  const sources=(r.sourceRefs||[]).map(sourceById).filter(Boolean),related=relatedFor(r);
  const warn=r.verdict==='investigating'||r.confidence==='low'||r.status==='needs_primary_source'||r.status==='historical_disputed'||r.status==='historical_wiki_investigating';
  $('detailPanel').classList.toggle('focus',state.focus);
  $('detailPanel').innerHTML=`
  <div class="detail-actions">
    <button class="action" id="backButton">← 一覧</button>
    <div class="action-group">
      <button class="action ${state.favorites.has(r.id)?'faved':''}" id="favButton">${state.favorites.has(r.id)?'★ 保存済み':'☆ 保存'}</button>
      <button class="action" id="copyRuling">裁定をコピー</button>
      <button class="action" id="focusButton">${state.focus?'標準表示':'大きく表示'}</button>
    </div>
  </div>
  <div class="detail-inner">
    <div class="eyebrow">${esc(r.id)}</div>
    <h2>${esc(r.title)}</h2>
    <div class="detail-meta">
      ${layerBadge(r)}
      ${verdictBadge(r)}
      ${(r.cards||[]).slice(0,3).map(c=>`<span class="meta-chip">${esc(c)}</span>`).join('')}
    </div>
    ${warn?`<div class="alert">⚠ この項目は調査中または根拠確認が必要な裁定です。下部の「根拠・確認状況」も確認してください。</div>`:''}
    <div class="answer-box"><span class="label">1103 RULING</span><p>${esc(r.answer)}</p></div>
    <div class="question-box"><span class="label">QUESTION</span><p>${esc(r.question)}</p></div>
    <div class="secondary">
      ${(r.cards||[]).length?`<div class="detail-cards">${r.cards.map(c=>`<button class="card-chip" data-card="${esc(c)}">${esc(c)}の裁定を検索</button>`).join('')}</div>`:''}
      ${r.steps?.length?`<section class="section"><h3>処理順</h3><ol class="steps">${r.steps.map(x=>`<li>${esc(x)}</li>`).join('')}</ol></section>`:''}
      ${r.deckTip?`<section class="section"><h3>実戦でのポイント</h3><div class="tip">${esc(r.deckTip)}</div></section>`:''}
      ${related.length?`<section class="section"><h3>関連裁定</h3><div class="related">${related.map(x=>`<button class="related-btn" data-related="${esc(x.id)}"><b>${esc(x.title)}</b><span>${esc(x.question)}</span></button>`).join('')}</div></section>`:''}
      ${(r.tags||[]).length?`<section class="section"><span class="section-label">TAGS</span><div class="detail-cards">${r.tags.map(t=>`<button class="tag-chip" data-tag="${esc(t)}">${esc(t)}</button>`).join('')}</div></section>`:''}
      <details class="proof"><summary>根拠・確認状況</summary><div class="proof-body">
        <div class="review">確認状況：${esc(LABELS.status[r.status]||r.status)} / 信頼度：${esc(LABELS.confidence[r.confidence]||r.confidence)}</div>
        ${sources.map(s=>`<a href="${esc(s.url)}" target="_blank" rel="noreferrer">${esc(s.title)} <small>(${esc(s.date)})</small></a>`).join('')}${r.sourceUrl?`<a href="${esc(r.sourceUrl)}" target="_blank" rel="noreferrer">遊戯王Wiki 旧バックアップ <small>(${esc(r.backupDate||'日付不明')})</small></a>`:''}${!sources.length&&!r.sourceUrl?'<div class="review">出典未登録</div>':''}
        ${r.reviewNote?`<div class="review">${esc(r.reviewNote)}</div>`:''}
      </div></details>
    </div>
  </div>`;
  $('backButton').onclick=showListMobile;
  $('favButton').onclick=()=>toggleFavorite(r.id);
  $('copyRuling').onclick=e=>copyRuling(r,e.currentTarget);
  $('focusButton').onclick=()=>{state.focus=!state.focus;renderDetail(r)};
  $('detailPanel').querySelectorAll('[data-card]').forEach(b=>b.onclick=()=>setQuery(b.dataset.card));
  $('detailPanel').querySelectorAll('[data-tag]').forEach(b=>b.onclick=()=>setQuery(b.dataset.tag));
  $('detailPanel').querySelectorAll('[data-related]').forEach(b=>b.onclick=()=>selectRuling(b.dataset.related,true));
}
function cardSuggestions(q){
  const nq=norm(q); if(!nq||nq.length<1)return [];
  return state.cards
    .map(x=>({name:x.name,count:x.count,norm:norm(x.name),exact:norm(x.name)===nq}))
    .filter(x=>x.norm.includes(nq))
    .sort((a,b)=>(b.exact-a.exact)||(a.norm.indexOf(nq)-b.norm.indexOf(nq))||(b.count-a.count)||a.name.localeCompare(b.name,'ja'))
    .slice(0,8);
}
function renderSuggest(){
  if(!state.data)return;
  const q=$('searchInput').value.trim(), items=cardSuggestions(q);
  state.suggestIndex=-1;
  if(!q||!items.length){hideSuggest();return}
  $('suggest').innerHTML=`<div class="suggest-title">カード名候補</div>${items.map((x,i)=>`<button class="suggest-btn" data-i="${i}" data-card="${esc(x.name)}"><b>${esc(x.name)}</b><span>${x.count}件</span></button>`).join('')}`;
  $('suggest').classList.add('visible');
  $('suggest').querySelectorAll('[data-card]').forEach(b=>b.onclick=()=>setQuery(b.dataset.card));
}
function hideSuggest(){$('suggest').classList.remove('visible');state.suggestIndex=-1}
function moveSuggest(dir){
  const bs=[...$('suggest').querySelectorAll('.suggest-btn')]; if(!bs.length)return;
  state.suggestIndex=(state.suggestIndex+dir+bs.length)%bs.length;
  bs.forEach((b,i)=>b.classList.toggle('active',i===state.suggestIndex));bs[state.suggestIndex].scrollIntoView({block:'nearest'});
}
function chooseSuggest(){
  const bs=[...$('suggest').querySelectorAll('.suggest-btn')];
  if(state.suggestIndex>=0&&bs[state.suggestIndex])setQuery(bs[state.suggestIndex].dataset.card);
}
function applyData(data){
  if(!data?.meta||!Array.isArray(data.rulings))throw new Error('裁定データの形式が正しくありません。');
  const extra=window.__WIKI_RULINGS_DATA__;
  if(extra&&Array.isArray(extra.rulings)){data={...data,rulings:[...data.rulings,...extra.rulings]};}
  data.rulings.forEach(r=>r.__index=makeIndex(r));state.data=data;
  const counts=new Map();
  data.rulings.forEach(r=>(r.cards||[]).forEach(c=>counts.set(c,(counts.get(c)||0)+1)));
  state.cards=[...counts].map(([name,count])=>({name,count}));
  $('environment').textContent='2011.03 LIMIT · ～2011.08';
  const reviewedCount=data.rulings.filter(r=>r.layer!=='historical_wiki').length, wikiCount=data.rulings.length-reviewedCount;
  $('footerVersion').textContent=`${data.meta.title} v${data.meta.version} · UI 5.4 · ${reviewedCount} reviewed + ${wikiCount} historical FAQ`;

  // デッキビルダー連携: rulings.html?card=カード名
  const params=new URLSearchParams(location.search);
  const linkedCard=(params.get('card')||'').trim();
  if(linkedCard){
    $('searchInput').value=linkedCard;
    state.query=linkedCard;
    state.mode='all';
  }

  renderModes();renderQuick();renderList();

  const hash=decodeURIComponent(location.hash.slice(1));
  if(hash&&data.rulings.some(r=>r.id===hash)){
    selectRuling(hash,false);
  }else if(linkedCard){
    // スマホではそのカードの裁定一覧を見せる。
    // PCでは先頭裁定を右ペインに表示しつつ一覧も残す。
    if(innerWidth>900){
      const rows=modeRows();
      if(rows[0]) selectRuling(rows[0].id,false);
    }else{
      showListMobile();
    }
  }else if(innerWidth>900&&data.rulings[0]){
    selectRuling(data.rulings[0].id,false);
  }else{
    showListMobile();
  }
}
async function boot(){
  loadLocal();
  $('searchInput').addEventListener('input',e=>{state.query=e.target.value;state.mode='all';renderModes();renderQuick();renderList();renderSuggest()});
  $('searchInput').addEventListener('keydown',e=>{
    if(e.key==='ArrowDown'){e.preventDefault();moveSuggest(1)}
    else if(e.key==='ArrowUp'){e.preventDefault();moveSuggest(-1)}
    else if(e.key==='Enter'&&$('suggest').classList.contains('visible')&&state.suggestIndex>=0){e.preventDefault();chooseSuggest()}
    else if(e.key==='Escape'){hideSuggest()}
  });
  $('clearSearch').onclick=()=>{$('searchInput').value='';state.query='';hideSuggest();renderList();$('searchInput').focus()};
  document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>setMode(b.dataset.mode)));
  document.addEventListener('click',e=>{if(!e.target.closest('.search-wrap'))hideSuggest()});
  addEventListener('keydown',e=>{if(e.key==='/'&&!/input|textarea/i.test(document.activeElement.tagName)){e.preventDefault();$('searchInput').focus()}if(e.key==='Escape'&&innerWidth<=900)showListMobile()});
  addEventListener('popstate',()=>{const id=decodeURIComponent(location.hash.slice(1));if(id&&state.data?.rulings.some(r=>r.id===id))selectRuling(id,false);else showListMobile()});
  try{applyData(window.__RULINGS_DATA__)}
  catch(err){$('detailPanel').innerHTML=`<div class="empty"><div><b>裁定データを読み込めませんでした</b>${esc(err.message)}</div></div>`}
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();
</script>
</body>
