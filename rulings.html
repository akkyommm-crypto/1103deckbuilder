<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>1103 裁定DB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;700;800&family=Cinzel:wght@700;900&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --bg:#120d08;--bg2:#161007;--surface:#1e1710;--surface2:#292015;--surface3:#352a1b;
  --line:rgba(201,162,75,.22);--lineHi:rgba(201,162,75,.48);
  --ink:#f0e7d2;--dim:#a2937c;--gold:#c9a24b;--goldHi:#e4c06a;--goldInk:#14100a;
  --paper:#e9e4d6;--paperInk:#211b13;
  --danger:#ef6b5e;--ok:#74c89a;--warn:#e3a94f;
  --radius:2px;--shadow:0 18px 50px rgba(0,0,0,.27);
  --bottomNav:0px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink)}
body{
  font-family:"Noto Sans JP",system-ui,sans-serif;
  background:
   radial-gradient(140% 80% at 50% -10%,rgba(201,162,75,.18),transparent 72%),
   radial-gradient(140% 80% at 50% 110%,rgba(201,162,75,.12),transparent 72%),
   linear-gradient(180deg,var(--bg),var(--bg2));
}
button,input{font:inherit}
button{color:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--goldHi);outline-offset:2px}
.app{max-width:1460px;margin:auto;padding:14px 14px calc(18px + var(--bottomNav))}
.app-header{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;padding:10px 2px 13px}
.brand-title{font-family:"Shippori Mincho",serif;font-size:25px;font-weight:800;letter-spacing:.05em;margin:0}
.brand-sub{margin:4px 0 0;color:var(--dim);font-size:10px}
.env{font-family:"Cinzel",serif;color:var(--gold);font-size:10px;letter-spacing:.08em;white-space:nowrap}
.search-shell{position:sticky;top:0;z-index:30;padding:8px 0 10px;background:linear-gradient(180deg,rgba(18,13,8,.98) 70%,rgba(18,13,8,.75),transparent)}
.search-wrap{position:relative}
.search{
  height:48px;border:1px solid var(--lineHi);background:rgba(20,15,10,.96);
  display:grid;grid-template-columns:38px 1fr 42px;align-items:center;box-shadow:0 8px 25px rgba(0,0,0,.22)
}
.search-ic{text-align:center;color:var(--gold);font-size:20px}
.search input{min-width:0;height:100%;border:0;background:transparent;color:var(--ink);font-size:15px;outline:none}
.search input::placeholder{color:#8e806c}
.clear{height:100%;border:0;background:transparent;color:var(--dim);font-size:20px;cursor:pointer}
.suggest{
  display:none;position:absolute;top:52px;left:0;right:0;z-index:50;background:#16100b;border:1px solid var(--lineHi);
  box-shadow:var(--shadow);max-height:330px;overflow:auto
}
.suggest.visible{display:block}
.suggest-title{padding:8px 11px 6px;color:var(--dim);font-size:9px;letter-spacing:.08em}
.suggest-btn{display:flex;width:100%;align-items:center;justify-content:space-between;gap:12px;text-align:left;padding:11px 12px;border:0;border-top:1px solid rgba(201,162,75,.1);background:transparent;cursor:pointer}
.suggest-btn:hover,.suggest-btn.active{background:var(--surface2)}
.suggest-btn b{font-family:"Shippori Mincho",serif;font-size:13px}.suggest-btn span{font-size:9px;color:var(--dim)}
.mode-tabs{display:flex;gap:7px;margin:0 0 10px}
.mode{
  border:1px solid var(--line);background:var(--surface);color:var(--dim);min-height:38px;padding:0 13px;cursor:pointer;
  font-size:11px;font-weight:700
}
.mode.active{background:var(--gold);border-color:var(--gold);color:var(--goldInk)}
.mode .count{font-family:"Cinzel",serif;margin-left:5px;font-size:9px}
.quick{display:none;margin:0 0 10px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:9px 0}
.quick.visible{display:block}
.quick-head{display:flex;justify-content:space-between;align-items:center;padding:0 2px 7px}
.quick-head b{font-size:10px;color:var(--goldHi)}.quick-head span{font-size:9px;color:var(--dim)}
.quick-items{display:flex;gap:6px;overflow:auto;scrollbar-width:none}.quick-items::-webkit-scrollbar{display:none}
.quick-btn{flex:0 0 auto;max-width:260px;text-align:left;background:var(--surface);border:1px solid var(--line);padding:8px 10px;cursor:pointer}
.quick-btn b,.quick-btn span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.quick-btn b{font-size:10px}.quick-btn span{font-size:8px;color:var(--dim);margin-top:2px}
.workspace{display:grid;grid-template-columns:minmax(330px,.82fr) minmax(560px,1.48fr);gap:10px;align-items:start}
.panel{border:1px solid var(--line);background:rgba(25,19,13,.92);box-shadow:var(--shadow)}
.panel-head{height:42px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;border-bottom:1px solid var(--line)}
.panel-head b{font-family:"Shippori Mincho",serif;font-size:13px}.panel-head span{font-size:9px;color:var(--dim)}
.result-list{max-height:calc(100vh - 200px);min-height:480px;overflow:auto}
.result{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid rgba(201,162,75,.1);background:transparent;padding:12px 13px;cursor:pointer;position:relative}
.result:hover{background:rgba(201,162,75,.06)}.result.active{background:var(--surface2)}.result.active:before{content:"";position:absolute;inset:0 auto 0 0;width:3px;background:var(--goldHi)}
.result-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.result h3{margin:0;font-family:"Shippori Mincho",serif;font-size:14px;line-height:1.4}
.result-q{margin:5px 0 0;color:var(--dim);font-size:10px;line-height:1.55;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.result-a{margin:6px 0 0;color:var(--ink);font-size:11px;font-weight:700;line-height:1.6;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cardline{margin-top:7px;color:var(--gold);font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.verdict{flex:0 0 auto;border:1px solid var(--lineHi);padding:3px 6px;font-size:8px;font-weight:900;white-space:nowrap}
.v-can{color:var(--ok)}.v-cannot{color:var(--danger)}.v-conditional{color:var(--warn)}.v-investigating{color:#9fb4d9}
.favstar{color:var(--goldHi)}
mark{background:rgba(228,192,106,.22);color:inherit;padding:0 1px}
.empty{min-height:300px;display:grid;place-items:center;text-align:center;color:var(--dim);padding:30px;font-size:11px;line-height:1.8}
.empty b{display:block;color:var(--ink);font-family:"Shippori Mincho",serif;font-size:15px;margin-bottom:5px}
.detail{min-height:570px}
.detail-actions{display:flex;align-items:center;justify-content:space-between;gap:8px;height:46px;padding:0 10px;border-bottom:1px solid var(--line);position:sticky;top:66px;z-index:20;background:rgba(25,19,13,.98)}
.action-group{display:flex;gap:6px}
.action{height:32px;border:1px solid var(--line);background:var(--surface);padding:0 10px;font-size:9px;cursor:pointer}
.action:hover,.action.faved{border-color:var(--goldHi);color:var(--goldHi)}
.detail-inner{padding:18px}
.eyebrow{font-family:"Cinzel",serif;font-size:9px;color:var(--gold);letter-spacing:.08em}
.detail h2{font-family:"Shippori Mincho",serif;font-size:24px;line-height:1.35;margin:5px 0 10px}
.detail-meta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.meta-chip{border:1px solid var(--line);font-size:8px;padding:3px 6px;color:var(--dim)}
.alert{border-left:3px solid var(--warn);background:rgba(227,169,79,.08);padding:9px 11px;margin:10px 0;font-size:10px;line-height:1.65;color:#d8c9b1}
.answer-box{background:var(--paper);color:var(--paperInk);border:1px solid #c8b98d;padding:15px 16px;margin:12px 0 10px;box-shadow:0 7px 20px rgba(0,0,0,.18)}
.answer-box .label,.question-box .label,.section-label{display:block;font-family:"Cinzel",serif;font-size:9px;letter-spacing:.12em;font-weight:900;margin-bottom:7px}
.answer-box .label{color:#7b5b1e}.answer-box p{margin:0;font-family:"Shippori Mincho",serif;font-size:19px;font-weight:800;line-height:1.65}
.question-box{border:1px solid var(--line);background:#130f0a;padding:12px 13px}.question-box .label{color:var(--gold)}.question-box p{margin:0;font-size:12px;line-height:1.75}
.focus .answer-box p{font-size:24px}.focus .question-box,.focus .secondary,.focus .footer{display:none}
.detail-cards{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 2px}
.card-chip,.tag-chip{border:1px solid var(--line);background:var(--surface);padding:5px 7px;font-size:9px;cursor:pointer}
.card-chip{color:var(--goldHi)}.tag-chip{color:var(--dim)}
.section{margin-top:16px;padding-top:13px;border-top:1px solid var(--line)}
.section h3{font-family:"Shippori Mincho",serif;margin:0 0 8px;font-size:14px}
.steps{margin:0;padding-left:22px}.steps li{font-size:11px;line-height:1.8;padding-left:3px}
.tip{font-size:11px;line-height:1.8;color:#ded2bd}
.related{display:grid;gap:6px}
.related-btn{border:1px solid var(--line);background:#15100b;text-align:left;padding:9px 10px;cursor:pointer}
.related-btn:hover{border-color:var(--lineHi);background:var(--surface2)}
.related-btn b,.related-btn span{display:block}.related-btn b{font-size:11px}.related-btn span{font-size:9px;color:var(--dim);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
details
.current-compare{margin-top:12px;border:1px solid var(--line);background:rgba(201,162,75,.045);padding:9px 10px}
.current-compare summary{cursor:pointer;color:var(--goldHi);font-size:10px;font-weight:700}
.current-warning{margin:8px 0;padding:8px 9px;border-left:2px solid var(--warn);background:rgba(227,169,79,.06);font-size:9px;line-height:1.7;color:var(--ink)}
.current-warning.change{border-left-color:var(--danger);background:rgba(239,107,94,.06)}
.current-row{margin-top:8px;font-size:10px;line-height:1.75;color:var(--dim)}
.current-row b{display:block;color:var(--ink);font-size:9px;letter-spacing:.04em;margin-bottom:2px}
.current-row a{color:var(--goldHi)}

.proof{margin-top:14px;border-top:1px solid var(--line);padding-top:10px}
details.proof summary{cursor:pointer;color:var(--dim);font-size:10px}
.proof-body{padding-top:9px}.proof-body a{display:block;color:var(--goldHi);font-size:10px;line-height:1.6;margin:6px 0}.review{font-size:9px;color:var(--dim);line-height:1.7}
.footer{text-align:center;color:#756957;font-size:8px;padding:14px 0 4px}
.mobile-nav{display:none}
@media(max-width:900px){
  :root{--bottomNav:66px}
  .app{padding:8px 8px calc(12px + var(--bottomNav))}
  .app-header{padding:7px 2px 9px}.brand-title{font-size:21px}.brand-sub{display:none}.env{font-size:8px}
  .search-shell{top:0;padding:5px 0 7px}.search{height:46px}
  .mode-tabs{display:none}
  .quick{margin-bottom:7px}
  .workspace{display:block}.results-panel.mobile-hidden{display:none}.detail-panel{display:none}.detail-panel.mobile-open{display:block}
  .result-list{max-height:none;min-height:calc(100vh - 180px)}.result{padding:13px 11px}.result h3{font-size:14px}.result-a{font-size:11px}
  .detail{min-height:calc(100vh - 135px)}.detail-actions{top:58px;height:44px;padding:0 7px}.detail-inner{padding:14px 10px 22px}.detail h2{font-size:21px}
  .answer-box{padding:14px 13px}.answer-box p{font-size:19px}.focus .answer-box p{font-size:25px}
  .mobile-nav{
    display:grid;grid-template-columns:repeat(3,1fr);position:fixed;z-index:80;left:0;right:0;bottom:0;
    padding:6px 8px calc(6px + env(safe-area-inset-bottom));background:rgba(15,11,7,.98);border-top:1px solid var(--lineHi)
  }
  .nav-btn{height:48px;border:0;background:transparent;color:var(--dim);font-size:9px;font-weight:700;display:grid;place-items:center;align-content:center;gap:2px;cursor:pointer}
  .nav-btn i{font-style:normal;font-size:18px;line-height:1}.nav-btn.active{color:var(--goldHi)}
  body.detail-open .mobile-nav{display:none}
}

.source-badge{display:inline-flex;align-items:center;border:1px solid var(--line);padding:2px 5px;font-size:8px;font-weight:800;letter-spacing:.04em;white-space:nowrap}
.source-badge.curated{color:var(--goldHi);border-color:#725d30;background:#1b150c}
.source-badge.reviewed{color:#e5cf91;border-color:#76633d;background:#17140e}
.source-badge.wiki{color:#a99c89;border-color:#4b4338;background:#14110e}
.result.is-wiki{border-left:2px solid #4b4338}
.result.is-reviewed{border-left:2px solid #8b7543}
.layer-note{font-size:9px;color:var(--dim);line-height:1.6;margin:5px 0 0}

/* v3.0 three-layer comparison */
.source-badge.official{color:#b9cff7;border-color:#50698f;background:#101721}
.result.is-current{border-left:2px solid #50698f}
.current-layer-note{border:1px solid #50698f;background:rgba(80,105,143,.10);padding:9px 11px;margin:0 0 10px;font-size:10px;line-height:1.65;color:#c8d7ed}
.current-layer-note strong{color:#e4edf9}
.current-answer-box{background:#e7edf5;color:#17202c;border-color:#a9bdd5}
.current-answer-box .label{color:#385273}
.current-answer-box p{font-size:17px}
.compare-count{font-family:"Cinzel",serif;color:var(--goldHi)}
.compare-list{display:grid;gap:7px;margin-top:8px}
.compare-btn{display:block;width:100%;text-align:left;border:1px solid var(--line);background:#14110e;padding:9px 10px;cursor:pointer}
.compare-btn:hover{border-color:var(--lineHi);background:var(--surface2)}
.compare-btn b,.compare-btn span{display:block}.compare-btn b{font-size:10px;color:var(--ink)}.compare-btn span{font-size:9px;color:var(--dim);margin-top:4px;line-height:1.55}
.change-flag{display:inline-block;border:1px solid rgba(239,107,94,.55);color:var(--danger);padding:2px 5px;font-size:8px;font-weight:900;margin-left:5px}
.layer-stats{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 9px}
.layer-stat{border:1px solid var(--line);background:rgba(25,19,13,.8);padding:5px 7px;font-size:8px;color:var(--dim)}
.layer-stat b{color:var(--ink);font-size:9px}

.review-flag{display:inline-block;border:1px solid rgba(227,169,79,.5);color:var(--warn);padding:2px 5px;font-size:8px;font-weight:900;white-space:nowrap}
.review-reasons{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.review-reason{border:1px solid var(--line);padding:2px 5px;font-size:8px;color:var(--dim)}
.match-line{margin-top:5px;font-size:8px;color:#9fb4d9;line-height:1.5}
.smart-note{border:1px solid var(--line);background:rgba(201,162,75,.045);padding:8px 10px;margin:0 0 9px;font-size:9px;color:var(--dim);line-height:1.6}
.smart-note b{color:var(--goldHi)}

/* v3.2 retroactive 1103 inference */
.retro-badge{display:inline-flex;align-items:center;border:1px solid var(--lineHi);padding:2px 6px;font-size:8px;font-weight:900;white-space:nowrap}
.retro-A{color:#8ee0ad;border-color:#4c9568;background:rgba(76,149,104,.10)}
.retro-B{color:#a9d9ff;border-color:#4f7ca0;background:rgba(79,124,160,.10)}
.retro-C{color:#e5cf91;border-color:#8a7340;background:rgba(138,115,64,.10)}
.retro-D{color:var(--warn);border-color:rgba(227,169,79,.55);background:rgba(227,169,79,.08)}
.retro-X{color:var(--danger);border-color:rgba(239,107,94,.6);background:rgba(239,107,94,.08)}
.result.is-retro{border-left:3px solid #4f7ca0}
.retro-note{border:1px solid #4f7ca0;background:rgba(79,124,160,.08);padding:9px 11px;margin:0 0 10px;font-size:10px;line-height:1.65}
.retro-note strong{color:#cfe9ff}
.retro-reasons{display:flex;gap:4px;flex-wrap:wrap;margin:7px 0 0}.retro-reason{border:1px solid var(--line);padding:2px 5px;font-size:8px;color:var(--dim)}
@media(max-width:900px){.mobile-nav{grid-template-columns:repeat(6,1fr)}.nav-btn i{font-size:13px;font-weight:900}.nav-btn{font-size:8px}.mode-tabs{overflow:auto}}


</style>
</head>
<body>
<main class="app">
<header class="app-header">
  <div><h1 class="brand-title">1103 裁定DB</h1><p class="brand-sub">1103当時裁定＋現行公式からの1103推定を根拠レベル付きで検索</p></div>
  <div style="display:flex;align-items:center;gap:10px">
    <a href="index.html" style="color:var(--goldHi);text-decoration:none;font-size:10px;font-weight:700;white-space:nowrap">← デッキビルダー</a>
    <div class="env" id="environment">2011.03 LIMIT · ～2011.08</div>
  </div>
</header>

<section class="search-shell">
  <div class="search-wrap">
    <div class="search">
      <div class="search-ic">⌕</div>
      <input id="searchInput" type="search" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="1103裁定：カード名・状況を検索">
      <button id="clearSearch" class="clear" aria-label="検索を消す">×</button>
    </div>
    <div class="suggest" id="suggest"></div>
  </div>
</section>

<nav class="mode-tabs" id="modeTabs">
  <button class="mode active" data-mode="all">1103裁定 <span class="count" id="allCount"></span></button>
  <button class="mode" data-mode="retro">1103推定 <span class="count" id="retroCount"></span></button>
  <button class="mode" data-mode="current">現行公式 <span class="count" id="currentCount"></span></button>
  <button class="mode" data-mode="review">要レビュー <span class="count" id="reviewCount"></span></button>
  <button class="mode" data-mode="fav">☆ 保存 <span class="count" id="favCount"></span></button>
  <button class="mode" data-mode="recent">↶ 履歴 <span class="count" id="recentCount"></span></button>
</nav>

<section class="quick" id="quick"></section>

<section class="workspace">
  <section class="panel results-panel" id="resultsPanel">
    <div class="panel-head"><b id="listTitle">裁定一覧</b><span id="resultSummary"></span></div>
    <div class="result-list" id="resultList"></div>
  </section>
  <article class="panel detail detail-panel" id="detailPanel">
    <div class="empty"><div><b>カード名を検索してください</b>一覧から裁定を選ぶと、答えを最上段に表示します。</div></div>
  </article>
</section>

<footer class="footer" id="footerVersion"></footer>
</main>

<nav class="mobile-nav" id="mobileNav">
  <button class="nav-btn active" data-mode="all"><i>1103</i><span>裁定</span></button>
  <button class="nav-btn" data-mode="retro"><i>推</i><span>1103推定</span></button>
  <button class="nav-btn" data-mode="current"><i>現</i><span>現行公式</span></button>
  <button class="nav-btn" data-mode="review"><i>!</i><span>要確認</span></button>
  <button class="nav-btn" data-mode="fav"><i>☆</i><span>保存</span></button>
  <button class="nav-btn" data-mode="recent"><i>↶</i><span>履歴</span></button>
</nav>

<script src="rulings-data.js"></script>
<script src="wiki-rulings.js"></script>
<script src="official-current.js"></script>
<script>
const LABELS={
 verdict:{can:'できる',cannot:'できない',conditional:'条件付き',investigating:'調査中'},
 confidence:{high:'高',medium:'中',low:'要確認'},
 status:{historical_source_confirmed:'当時資料あり',secondary_confirmed:'二次確認',needs_primary_source:'一次資料待ち',researching:'調査中',historical_disputed:'当時裁定不確定',official_current_consistent:'現行公式と一致',historical_wiki_reviewed:'旧Wiki確認・意味レビュー済み',historical_wiki_snapshot:'旧Wiki記録',historical_wiki_investigating:'旧Wiki上で調整中'}
};
const state={data:null,official:null,query:'',mode:'all',selected:null,selectedKind:'ruling',favorites:new Set(),recent:[],cards:[],officialCards:[],focus:false,suggestIndex:-1,officialByCard:new Map(),officialByFid:new Map(),historicalByCard:new Map(),reviewCandidates:[],retroRowsCache:[],_qraw:null,_qspec:null};
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const norm=v=>String(v??'').normalize('NFKC').toLowerCase().replace(/\s+/g,' ').trim();
const plain=v=>String(v??'').replace(/\s+/g,' ').trim();
const kanaFold=v=>norm(v).replace(/[ぁ-ゖ]/g,ch=>String.fromCharCode(ch.charCodeAt(0)+0x60));
const searchNorm=v=>kanaFold(v).replace(/[《》「」『』【】〈〉()（）［］\[\]{}｛｝・･,，.。:：;；!?！？“”\"'’`]/g,' ').replace(/\s+/g,' ').trim();
const compact=v=>searchNorm(v).replace(/\s+/g,'');
const itemKey=(kind,id)=>kind==='current'?`OFFICIAL-${id}`:id;
const QUERY_ALIAS_GROUPS=[
 ['ss','特殊召喚'],['ns','通常召喚'],['gy','墓地'],['除外','ゲームから除外'],
 ['ダメステ','ダメージステップ'],['ダメ計','ダメージ計算'],['チェーンブロック','チェーンブロックを組む'],
 ['起動','起動効果'],['誘発即時','誘発即時効果'],['誘発','誘発効果'],['永続','永続効果'],
 ['対象を取る','対象をとる'],['対象を取らない','対象をとらない'],['リリース','生け贄'],['手札誘発','手札から発動']
];
const STOP_WORDS=new Set(['この','その','カード','場合','効果','できますか','できる','ですか','ますか','する','した','される','について','どうなりますか','なりますか']);
function aliasVariants(token){const t=searchNorm(token),ct=compact(token),out=new Set([t,ct]);for(const group of QUERY_ALIAS_GROUPS){if(group.some(x=>compact(x)===ct)){for(const x of group){const sx=searchNorm(x),cx=compact(x);if(/^[a-z]{1,2}$/.test(cx))continue;out.add(sx);out.add(cx)}}}if(/^[a-z]{1,2}$/.test(ct))out.delete(ct);return [...out].filter(Boolean)}
function parseQuery(q){const src=String(q??'').normalize('NFKC').trim(),parts=[];const re=/\"([^\"]+)\"|(\S+)/g;let m;while((m=re.exec(src)))parts.push(m[1]||m[2]);const pos=[],neg=[];for(let raw of parts){let isNeg=false;if(raw.startsWith('-')&&raw.length>1){isNeg=true;raw=raw.slice(1)}const n=searchNorm(raw);if(!n)continue;const g={raw,n,compact:compact(n),variants:aliasVariants(n)};(isNeg?neg:pos).push(g)}return {positive:pos,negative:neg,whole:searchNorm(src),wholeCompact:compact(src)}}
function getQSpec(){if(state._qraw!==state.query){state._qraw=state.query;state._qspec=parseQuery(state.query)}return state._qspec}
function groupHit(item,g){return g.variants.some(v=>item.__search.includes(v)||item.__compact.includes(compact(v)))}
function matchesSpec(item,spec=getQSpec()){return spec.positive.every(g=>groupHit(item,g))&&!spec.negative.some(g=>groupHit(item,g))}
function gramsForCompare(v,remove=[]){let t=compact(v);for(const x of remove||[]){const c=compact(x);if(c)t=t.split(c).join('')}for(const x of STOP_WORDS){const c=compact(x);if(c)t=t.split(c).join('')}const out=new Set();if(t.length<3){if(t.length>=2)out.add(t);return out}for(let i=0;i<=t.length-3;i++)out.add(t.slice(i,i+3));return out}
function textOverlap(a,b,remove=[]){const A=gramsForCompare(a,remove),B=gramsForCompare(b,remove);if(!A.size||!B.size)return 0;let hit=0;for(const x of A)if(B.has(x))hit++;return hit/Math.max(1,Math.min(A.size,B.size))}

function loadLocal(){try{state.favorites=new Set(JSON.parse(localStorage.getItem('r1103:favs')||'[]'));state.recent=JSON.parse(localStorage.getItem('r1103:recent')||'[]').slice(0,40)}catch(_){state.favorites=new Set();state.recent=[]}}
function saveFavs(){try{localStorage.setItem('r1103:favs',JSON.stringify([...state.favorites]))}catch(_){}}
function saveRecent(){try{localStorage.setItem('r1103:recent',JSON.stringify(state.recent.slice(0,40)))}catch(_){}}
function makeIndex(r){const co=r.currentOfficial||{},txt=[r.title,r.question,r.answer,...(r.cards||[]),...(r.tags||[]),co.question||'',co.answer||''].join(' ');r.__search=searchNorm(txt);r.__compact=compact(txt);r.__cardCompact=(r.cards||[]).map(compact);r.__titleSearch=searchNorm(r.title);r.__qSearch=searchNorm(r.question);r.__aSearch=searchNorm(r.answer);return r.__search}
function makeOfficialIndex(f){const txt=[f.question,f.answer,...(f.related1103TargetCards||[])].join(' ');f.__search=searchNorm(txt);f.__compact=compact(txt);f.__cardCompact=(f.related1103TargetCards||[]).map(compact);f.__qSearch=searchNorm(f.question);f.__aSearch=searchNorm(f.answer);return f.__search}
function verdictBadge(r){return `<span class="verdict v-${esc(r.verdict)}">${esc(LABELS.verdict[r.verdict]||r.verdict)}</span>`}
function layerBadge(r){if(r.layer==='historical_wiki')return '<span class="source-badge wiki">旧Wiki</span>';if(r.layer==='wiki_reviewed')return '<span class="source-badge reviewed">旧Wiki・レビュー済</span>';return '<span class="source-badge curated">1103レビュー済</span>'}
function officialBadge(){return '<span class="source-badge official">現行KONAMI公式</span>'}
function retroBadge(f){const r=f.retro1103||{},c=r.class||'C';return `<span class="retro-badge retro-${esc(c)}">${esc(r.label||c)}</span>`}
function retroClassRank(c){return ({A:0,B:1,C:2,D:3,X:4})[c]??9}
function highlight(text){const raw=plain(text),spec=getQSpec();if(!spec.positive.length)return esc(raw);let safe=esc(raw);const terms=[...new Set(spec.positive.flatMap(g=>g.variants).filter(t=>t.length>=2))].sort((a,b)=>b.length-a.length);for(const t of terms.slice(0,12)){const needle=esc(t).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');try{safe=safe.replace(new RegExp(`(${needle})`,'ig'),'<mark>$1</mark>')}catch(_){}}return safe}
function historicalMatch(r){const spec=getQSpec(),key=itemKey('ruling',r.id);if(state.mode==='fav'&&!state.favorites.has(key))return false;if(state.mode==='recent'&&!state.recent.includes(key))return false;if(state.mode==='all'&&!spec.positive.length&&!spec.negative.length&&r.layer==='historical_wiki')return false;return matchesSpec(r,spec)}
function historicalScore(r){const spec=getQSpec();if(!spec.positive.length)return r.layer==='historical_wiki'?0:r.layer==='wiki_reviewed'?35:70;let s=r.layer==='historical_wiki'?0:r.layer==='wiki_reviewed'?40:85;const whole=spec.wholeCompact;if(whole){if(r.__cardCompact.some(c=>c===whole))s+=260;else if(r.__cardCompact.some(c=>c.includes(whole)||whole.includes(c)))s+=140;if(compact(r.title).includes(whole))s+=120;if(compact(r.question).includes(whole))s+=65;if(compact(r.answer).includes(whole))s+=35}for(const g of spec.positive){if(r.__cardCompact.some(c=>g.variants.some(v=>c.includes(compact(v)))))s+=65;if(g.variants.some(v=>r.__titleSearch.includes(v)))s+=35;if(g.variants.some(v=>r.__qSearch.includes(v)))s+=22;if(g.variants.some(v=>r.__aSearch.includes(v)))s+=10}if(r.status==='historical_source_confirmed')s+=12;if(r.confidence==='high')s+=8;return s}
function officialScore(f){const spec=getQSpec();if(!spec.positive.length)return f.post2011Change?5:0;let s=0,whole=spec.wholeCompact;if(whole){if(f.__cardCompact.some(c=>c===whole))s+=280;else if(f.__cardCompact.some(c=>c.includes(whole)||whole.includes(c)))s+=145;if(compact(f.question).includes(whole))s+=100;if(compact(f.answer).includes(whole))s+=45}for(const g of spec.positive){if(f.__cardCompact.some(c=>g.variants.some(v=>c.includes(compact(v)))))s+=70;if(g.variants.some(v=>f.__qSearch.includes(v)))s+=28;if(g.variants.some(v=>f.__aSearch.includes(v)))s+=12}if(f.post2011Change)s+=4;return s}
function historicalRows(){let rows=state.data.rulings.filter(historicalMatch);if(state.mode==='recent'&&!state.query){const pos=new Map(state.recent.map((id,i)=>[id,i]));rows.sort((a,b)=>(pos.get(a.id)??999)-(pos.get(b.id)??999))}else if(state.query)rows=[...rows].sort((a,b)=>historicalScore(b)-historicalScore(a));return rows}
function currentRows(){let rows=state.official.faqs.filter(f=>matchesSpec(f));if(state.query)rows=[...rows].sort((a,b)=>officialScore(b)-officialScore(a));else rows=[...rows].sort((a,b)=>(b.post2011Change?1:0)-(a.post2011Change?1:0)||Number(a.fid)-Number(b.fid));return rows}
function retroRows(){let rows=state.official.faqs.filter(f=>['A','B','C'].includes(f.retro1103?.class)&&matchesSpec(f));rows=[...rows].sort((a,b)=>retroClassRank(a.retro1103?.class)-retroClassRank(b.retro1103?.class)||(b.retro1103?.confidence||0)-(a.retro1103?.confidence||0)||(state.query?officialScore(b)-officialScore(a):Number(a.fid)-Number(b.fid)));return rows}
function favoriteRows(){const hist=state.data.rulings.filter(r=>state.favorites.has(itemKey('ruling',r.id))&&matchesSpec(r));const cur=state.official.faqs.filter(f=>state.favorites.has(itemKey('current',f.fid))&&matchesSpec(f));return {hist,cur}}
function recentRows(){const out=[];for(const key of state.recent){if(key.startsWith('OFFICIAL-')){const f=state.officialByFid.get(key.slice(9));if(f)out.push({kind:'current',item:f,key})}else{const r=state.data.rulings.find(x=>x.id===key);if(r)out.push({kind:'ruling',item:r,key})}}return out.filter(x=>matchesSpec(x.item))}
function reviewInfo(r){let score=0,reasons=[];const add=(n,label)=>{score+=n;if(label&&!reasons.includes(label))reasons.push(label)};if(r.status==='historical_wiki_investigating'||String(r.answer||'').includes('調整中'))add(140,'旧Wiki調整中');if(r.status==='needs_primary_source')add(110,'一次資料待ち');if(r.status==='historical_disputed')add(105,'当時裁定不確定');if(r.status==='researching')add(100,'調査中');if(r.confidence==='low')add(55,'信頼度低');const rel=r.currentOfficial?.relation;if(rel==='post_2011_rule_change')add(180,'後年変更確定');if(rel==='current_answer_after_historical_investigating')add(90,'現行回答あり');let post=false;for(const c of r.cards||[])if((state.officialByCard.get(norm(c))||[]).some(f=>f.post2011Change)){post=true;break}if(post)add(40,'同カードに後年変更Q&A');return {score,reasons}}
function buildReviewCandidates(){state.reviewCandidates=state.data.rulings.map(r=>({r,...reviewInfo(r)})).filter(x=>x.score>=60).sort((a,b)=>b.score-a.score||historicalScore(b.r)-historicalScore(a.r))}
function reviewRows(){return state.reviewCandidates.filter(x=>matchesSpec(x.r))}
function renderModes(){document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===state.mode));$('allCount').textContent=state.data?state.data.rulings.length:'';$('currentCount').textContent=state.official?state.official.faqs.length:'';const rc=state.official?.meta?.retro1103Classification?.counts||{};$('retroCount').textContent=state.official?((rc.A||0)+(rc.B||0)+(rc.C||0)):'';$('reviewCount').textContent=state.reviewCandidates.length||'';$('favCount').textContent=state.favorites.size||'';$('recentCount').textContent=state.recent.length||'';$('listTitle').textContent=state.mode==='retro'?'1103推定・遡及判定':state.mode==='current'?'現行公式Q&A':state.mode==='review'?'要レビュー候補':state.mode==='fav'?'保存した裁定':state.mode==='recent'?'最近見た裁定':'1103裁定一覧';$('searchInput').placeholder=state.mode==='retro'?'1103推定：カード名・状況を検索':state.mode==='current'?'現行公式：カード名・状況を検索':state.mode==='review'?'要レビュー：カード名・状況を絞り込み':'1103裁定：カード名・状況を検索'}
function setMode(mode){state.mode=mode;state.selected=null;renderModes();renderQuick();renderList();hideSuggest();if(innerWidth<=900)showListMobile();if((mode==='all'||mode==='current'||mode==='retro')&&innerWidth<=900)setTimeout(()=>$('searchInput').focus(),40)}
function renderQuick(){if(!state.data||!state.official)return;let keys=[],title='';if(state.mode==='all'){keys=[...state.favorites,...state.recent].filter((x,i,a)=>a.indexOf(x)===i).slice(0,10);title='すぐ開く'}else if(state.mode==='current'||state.mode==='retro'||state.mode==='review'){$('quick').classList.remove('visible');$('quick').innerHTML='';return}else if(state.mode==='fav'){keys=[...state.favorites].slice(0,12);title='保存した裁定'}else{keys=state.recent.slice(0,12);title='最近見た裁定'}const items=keys.map(key=>{if(key.startsWith('OFFICIAL-')){const f=state.officialByFid.get(key.slice(9));return f?{kind:'current',id:f.fid,title:`現行Q&A fid=${f.fid}`,sub:(f.related1103TargetCards||[]).join(' / '),key}:null}const r=state.data.rulings.find(x=>x.id===key);return r?{kind:'ruling',id:r.id,title:r.title,sub:(r.cards||[]).join(' / ')||'共通ルール',key}:null}).filter(Boolean);if(!items.length){$('quick').classList.remove('visible');$('quick').innerHTML='';return}$('quick').classList.add('visible');$('quick').innerHTML=`<div class="quick-head"><b>${title}</b><span>${items.length}件</span></div><div class="quick-items">${items.map(x=>`<button class="quick-btn" data-kind="${x.kind}" data-id="${esc(x.id)}"><b>${state.favorites.has(x.key)?'★ ':''}${esc(x.title)}</b><span>${esc(x.sub)}</span></button>`).join('')}</div>`;$('quick').querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>selectItem(b.dataset.kind,b.dataset.id,true))}
function renderReviewList(rows){const maxRender=300,shown=rows.slice(0,maxRender);$('resultSummary').textContent=rows.length>maxRender?`${rows.length}件（優先度上位${maxRender}件）`:`${rows.length}件・自動判定はレビュー優先順位のみ`;
 if(!rows.length){$('resultList').innerHTML='<div class="empty"><div><b>要レビュー候補はありません</b>検索条件を外すか、別のカード名で確認してください。</div></div>';return}
 $('resultList').innerHTML=`<div class="smart-note"><b>自動トリアージ</b>：当時調整中・一次資料待ち・後年変更などを優先表示します。ここでの順位は裁定の正誤判定ではありません。</div>`+shown.map(x=>{const r=x.r,key=itemKey('ruling',r.id);return `<button class="result ${r.id===state.selected&&state.selectedKind==='ruling'?'active':''} ${r.layer==='historical_wiki'?'is-wiki':r.layer==='wiki_reviewed'?'is-reviewed':''}" data-kind="ruling" data-id="${esc(r.id)}"><div class="result-top"><h3>${state.favorites.has(key)?'<span class="favstar">★</span> ':''}${highlight(r.title)}</h3><div style="display:flex;gap:5px;align-items:center"><span class="review-flag">優先度 ${x.score}</span>${layerBadge(r)}</div></div><p class="result-q">${highlight(r.question)}</p><p class="result-a">→ ${highlight(r.answer)}</p><div class="review-reasons">${x.reasons.map(z=>`<span class="review-reason">${esc(z)}</span>`).join('')}</div><div class="cardline">${esc((r.cards||[]).join(' / ')||'共通ルール')}</div></button>`}).join('');bindResultButtons()}
function renderHistoricalList(rows){const maxRender=state.query?300:220,shown=rows.slice(0,maxRender),defaultReviewed=state.mode==='all'&&!norm(state.query);$('resultSummary').textContent=rows.length>maxRender?`${rows.length}件（上位${maxRender}件表示）`:`${rows.length}件${defaultReviewed?'・レビュー済み中心':''}`;if(!rows.length){$('resultList').innerHTML='<div class="empty"><div><b>該当する裁定がありません</b>別のカード名や状況で検索してください。</div></div>';return}$('resultList').innerHTML=shown.map(r=>{const key=itemKey('ruling',r.id);return `<button class="result ${r.id===state.selected&&state.selectedKind==='ruling'?'active':''} ${r.layer==='historical_wiki'?'is-wiki':r.layer==='wiki_reviewed'?'is-reviewed':''}" data-kind="ruling" data-id="${esc(r.id)}"><div class="result-top"><h3>${state.favorites.has(key)?'<span class="favstar">★</span> ':''}${highlight(r.title)}</h3><div style="display:flex;gap:5px;align-items:center">${layerBadge(r)}${verdictBadge(r)}</div></div><p class="result-q">${highlight(r.question)}</p><p class="result-a">→ ${highlight(r.answer)}</p><div class="cardline">${esc((r.cards||[]).join(' / ')||'共通ルール')}</div></button>`}).join('');bindResultButtons()}
function renderRetroList(rows){const maxRender=state.query?320:240,shown=rows.slice(0,maxRender),rc=state.official.meta.retro1103Classification?.counts||{};$('resultSummary').textContent=rows.length>maxRender?`${rows.length}件（上位${maxRender}件表示）`:`${rows.length}件 · A${rc.A||0} B${rc.B||0} C${rc.C||0} D${rc.D||0} X${rc.X||0}`;if(!rows.length){$('resultList').innerHTML='<div class="empty"><div><b>1103推定候補が見つかりません</b>別のカード名や状況で検索してください。</div></div>';return}$('resultList').innerHTML=`<div class="retro-note"><strong>1103推定レイヤー</strong>：A=当時根拠一致候補、B=高信頼推定、C=推定、D=要レビュー、X=1103非適用。A/B/Cも「2011年当時にKONAMIが回答した」という意味ではありません。</div>`+shown.map(f=>{const rr=f.retro1103||{},key=itemKey('current',f.fid);return `<button class="result is-retro ${f.fid===state.selected&&state.selectedKind==='current'?'active':''}" data-kind="current" data-id="${esc(f.fid)}"><div class="result-top"><h3>${state.favorites.has(key)?'<span class="favstar">★</span> ':''}fid=${esc(f.fid)}</h3><div style="display:flex;gap:5px;align-items:center">${retroBadge(f)}${officialBadge()}</div></div><p class="result-q">${highlight(f.question)}</p><p class="result-a">→ ${highlight(f.answer)}</p><div class="retro-reasons">${(rr.reasons||[]).slice(0,3).map(z=>`<span class="retro-reason">${esc(z)}</span>`).join('')}</div><div class="cardline">${esc((f.related1103TargetCards||[]).join(' / ')||'1103対象カードとの関連あり')}</div></button>`}).join('');bindResultButtons()}
function renderCurrentList(rows){const maxRender=state.query?300:180,shown=rows.slice(0,maxRender);$('resultSummary').textContent=rows.length>maxRender?`${rows.length}件（上位${maxRender}件表示）`:`${rows.length}件・遡及判定付き`;if(!rows.length){$('resultList').innerHTML='<div class="empty"><div><b>現行公式Q&Aが見つかりません</b>1103対象4996枚のうち、公式Q&A索引にないカードもあります。</div></div>';return}$('resultList').innerHTML=shown.map(f=>{const key=itemKey('current',f.fid);return `<button class="result is-current ${f.fid===state.selected&&state.selectedKind==='current'?'active':''}" data-kind="current" data-id="${esc(f.fid)}"><div class="result-top"><h3>${state.favorites.has(key)?'<span class="favstar">★</span> ':''}fid=${esc(f.fid)} ${f.post2011Change?'<span class="change-flag">後年変更</span>':''}</h3><div style="display:flex;gap:5px;align-items:center">${retroBadge(f)}${officialBadge()}</div></div><p class="result-q">${highlight(f.question)}</p><p class="result-a">→ ${highlight(f.answer)}</p><div class="cardline">${esc((f.related1103TargetCards||[]).join(' / ')||'1103対象カードとの関連あり')}</div></button>`}).join('');bindResultButtons()}

function selectCurrent(fid,updateHash){const f=state.officialByFid.get(String(fid));if(!f)return;state.selected=String(fid);state.selectedKind='current';remember('current',String(fid));if(updateHash&&location.hash!==`#${encodeURIComponent('OFFICIAL-'+fid)}`)history.pushState({kind:'current',id:String(fid)},'',`#${encodeURIComponent('OFFICIAL-'+fid)}`);renderList();renderQuick();renderCurrentDetail(f);openDetailMobile()}
function openDetailMobile(){$('detailPanel').classList.add('mobile-open');$('resultsPanel').classList.add('mobile-hidden');document.body.classList.add('detail-open');if(innerWidth<=900)scrollTo({top:0,behavior:'smooth'})}
function setQuery(q,forceMode=null){$('searchInput').value=q;state.query=q;if(forceMode)state.mode=forceMode;else if(state.mode==='fav'||state.mode==='recent')state.mode='all';renderModes();renderQuick();renderList();hideSuggest();if(innerWidth<=900){showListMobile();scrollTo({top:0,behavior:'smooth'})}}
function toggleFavorite(kind,id){const key=itemKey(kind,id);state.favorites.has(key)?state.favorites.delete(key):state.favorites.add(key);saveFavs();renderModes();renderQuick();renderList();if(kind==='current'){const f=state.officialByFid.get(String(id));if(f)renderCurrentDetail(f)}else{const r=state.data.rulings.find(x=>x.id===id);if(r)renderDetail(r)}}
async function copyItem(kind,item,button){const txt=kind==='current'?`【現行KONAMI公式Q&A fid=${item.fid}】\nQ：${plain(item.question)}\nA：${plain(item.answer)}\n※1103当時裁定として自動適用しない`:`【${item.title}】\nQ：${item.question}\nA：${item.answer}`;try{await navigator.clipboard.writeText(txt);button.textContent='コピー済み';setTimeout(()=>button.textContent='裁定をコピー',1000)}catch(_){button.textContent='コピー不可'}}
function officialForRuling(r){const map=new Map();for(const card of r.cards||[]){for(const f of state.officialByCard.get(norm(card))||[])map.set(f.fid,f)}if(r.currentOfficial?.fid){const manual=state.officialByFid.get(String(r.currentOfficial.fid));if(manual)map.set(manual.fid,manual)}return [...map.values()].map(f=>{const sameCards=(f.related1103TargetCards||[]).filter(c=>(r.cards||[]).some(rc=>norm(rc)===norm(c))).length,overlap=textOverlap(r.question,f.question,[...(r.cards||[]),...(f.related1103TargetCards||[])]);let score=sameCards*160+Math.round(overlap*120),reasons=[];if(sameCards)reasons.push(`同一カード${sameCards}枚`);if(overlap>=.55)reasons.push('状況語一致:高');else if(overlap>=.25)reasons.push('状況語一致:中');if(String(r.currentOfficial?.fid||'')===String(f.fid)){score+=900;reasons.unshift('手動確認済み')}if(f.post2011Change){score+=20;reasons.push('後年変更')}return {f,score,reasons,overlap}}).sort((a,b)=>b.score-a.score||Number(a.f.fid)-Number(b.f.fid))}
function renderOfficialComparisons(r){const ranked=officialForRuling(r),manual=r.currentOfficial;if(!ranked.length&&!manual)return '';
 const first=ranked.slice(0,10);return `<section class="section"><h3>現行公式Q&Aとの比較 <span class="compare-count">${ranked.length}</span></h3><div class="current-warning">⚠ 下記は現在のKONAMI公式Q&Aです。1103当時の裁定として自動採用しません。順位は「同一カード＋質問状況の類似度」で付けています。${ranked.some(x=>x.f.post2011Change)?'「後年変更」は適用開始が2011年より後と明記された回答です。':''}</div>${manual?.note?`<div class="current-row">${esc(manual.note)}</div>`:''}<div class="compare-list">${first.map(x=>{const f=x.f;return `<button class="compare-btn" data-current-fid="${esc(f.fid)}"><b>fid=${esc(f.fid)} ${f.post2011Change?`<span class="change-flag">${esc(f.effectiveFrom||'後年変更')}</span>`:''}</b><span>${esc(plain(f.question))}</span><div class="match-line">候補スコア ${x.score}${x.reasons.length?' · '+esc(x.reasons.join(' / ')):''}</div></button>`}).join('')}</div>${ranked.length>10?`<button class="action" style="margin-top:8px" data-current-card="${esc((r.cards||[])[0]||'')}">このカードの現行Q&Aを全て見る</button>`:''}</section>`}
function renderDetail(r){const sources=(r.sourceRefs||[]).map(sourceById).filter(Boolean),related=relatedFor(r),triage=state.reviewCandidates.find(x=>x.r.id===r.id);const warn=r.verdict==='investigating'||r.confidence==='low'||r.status==='needs_primary_source'||r.status==='historical_disputed'||r.status==='historical_wiki_investigating';const key=itemKey('ruling',r.id);$('detailPanel').classList.toggle('focus',state.focus);$('detailPanel').innerHTML=`<div class="detail-actions"><button class="action" id="backButton">← 一覧</button><div class="action-group"><button class="action ${state.favorites.has(key)?'faved':''}" id="favButton">${state.favorites.has(key)?'★ 保存済み':'☆ 保存'}</button><button class="action" id="copyRuling">裁定をコピー</button><button class="action" id="focusButton">${state.focus?'標準表示':'大きく表示'}</button></div></div><div class="detail-inner"><div class="eyebrow">${esc(r.id)}</div><h2>${esc(r.title)}</h2><div class="detail-meta">${layerBadge(r)}${verdictBadge(r)}${(r.cards||[]).slice(0,4).map(c=>`<span class="meta-chip">${esc(c)}</span>`).join('')}</div>${warn?'<div class="alert">⚠ この項目は調査中または根拠確認が必要な裁定です。下部の「根拠・確認状況」も確認してください。</div>':''}${triage?`<div class="smart-note"><b>レビュー優先度 ${triage.score}</b> · ${esc(triage.reasons.join(' / '))}</div>`:''}<div class="answer-box"><span class="label">1103 RULING</span><p>${esc(r.answer)}</p></div><div class="question-box"><span class="label">QUESTION</span><p>${esc(r.question)}</p></div><div class="secondary">${(r.cards||[]).length?`<div class="detail-cards">${r.cards.map(c=>`<button class="card-chip" data-card="${esc(c)}">${esc(c)}の1103裁定</button>`).join('')}</div>`:''}${r.steps?.length?`<section class="section"><h3>処理順</h3><ol class="steps">${r.steps.map(x=>`<li>${esc(x)}</li>`).join('')}</ol></section>`:''}${r.deckTip?`<section class="section"><h3>実戦でのポイント</h3><div class="tip">${esc(r.deckTip)}</div></section>`:''}${related.length?`<section class="section"><h3>関連1103裁定</h3><div class="related">${related.map(x=>`<button class="related-btn" data-related="${esc(x.id)}"><b>${esc(x.title)}</b><span>${esc(x.question)}</span></button>`).join('')}</div></section>`:''}${(r.tags||[]).length?`<section class="section"><span class="section-label">TAGS</span><div class="detail-cards">${r.tags.map(t=>`<button class="tag-chip" data-tag="${esc(t)}">${esc(t)}</button>`).join('')}</div></section>`:''}${renderOfficialComparisons(r)}<details class="proof"><summary>根拠・確認状況</summary><div class="proof-body"><div class="review">確認状況：${esc(LABELS.status[r.status]||r.status)} / 信頼度：${esc(LABELS.confidence[r.confidence]||r.confidence)}</div>${sources.map(s=>`<a href="${esc(s.url)}" target="_blank" rel="noreferrer">${esc(s.title)} <small>(${esc(s.date)})</small></a>`).join('')}${r.sourceUrl?`<a href="${esc(r.sourceUrl)}" target="_blank" rel="noreferrer">遊戯王Wiki 旧バックアップ <small>(${esc(r.backupDate||'日付不明')})</small></a>`:''}${!sources.length&&!r.sourceUrl?'<div class="review">出典未登録</div>':''}${r.reviewNote?`<div class="review">${esc(r.reviewNote)}</div>`:''}</div></details></div></div>`;
 $('backButton').onclick=showListMobile;$('favButton').onclick=()=>toggleFavorite('ruling',r.id);$('copyRuling').onclick=e=>copyItem('ruling',r,e.currentTarget);$('focusButton').onclick=()=>{state.focus=!state.focus;renderDetail(r)};$('detailPanel').querySelectorAll('[data-card]').forEach(b=>b.onclick=()=>setQuery(b.dataset.card,'all'));$('detailPanel').querySelectorAll('[data-tag]').forEach(b=>b.onclick=()=>setQuery(b.dataset.tag,'all'));$('detailPanel').querySelectorAll('[data-related]').forEach(b=>b.onclick=()=>selectRuling(b.dataset.related,true));$('detailPanel').querySelectorAll('[data-current-fid]').forEach(b=>b.onclick=()=>{state.mode='current';renderModes();selectCurrent(b.dataset.currentFid,true)});$('detailPanel').querySelectorAll('[data-current-card]').forEach(b=>b.onclick=()=>setQuery(b.dataset.currentCard,'current'))}
function historicalForOfficial(f){const map=new Map();for(const card of f.related1103TargetCards||[]){for(const r of state.historicalByCard.get(norm(card))||[])map.set(r.id,r)}return [...map.values()].map(r=>{const sameCards=(r.cards||[]).filter(c=>(f.related1103TargetCards||[]).some(fc=>norm(fc)===norm(c))).length,overlap=textOverlap(r.question,f.question,[...(r.cards||[]),...(f.related1103TargetCards||[])]);let score=sameCards*160+Math.round(overlap*120)+(r.layer==='historical_wiki'?0:r.layer==='wiki_reviewed'?35:75),reasons=[];if(String(r.currentOfficial?.fid||'')===String(f.fid)){score+=900;reasons.push('手動確認済み')}if(sameCards)reasons.push(`同一カード${sameCards}枚`);if(overlap>=.55)reasons.push('状況語一致:高');else if(overlap>=.25)reasons.push('状況語一致:中');if(r.layer!=='historical_wiki')reasons.push('レビュー済み');return {r,score,reasons}}).sort((a,b)=>b.score-a.score).slice(0,8)}
function renderHistoricalComparisonsForOfficial(f){const rows=historicalForOfficial(f);if(!rows.length)return '';return `<section class="section"><h3>関連する1103裁定候補</h3><div class="current-warning">候補順位は同一カードと質問状況の類似度によるものです。現行Q&Aから1103当時の結論を逆算しません。</div><div class="related">${rows.map(x=>`<button class="related-btn" data-1103-id="${esc(x.r.id)}"><b>${esc(x.r.title)}</b><span>${esc(plain(x.r.question))}</span><div class="match-line">候補スコア ${x.score}${x.reasons.length?' · '+esc(x.reasons.join(' / ')):''}</div></button>`).join('')}</div></section>`}
function renderCurrentDetail(f){const key=itemKey('current',f.fid),rr=f.retro1103||{},hm=rr.historicalMatch;$('detailPanel').classList.toggle('focus',state.focus);$('detailPanel').innerHTML=`<div class="detail-actions"><button class="action" id="backButton">← 一覧</button><div class="action-group"><button class="action ${state.favorites.has(key)?'faved':''}" id="favButton">${state.favorites.has(key)?'★ 保存済み':'☆ 保存'}</button><button class="action" id="copyRuling">裁定をコピー</button><button class="action" id="focusButton">${state.focus?'標準表示':'大きく表示'}</button></div></div><div class="detail-inner"><div class="eyebrow">OFFICIAL CURRENT · fid=${esc(f.fid)}</div><h2>現行KONAMI公式Q&A</h2><div class="detail-meta">${retroBadge(f)}${officialBadge()}${f.post2011Change?`<span class="change-flag">${esc(f.effectiveFrom||'後年変更')}</span>`:''}${(f.related1103TargetCards||[]).slice(0,5).map(c=>`<span class="meta-chip">${esc(c)}</span>`).join('')}</div><div class="retro-note"><strong>1103利用判定：${esc(rr.label||'未分類')} · 信頼度 ${esc(rr.confidence??'—')}</strong><div class="retro-reasons">${(rr.reasons||[]).map(z=>`<span class="retro-reason">${esc(z)}</span>`).join('')}</div>${rr.offPoolQuestionCards?.length?`<div class="current-warning change">質問に1103外カード：${esc(rr.offPoolQuestionCards.join(' / '))}</div>`:''}${hm?`<div class="match-line">当時資料候補：${esc(hm.id)} · 質問類似度 ${esc(hm.questionSimilarity)} · ${hm.consistentDirection?'回答方向整合':'回答方向要確認'}</div>`:''}</div><div class="current-layer-note"><strong>出典の区別：</strong>回答本文は現行KONAMI公式です。A/B/Cは1103で利用するための遡及推定であり、2011年当時の公式回答そのものとは表示しません。${rr.class==='X'?' このQ&Aは1103へ遡及しません。':rr.class==='D'?' このQ&Aは手動レビューが必要です。':''}</div><div class="answer-box current-answer-box"><span class="label">CURRENT OFFICIAL ANSWER</span><p>${esc(plain(f.answer))}</p></div><div class="question-box"><span class="label">CURRENT OFFICIAL QUESTION</span><p>${esc(plain(f.question))}</p></div><div class="secondary">${(f.related1103TargetCards||[]).length?`<div class="detail-cards">${f.related1103TargetCards.map(c=>`<button class="card-chip" data-current-card="${esc(c)}">${esc(c)}の現行Q&A</button><button class="tag-chip" data-1103-card="${esc(c)}">1103当時資料</button>`).join('')}</div>`:''}${hm?`<section class="section"><h3>自動照合した当時資料</h3><button class="related-btn" data-1103-id="${esc(hm.id)}"><b>${esc(hm.id)}</b><span>類似度 ${esc(hm.questionSimilarity)} · ${esc(hm.layer)}</span></button></section>`:''}${renderHistoricalComparisonsForOfficial(f)}<section class="section"><h3>公式情報</h3><div class="current-row"><b>更新日</b>${esc(f.updatedAt||'不明')}</div><div class="current-row"><b>データ取得</b>${esc(state.official.meta.collectedAt||'')}</div><div class="current-row"><a href="${esc(f.url)}" target="_blank" rel="noreferrer">KONAMI公式Q&Aを開く（fid=${esc(f.fid)}）</a></div></section></div></div>`;
 $('backButton').onclick=showListMobile;$('favButton').onclick=()=>toggleFavorite('current',f.fid);$('copyRuling').onclick=e=>copyItem('current',f,e.currentTarget);$('focusButton').onclick=()=>{state.focus=!state.focus;renderCurrentDetail(f)};$('detailPanel').querySelectorAll('[data-current-card]').forEach(b=>b.onclick=()=>setQuery(b.dataset.currentCard,state.mode==='retro'?'retro':'current'));$('detailPanel').querySelectorAll('[data-1103-card]').forEach(b=>b.onclick=()=>setQuery(b.dataset['1103Card'],'all'));$('detailPanel').querySelectorAll('[data-1103-id]').forEach(b=>b.onclick=()=>{state.mode='all';renderModes();selectRuling(b.dataset['1103Id'],true)})}
function cardSuggestions(q){const nq=searchNorm(q),cq=compact(q);if(!nq)return [];const src=(state.mode==='current'||state.mode==='retro')?state.officialCards:state.cards;return src.map(x=>({name:x.name,count:x.count,norm:searchNorm(x.name),compact:compact(x.name),exact:compact(x.name)===cq})).filter(x=>x.norm.includes(nq)||x.compact.includes(cq)).sort((a,b)=>(b.exact-a.exact)||(a.compact.indexOf(cq)-b.compact.indexOf(cq))||(b.count-a.count)||a.name.localeCompare(b.name,'ja')).slice(0,8)}
function renderSuggest(){if(!state.data||!state.official)return;const q=$('searchInput').value.trim(),items=cardSuggestions(q);state.suggestIndex=-1;if(!q||!items.length){hideSuggest();return}$('suggest').innerHTML=`<div class="suggest-title">カード名候補</div>${items.map((x,i)=>`<button class="suggest-btn" data-i="${i}" data-card="${esc(x.name)}"><b>${esc(x.name)}</b><span>${x.count}件</span></button>`).join('')}`;$('suggest').classList.add('visible');$('suggest').querySelectorAll('[data-card]').forEach(b=>b.onclick=()=>setQuery(b.dataset.card,state.mode==='retro'?'retro':state.mode==='current'?'current':'all'))}
function hideSuggest(){$('suggest').classList.remove('visible');state.suggestIndex=-1}
function moveSuggest(dir){const bs=[...$('suggest').querySelectorAll('.suggest-btn')];if(!bs.length)return;state.suggestIndex=(state.suggestIndex+dir+bs.length)%bs.length;bs.forEach((b,i)=>b.classList.toggle('active',i===state.suggestIndex));bs[state.suggestIndex].scrollIntoView({block:'nearest'})}
function chooseSuggest(){const bs=[...$('suggest').querySelectorAll('.suggest-btn')];if(state.suggestIndex>=0&&bs[state.suggestIndex])setQuery(bs[state.suggestIndex].dataset.card,state.mode==='retro'?'retro':state.mode==='current'?'current':'all')}
function applyData(data,official){if(!data?.meta||!Array.isArray(data.rulings))throw new Error('1103裁定データの形式が正しくありません。');if(!official?.meta||!Array.isArray(official.faqs))throw new Error('現行公式Q&Aデータの形式が正しくありません。');const extra=window.__WIKI_RULINGS_DATA__;if(extra&&Array.isArray(extra.rulings))data={...data,rulings:[...data.rulings,...extra.rulings]};data.rulings.forEach(r=>r.__index=makeIndex(r));official.faqs.forEach(f=>{f.__index=makeOfficialIndex(f);state.officialByFid.set(String(f.fid),f);for(const c of f.related1103TargetCards||[]){const k=norm(c);if(!state.officialByCard.has(k))state.officialByCard.set(k,[]);state.officialByCard.get(k).push(f)}});state.data=data;state.official=official;const counts=new Map();data.rulings.forEach(r=>(r.cards||[]).forEach(c=>{counts.set(c,(counts.get(c)||0)+1);const k=norm(c);if(!state.historicalByCard.has(k))state.historicalByCard.set(k,[]);state.historicalByCard.get(k).push(r)}));state.cards=[...counts].map(([name,count])=>({name,count}));const oc=new Map();official.faqs.forEach(f=>(f.related1103TargetCards||[]).forEach(c=>oc.set(c,(oc.get(c)||0)+1)));state.officialCards=[...oc].map(([name,count])=>({name,count}));buildReviewCandidates();$('environment').textContent='2011.03 LIMIT · ～2011.08';const reviewedCount=data.rulings.filter(r=>r.layer!=='historical_wiki').length,wikiCount=data.rulings.length-reviewedCount;const cc=official.meta.retro1103Classification?.counts||{};$('footerVersion').textContent=`${data.meta.title} v${data.meta.version} · ${reviewedCount} reviewed + ${wikiCount} historical Wiki + ${official.faqs.length} current official · inference A${cc.A||0}/B${cc.B||0}/C${cc.C||0}/D${cc.D||0}/X${cc.X||0}`;
 const params=new URLSearchParams(location.search),linkedCard=(params.get('card')||'').trim();if(linkedCard){$('searchInput').value=linkedCard;state.query=linkedCard;state.mode=params.get('layer')==='retro'?'retro':params.get('layer')==='current'?'current':'all'}renderModes();renderQuick();renderList();const hash=decodeURIComponent(location.hash.slice(1));if(hash.startsWith('OFFICIAL-')&&state.officialByFid.has(hash.slice(9))){state.mode='current';renderModes();selectCurrent(hash.slice(9),false)}else if(hash&&data.rulings.some(r=>r.id===hash)){selectRuling(hash,false)}else if(linkedCard){if(innerWidth>900){const rows=state.mode==='retro'?retroRows():state.mode==='current'?currentRows():historicalRows();if(rows[0])(state.mode==='retro'||state.mode==='current')?selectCurrent(rows[0].fid,false):selectRuling(rows[0].id,false)}else showListMobile()}else if(innerWidth>900&&data.rulings[0])selectRuling(data.rulings[0].id,false);else showListMobile()}
async function boot(){loadLocal();$('searchInput').addEventListener('input',e=>{state.query=e.target.value;if(state.mode==='fav'||state.mode==='recent')state.mode='all';renderModes();renderQuick();renderList();renderSuggest()});$('searchInput').addEventListener('keydown',e=>{if(e.key==='ArrowDown'){e.preventDefault();moveSuggest(1)}else if(e.key==='ArrowUp'){e.preventDefault();moveSuggest(-1)}else if(e.key==='Enter'&&$('suggest').classList.contains('visible')&&state.suggestIndex>=0){e.preventDefault();chooseSuggest()}else if(e.key==='Escape')hideSuggest()});$('clearSearch').onclick=()=>{$('searchInput').value='';state.query='';hideSuggest();renderList();$('searchInput').focus()};document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>setMode(b.dataset.mode)));document.addEventListener('click',e=>{if(!e.target.closest('.search-wrap'))hideSuggest()});addEventListener('keydown',e=>{if(e.key==='/'&&!/input|textarea/i.test(document.activeElement.tagName)){e.preventDefault();$('searchInput').focus()}if(e.key==='Escape'&&innerWidth<=900)showListMobile()});addEventListener('popstate',()=>{const id=decodeURIComponent(location.hash.slice(1));if(id.startsWith('OFFICIAL-')){state.mode='current';renderModes();selectCurrent(id.slice(9),false)}else if(id&&state.data?.rulings.some(r=>r.id===id))selectRuling(id,false);else showListMobile()});try{applyData(window.__RULINGS_DATA__,window.__OFFICIAL_CURRENT_DATA__)}catch(err){$('detailPanel').innerHTML=`<div class="empty"><div><b>裁定データを読み込めませんでした</b>${esc(err.message)}</div></div>`}}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();
