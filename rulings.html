<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>1103 裁定DB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;700;800&family=Cinzel:wght@700;900&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --bg:#120d08;--bg2:#161007;--surface:#1e1710;--surface2:#292015;--surface3:#352a1b;
  --line:rgba(201,162,75,.22);--lineHi:rgba(201,162,75,.48);
  --ink:#f0e7d2;--dim:#a2937c;--gold:#c9a24b;--goldHi:#e4c06a;--goldInk:#14100a;
  --paper:#e9e4d6;--paperInk:#211b13;
  --danger:#ef6b5e;--ok:#74c89a;--warn:#e3a94f;
  --radius:2px;--shadow:0 18px 50px rgba(0,0,0,.27);
  --bottomNav:0px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink)}
body{
  font-family:"Noto Sans JP",system-ui,sans-serif;
  background:
   radial-gradient(140% 80% at 50% -10%,rgba(201,162,75,.18),transparent 72%),
   radial-gradient(140% 80% at 50% 110%,rgba(201,162,75,.12),transparent 72%),
   linear-gradient(180deg,var(--bg),var(--bg2));
}
button,input{font:inherit}
button{color:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--goldHi);outline-offset:2px}
.app{max-width:1460px;margin:auto;padding:14px 14px calc(18px + var(--bottomNav))}
.app-header{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;padding:10px 2px 13px}
.brand-title{font-family:"Shippori Mincho",serif;font-size:25px;font-weight:800;letter-spacing:.05em;margin:0}
.brand-sub{margin:4px 0 0;color:var(--dim);font-size:10px}
.env{font-family:"Cinzel",serif;color:var(--gold);font-size:10px;letter-spacing:.08em;white-space:nowrap}
.search-shell{position:sticky;top:0;z-index:30;padding:8px 0 10px;background:linear-gradient(180deg,rgba(18,13,8,.98) 70%,rgba(18,13,8,.75),transparent)}
.search-wrap{position:relative}
.search{
  height:48px;border:1px solid var(--lineHi);background:rgba(20,15,10,.96);
  display:grid;grid-template-columns:38px 1fr 42px;align-items:center;box-shadow:0 8px 25px rgba(0,0,0,.22)
}
.search-ic{text-align:center;color:var(--gold);font-size:20px}
.search input{min-width:0;height:100%;border:0;background:transparent;color:var(--ink);font-size:15px;outline:none}
.search input::placeholder{color:#8e806c}
.clear{height:100%;border:0;background:transparent;color:var(--dim);font-size:20px;cursor:pointer}
.suggest{
  display:none;position:absolute;top:52px;left:0;right:0;z-index:50;background:#16100b;border:1px solid var(--lineHi);
  box-shadow:var(--shadow);max-height:330px;overflow:auto
}
.suggest.visible{display:block}
.suggest-title{padding:8px 11px 6px;color:var(--dim);font-size:9px;letter-spacing:.08em}
.suggest-btn{display:flex;width:100%;align-items:center;justify-content:space-between;gap:12px;text-align:left;padding:11px 12px;border:0;border-top:1px solid rgba(201,162,75,.1);background:transparent;cursor:pointer}
.suggest-btn:hover,.suggest-btn.active{background:var(--surface2)}
.suggest-btn b{font-family:"Shippori Mincho",serif;font-size:13px}.suggest-btn span{font-size:9px;color:var(--dim)}
.mode-tabs{display:flex;gap:7px;margin:0 0 10px}
.mode{
  border:1px solid var(--line);background:var(--surface);color:var(--dim);min-height:38px;padding:0 13px;cursor:pointer;
  font-size:11px;font-weight:700
}
.mode.active{background:var(--gold);border-color:var(--gold);color:var(--goldInk)}
.mode .count{font-family:"Cinzel",serif;margin-left:5px;font-size:9px}
.quick{display:none;margin:0 0 10px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:9px 0}
.quick.visible{display:block}
.quick-head{display:flex;justify-content:space-between;align-items:center;padding:0 2px 7px}
.quick-head b{font-size:10px;color:var(--goldHi)}.quick-head span{font-size:9px;color:var(--dim)}
.quick-items{display:flex;gap:6px;overflow:auto;scrollbar-width:none}.quick-items::-webkit-scrollbar{display:none}
.quick-btn{flex:0 0 auto;max-width:260px;text-align:left;background:var(--surface);border:1px solid var(--line);padding:8px 10px;cursor:pointer}
.quick-btn b,.quick-btn span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.quick-btn b{font-size:10px}.quick-btn span{font-size:8px;color:var(--dim);margin-top:2px}
.workspace{display:grid;grid-template-columns:minmax(330px,.82fr) minmax(560px,1.48fr);gap:10px;align-items:start}
.panel{border:1px solid var(--line);background:rgba(25,19,13,.92);box-shadow:var(--shadow)}
.panel-head{height:42px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;border-bottom:1px solid var(--line)}
.panel-head b{font-family:"Shippori Mincho",serif;font-size:13px}.panel-head span{font-size:9px;color:var(--dim)}
.result-list{max-height:calc(100vh - 200px);min-height:480px;overflow:auto}
.result{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid rgba(201,162,75,.1);background:transparent;padding:12px 13px;cursor:pointer;position:relative}
.result:hover{background:rgba(201,162,75,.06)}.result.active{background:var(--surface2)}.result.active:before{content:"";position:absolute;inset:0 auto 0 0;width:3px;background:var(--goldHi)}
.result-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.result h3{margin:0;font-family:"Shippori Mincho",serif;font-size:14px;line-height:1.4}
.result-q{margin:5px 0 0;color:var(--dim);font-size:10px;line-height:1.55;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.result-a{margin:6px 0 0;color:var(--ink);font-size:11px;font-weight:700;line-height:1.6;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cardline{margin-top:7px;color:var(--gold);font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.verdict{flex:0 0 auto;border:1px solid var(--lineHi);padding:3px 6px;font-size:8px;font-weight:900;white-space:nowrap}
.v-can{color:var(--ok)}.v-cannot{color:var(--danger)}.v-conditional{color:var(--warn)}.v-investigating{color:#9fb4d9}
.favstar{color:var(--goldHi)}
mark{background:rgba(228,192,106,.22);color:inherit;padding:0 1px}
.empty{min-height:300px;display:grid;place-items:center;text-align:center;color:var(--dim);padding:30px;font-size:11px;line-height:1.8}
.empty b{display:block;color:var(--ink);font-family:"Shippori Mincho",serif;font-size:15px;margin-bottom:5px}
.detail{min-height:570px}
.detail-actions{display:flex;align-items:center;justify-content:space-between;gap:8px;height:46px;padding:0 10px;border-bottom:1px solid var(--line);position:sticky;top:66px;z-index:20;background:rgba(25,19,13,.98)}
.action-group{display:flex;gap:6px}
.action{height:32px;border:1px solid var(--line);background:var(--surface);padding:0 10px;font-size:9px;cursor:pointer}
.action:hover,.action.faved{border-color:var(--goldHi);color:var(--goldHi)}
.detail-inner{padding:18px}
.eyebrow{font-family:"Cinzel",serif;font-size:9px;color:var(--gold);letter-spacing:.08em}
.detail h2{font-family:"Shippori Mincho",serif;font-size:24px;line-height:1.35;margin:5px 0 10px}
.detail-meta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.meta-chip{border:1px solid var(--line);font-size:8px;padding:3px 6px;color:var(--dim)}
.alert{border-left:3px solid var(--warn);background:rgba(227,169,79,.08);padding:9px 11px;margin:10px 0;font-size:10px;line-height:1.65;color:#d8c9b1}
.answer-box{background:var(--paper);color:var(--paperInk);border:1px solid #c8b98d;padding:15px 16px;margin:12px 0 10px;box-shadow:0 7px 20px rgba(0,0,0,.18)}
.answer-box .label,.question-box .label,.section-label{display:block;font-family:"Cinzel",serif;font-size:9px;letter-spacing:.12em;font-weight:900;margin-bottom:7px}
.answer-box .label{color:#7b5b1e}.answer-box p{margin:0;font-family:"Shippori Mincho",serif;font-size:19px;font-weight:800;line-height:1.65}
.question-box{border:1px solid var(--line);background:#130f0a;padding:12px 13px}.question-box .label{color:var(--gold)}.question-box p{margin:0;font-size:12px;line-height:1.75}
.focus .answer-box p{font-size:24px}.focus .question-box,.focus .secondary,.focus .footer{display:none}
.detail-cards{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 2px}
.card-chip,.tag-chip{border:1px solid var(--line);background:var(--surface);padding:5px 7px;font-size:9px;cursor:pointer}
.card-chip{color:var(--goldHi)}.tag-chip{color:var(--dim)}
.section{margin-top:16px;padding-top:13px;border-top:1px solid var(--line)}
.section h3{font-family:"Shippori Mincho",serif;margin:0 0 8px;font-size:14px}
.steps{margin:0;padding-left:22px}.steps li{font-size:11px;line-height:1.8;padding-left:3px}
.tip{font-size:11px;line-height:1.8;color:#ded2bd}
.related{display:grid;gap:6px}
.related-btn{border:1px solid var(--line);background:#15100b;text-align:left;padding:9px 10px;cursor:pointer}
.related-btn:hover{border-color:var(--lineHi);background:var(--surface2)}
.related-btn b,.related-btn span{display:block}.related-btn b{font-size:11px}.related-btn span{font-size:9px;color:var(--dim);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
details.proof{margin-top:14px;border-top:1px solid var(--line);padding-top:10px}
details.proof summary{cursor:pointer;color:var(--dim);font-size:10px}
.proof-body{padding-top:9px}.proof-body a{display:block;color:var(--goldHi);font-size:10px;line-height:1.6;margin:6px 0}.review{font-size:9px;color:var(--dim);line-height:1.7}
.footer{text-align:center;color:#756957;font-size:8px;padding:14px 0 4px}
.mobile-nav{display:none}
@media(max-width:900px){
  :root{--bottomNav:66px}
  .app{padding:8px 8px calc(12px + var(--bottomNav))}
  .app-header{padding:7px 2px 9px}.brand-title{font-size:21px}.brand-sub{display:none}.env{font-size:8px}
  .search-shell{top:0;padding:5px 0 7px}.search{height:46px}
  .mode-tabs{display:none}
  .quick{margin-bottom:7px}
  .workspace{display:block}.results-panel.mobile-hidden{display:none}.detail-panel{display:none}.detail-panel.mobile-open{display:block}
  .result-list{max-height:none;min-height:calc(100vh - 180px)}.result{padding:13px 11px}.result h3{font-size:14px}.result-a{font-size:11px}
  .detail{min-height:calc(100vh - 135px)}.detail-actions{top:58px;height:44px;padding:0 7px}.detail-inner{padding:14px 10px 22px}.detail h2{font-size:21px}
  .answer-box{padding:14px 13px}.answer-box p{font-size:19px}.focus .answer-box p{font-size:25px}
  .mobile-nav{
    display:grid;grid-template-columns:repeat(3,1fr);position:fixed;z-index:80;left:0;right:0;bottom:0;
    padding:6px 8px calc(6px + env(safe-area-inset-bottom));background:rgba(15,11,7,.98);border-top:1px solid var(--lineHi)
  }
  .nav-btn{height:48px;border:0;background:transparent;color:var(--dim);font-size:9px;font-weight:700;display:grid;place-items:center;align-content:center;gap:2px;cursor:pointer}
  .nav-btn i{font-style:normal;font-size:18px;line-height:1}.nav-btn.active{color:var(--goldHi)}
  body.detail-open .mobile-nav{display:none}
}

.source-badge{display:inline-flex;align-items:center;border:1px solid var(--line);padding:2px 5px;font-size:8px;font-weight:800;letter-spacing:.04em;white-space:nowrap}
.source-badge.curated{color:var(--goldHi);border-color:#725d30;background:#1b150c}
.source-badge.reviewed{color:#e5cf91;border-color:#76633d;background:#17140e}
.source-badge.wiki{color:#a99c89;border-color:#4b4338;background:#14110e}
.result.is-wiki{border-left:2px solid #4b4338}
.result.is-reviewed{border-left:2px solid #8b7543}
.layer-note{font-size:9px;color:var(--dim);line-height:1.6;margin:5px 0 0}
</style>
</head>
<body>
<main class="app">
<header class="app-header">
  <div><h1 class="brand-title">1103 裁定DB</h1><p class="brand-sub">レビュー済み裁定＋2011旧Wiki FAQを横断検索</p></div>
  <div style="display:flex;align-items:center;gap:10px">
    <a href="index.html" style="color:var(--goldHi);text-decoration:none;font-size:10px;font-weight:700;white-space:nowrap">← デッキビルダー</a>
    <div class="env" id="environment">2011.03 LIMIT · ～2011.08</div>
  </div>
</header>

<section class="search-shell">
  <div class="search-wrap">
    <div class="search">
      <div class="search-ic">⌕</div>
      <input id="searchInput" type="search" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="カード名・状況を検索">
      <button id="clearSearch" class="clear" aria-label="検索を消す">×</button>
    </div>
    <div class="suggest" id="suggest"></div>
  </div>
</section>

<nav class="mode-tabs" id="modeTabs">
  <button class="mode active" data-mode="all">裁定を探す <span class="count" id="allCount"></span></button>
  <button class="mode" data-mode="fav">☆ 保存 <span class="count" id="favCount"></span></button>
  <button class="mode" data-mode="recent">↶ 履歴 <span class="count" id="recentCount"></span></button>
</nav>

<section class="quick" id="quick"></section>

<section class="workspace">
  <section class="panel results-panel" id="resultsPanel">
    <div class="panel-head"><b id="listTitle">裁定一覧</b><span id="resultSummary"></span></div>
    <div class="result-list" id="resultList"></div>
  </section>
  <article class="panel detail detail-panel" id="detailPanel">
    <div class="empty"><div><b>カード名を検索してください</b>一覧から裁定を選ぶと、答えを最上段に表示します。</div></div>
  </article>
</section>

<footer class="footer" id="footerVersion"></footer>
</main>

<nav class="mobile-nav" id="mobileNav">
  <button class="nav-btn active" data-mode="all"><i>⌕</i><span>検索</span></button>
  <button class="nav-btn" data-mode="fav"><i>☆</i><span>保存</span></button>
  <button class="nav-btn" data-mode="recent"><i>↶</i><span>履歴</span></button>
</nav>

を発動できる時点では、フィールドにモンスターがいない。","破壊できるモンスターが存在しないため、激流葬は発動できない。"],"deckTip":"フィールド魔法なしでSinを一時的な召喚成功トリガーとして使うことはできない。自分の激流葬を能動的に起動する目的でも、別のモンスターが必要。","simulator":{"ruleKey":"continuous_self_destruction_before_response_window","expected":"summon_success -> immediate_continuous_check -> destroy_sin -> response_window","engineGap":false,"implementationNote":"特殊召喚成功直後、召喚反応ウィンドウを開く前に永続効果を再評価する。"},"sourceRefs":["SRC-1103-MAJOR-RULINGS"],"reviewNote":"当時公式FAQの原ページまたは保存版を追加確認する。"},{"id":"R1103-SIN-002","layer":"card","title":"フィールド魔法なしでSinを特殊召喚：他のモンスターあり","question":"フィールド魔法が存在しない状態で「Sin スターダスト・ドラゴン」を特殊召喚し、自壊後もフィールドに別のモンスターが残る場合、その特殊召喚に対して「激流葬」を発動できるか。","answer":"発動できる。特殊召喚されたSin自身は先に自壊するが、召喚成功時の発動タイミングは残り、破壊できる別のモンスターが存在するため。","verdict":"can","status":"secondary_confirmed","confidence":"medium","historicalScope":"1103","cards":["Sin スターダスト・ドラゴン","激流葬"],"tags":["Sin","特殊召喚成功時","自壊","永続効果","激流葬","発動可否"],"steps":["Sin スターダスト・ドラゴンの特殊召喚に成功する。","フィールド魔法がないため、Sinのみがただちに自壊する。","召喚成功時の発動タイミングで、別のモンスターがフィールドに存在する。","激流葬を発動し、その時点で存在するモンスターを全て破壊できる。"],"deckTip":"Sinが自壊しても召喚成功の事実は残る。別のモンスターがいれば激流葬の起動役にはなる。","simulator":{"ruleKey":"summon_event_survives_summoned_card_departure","expected":"summon_success -> destroy_sin -> response_window_with_summon_event","engineGap":false,"implementationNote":"召喚イベントと召喚されたカードの現在位置を分けて保持する。"},"sourceRefs":["SRC-1103-MAJOR-RULINGS"],"reviewNote":"当時公式FAQの原ページまたは保存版を追加確認する。"},{"id":"R1103-SIN-003","layer":"interaction","title":"自壊前のSinを闇のデッキ破壊ウイルスのコストにできるか","question":"フィールド魔法が存在しない状態で「Sin スターダスト・ドラゴン」を特殊召喚した直後、自壊する前にそのSinをリリースして「闇のデッキ破壊ウイルス」を発動できるか。","answer":"発動できない。特殊召喚成功後、カードを発動できるタイミングを迎える前にSinの自壊する永続効果が適用される。","verdict":"cannot","status":"needs_primary_source","confidence":"low","historicalScope":"1103","cards":["Sin スターダスト・ドラゴン","闇のデッキ破壊ウイルス"],"tags":["Sin","自壊","永続効果","リリース","コスト","発動タイミング"],"steps":["Sin スターダスト・ドラゴンの特殊召喚に成功する。","優先権を行使して罠を発動する前に、表側モンスターの永続効果を適用する。","フィールド魔法がないためSinが破壊され、リリースできるカードとして残らない。"],"deckTip":"Sinをウイルス媒体にするなら、表側のフィールド魔法かスキルドレイン等で自壊を止めた状態が必要。","simulator":{"ruleKey":"continuous_effect_precedes_fast_effect_window","expected":"summon_success -> immediate_continuous_check -> destroy_sin -> no_virus_cost","engineGap":false,"implementationNote":"同じ自壊チェックを召喚反応罠とフリーチェーン罠の双方より先に行う。"},"sourceRefs":["SRC-1103-MAJOR-RULINGS","SRC-DARK-VIRUS-OFFICIAL"],"reviewNote":"遊戯王Wikiの旧バックアップに同一Q&Aの痕跡あり。当時の回答全文を一次資料で確認するまで低信頼表示。"},{"id":"R1103-GEAR-001","layer":"card","title":"自分の歯車街の上に新しいフィールド魔法をセット","question":"自分の「歯車街」が表側表示で存在する時、自分が新しいフィールド魔法をその上からセットした。破壊され墓地へ送られた歯車街の特殊召喚効果を発動できるか。","answer":"発動できる。1103当時はフィールド魔法の張り替えで古いフィールド魔法が破壊され、セットの場合は歯車街の破壊後に別の効果処理が入らないため、発動タイミングを逃さない。","verdict":"can","status":"historical_source_confirmed","confidence":"high","historicalScope":"1103","cards":["歯車街"],"tags":["歯車街","フィールド魔法","セット","張り替え","破壊された時","タイミングを逃す"],"steps":["新しいフィールド魔法をセットする。","古い歯車街は1103当時のルールで破壊され、墓地へ送られる。","新しいカードをセットする処理と旧カードの破壊は同時扱いとなる。","直後のタイミングで歯車街の任意効果を発動できる。"],"deckTip":"1103では歯車街を能動的に起動する基本手段。新しいフィールド魔法を『発動』する場合との違いに注意。","simulator":{"ruleKey":"legacy_field_spell_replace_by_set","expected":"set_new_field_and_destroy_old_simultaneously -> open_optional_trigger","engineGap":true,"implementationNote":"現行ルールではなく、旧フィールド魔法張り替え処理を環境ルールとして固定する。"},"sourceRefs":["SRC-GEARTOWN-2011"],"reviewNote":"記事が引用する旧公式FAQ番号を保存版で再取得できれば一次資料確認済みに昇格。"},{"id":"R1103-GEAR-002","layer":"card","title":"自分の歯車街の上から新しいフィールド魔法を発動","question":"自分の「歯車街」が表側表示で存在する時、自分が新しいフィールド魔法をその上から発動した。破壊され墓地へ送られた歯車街の特殊召喚効果を発動できるか。","answer":"発動できない。旧フィールド魔法の破壊後に、新しいフィールド魔法を発動・適用する処理が続くため、「破壊され墓地へ送られた時」の任意効果はタイミングを逃す。","verdict":"cannot","status":"historical_source_confirmed","confidence":"high","historicalScope":"1103","cards":["歯車街"],"tags":["歯車街","フィールド魔法","発動","張り替え","時の任意効果","タイミングを逃す"],"steps":["古い歯車街を破壊してフィールドゾーンを空ける。","新しいフィールド魔法を発動し、その処理を適用する。","処理終了時は歯車街が破壊された直後ではない。","歯車街の任意効果は発動タイミングを逃す。"],"deckTip":"同じ張り替えでも『セット』なら発動でき、『発動』ではタイミングを逃す。1103デッキで特に重要な操作差。","simulator":{"ruleKey":"legacy_field_spell_replace_by_activation","expected":"destroy_old -> activate_and_apply_new -> optional_when_misses_timing","engineGap":true,"implementationNote":"セットと発動を同じreplaceField操作にまとめず、イベント順序を分ける。"},"sourceRefs":["SRC-GEARTOWN-2011"],"reviewNote":"旧公式FAQの保存版確認待ち。"},{"id":"R1103-GEAR-003","layer":"interaction","title":"相手が新しいフィールド魔法を発動して歯車街を破壊","question":"自分の「歯車街」が存在する時、相手が新しいフィールド魔法を発動して歯車街が破壊された。歯車街の特殊召喚効果を発動できるか。","answer":"発動できる。1103当時は相手のフィールド魔法の効果処理完了と歯車街の破壊が同時扱いとなり、歯車街が破壊された直後のタイミングを満たす。","verdict":"can","status":"historical_source_confirmed","confidence":"high","historicalScope":"1103","cards":["歯車街"],"tags":["歯車街","フィールド魔法","相手カード","張り替え","破壊された時"],"steps":["相手が新しいフィールド魔法を発動する。","新しいフィールド魔法の適用と、自分の歯車街の破壊が同時に完了する。","処理終了直後に歯車街の任意効果を発動できる。"],"deckTip":"相手のフィールド魔法による張り替えでも歯車街のリクルート効果を利用できる。","simulator":{"ruleKey":"legacy_opponent_field_spell_replace","expected":"opponent_field_activation_resolves_and_old_field_destroyed_simultaneously -> trigger","engineGap":true,"implementationNote":"旧ルールの単一フィールド魔法制をプレイヤー間イベントとして実装する。"},"sourceRefs":["SRC-GEARTOWN-2011"],"reviewNote":"旧公式FAQの保存版確認待ち。"},{"id":"R1103-GEAR-VANITY-001","layer":"interaction","title":"歯車街＋虚無空間の状態で新しいフィールド魔法をセット","question":"自分フィールドに表側表示の「歯車街」と「虚無空間」がある状態で、新しいフィールド魔法をセットした。歯車街の効果で「古代の機械巨竜」を特殊召喚できるか。","answer":"調査中。歯車街と虚無空間の効果が同じ出来事を契機に発動する場合のチェーン順と、1103当時の虚無空間の効果分類を確定する必要がある。現段階ではデュエルシミュレーターが自動確定してはいけない。","verdict":"investigating","status":"researching","confidence":"low","historicalScope":"1103","cards":["歯車街","虚無空間","古代の機械巨竜"],"tags":["歯車街","虚無空間","特殊召喚制限","同時誘発","チェーン順","要検証"],"steps":["新しいフィールド魔法のセットにより、旧ルール上の歯車街が破壊され墓地へ送られる。","歯車街の任意効果と、虚無空間の自壊効果が発動条件を満たす可能性がある。","どちらを先にチェーンへ積むかで、歯車街の解決時に特殊召喚制限が残るかが変わる。","1103当時の公式回答または当時ログが確認できるまで結論を固定しない。"],"deckTip":"実戦で揉めやすい相互作用。現状は対戦前に採用ルールを確認し、DBの確定後に更新する。","simulator":{"ruleKey":"legacy_geartown_vanity_simultaneous_trigger","expected":"manual_ruling_required","engineGap":true,"implementationNote":"調査完了まではMANUALへ送り、関連裁定カードを表示する。"},"sourceRefs":["SRC-GEARTOWN-2011","SRC-VANITY-OFFICIAL"],"reviewNote":"最優先調査。現行公式FAQだけでは1103当時の結論を確定できない。"},{"id":"R1103-RULE-001","layer":"common","title":"『～した時、できる』任意効果とタイミング","question":"『～した時、～できる』と書かれた任意効果は、条件を満たした後に別の処理が続いた場合でも発動できるか。","answer":"原則として発動できない。条件を満たしたことが、直前に完了した処理である必要がある。カード固有裁定や同時扱いの有無を優先して確認する。","verdict":"conditional","status":"historical_source_confirmed","confidence":"high","historicalScope":"1103","cards":[],"tags":["共通ルール","時の任意効果","タイミングを逃す","チェーン処理"],"steps":["発動条件となる出来事が起きる。","その後に別の処理が続いたかを確認する。","別の処理が続けば、条件を満たした直後ではないため発動できない。","複数の処理が同時扱いなら、条件を満たした直後として扱える場合がある。"],"deckTip":"歯車街などの『時・できる』カードは、破壊方法だけでなく処理順まで含めて採用コンボを確認する。","simulator":{"ruleKey":"optional_when_last_event","expected":"trigger_only_if_condition_is_last_completed_event","engineGap":false,"implementationNote":"イベント履歴にlastResolvedEventとsimultaneousGroupを持たせる。"},"sourceRefs":["SRC-GEARTOWN-2011"],"reviewNote":"共通ルールとしてカード個別裁定より下位に適用する。"},{"id":"R1103-SHIEN-001","layer":"card","title":"真六武衆－シエンの無効化効果をダメージステップで発動","question":"「真六武衆－シエン」の魔法・罠カードの発動を無効にする効果は、ダメージステップやダメージ計算時にも発動できるか。","answer":"発動できる。カードの発動を無効にする効果であるため、ダメージステップおよびダメージ計算時にも発動可能。","verdict":"can","status":"secondary_confirmed","confidence":"medium","historicalScope":"1103","cards":["真六武衆－シエン"],"tags":["真六武衆","シエン","ダメージステップ","ダメージ計算時","発動無効"],"steps":["ダメージステップ中に魔法・罠カードが発動する。","発動無効効果に許されたタイミングか確認する。","真六武衆－シエンの誘発即時効果をチェーンして発動できる。"],"deckTip":"ダメージステップで使われる収縮系・戦闘補助系の魔法・罠にもシエンで対応できる。","simulator":{"ruleKey":"activation_negation_allowed_in_damage_calculation","expected":"spell_trap_activation_in_damage_step -> shien_response_allowed","engineGap":false,"implementationNote":"通常のダメステ制限より、発動無効カテゴリの許可を優先する。"},"sourceRefs":["SRC-1103-MAJOR-RULINGS"],"reviewNote":"当時公式FAQの保存版確認待ち。"},{"id":"R1103-SHIEN-002","layer":"interaction","title":"真六武衆－シエンはカウンター罠を無効にできるか","question":"カウンター罠の発動に対して「真六武衆－シエン」の効果を発動できるか。","answer":"発動できない。真六武衆－シエンの効果はスペルスピード2であり、スペルスピード3のカウンター罠へチェーンできない。","verdict":"cannot","status":"secondary_confirmed","confidence":"medium","historicalScope":"1103","cards":["真六武衆－シエン"],"tags":["真六武衆","シエン","カウンター罠","スペルスピード","チェーン不可"],"steps":["カウンター罠が発動する。","直前の効果はスペルスピード3として扱う。","スペルスピード2のシエンはチェーンできない。"],"deckTip":"シエンが立っていても神の宣告・神の警告などのカウンター罠は別枠で対策が必要。","simulator":{"ruleKey":"spell_speed_chain_gate","expected":"counter_trap_speed_3 -> reject_shien_speed_2","engineGap":false,"implementationNote":"カード種別ではなく現在のチェーン速度で応答可否を判定する。"},"sourceRefs":["SRC-1103-MAJOR-RULINGS"],"reviewNote":"スペルスピード共通ルールの一次資料を追加予定。"},{"id":"R1103-SHIEN-003","layer":"card","title":"発動後に真六武衆－シエンがフィールドを離れた場合","question":"真六武衆－シエンの無効化効果を発動した後、チェーンされた効果でシエンがフィールドを離れた。その無効化効果は適用されるか。","answer":"適用される。発動済みの効果は、効果解決時にシエン自身がフィールドに存在しなくても無効化と破壊を処理する。","verdict":"can","status":"secondary_confirmed","confidence":"medium","historicalScope":"1103","cards":["真六武衆－シエン"],"tags":["真六武衆","シエン","効果解決","フィールドを離れる","無効化"],"steps":["シエンの無効化効果を発動する。","上位チェーンでシエンがフィールドを離れる。","チェーン解決時、発動済みのシエンの効果を通常どおり処理する。"],"deckTip":"シエン本体をチェーン除去するだけでは、既に発動した無効化を止められない。","simulator":{"ruleKey":"activated_effect_resolves_without_source","expected":"source_leaves_field -> previously_activated_effect_still_resolves","engineGap":false,"implementationNote":"チェーンリンクに解決情報を保存し、発生源の現在位置へ依存させない。"},"sourceRefs":["SRC-1103-MAJOR-RULINGS"],"reviewNote":"無効化される等の別条件がない通常例。"},{"id":"R1103-SHIEN-004","layer":"interaction","title":"墓地の真六武衆－シエンを六武の門で手札に加える","question":"墓地の「真六武衆－シエン」を「六武の門」の効果で手札に加えられるか。","answer":"効果を適用できる。ただしシンクロモンスターなので手札には加わらず、エクストラデッキへ戻る。","verdict":"can","status":"secondary_confirmed","confidence":"medium","historicalScope":"1103","cards":["真六武衆－シエン","六武の門"],"tags":["真六武衆","シエン","六武の門","サルベージ","エクストラデッキ"],"steps":["墓地の真六武衆－シエンを六武の門で選ぶ。","手札へ戻す処理を適用する。","シンクロモンスターのためエクストラデッキへ戻る。"],"deckTip":"門の回収効果でシエンを再度シンクロ召喚できる状態へ戻せる。手札枚数は増えない。","simulator":{"ruleKey":"extra_deck_monster_return_destination","expected":"return_synchro_to_hand -> redirect_to_extra_deck","engineGap":false,"implementationNote":"手札へ戻す操作にEXモンスターの行先置換を共通実装する。"},"sourceRefs":["SRC-1103-MAJOR-RULINGS"],"reviewNote":"カード名条件と行先置換を分けて扱う。"},{"id":"R1103-SCAPEGOAT-001","layer":"card","title":"スケープ・ゴートを発動したターンのモンスターセット","question":"「スケープ・ゴート」を発動したターン、モンスターを通常の手順でセットできるか。またカード効果でセットできるか。","answer":"通常のモンスターセットはできる。当時テキストで禁止されるのは召喚・反転召喚・特殊召喚であり、通常のセットは召喚ではない。ただしカード効果によるセットは特殊召喚扱いになるためできない。","verdict":"conditional","status":"secondary_confirmed","confidence":"medium","historicalScope":"1103","cards":["スケープ・ゴート"],"tags":["スケープ・ゴート","セット","召喚制限","特殊召喚扱い"],"steps":["スケープ・ゴートの発動後制約を記録する。","プレイヤーの通常セットは召喚に含めず許可する。","効果によるモンスターのセットは特殊召喚扱いとして拒否する。"],"deckTip":"相手エンドにスケープ・ゴートを使った後でも、自分ターンに通常のモンスターセットは可能。","simulator":{"ruleKey":"normal_set_is_not_summon_but_effect_set_is_special","expected":"normal_set_allowed; effect_set_rejected","engineGap":true,"implementationNote":"set操作にnormal_setとeffect_setの由来情報を持たせる。"},"sourceRefs":["SRC-1103-MAJOR-RULINGS"],"reviewNote":"当時カードテキスト版と現行表記の差を固定する。"},{"id":"R1103-SPORE-001","layer":"card","title":"スポーアの効果発動を無効にされた後の再発動","question":"「スポーア」の自己特殊召喚効果の発動を「天罰」などで無効にされた。同じデュエル中にもう一度発動できるか。","answer":"発動できない。発動が無効になっても『デュエル中に1度』使用した扱いは残る。","verdict":"cannot","status":"secondary_confirmed","confidence":"medium","historicalScope":"1103","cards":["スポーア","天罰"],"tags":["スポーア","デュエル中1度","発動無効","再発動不可","墓地効果"],"steps":["スポーアの自己特殊召喚効果を発動する。","その発動を無効にする。","スポーアのデュエル中使用済みフラグは消さない。"],"deckTip":"スポーアは無効札を受けると、そのデュエルでは再利用できないため発動タイミングが重要。","simulator":{"ruleKey":"once_per_duel_consumed_on_activation_attempt","expected":"activation_negated -> once_per_duel_flag_remains_used","engineGap":false,"implementationNote":"発動成功ではなく発動宣言時に使用済みフラグを立てる。"},"sourceRefs":["SRC-1103-MAJOR-RULINGS"],"reviewNote":"カードごとの『使用できる』制限として扱う。"},{"id":"R1103-SPORE-002","layer":"card","title":"スポーアの特殊召喚とレベル上昇のタイミング","question":"スポーアの効果で自己特殊召喚した場合、特殊召喚後に別処理としてレベルが上がるのか。また激流葬を発動できるか。","answer":"レベルが上がった状態で特殊召喚される一連の処理であり、後から別処理でレベルを上げるわけではない。特殊召喚成功時に激流葬は発動できる。","verdict":"can","status":"secondary_confirmed","confidence":"medium","historicalScope":"1103","cards":["スポーア","激流葬"],"tags":["スポーア","特殊召喚成功時","レベル変更","一連の処理","激流葬"],"steps":[ n_then_destroy","expected":"special_summon -> destroy_step -> no_summon_timing_triggers","engineGap":false,"implementationNote":"破壊枚数が0でも後続処理を通過したイベント履歴を残す。"},"sourceRefs":["SRC-1103-MAJOR-RULINGS"],"reviewNote":"破壊対象0枚時も結論が変わらない個別裁定を保持する。"},{"id":"R1103-MINDCONTROL-001","layer":"card","title":"精神操作で奪ったモンスターを裏側表示にした場合","question":"「精神操作」でコントロールを得たモンスターが裏側守備表示になった場合、攻撃・リリース不可とエンドフェイズに戻す処理は消えるか。","answer":"消えない。表示形式や一時的なコントロール変更に関係なく、精神操作が与えた制約はカード単位でエンドフェイズまで残り、最終的に元々のコントローラーへ戻す。","verdict":"cannot","status":"secondary_confirmed","confidence":"medium","historicalScope":"1103","cards":["精神操作"],"tags":["精神操作","コントロール奪取","裏側表示","残存効果","攻撃不可","リリース不可"],"steps":["精神操作の対象となったカードへ制約と返却予定を記録する。","そのカードが裏側表示になってもカード同一性を維持する。","エンドフェイズに元々のコントローラーへ戻す。"],"deckTip":"月の書で裏側にしてもリリース素材にはできず、返却義務も消えない。シンクロ素材には利用できる。","simulator":{"ruleKey":"card_bound_lingering_control_restrictions","expected":"set_facedown -> restrictions_and_return_schedule_persist","engineGap":true,"implementationNote":"公開情報が消えてもカードUIDに紐づく残存効果を保持する。"},"sourceRefs":["SRC-1103-MAJOR-RULINGS"],"reviewNote":"別カードとして扱われる再セット・一時除外との境界は別裁定で追加する。"},{"id":"R1103-SUPERVISE-001","layer":"interaction","title":"スーペルヴィスの発動にサイクロンをチェーン","question":"「スーペルヴィス」の発動にチェーンしてサイクロンで破壊し、装備される前に墓地へ送った場合、通常モンスターを特殊召喚する効果は発動するか。","answer":"発動する。発動が無効にされず、表側表示でフィールドから墓地へ送られた条件を満たすため。","verdict":"can","status":"secondary_confirmed","confidence":"medium","historicalScope":"1103","cards":["スーペルヴィス","サイクロン"],"tags":["スーペルヴィス","装備魔法","サイクロン","墓地へ送られた時","チェーン"],"steps":["スーペルヴィスを発動して表側表示になる。","チェーンされたサイクロンで、装備完了前に破壊され墓地へ送られる。","フィールドから墓地へ送られたため蘇生効果を新たに発動する。"],"deckTip":"サイクロンで装備を妨害されても、スーペルヴィスの蘇生効果による損失補填が働く。","simulator":{"ruleKey":"equip_spell_grave_trigger_before_equip_completion","expected":"faceup_activation -> chained_destroy -> grave_trigger","engineGap":false,"implementationNote":"装備関係成立前でもフィールド上で表側になった履歴を参照する。"},"sourceRefs":["SRC-1103-MAJOR-RULINGS"],"reviewNote":"発動無効との違いを対になる裁定で表示する。"},{"id":"R1103-SUPERVISE-002","layer":"interaction","t ゴン","E・HERO エアーマン"],"tags":["スターダスト・ドラゴン","E・HERO エアーマン","破壊不確定","発動条件"],"steps":["エアーマンが魔法・罠破壊モードを選ぶ。","効果発動時点で破壊枚数が0枚になり得る。","破壊が確定していないためスターダストは応答できない。"],"deckTip":"テキストに破壊処理が含まれるだけでは足りず、発動時点で破壊が確定している必要がある。","simulator":{"ruleKey":"destruction_must_be_certain_at_activation","expected":"optional_zero_destruction -> stardust_response_rejected","engineGap":true,"implementationNote":"効果カテゴリだけでなく、発動時選択後の破壊確定性を評価する。"},"sourceRefs":["SRC-1103-MAJOR-RULINGS"],"reviewNote":"対象選択後に破壊が確定するカードとの比較裁定を追加予定。"},{"id":"R1103-STARDUST-003","layer":"interaction","title":"王宮の弾圧によるチェーンに乗らない特殊召喚の無効","question":"シンクロ召喚などチェーンに乗らない特殊召喚へ王宮の弾圧が発動した場合、スターダスト・ドラゴンで弾圧を無効にできるか。","answer":"発動できない。特殊召喚を無効にして破壊されるモンスターは、召喚無効の時点ではまだフィールド上に存在しない扱いであり、『フィールド上のカードを破壊する効果』に該当しない。","verdict":"cannot","status":"secondary_confirmed","confidence":"medium","historicalScope":"1103","cards":["スターダスト・ドラゴン","王宮の弾圧"],"tags":["スターダスト・ドラゴン","王宮の弾圧","召喚無効","チェーンに乗らない特殊召喚","発動場所"],"steps":["チェーンに乗らない特殊召喚を宣言する。","王宮の弾圧でその特殊召喚を無効にする。","破壊対象はフィールド上扱いではないため、スターダストは発動できない。"],"deckTip":"スターダストがいても、弾圧によるシンクロ召喚・エクシーズ召喚そのものの無効化は守れない。","simulator":{"ruleKey":"summon_negation_card_not_on_field","expected":"inherent_summon_negation -> destruction_outside_field -> no_stardust","engineGap":true,"implementationNote":"召喚成功前の中間状態をフィールドゾーンと分離する。"},"sourceRefs":["SRC-1103-MAJOR-RULINGS"],"reviewNote":"1103当時の召喚無効中間状態を固定する重要裁定。"},{"id":"R1103-STARDUST-004","layer":"interaction","title":"死者蘇生へ発動された王宮の弾圧をスターダストで無効","question":"死者蘇生の発動に王宮の弾圧の特殊召喚効果を無効にする効果がチェーンされた。スターダスト・ドラゴンで弾圧を無効にできるか。","answer":"発動できる。この場合の王宮の弾圧は、フィールド上で発動した死者蘇生の効果を無効にしてそのカードを破壊するため、フィールド上のカードを破壊する効果に該当する。","verdict":"can","status":"secondary_confirmed","confidence":"medium","historicalScope":"1103","cards":["スターダスト・ドラゴン","王宮の弾圧","死者蘇生"],"tags":["スターダスト・ドラゴン","王宮の弾圧","死者蘇生","効果無効","フィールド破壊"],"steps":["死者蘇生を発動する。","王宮の弾圧がその特殊召喚効果を無効にして死者蘇生を破壊しようとする。","スターダストをチェーンして弾圧の効果を無効にできる。"],"deckTip":"同じ王宮の弾圧でも、召喚そのものを無効にする場合と蘇生カードの効果を無効にする場合で結果が変わる。","simulator":{"ruleKey":"oppression_effect_negation_destroys_field_card","expected":"chain_effect_summon_card -> oppression -> stardust_allowed","engineGap":true,"implementationNote":"弾圧の前半・後半を、破壊されるカードの場所で分類する。"},"sourceRefs":["SRC-1103-MAJOR-RULINGS"],"reviewNote":"召喚無効と効果無効を一つの処理へ統合しない。"},{"id":"R1103-STARDUST-005","layer":"interaction","title":"エンドフェイズのスターダスト蘇生を弾圧された後の再発動","question":"スターダスト・ドラゴンのエンドフェイズ蘇生効果を王宮の弾圧で無効にされた。同じエンドフェイズにもう一度蘇生効果を発動できるか。","answer":"発動できない。一度発動した蘇生効果を無効にされても、同じエンドフェイズ中に再度発動することはできない。","verdict":"cannot","status":"secondary_confirmed","confidence":"medium","historicalScope":"1103","cards":["スターダスト・ドラゴン","王宮の弾圧"],"tags":["スターダスト・ドラゴン","王宮の弾圧","エンドフェイズ","自己蘇生","再発動不可"],"steps":["エンドフェイズに自己蘇生効果を発動する。","王宮の弾圧でその効果を無効にする。","そのエンドフェイズの蘇生機会は使用済みとして再発動を許可しない。"],"deckTip":"弾圧を後から除去しても、そのエンドフェイズ中に同じスターダストは再度戻れない。","simulator":{"ruleKey":"stardust_end_phase_revive_once_per_opportunity","expected":"revive_negated -> no_retry_same_end_phase","engineGap":true,"implementationNote":"カードUIDごとにエンドフェイズ蘇生の試行済み状態を保持する。"},"sourceRefs":["SRC-1103-MAJOR-RULINGS"],"reviewNote":"ターンをまたいだ次回機会との区別が必要。"},{"id":"R1103-STARDUST-006","layer":"common","title":"同時誘発のチェーン順でスターダストが発動できなくなる場合","question":"同時に発動条件を満たした破壊効果と破壊しない効果がチェーン1・2に積まれた場合、スターダストはチェーン1の破壊効果へ発動できるか。","answer":"発動できない場合がある。スターダストは直前のチェーンリンクへ直接チェーンする必要があり、破壊しない効果が間に積まれると、それより前の破壊効果へ遡って発動できない。","verdict":"conditional","status":"secondary_confirmed","confidence":"medium","historicalScope":"1103","cards":["スターダスト・ドラゴン","雷帝ザボルグ","クリッター"],"tags":["スターダスト・ドラゴン","同時誘発","チェーン順","直接チェーン","発動タイミング"],"steps":["チェーン1に破壊効果を積む。","同時誘発した破壊しない効果をチェーン2に積む。","直前のチェーン2が破壊効果ではないためスターダストは発動できない。"],"deckTip":"同時誘発の組み方によってスターダストを封じられる場合がある。チェーン順の確認が重要。","simulator":{"ruleKey":"must_chain_directly_to_destroy_effect","expected":"non_destroying_link_intervenes -> stardust_rejected","engineGap":true,"implementationNote":"チェーン全体ではなく直前リンクだけを応答条件に評価する。"},"sourceRefs":["SRC-1103-MAJOR-RULINGS"],"reviewNote":"SEGOCのチェーン構築と組み合わせて適用する。"},{"id":"R1103-STARDUST-007"," ":"対象耐性では速攻のかかしを防げない。","simulator":{"ruleKey":"swift_scarecrow_non_targeting","expected":"no_target_selection","engineGap":false,"implementationNote":"対象選択UIを出さない。"},"sourceRefs":["SRC-1103-MAJOR-RULINGS"],"reviewNote":"攻撃モンスターの状態変化は解決時に再確認する。"},{"id":"R1103-SCARECROW-002","layer":"interaction","title":"攻撃宣言時のサイクロンに速攻のかかしをチェーン","question":"相手が直接攻撃宣言時にサイクロンを発動した。そのサイクロンへ速攻のかかしをチェーンできるか。","answer":"発動できる。同じ攻撃宣言時のチェーン上で手札から速攻のかかしを発動できる。","verdict":"can","status":"secondary_confirmed","confidence":"medium","historicalScope":"1103","cards":["速攻のかかし","サイクロン"],"tags":["速攻のかかし","サイクロン","攻撃宣言時","チェーン"],"steps":["相手が直接攻撃を宣言する。","相手が攻撃宣言時のサイクロンを発動する。","そのチェーンに速攻のかかしを発動する。"],"deckTip":"相手が攻撃宣言時に別の速攻効果を使っても、かかしの発動機会は直ちに失われない。","simulator":{"ruleKey":"attack_declaration_window_persists_in_chain","expected":"attack_declared -> other_chain_link -> scarecrow_allowed","engineGap":false,"implementationNote":"チェーン中も攻撃宣言イベントIDを保持する。"},"sourceRefs":["SRC-1103-MAJOR-RULINGS"],"reviewNote":"チェーン解決後の新しいチェーンで発動できるかとは分ける。"},{"id":"R1103-SCARECROW-003","layer":"common","title":"攻撃宣言時の最初の発動権はターンプレイヤー","question":"相手の直接攻撃宣言直後、相手がサイクロンを発動する前に非ターンプレイヤーは速攻のかかしを先に発動できるか。","answer":"先に発動できない。攻撃宣言後はまずターンプレイヤーにクイックエフェクトを発動する機会があり、ターンプレイヤーがサイクロンを発動できる。","verdict":"cannot","status":"secondary_confirmed","confidence":"medium","historicalScope":"1103","cards":["速攻のかかし","サイクロン"],"tags":["速攻のかかし","優先権","ターンプレイヤー","攻撃宣言時","発動順"],"steps":["ターンプレイヤーが直接攻撃を宣言する。","最初にターンプレイヤーへクイックエフェクトの発動機会を与える。","ターンプレイヤーが権利を放棄または発動した後に相手へ機会を移す。"],"deckTip":"攻撃宣言時に相手が先にカードを使う可能性を含めて、かかしのチェーン位置を判断する。","simulator":{"ruleKey":"turn_player_first_response_priority","expected":"event_window -> turn_player_response_first","engineGap":true,"implementationNote":"イベント直後の優先権順序をUIにも明示する。"},"sourceRefs":["SRC-1103-MAJOR-RULINGS"],"reviewNote":"1103当時の優先権運用として固定する。"},{"id":"R1103-SCARECROW-004","layer":"card","title":"速攻のかかしを同一チェーン上で2枚発動","question":"同じ直接攻撃宣言に対して、速攻のかかしを同一チェーン上で2枚発動できるか。","answer":"2011年当時のWiki旧FAQでは「調整中」。既存DBで採用していた二次資料上の結論は ーを適用する。","そのモンスターが自身をコストにフィールドで効果を発動する。","発動場所と付与済み無効状態を参照し、効果を無効にする。"],"deckTip":"ヴェーラーを受けたラビットやロンファを自身コストで逃がしても効果は通らない。","simulator":{"ruleKey":"veiler_negates_field_activated_effect_after_source_leaves_as_cost","expected":"effect_activated_on_field_while_veiler_applied -> resolve_negated","engineGap":true,"implementationNote":"解決時のカード位置だけでなく、発動時の場所と無効状態をチェーンリンクへ保存する。"},"sourceRefs":["SRC-1103-MAJOR-RULINGS","SRC-VEILER-OFFICIAL"],"reviewNote":"2012年裁定との境界が資料に注記されるため、1103イベント規約との照合を継続する。"},{"id":"R1103-VEILER-006","layer":"card","title":"ヴェーラーは墓地で発動する効果を無効にしない","question":"エフェクト・ヴェーラーが適用されたクリッター等が墓地へ送られた場合、墓地で発動する効果も無効になるか。","answer":"無効にならない。エフェクト・ヴェーラーが無効にするのは対象モンスターがフィールド上で適用・発動する効果であり、墓地で新たに発動する効果には適用されない。","verdict":"cannot","status":"secondary_confirmed","confidence":"high","historicalScope":"1103","cards":["エフェクト・ヴェーラー","クリッター"],"tags":["エフェクト・ヴェーラー","墓地発動","クリッター","無効範囲","ゾーン移動"],"steps":["フィールドのクリッターへヴェーラーを適用する。","クリッターを墓地へ送る。","墓地で新たに誘発する効果はヴェーラーの範囲外として発動・処理する。"],"deckTip":"場の効果を止めても、墓地誘発までまとめて止められるわけではない。","simulator":{"ruleKey":"veiler_does_not_negate_new_grave_effect","expected":"new_effect_origin_grave -> not_affected_by_field_veiler","engineGap":false,"implementationNote":"効果の発動ゾーン単位で無効範囲を判定する。"},"sourceRefs":["SRC-1103-MAJOR-RULINGS","SRC-VEILER-OFFICIAL"],"reviewNote":"フィールドを離れた時に発動する効果にも同じ考え方を適用する。"},{"id":"R1103-ARMORYARM-001","layer":"card","title":"アームズ・エイドの効果分類","question":"アームズ・エイドの装備化と戦闘破壊時のダメージ効果は、それぞれチェーンブロックを作るか。","answer":"自身を装備カード扱いにする効果は対象を取る起動効果。装備中の攻撃力アップ等は装備魔法カードとしての効果で、戦闘破壊時にダメージを与える効果はチェーンブロックを作る。","verdict":"conditional","status":"secondary_confirmed","confidence":"medium","historicalScope":"1103","cards":["アームズ・エイド"],"tags":["アームズ・エイド","装備カード","起動効果","対象を取る","チェーンブロック"],"steps":["自分フィールドの表側モンスターを対象に装備化効果を発動する。","解決してアームズ・エイドを装備魔法カード扱いにする。","装備モンスターが戦闘破壊した場合、ダメージ効果を新たなチェーンで発動する。"],"deckTip":"装備化は対象耐性の影響を受け、ダメージ効果にはさらにチェーンできる。","simulator":{"ruleKey":"armory_arm_monster_to_equip_state","expected":"ignition_target -> move_monster_zone_to_spell_trap_zone -> grant_equip_effects","engineGap":true,"implementationNote":"同一カードをモンスター状態から装備魔法状態へ遷移させる。"},"sourceRefs":["SRC-1103-MAJOR-RULINGS","SRC-ARMORYARM-OFFICIAL"],"reviewNote":"装備状態でのコントローラーと対象関係を保持する。"},{"id":"R1103-ARMORYARM-002","layer":"card","title":"装備モンスターが相打ちになった場合の効果ダメージ","question":"アームズ・エイドを装備したモンスターが相手モンスターと戦闘を行い、相打ちで双方が破壊された場合、ダメージ効果は発動するか。","answer":"発動しない。装備モンスター自身も戦闘破壊されており、アームズ・エイドの装備状態が失われるため。","verdict":"cannot","status":"secondary_confirmed","confidence":"medium","historicalScope":"1103","cards":["アームズ・エイド"],"tags":["アームズ・エイド","相打ち","戦闘破壊","効果ダメージ","発動しない"],"steps":["装備モンスターと相手モンスターの戦闘破壊を確定する。","相打ちで装備モンスターも破壊する。","装備状態が失われるためダメージ効果を発動しない。"],"deckTip":"高攻撃力同士の相打ちではバーンダメージを取れない。","simulator":{"ruleKey":"armory_arm_no_burn_on_mutual_battle_destruction","expected":"equipped_monster_destroyed_in_same_battle -> no_burn_trigger","engineGap":true,"implementationNote":"戦闘結果確定時に装備モンスターの生存を確認する。"},"sourceRefs":["SRC-1103-MAJOR-RULINGS"],"reviewNote":"旧公式FAQ原文を追加確認予定。"},{"id":"R1103-ARMORYARM-003","layer":"interaction","title":"相手モンスターへアームズ・エイドを装備した場合","question":"自分のアームズ・エイドを相手モンスターへ装備できるか。また、そのモンスターが戦闘でモンスターを破壊した場合、誰がダメージを受けるか。","answer":"相手モンスターにも装備できる。その相手モンスターが戦闘でモンスターを破壊した場合、アームズ・エイドの効果により相手プレイヤーがダメージを受ける。","verdict":"can","status":"secondary_confirmed","confidence":"medium","historicalScope":"1103","cards":["アームズ・エイド"],"tags":["アームズ・エイド","相手モンスターに装備","コントローラー","効果ダメージ","対象"],"steps":["相手の表側モンスターを対象に装備化効果を発動する。","自分の魔法＆罠ゾーンへアームズ・エイドを置き、その相手モンスターへ装備する。","装備モンスターが戦闘破壊した時、相手へ効果ダメージを与える。"],"deckTip":"相手の高打点モンスターへ装備し、戦闘を利用して相手へバーンを返す応用がある。","simulator":{"ruleKey":"armory_arm_can_equip_opponent_monster_and_burn_opponent","expected":"opponent_monster_legal_equip_target; damage_recipient=opponent_of_equip_controller","engineGap":true,"implementationNote":"装備カードのコントローラーと装備モンスターのコントローラーを別々に保持する。"},"sourceRefs":["SRC-1103-MAJOR-RULINGS"],"reviewNote":"コントロール変更時の継続装備とダメージ帰属を追加テストする。"},{"id":"R1103-ARMORYARM-004","layer":"interaction","title":"戦闘破壊したモンスターが墓地から移動した場合","question":"アームズ・エイドのダメージ効果処理時、戦闘で破壊されたモンスターが墓地に存在しない場合、ダメージを与えるか。","answer":"ダメージを与えない。破壊されたモンスターが先に蘇生・除外等で墓地から移動している場合、攻撃力を参照できず効果は適用されない。","verdict":"cannot","status":"secondary_confirmed","confidence":"high","historicalScope":"1103","cards":["アームズ・エイド","ギガンテック・ファイター"],"tags":["アームズ・エイド","ギガンテック・ファイター","墓地存在条件","効果ダメージ","逆順処理"],"steps":["戦闘破壊を条件にアームズ・エイドの強制効果をチェーンへ置く。","先に解決する効果で破壊モンスターが墓地から移動する。","アームズ・エイド解決時に墓地で確認できないためダメージを与えない。"],"deckTip":"ギガンテック・ファイターが先に蘇生されるチェーン順ではバーンが発生しない。","simulator":{"ruleKey":"armory_arm_burn_requires_destroyed_monster_in_grave_at_resolution","expected":"destroyed_card_not_in_grave -> no_damage","engineGap":true,"implementationNote":"戦闘破壊カードの参照を保持し、解決時に墓地存在と攻撃力を確認する。"},"sourceRefs":["SRC-1103-MAJOR-RULINGS","SRC-ARMORYARM-OFFICIAL"],"reviewNote":"当時資料と現行公式FAQが一致。"},{"id":"R1103-CATASTOR-001","layer":"interaction","title":"カタストルとN・グラン・モールが戦闘する場合","question":"表側表示のA・O・J カタストルとN・グラン・モールが戦闘する場合、両者の効果をどの順番で処理するか。","answer":"カタストルの強制効果をチェーン1、グラン・モールの任意効果をチェーン2として組む。逆順処理で両者が手札・エクストラデッキへ戻り、カタストルの破壊効果は対象となるモンスターがいないため適用されない。","verdict":"conditional","status":"secondary_confirmed","confidence":"high","historicalScope":"1103","cards":["Ａ・Ｏ・Ｊ カタストル","Ｎ・グラン・モール"],"tags":["カタストル","グラン・モール","ダメージステップ開始時","強制効果","任意効果","SEGOC"],"steps":["ダメージステップ開始時にカタストルの強制効果をチェーン1へ置く。","グラン・モールの任意効果をチェーン2へ置く。","チェーン2で両者を手札・エクストラデッキへ戻す。","チェーン1は戦闘相手が存在しないため破壊処理を行わない。"],"deckTip":"カタストルでもグラン・モールを戦闘前破壊できず、エクストラデッキへ戻される。","simulator":{"ruleKey":"catastor_vs_grand_mole_segoc","expected":"CL1_catastor_mandatory; CL2_grand_mole_optional -> bounce_both -> catastor_no_destroy","engineGap":true,"implementationNote":"同一タイミングの強制・任意誘発を1103のチェーン順で積む。"},"sourceRefs":["SRC-1103-MAJOR-RULINGS","SRC-CATASTOR-OFFICIAL"],"reviewNote":"当時資料と現行公式FAQが一致。"},{"id":"R1103-CATASTOR-002","layer":"card","title":"裏側表示のカタストルが攻撃された場合","question":"裏側守備表示のA・O・J カタストルが闇属性以外のモンスターに攻撃され、ダメージ計算前に表側になった場合、破壊効果は発動するか。","answer":"発動しない。カタストルの効果発動タイミングはダメージステップ開始時であり、その時点では裏側表示のため効 des_permission_for_zero_material_revice","expected":"direct_attack_permission && revice_prohibition -> direct_attack_illegal","engineGap":true,"implementationNote":"行動可否の競合では禁止効果を許可効果より優先する。"},"sourceRefs":["SRC-REVICE-OFFICIAL"],"reviewNote":"公式Q&A fid=7107で確認。"},{"id":"R1103-HOPE-001","layer":"card","title":"希望皇ホープの攻撃無効は対象を取らない誘発効果","question":"No.39 希望皇ホープの攻撃を無効にする効果は対象を取るか。スペルスピードはいくつか。","answer":"対象を取らない任意の誘発効果で、スペルスピード1。攻撃宣言時に素材1つを取り除いて発動する。","verdict":"conditional","status":"secondary_confirmed","confidence":"high","historicalScope":"1103","cards":["Ｎｏ.３９ 希望皇ホープ","魂を削る死霊"],"tags":["希望皇ホープ","攻撃宣言時","誘発効果","スペルスピード1","対象を取らない","エクシーズ素材"],"steps":["攻撃宣言イベントを生成する。","攻撃対象を取らず、素材1つをコストに誘発効果を発動する。","解決時にその攻撃を無効にする。"],"deckTip":"対象を取らないため、ホープで魂を削る死霊の攻撃を止めても死霊は自身の効果で破壊されない。","simulator":{"ruleKey":"utopia_attack_negation_is_non_targeting_trigger","expected":"attack_declared -> optional_trigger_detach -> negate_attack","engineGap":true,"implementationNote":"攻撃イベントを参照し、攻撃モンスターを効果対象として登録しない。"},"sourceRefs":["SRC-1103-MAJOR-RULINGS","SRC-HOPE-OFFICIAL"],"reviewNote":"当時資料と公式補足の基本分類が一致。"},{"id":"R1103-HOPE-002","layer":"interaction","title":"次元幽閉にチェーンしてホープを発動できない","question":"攻撃宣言時に相手が次元幽閉を発動した後、その発動にチェーンして希望皇ホープの攻撃無効効果を発動できるか。","answer":"できない。ホープはスペルスピード1の誘発効果なので、次元幽閉へチェーンして発動できない。ホープも使うなら、攻撃宣言時の優先順位に従ってホープを先に発動し、相手が次元幽閉をチェーンする。","verdict":"cannot","status":"historical_source_confirmed","confidence":"high","historicalScope":"1103","cards":["Ｎｏ.３９ 希望皇ホープ","次元幽閉"],"tags":["希望皇ホープ","次元幽閉","攻撃宣言時","スペルスピード","チェーン","優先権"],"steps":["攻撃宣言時、ホープの誘発効果を使用するか先に決定する。","先に次元幽閉の発動を許した場合、ホープを後からチェーンしない。","両方使う場合はホープをチェーン1、次元幽閉をチェーン2とする。"],"deckTip":"素材を墓地へ送りたいなら、相手の攻撃反応罠を確認する前にホープを使う必要がある。","simulator":{"ruleKey":"utopia_trigger_must_be_declared_before_spell_speed2_attack_response","expected":"utopia_first_or_pass; cannot_chain_utopia_to_trap","engineGap":true,"implementationNote":"攻撃宣言時に誘発効果の確認窓を先に出し、その後でフリーチェーン・攻撃反応窓を開く。"},"sourceRefs":["SRC-1103-MAJOR-RULINGS","SRC-HOPE-OFFICIAL"],"re 動","question":"エヴォルカイザー・ラギアは、どの召喚や効果を無効にできるか。素材を取り除くのはコストか。","answer":"素材2つを発動コストとして取り除く誘発即時効果。通常召喚、反転召喚、チェーンブロックを作らない特殊召喚、魔法・罠カードの発動を無効にして破壊できる。カード効果の解決による特殊召喚や、モンスター効果の発動は無効にできない。","verdict":"conditional","status":"historical_source_confirmed","confidence":"high","historicalScope":"1103","cards":["エヴォルカイザー・ラギア"],"tags":["エヴォルカイザー・ラギア","召喚無効","発動無効","誘発即時効果","エクシーズ素材","コスト"],"steps":["無効対象が召喚行為または魔法・罠カードの発動か確認する。","召喚ならチェーンブロックを作らない召喚か確認する。","素材2つをコストで取り除き、発動または召喚を無効にして破壊する。"],"deckTip":"死者蘇生などの解決中に行う特殊召喚は止められない。兎ラギアでは召喚反応罠との役割分担が重要。","simulator":{"ruleKey":"laggia_negates_inherent_summon_or_spell_trap_activation","expected":"detach_2 -> negate_summon_or_spell_trap_activation -> destroy","engineGap":true,"implementationNote":"特殊召喚イベントにチェーン生成の有無を持たせ、効果解決中の召喚には応答窓を開かない。"},"sourceRefs":["SRC-1103-MAJOR-RULINGS","SRC-LAGGIA-OFFICIAL"],"reviewNote":"当時資料と現行公式の基本分類が一致。"},{"id":"R1103-LAGGIA-002","layer":"interaction","title":"ラギアの召喚無効効果へ禁じられた聖杯をチェーン","question":"モンスターの召喚を無効にするラギアの効果へ、禁じられた聖杯をチェーンしてラギアを無効にできるか。","answer":"できる。召喚されようとしているモンスターはまだフィールドに存在しないが、ラギア自身は表側表示で存在しており、禁じられた聖杯の対象にできる。ラギアの効果は無効になる。","verdict":"can","status":"historical_source_confirmed","confidence":"medium","historicalScope":"1103","cards":["エヴォルカイザー・ラギア","禁じられた聖杯"],"tags":["エヴォルカイザー・ラギア","禁じられた聖杯","召喚無効","チェーン","謎空間"],"steps":["召喚宣言に対してラギアを発動する。","ラギアを対象に禁じられた聖杯をチェーンする。","聖杯でラギアを無効にし、ラギアの召喚無効処理を適用しない。"],"deckTip":"ラギアが召喚を止めようとした場面でも、聖杯はラギアへの突破札になる。","simulator":{"ruleKey":"chalice_can_chain_to_laggia_during_summon_negation_window","expected":"CL1_laggia; CL2_chalice -> laggia_negated -> summon_succeeds","engineGap":true,"implementationNote":"召喚保留中も既存フィールドのクイック効果応答を許可する。"},"sourceRefs":["SRC-1103-MAJOR-RULINGS","SRC-LAGGIA-OFFICIAL"],"reviewNote":"召喚保留状態を通常のフィールド状態と分離する。"},{"id":"R1103-LAGGIA-003","layer":"interaction","title":"召喚無効待ちのTG ストライカーは手札にもフィールドにもいない","question":"TG ストライカーの特殊召喚宣言にラギアを発動した時、マインドクラッシュや闇のデッキ破壊ウイルスでストライカーを処理できるか。","answer":"できない。特殊召喚を宣言したストライカーは、召喚が無効になるか確定するまで手札にもフィールドにも存在しない状態として扱う。当該ゾーンのカードを処理する効果では触れられない。","verdict":"cannot","status":"historical_source_confirmed","confidence":"medium","historicalScope":"1103","cards":["エヴォルカイザー・ラギア","ＴＧ ストライカー","マインドクラッシュ","闇のデッキ破壊ウイルス"],"tags":["召喚無効","謎空間","TG ストライカー","マインドクラッシュ","手札","フィールド"],"steps":["ストライカーを手札から特殊召喚宣言して召喚保留領域へ移す。","ラギアの召喚無効効果を発動する。","手札・フィールドを参照する効果の候補からストライカーを除外する。"],"deckTip":"召喚無効の確認中に、宣言したモンスターを別の手札破壊で落とすことはできない。","simulator":{"ruleKey":"pending_summon_card_is_outside_hand_and_field","expected":"summon_declared -> pending_zone -> not_hand_not_field","engineGap":true,"implementationNote":"召喚無効確認用のpendingSummon領域を実装する。"},"sourceRefs":["SRC-1103-MAJOR-RULINGS"],"reviewNote":"旧公式FAQ原文の保存版探索を継続。"},{"id":"R1103-HONEST-001","layer":"card","title":"1103のオネストはダメージ計算時にも発動できる","question":"1103環境のオネストは、ダメージ計算時に手札から発動できるか。","answer":"発動できる。マスタールール2当時はダメージ計算時が最終発動タイミングだった。2014年のマスタールール3以降はダメージ計算前までとなっているため、現行裁定を1103へ流用してはいけない。","verdict":"can","status":"historical_source_confirmed","confidence":"medium","historicalScope":"1103","cards":["オネスト"],"tags":["オネスト","旧裁定","マスタールール2","ダメージ計算時","現行裁定との差"],"steps":["光属性モンスターが戦闘を行う。","ダメージ計算時の発動確認窓を開く。","オネストを手札から墓地へ送り効果を発動する。"],"deckTip":"1103では『ダメージ計算に入ってよいか』の確認が実戦上重要。現在のゲーム感覚で早く締め切らないこと。","simulator":{"ruleKey":"mr2_honest_allowed_during_damage_calculation","expected":"damage_calculation_window -> honest_activation_allowed","engineGap":true,"implementationNote":"環境ルールセットが1103ならオネスト専用の計算時発動窓を有効にする。"},"sourceRefs":["SRC-HONEST-HISTORY","SRC-OLD-DAMAGE-STEP","SRC-MR3-OFFICIAL"],"reviewNote":"後年の公式ルール変更を境界資料として併記。"},{"id":"R1103-HONEST-002","layer":"interaction","title":"複数のオネストは計算前と計算時で出し方が違う","question":"複数枚のオネストを使う場合、ダメージ計算前とダメージ計算時でチェーンの作り方はどう違うか。","answer":"ダメージ計算前なら、1つ目のチェーン解決後に新しいチェーンで次のオネストを発動できる。ダメージ計算時は原則1つのチェーンしか作れず、解決後にもう1枚を新しく発動できない。計算時に双方が使う場合は逆順処理のため先に発動した側が有利になりやすい。","verdict":"conditional","status":"historical_source_confirmed","confidence":"medium","historicalScope":"1103","cards":["オネスト"],"tags":["オネスト","ダメージ計算前","ダメージ計算時","複数チェーン", する。"},"sourceRefs":["SRC-1103-MAJOR-RULINGS","SRC-CARDGUNNER-OFFICIAL"],"reviewNote":"マクロコスモス等の全カード除外と同じ結果になる。"},{"id":"R1103-CARDGUNNER-002","layer":"card","title":"カードガンナーは送る枚数を先に宣言する","question":"カードガンナーのコストは、1枚ずつめくりながら送る枚数を決められるか。","answer":"できない。発動時に1～3枚のうち送る枚数を宣言し、その枚数をまとめてデッキの上から墓地へ送る。内容を確認してから枚数を変えることはできない。","verdict":"cannot","status":"historical_source_confirmed","confidence":"high","historicalScope":"1103","cards":["カードガンナー"],"tags":["カードガンナー","発動コスト","デッキトップ","枚数宣言","非公開情報"],"steps":["発動時に1・2・3から枚数を選ぶ。","選んだ枚数を同時にコストとして墓地へ送る。","送った枚数×500だけ攻撃力を上げる。"],"deckTip":"墓地へ落ちた内容を見て途中で止めることはできない。先にリスクを決める。","simulator":{"ruleKey":"card_trooper_declares_cost_count_before_milling","expected":"choose_1_to_3 -> send_exact_count -> atk_gain","engineGap":false,"implementationNote":"カード公開前に枚数選択UIを確定する。"},"sourceRefs":["SRC-1103-MAJOR-RULINGS","SRC-CARDGUNNER-OFFICIAL"],"reviewNote":"コストと効果処理を分離する。"},{"id":"R1103-CARDGUNNER-003","layer":"card","title":"裏側のカードガンナーが破壊されても1枚ドローできる","question":"裏側表示のカードガンナーがカード効果で破壊され墓地へ送られた場合、ドロー効果を発動できるか。","answer":"発動できる。墓地でカードガンナー本人であることを確認でき、破壊されて墓地へ送られた条件を満たす。","verdict":"can","status":"historical_source_confirmed","confidence":"medium","historicalScope":"1103","cards":["カードガンナー"],"tags":["カードガンナー","裏側表示","破壊","墓地誘発","ドロー"],"steps":["裏側表示のカードガンナーを破壊する。","墓地へ送られたカードを表側で確認する。","任意のドロー効果を発動する。"],"deckTip":"セットしたカードガンナーも除去への牽制になる。","simulator":{"ruleKey":"face_down_card_trooper_triggers_when_destroyed_to_grave","expected":"destroyed_set_trooper -> grave_identity_revealed -> draw_trigger","engineGap":true,"implementationNote":"直前の裏側状態ではなく、破壊と墓地到達の履歴で誘発判定する。"},"sourceRefs":["SRC-1103-MAJOR-RULINGS","SRC-CARDGUNNER-OFFICIAL"],"reviewNote":"破壊を伴わない墓地送りでは発動しない。"},{"id":"R1103-CARDGUNNER-004","layer":"interaction","title":"光と闇の竜に発動を無効にされても同じターンに再発動できない","question":"カードガンナーの攻撃力上昇効果の発動を光と闇の竜に無効にされた場合、同じターンにもう一度発動できるか。","answer":"発動できない。『1ターンに1度』の使用回数は発動を試みた時点で消費され、発動が無効になっても戻らない。","verdict":"cannot","status":"historical_source_confirmed","confidence":"medium","historicalScope":"1103","cards":["カードガンナー","光と闇の竜"],"tags":["カードガンナー","光と闇の竜","発動無効","1ターンに1度","再発動不可"],"steps":["カードガンナーの効果を発動し使用済みフラグを立てる。","光と闇の竜で発動を無効にする。","使用済みフラグを維持し再発動を拒否する。"],"deckTip":"コストの墓地送りも戻らず、そのターンの再使用もできない。","simulator":{"ruleKey":"card_trooper_once_per_turn_consumed_when_activation_negated","expected":"activation_attempt -> used=true; negated -> used_stays_true","engineGap":false,"implementationNote":"使用制限を解決成功時ではなく発動時に消費する。"},"sourceRefs":["SRC-1103-MAJOR-RULINGS"],"reviewNote":"当時FAQ保存版の確認待ち。"},{"id":"R1103-CARDGUNNER-005","layer":"interaction","title":"デブリ・ドラゴンで蘇生したカードガンナーはコストを払える","question":"デブリ・ドラゴンで特殊召喚され効果が無効になったカードガンナーは、デッキからカードを墓地へ送れるか。また破壊された時にドローできるか。","answer":"起動効果を発動してコストを墓地へ送ることはできるが、フィールドでの効果は無効なので攻撃力は上がらない。その後破壊され墓地へ送られた場合、墓地で発動する別の効果は無効化の影響を受けず、1枚ドローできる。","verdict":"conditional","status":"historical_source_confirmed","confidence":"medium","historicalScope":"1103","cards":["カードガンナー","デブリ・ドラゴン"],"tags":["カードガンナー","デブリ・ドラゴン","効果無効","コスト","墓地効果"],"steps":["デブリ・ドラゴンでカードガンナーを特殊召喚しフィールド効果無効を付与する。","カードガンナーを発動してコストを墓地へ送る。","攻撃力上昇は無効にする。","破壊後は墓地の新しい効果としてドローを処理する。"],"deckTip":"デブリで蘇生しても墓地肥やしと破壊時ドローは利用できる。","simulator":{"ruleKey":"debris_negates_trooper_field_effect_not_cost_or_grave_effect","expected":"cost_paid; atk_gain_negated; later_grave_trigger_active","engineGap":true,"implementationNote":"効果無効をカード名全体ではなくフィールド上の効果インスタンスに適用する。"},"sourceRefs":["SRC-1103-MAJOR-RULINGS","SRC-CARDGUNNER-OFFICIAL"],"reviewNote":"コスト、フィールド効果、墓地効果を別インスタンスとして扱う。"},{"id":"R1103-JUNKSYNCHRON-001","layer":"card","title":"解決時にジャンク・シンクロンがいなくても対象を蘇生する","question":"ジャンク・シンクロンの効果にチェーンして自身がフィールドを離れるか裏側になった場合、対象モンスターは特殊召喚されるか。","answer":"特殊召喚され、効果も無効になる。発動時に対象を取った後、ジャンク・シンクロンとの継続的な対象関係は必要ない。","verdict":"can","status":"historical_source_confirmed","confidence":"high","historicalScope":"1103","cards":["ジャンク・シンクロン"],"tags":["ジャンク・シンクロン","対象を取る","効果解決","フィールドを離れる","特殊召喚"],"steps":["召喚成功時に墓地のレベル2以下を対象にする。","チェーン上でジャンク・シンクロンが離れるか裏側になる。","対象が墓地に残っていれば特殊召喚し効果を無効に ,"reviewNote":"共通のタイミングを逃す規則として再利用可能。"},{"id":"R1103-DANDYLION-001","layer":"card","title":"ダンディライオンは場所や方法を問わず墓地送りで発動","question":"ダンディライオンは手札・デッキ・フィールドなど、どこから墓地へ送られても発動するか。コストで捨ててもよいか。","answer":"原則としてどこから、どの方法で墓地へ送られても強制効果が発動する。発動コストとして捨てられた場合も含む。ただし除外状態から『墓地に戻す』処理は『墓地へ送る』ではないため発動しない。","verdict":"conditional","status":"historical_source_confirmed","confidence":"high","historicalScope":"1103","cards":["ダンディライオン"],"tags":["ダンディライオン","強制効果","墓地へ送る","コスト","除外から戻す"],"steps":["カードの移動元と移動理由を記録する。","行先が墓地で操作種別がsend_to_graveなら誘発を予約する。","return_to_graveなら誘発しない。"],"deckTip":"手札コストやデッキからの墓地肥やしでもトークンを作れるのがジャンドの強み。","simulator":{"ruleKey":"dandylion_triggers_on_any_send_to_grave_not_return_from_banish","expected":"send_to_grave -> mandatory_trigger; return_to_grave -> no_trigger","engineGap":true,"implementationNote":"同じ墓地到着でも移動操作の種別を区別する。"},"sourceRefs":["SRC-1103-MAJOR-RULINGS","SRC-DANDYLION-OFFICIAL"],"reviewNote":"1103の旧テキストを基準にする。"},{"id":"R1103-DANDYLION-002","layer":"interaction","title":"墓地から移動させられてもダンディライオンは墓地で発動する","question":"コストで墓地へ送られたダンディライオンを、同じチェーン中にD.D.クロウで除外、または転生の予言でデッキへ戻した場合、トークン効果は発動するか。","answer":"1103当時はどちらの場合もチェーン処理後に発動し、墓地で発動した効果として扱う。カード本体が発動時に墓地に残っていなくてもよい。","verdict":"can","status":"historical_source_confirmed","confidence":"medium","historicalScope":"1103","cards":["ダンディライオン","Ｄ.Ｄ.クロウ","転生の予言"],"tags":["ダンディライオン","D.D.クロウ","転生の予言","墓地誘発","領域移動","旧裁定"],"steps":["ダンディライオンがコストで墓地へ送られた事実を記録する。","同じチェーン中に除外またはデッキへ戻す。","チェーン解決後、墓地発動扱いで強制効果をチェーンへ置く。"],"deckTip":"D.D.クロウで本体を除外するだけでは綿毛トークンを止められない。","simulator":{"ruleKey":"mr2_dandylion_triggers_from_grave_event_even_after_relocation","expected":"sent_to_grave_event -> later_relocated -> grave_trigger_still_created","engineGap":true,"implementationNote":"1103ルールでは誘発予約をカードの現在位置で破棄しない。"},"sourceRefs":["SRC-1103-MAJOR-RULINGS"],"reviewNote":"カード個別の旧裁定。現行の誘発効果の所在規則と混在させない。"},{"id":"R1103-DANDYLION-003","layer":"card","title":"綿毛トークンは出たターンにアドバンス召喚へ使えない","question":"ダンディライオンで特殊召喚した綿毛トークンは、そのターンに何へ使用できないか。","answer":"特殊召喚されたターン、アドバンス召喚のためにはリリースできない。シンクロ素材やカード効果のコストなど、アドバンス召喚以外の用途まで一律に禁止する効果ではない。","verdict":"conditional","status":"official_current_consistent","confidence":"high","historicalScope":"1103","cards":["ダンディライオン"],"tags":["ダンディライオン","綿毛トークン","アドバンス召喚","リリース制限","シンクロ素材"],"steps":["綿毛トークンに生成ターンを記録する。","リリース目的がアドバンス召喚なら拒否する。","その他の素材・コストは各カードの条件で判定する。"],"deckTip":"生成直後でもシンクロ素材には使えるが、上級モンスターのアドバンス召喚には使えない。","simulator":{"ruleKey":"fluff_tokens_cannot_be_tribute_summon_material_on_summoned_turn","expected":"same_turn && tribute_summon -> illegal","engineGap":false,"implementationNote":"トークンの制約をリリース全般ではなくtribute_summon目的だけに適用する。"},"sourceRefs":["SRC-DANDYLION-OFFICIAL"],"reviewNote":"カードテキストで確認可能。"},{"id":"R1103-BULB-001","layer":"card","title":"バルブのデッキトップ墓地送りはコストではなく効果","question":"グローアップ・バルブの自己蘇生はチェーンを作るか。デッキトップを墓地へ送るのはコストか。","answer":"墓地で発動する起動効果でチェーンブロックを作る。デッキトップ1枚を墓地へ送るのはコストではなく効果処理。","verdict":"conditional","status":"historical_source_confirmed","confidence":"high","historicalScope":"1103","cards":["グローアップ・バルブ"],"tags":["グローアップ・バルブ","起動効果","墓地効果","チェーンブロック","効果で墓地へ送る"],"steps":["墓地でバルブの起動効果を発動する。","解決時にデッキトップ1枚を効果で墓地へ送る。","続いてバルブを特殊召喚する。"],"deckTip":"発動時にデッキトップは落ちないため、チェーンで効果を無効にされれば墓地肥やしも起きない。","simulator":{"ruleKey":"bulb_mill_is_effect_not_cost","expected":"activate_in_grave -> resolve_mill_1 -> summon","engineGap":false,"implementationNote":"発動コストを空にし、墓地送りを解決処理に置く。"},"sourceRefs":["SRC-1103-MAJOR-RULINGS","SRC-BULB-OFFICIAL"],"reviewNote":"当時資料と基本分類が一致。"},{"id":"R1103-BULB-002","layer":"card","title":"バルブの墓地送りと特殊召喚は同時扱いではない","question":"グローアップ・バルブのデッキトップ墓地送りと自身の特殊召喚は同時に行われるか。","answer":"同時扱いではない。先にデッキトップを墓地へ送り、その後にバルブを特殊召喚する。最後に行われた処理は特殊召喚。","verdict":"cannot","status":"historical_source_confirmed","confidence":"high","historicalScope":"1103","cards":["グローアップ・バルブ"],"tags":["グローアップ・バルブ","同時扱いではない","順番","墓地へ送る","特殊召喚成功時"],"steps":["デッキトップ1枚を墓地へ送るイベントを完了する。","別イベントでバルブを特殊召喚する。","特殊召喚成功時の応答窓を開く。"],"deckTip":"激流葬などは最後の特殊召喚成功に反応できる。","simulator":{"ruleKey":"bulb_mill_then_summon_not_simultaneous","expected":"mill_1 -> then_special_summon; last_event=summon","engineGap":true,"implementationNote":"一連の効果内のイベントを2段階で記録する。"},"sourceRefs":["SRC-1103-MAJOR-RULINGS","SRC-BULB-OFFICIAL"],"reviewNote":"タイミング判定用。"},{"id":"R1103-BULB-003","layer":"card","title":"解決時にデッキが0枚ならバルブは特殊召喚されない","question":"バルブの効果解決時にデッキが0枚、またはバルブが墓地からいなくなった場合はどう処理するか。","answer":"デッキが0枚なら墓地送りを行えず、バルブも特殊召喚されない。バルブだけが墓地から移動した場合はデッキトップを墓地へ送る処理は行うが、バルブの特殊召喚は行えない。","verdict":"conditional","status":"historical_source_confirmed","confidence":"high","historicalScope":"1103","cards":["グローアップ・バルブ","Ｄ.Ｄ.クロウ"],"tags":["グローアップ・バルブ","デッキ0枚","D.D.クロウ","効果解決","不発"],"steps":["解決時にデッキ枚数を確認する。","0枚なら全処理を終了する。","1枚以上なら墓地へ送り、続いて墓地にバルブが残る場合だけ特殊召喚する。"],"deckTip":"D.D.クロウでバルブを除外しても、デッキトップ1枚は墓地へ送られる。","simulator":{"ruleKey":"bulb_resolution_requires_deck_card_before_summon_and_grave_presence_for_summon","expected":"deck0=no_mill_no_summon; bulb_missing=mill_no_summon","engineGap":true,"implementationNote":"墓地送り可否と特殊召喚対象の現在位置を段階ごとに確認する。"},"sourceRefs":["SRC-1103-MAJOR-RULINGS","SRC-BULB-OFFICIAL"],"reviewNote":"部分解決を明示。"},{"id":"R1103-BULB-004","layer":"interaction","title":"1103のバルブは次元の裂け目下でも特殊召喚できる","question":"次元の裂け目やマクロコスモスの適用中、1103当時のグローアップ・バルブの効果を発動し、自己特殊召喚できるか。","answer":"発動できる。1103当時はデッキトップが墓地へ行かず除外された場合でも、その後バルブを特殊召喚する裁定だった。2017年以降は除外されると特殊召喚しない裁定になっているため、現行処理と分離する。","verdict":"can","status":"historical_source_confirmed","confidence":"medium","historicalScope":"1103","cards":["グローアップ・バルブ","次元の裂け目","マクロコスモス"],"tags":["グローアップ・バルブ","次元の裂け目","マクロコスモス","除外","旧裁定","現行裁定との差"],"steps":["バルブの効果を発動する。","置換効果でデッキトップを墓地ではなく除外する。","1103ルールでは後続のバルブ特殊召喚を行う。"],"deckTip":"1103では裂け目系メタがあってもバルブをチューナーとして戻せる。","simulator":{"ruleKey":"mr2_bulb_summons_even_if_top_card_is_banished","expected":"mill_replaced_by_banish -> bulb_special_summon","engineGap":true,"implementationNote":"環境ルール1103では墓地到達成功を後続召喚の条件にしない。"},"sourceRefs":["SRC-1103-MAJOR-RULINGS"],"reviewNote":"2016年までの旧裁定とされる項目。旧公式FAQ保存版の探索を継続。"},{"id":"R1103-GUAIBA-001","layer":"card","title":"グアイバはダメージステップ終了時に発動する","question":"ジュラック・グアイバのリクルート効果はいつ発動するか。戦闘破壊した相手が除外された場合も発動するか。","answer":"ダメージステップ終了時、戦闘破壊された相手モンスターが墓地へ送られた、または次元の裂け目などで除外された後に発動する。『場合』の任意効果なのでタイミングを逃さない。","verdict":"can","status":"historical_source_confirmed","confidence":"high","historicalScope":"1103","cards":["ジュラック・グアイバ","次元の裂け目"],"tags":["ジュラック・グアイバ","ダメージステップ終了時","場合の任意効果","戦闘破壊","除外"],"steps":["戦闘破壊を確定する。","ダメージステップ終了時に相手モンスターを墓地または除外へ移す。","グアイバの任意効果を発動する。"],"deckTip":"裂け目があっても兎ラギアのグアイバ展開は成立する。","simulator":{"ruleKey":"guaiba_triggers_at_damage_step_end_after_battle_destroyed_card_leaves_field","expected":"battle_destroyed_to_grave_or_banish -> optional_trigger","engineGap":true,"implementationNote":"戦闘破壊理由を保持し、墓地置換後も誘発を許可する。"},"sourceRefs":["SRC-1103-MAJOR-RULINGS","SRC-GUAIBA-OFFICIAL"],"reviewNote":"旧ダメージステップ区分を使用。"},{"id":"R1103-GUAIBA-002","layer":"card","title":"1103のグアイバは相打ちでも発動する","question":"ジュラック・グアイバと相手モンスターが戦闘で相打ちになった場合、1103当時はリクルート効果を発動できるか。","answer":"発動できる。マスタールール2当時は『場合』の任意・強制効果であるグアイバは、相打ちで自身もフィールドを離れてもフィールドで発動する扱いだった。現行裁定では発動できないため区別が必要。","verdict":"can","status":"historical_source_confirmed","confidence":"medium","historicalScope":"1103","cards":["ジュラック・グアイバ"],"tags":["ジュラック・グアイバ","相打ち","旧裁定","マスタールール2","現行裁定との差","フィールド発動"],"steps":["グアイバと相手モンスターの相打ちを確定する。","双方を戦闘破壊で墓地等へ移す。","1103ルールではグアイバのフィールド発動扱いの効果をチェーンへ置く。"],"deckTip":"1103ではグアイバを相打ちさせても後続を呼べるため、現在より攻撃判断が強い。","simulator":{"ruleKey":"mr2_guaiba_triggers_after_mutual_battle_destruction","expected":"mutual_battle_destruction -> guaiba_trigger_from_field_context","engineGap":true,"implementationNote":"1103専用例外として戦闘時コントローラーと発動場所のスナップショットを保持する。"},"sourceRefs":["SRC-1103-MAJOR-RULINGS"],"reviewNote":"現行FAQを上書きしない歴史的例外。"},{"id":"R1103-GUAIBA-003","layer":"interaction","title":"ライコウのリバース効果でグアイバが破壊されても発動する","question":"グアイバが裏側のライコウを戦闘破壊し、ダメージ計算後にライコウのリバース効果でグアイバも破壊された場合、グアイバの効果は発動できるか。","answer":"1103当時は発動できる。ライコウを戦闘破壊した条件を満たし、ダメージステップ終了時にグアイバがフィールドから離れていても旧裁定により効果を発動する。","v 衆が存在する場合、チェーンを作らない手順で手札から特殊召喚する。自分フィールドに表側表示で存在できる六武衆の師範は1体だけで、この制限は効果無効では解除されない。","verdict":"conditional","status":"historical_source_confirmed","confidence":"high","historicalScope":"1103","cards":["六武衆の師範"],"tags":["六武衆の師範","特殊召喚手順","チェーンブロックを作らない","1体制限","ルール効果"],"steps":["表側表示の六武衆が存在するか確認する。","自分フィールドに表側表示の師範がいないことを確認する。","チェーンを作らず特殊召喚する。"],"deckTip":"2枚目を抱えても同時展開できないが、1体目が除去された後の再展開札になる。","simulator":{"ruleKey":"grandmaster_inherent_summon_and_faceup_limit","expected":"six_samurai_present_and_no_faceup_grandmaster -> non_chain_summon","engineGap":true,"implementationNote":"1体制限は無効化されない配置ルールとして扱う。"},"sourceRefs":["SRC-GRANDMASTER-OFFICIAL"],"reviewNote":"所有者ではなく自分フィールド上の表側表示枚数で判定。"},{"id":"R1103-GRANDMASTER-002","layer":"card","title":"相手の効果で破壊された師範は自身も回収できる","question":"表側表示の師範が相手のカード効果で破壊された場合、墓地のどの六武衆を手札へ加えられるか。","answer":"墓地の六武衆1体を対象に発動する強制の誘発効果で、破壊されて墓地へ送られた師範自身も対象にできる。解決時に対象が墓地にいなければ回収しない。","verdict":"can","status":"historical_source_confirmed","confidence":"high","historicalScope":"1103","cards":["六武衆の師範"],"tags":["六武衆の師範","相手の効果","破壊","墓地回収","対象を取る","自身を回収"],"steps":["表側表示の師範が相手の効果で破壊される。","墓地の六武衆1体を対象に強制効果を発動する。","対象を手札へ加える。"],"deckTip":"相手の効果除去に対して師範自身を戻せるため、継続的に展開圧力を保てる。","simulator":{"ruleKey":"grandmaster_recovers_six_samurai_when_opponent_effect_destroyed","expected":"opponent_effect_destroy -> target_grave_six_samurai -> add_to_hand","engineGap":false,"implementationNote":"発動源自身も墓地対象候補に含める。"},"sourceRefs":["SRC-1103-MAJOR-RULINGS","SRC-GRANDMASTER-OFFICIAL"],"reviewNote":"破壊時に表側表示だったことを確認する。"},{"id":"R1103-GRANDMASTER-003","layer":"interaction","title":"六武衆の破壊身代わりになった師範は回収しない","question":"他の六武衆が破壊される代わりに師範を破壊した場合、師範の墓地回収効果は発動するか。","answer":"発動しない。身代わり処理による破壊であり、師範自身が相手のカード効果によって破壊された扱いにはならない。","verdict":"cannot","status":"historical_source_confirmed","confidence":"medium","historicalScope":"1103","cards":["六武衆の師範"],"tags":["六武衆の師範","破壊身代わり","相手の効果で破壊されていない","発動不可"],"steps":["他の六武衆へ破壊が適用される。","師範を身代わりとして破壊する。","相手効果による直接の破壊ではないため回収効果を発動しない。"],"dec er_trigger_regardless_effect_activator","engineGap":true,"implementationNote":"1103専用分岐。現行ルール設定とは別の履歴として固定する。"},"sourceRefs":["SRC-1103-MAJOR-RULINGS","SRC-GRANDMASTER-OFFICIAL"],"reviewNote":"歴史的差分。2024年以降の裁定とは分離する。"},{"id":"R1103-DARKWORLD-COMMON-001","layer":"common","title":"暗黒界は効果で捨てられた時だけ発動する","question":"暗黒界モンスターは、手札を捨てるカードならコストでも効果でも発動できるか。","answer":"発動条件はカード効果によって手札から墓地へ捨てられること。暗黒界の取引や暗黒界の門など、効果処理で捨てられれば発動するが、サンダー・ブレイクなどを発動するためのコストとして捨てた場合は発動しない。","verdict":"conditional","status":"historical_source_confirmed","confidence":"high","historicalScope":"1103","cards":["暗黒界の龍神 グラファ","暗黒界の術師 スノウ","暗黒界の狩人 ブラウ","暗黒界の取引","暗黒界の門","サンダー・ブレイク"],"tags":["暗黒界","効果で捨てる","コストで捨てる","発動条件","墓地"],"steps":["手札を捨てた処理の出所を確認する。","効果処理なら対応する暗黒界の誘発効果を発動する。","発動コストなら暗黒界の誘発効果を発動しない。"],"deckTip":"手札を捨てるカードでも全部が暗黒界サポートではない。採用時はコストか効果かを必ず確認する。","simulator":{"ruleKey":"dark_world_requires_discard_by_effect","expected":"discard_reason_effect -> trigger; discard_reason_cost -> no_trigger","engineGap":false,"implementationNote":"手札墓地送りイベントにdiscardReasonを必須で持たせる。"},"sourceRefs":["SRC-1103-MAJOR-RULINGS","SRC-GRAPHA-OFFICIAL","SRC-SNOWW-OFFICIAL","SRC-BROWW-OFFICIAL"],"reviewNote":"暗黒界全体で最優先の共通判定。"},{"id":"R1103-DARKWORLD-COMMON-002","layer":"common","title":"暗黒界の雷の捨てる処理は効果","question":"暗黒界の雷でセットカードを破壊した後に手札を捨てた場合、暗黒界モンスターの効果は発動するか。","answer":"発動する。暗黒界の雷で手札を捨てる処理は発動コストではなく、対象のセットカードを破壊した後に行う効果処理である。","verdict":"can","status":"historical_source_confirmed","confidence":"high","historicalScope":"1103","cards":["暗黒界の雷","暗黒界の龍神 グラファ","暗黒界の術師 スノウ","暗黒界の狩人 ブラウ"],"tags":["暗黒界の雷","暗黒界","効果で捨てる","破壊後","誘発効果"],"steps":["暗黒界の雷でセットカードを対象に発動する。","対象を破壊する。","その後、効果で手札を1枚捨てる。","捨てられた暗黒界の効果を新しいチェーンで発動する。"],"deckTip":"除去と暗黒界起動を1枚で兼ねるが、対象を破壊できない場合の後続処理には注意。","simulator":{"ruleKey":"dark_world_lightning_discards_by_effect","expected":"destroy_set_card_then_effect_discard -> dark_world_trigger","engineGap":false,"implementationNote":"捨てる処理をコスト欄へ置かない。"},"sourceRefs":["SRC-1103-MAJOR-RULINGS"],"reviewNote":"暗黒界用のデッキビルダー判定にも利用。"},{"id":"R1103-GRAPHA-001","layer":"card","title":"グラファの自己蘇生はチェーンを作らない召喚手順","question":"墓地のグラファを、自分フィールドの暗黒界を手札へ戻して特殊召喚する処理は効果またはコストか。","answer":"効果ではなくチェーンを作らない特殊召喚手順で、暗黒界モンスターを手札へ戻す行為もコストではない。召喚を宣言した時点で表側表示の暗黒界1体を手札へ戻し、墓地のグラファを特殊召喚する。","verdict":"can","status":"historical_source_confirmed","confidence":"high","historicalScope":"1103","cards":["暗黒界の龍神 グラファ"],"tags":["暗黒界の龍神 グラファ","特殊召喚手順","チェーンブロックを作らない","手札へ戻す","コストではない"],"steps":["グラファが墓地に存在することを確認する。","自分フィールドの表側表示の暗黒界1体を手札へ戻す。","チェーンを作らずグラファを特殊召喚する。"],"deckTip":"スノウやブラウを手札へ戻して再利用しながら、召喚権を使わず大型を出せる。","simulator":{"ruleKey":"grapha_inherent_grave_summon","expected":"return_faceup_dark_world_as_procedure -> non_chain_special_summon","engineGap":true,"implementationNote":"発動可能効果ではなく墓地からの召喚手順として実装する。"},"sourceRefs":["SRC-1103-MAJOR-RULINGS","SRC-GRAPHA-OFFICIAL"],"reviewNote":"手札へ戻す行為をコスト支払いイベントにしない。"},{"id":"R1103-GRAPHA-002","layer":"card","title":"グラファの召喚宣言後に戻した暗黒界を妨害できない","question":"グラファの自己蘇生を宣言して暗黒界を手札へ戻した後、D.D.クロウや強制脱出装置で特殊召喚を不成立にできるか。召喚を無効にされたら戻したカードはどうなるか。","answer":"召喚手順はチェーンを作らないため、その途中へD.D.クロウや強制脱出装置を差し込めない。神の警告などで特殊召喚を無効にされても、すでに手札へ戻した暗黒界はフィールドへ戻らない。","verdict":"cannot","status":"historical_source_confirmed","confidence":"high","historicalScope":"1103","cards":["暗黒界の龍神 グラファ","D.D.クロウ","強制脱出装置","神の警告"],"tags":["暗黒界の龍神 グラファ","召喚手順","チェーン不可","特殊召喚無効","手札へ戻したまま"],"steps":["暗黒界を手札へ戻してグラファの特殊召喚を宣言する。","手順の途中では優先権を渡さない。","召喚無効効果があれば召喚無効窓で処理する。","無効になっても戻した暗黒界は手札に残す。"],"deckTip":"相手は戻す前に墓地や場へ干渉する必要がある。召喚無効を受けても下級暗黒界は回収できる。","simulator":{"ruleKey":"grapha_procedure_atomic_before_summon_negation","expected":"return_dark_world -> pending_summon; no_interruption_between","engineGap":true,"implementationNote":"召喚手順をアトミックに処理し、その後だけ召喚無効窓を開く。"},"sourceRefs":["SRC-1103-MAJOR-RULINGS","SRC-GRAPHA-OFFICIAL"],"reviewNote":"戻した暗黒界の巻き戻しは行わない。"},{"id":"R1103-GRAPHA-003","layer":"interaction","title":"マクロコスモス下で警告されたグラファは除外される","question":"マクロコスモス適用中、墓地から特殊召喚しようとしたグラファを神の警告で無効にして破壊した場合、どこへ置くか。","answer":"2011年当時のWiki旧FAQでは「調整中」。既存DBで採用していた二次資料上の結論は参考として残すが、同時代一次資料の確認完了までは1103裁定として確定扱いしない。","verdict":"investigating","status":"historical_disputed","confidence":"low","historicalScope":"1103","cards":["暗黒界の龍神 グラファ","マクロコスモス","神の警告"],"tags":["暗黒界の龍神 グラファ","マクロコスモス","神の警告","特殊召喚無効","除外置換"],"steps":["マクロコスモス適用中にグラファの特殊召喚を宣言する。","神の警告で召喚を無効にし破壊する。","墓地へ送る代わりにグラファを除外する。"],"deckTip":"除外メタ下では警告を受けたグラファを墓地へ戻せず、自己蘇生ループが切れる。","simulator":{"ruleKey":"macro_banishes_grapha_destroyed_in_pending_summon","expected":"warning_destroy_pending_grapha -> banish_instead_of_grave","engineGap":true,"implementationNote":"召喚保留領域からの墓地送りにも置換効果を適用する。"},"sourceRefs":["SRC-1103-MAJOR-RULINGS","SRC-GRAPHA-OFFICIAL","SRC-WIKI-BFCC2637794C"],"reviewNote":"1103資料の召喚無効と除外置換の例。 旧回答（確定扱い時）: 破壊されたグラファは墓地へ送られる代わりに除外される。召喚が無効でも、破壊後の墓地送りにはマクロコスモスの除外置換が適用される。 Wiki旧FAQ WIKI-BFCC2637794C（backup 2011-08-27 / answer 2011-07-23）は「調整中」。"},{"id":"R1103-GRAPHA-004","layer":"card","title":"効果で捨てられたグラファの破壊と相手効果の追加処理","question":"グラファがカード効果で手札から墓地へ捨てられた場合、何を処理するか。","answer":"相手フィールドのカード1枚を対象に取り破壊する。相手のカード効果で捨てられた場合はさらに、相手の手札をランダムに1枚確認し、それがモンスターなら自分フィールドへ特殊召喚できる。コストで捨てられた場合は発動しない。","verdict":"conditional","status":"historical_source_confirmed","confidence":"high","historicalScope":"1103","cards":["暗黒界の龍神 グラファ"],"tags":["暗黒界の龍神 グラファ","効果で捨てる","対象を取る","破壊","相手の効果","手札確認","特殊召喚"],"steps":["効果で手札から墓地へ捨てられたことを確認する。","相手フィールドのカード1枚を対象に発動して破壊する。","相手効果で捨てられた場合は手札をランダムに確認し、モンスターなら任意で特殊召喚する。"],"deckTip":"自分の捨て札ギミックでは除去、相手のハンデスには除去＋手札奪取で強く返せる。","simulator":{"ruleKey":"grapha_discard_trigger_and_opponent_bonus","expected":"effect_discard -> target_destroy; opponent_effect -> random_hand_check_optional_summon","engineGap":true,"implementationNote":"discardEffectControllerで追加処理の有無を判定する。"},"sourceRefs":["SRC-GRAPHA-OFFICIAL"],"reviewNote":"ランダム確認で魔法・罠だった場合は特殊召喚しない。"},{"id":"R1103-SNOWW-001","layer":"card","title":"スノウは暗黒界カードを強制サーチする","question":"スノウがカード効果で手札から墓地へ捨てられた場合、何を手札へ加えられるか。","answer":"デッキから暗黒界と名のついたカード1枚を手札へ加える強制の誘発効果を発動する。モンスターだけでなく暗黒界の門や暗黒界の取引などの魔法・罠も選べる。コストで捨てた場合は発動しない。","verdict":"can","status":"historical_source_confirmed","confidence":"high","historicalScope":"1103","cards":["暗黒界の術師 スノウ","暗黒界の門","暗黒界の取引"],"tags":["暗黒界の術師 スノウ","強制効果","サーチ","暗黒界カード","効果で捨てる"],"steps":["スノウが効果で手札から墓地へ捨てられる。","強制の誘発効果を新しいチェーンで発動する。","デッキから暗黒界カード1枚を手札へ加える。"],"deckTip":"必要な下級・グラファ・門・取引のどれにも変換できる暗黒界の安定役。","simulator":{"ruleKey":"snoww_mandatory_dark_world_search","expected":"discard_by_effect -> mandatory_search_any_dark_world_card","engineGap":false,"implementationNote":"検索対象をモンスターに限定しない。"},"sourceRefs":["SRC-SNOWW-OFFICIAL"],"reviewNote":"ライオウ下でも発動自体は行う。"},{"id":"R1103-SNOWW-002","layer":"card","title":"相手効果で捨てられたスノウは相手墓地からも蘇生する","question":"スノウが相手のカード効果で捨てられた場合、サーチ後に何を行えるか。","answer":"暗黒界カードを手札へ加えた後、相手墓地のモンスター1体を対象にして自分フィールドへ表側守備表示で特殊召喚できる。対象を取る追加処理である。","verdict":"can","status":"historical_source_confirmed","confidence":"high","historicalScope":"1103","cards":["暗黒界の術師 スノウ"],"tags":["暗黒界の術師 スノウ","相手の効果","墓地蘇生","対象を取る","表側守備表示","追加処理"],"steps":["相手の効果でスノウが捨てられる。","暗黒界カードを手札へ加える。","相手墓地のモンスター1体を対象にする。","自分フィールドへ表側守備表示で特殊召喚する。"],"deckTip":"相手の手札破壊へ強烈な切り返しになる。墓地メタがある場合は追加処理を過信しない。","simulator":{"ruleKey":"snoww_opponent_discard_bonus_revives_opponent_grave","expected":"opponent_effect_discard -> search_then_target_opponent_grave_revive_defense","engineGap":true,"implementationNote":"追加の墓地対象を発動時に保持する。"},"sourceRefs":["SRC-SNOWW-OFFICIAL"],"reviewNote":"相手墓地のモンスターを自分の場へ出す。"},{"id":"R1103-SNOWW-003","layer":"interaction","title":"スノウとライオウ・ネクロバレーの処理","question":"ライオウまたは王家の眠る谷－ネクロバレーが存在する時、捨てられたスノウの効果はどうなるか。","answer":"ライオウ下でも強制効果は発動するが、デッキから暗黒界カードを手札へ加える処理は適用できない。ネクロバレーは通常のサーチ部分を無効にしないが、相手効果で捨てられて相手墓地のモンスターを対象にする追加処理を行う場合は、その墓地に及ぶ効果を無効にする。","verdict":"conditional","status":"historical_source_confirmed","confidence":"medium","historicalScope":"1103","cards":["暗黒界の術師 スノウ","ライオウ","王家の眠る谷－ネクロバレー"],"tags":["暗黒界の術師 スノウ","ライオウ","ネクロバレー","強制サーチ","墓地効果無効","部分処理"],"steps":["スノウの強制効果を発動する。","ライオウ適用中ならサーチ処理を適用しない。","ネクロバレー適用中でも通常のサーチだけなら解決する。","相手墓地を対象にする追加処理を含む場合はネクロバレーで無効にする。"],"deckTip":"ライオウはスノウの発動を止めずサーチ結果を消す。ネクロバレーは相手効果時の墓地奪取だけに強く干渉する。","simulator":{"ruleKey":"snoww_under_raioh_and_necrovalley","expected":"raioh=no_add; necrovalley=negate_only_when_grave_target_branch","engineGap":true,"implementationNote":"発動する分岐が墓地へ及ぶかを確定してからネクロバレーを判定する。"},"sourceRefs":["SRC-1103-MAJOR-RULINGS","SRC-SNOWW-OFFICIAL","SRC-RAIOH-OFFICIAL"],"reviewNote":"1103資料の個別相互作用。"},{"id":"R1103-BROWW-001","layer":"card","title":"ブラウは効果で捨てられるとドローする","question":"ブラウがカード効果で手札から墓地へ捨てられた場合、何枚ドローするか。","answer":"自分の効果で捨てられた場合は1枚ドローする。相手のカード効果で捨てられた場合はさらに1枚、合計2枚ドローする。コストとして捨てた場合は発動しない。","verdict":"conditional","status":"historical_source_confirmed","confidence":"high","historicalScope":"1103","cards":["暗黒界の狩人 ブラウ"],"tags":["暗黒界の狩人 ブラウ","効果で捨てる","ドロー","相手の効果","コストでは発動しない"],"steps":["ブラウが効果で手札から墓地へ捨てられる。","通常は1枚ドローする。","捨てた効果のコントローラーが相手なら追加でもう1枚ドローする。"],"deckTip":"門や取引で能動的に1ドローへ変換でき、相手のハンデスには2ドローで対抗できる。","simulator":{"ruleKey":"broww_draws_one_or_two_by_discard_effect_controller","expected":"own_effect_discard=draw1; opponent_effect_discard=draw2","engineGap":false,"implementationNote":"discardEffectControllerを参照してドロー枚数を決定する。"},"sourceRefs":["SRC-BROWW-OFFICIAL"],"reviewNote":"ドローはデッキから手札へ加える効果とは区別する。"},{"id":"R1103-BROWW-002","layer":"interaction","title":"ライオウはブラウのドローを妨げない","question":"ライオウが表側表示で存在する時、効果で捨てられたブラウはドローできるか。","answer":"ドローできる。ライオウが禁止するのはドロー以外の方法でデッキからカードを手札へ加える行為であり、ブラウの処理はドローである。","verdict":"can","status":"historical_source_confirmed","confidence":"high","historicalScope":"1103","cards":["暗黒界の狩人 ブラウ","ライオウ"],"tags":["暗黒界の狩人 ブラウ","ライオウ","ドロー","サーチ封印","処理可能"],"steps":["ブラウが効果で捨てられ誘発効果を発動する。","処理がドローであることを確認する。","ライオウの永続効果に妨げられずドローする。"],"deckTip":"ライオウ盤面ではスノウよりブラウを捨てた方が確実に手札を回復できる。","simulator":{"ruleKey":"raioh_allows_broww_draw","expected":"draw_event -> not_blocked_by_raioh","engineGap":false,"implementationNote":"移動理由drawとsearch/addを分ける。"},"sourceRefs":["SRC-BROWW-OFFICIAL","SRC-RAIOH-OFFICIAL"],"reviewNote":"ライオウ共通裁定の暗黒界向け具体例。"},{"id":"R1103-DEALINGS-001","layer":"card","title":"暗黒界の取引は双方が同時にドローしてから同時に捨てる","question":"暗黒界の取引のドローと手札を捨てる処理は、どの順番・同時性で行うか。","answer":"まずお互いに1枚ずつ同時にドローし、その後、お互いに手札を1枚ずつ選んで同時に捨てる。ドローと捨てる処理は同時ではない。","verdict":"conditional","status":"historical_source_confirmed","confidence":"high","historicalScope":"1103","cards":["暗黒界の取引"],"tags":["暗黒界の取引","同時ドロー","同時に捨てる","処理順","暗黒界"],"steps":["両プレイヤーが同時に1枚ドローする。","両プレイヤーが捨てる手札を選ぶ。","選んだカードを同時に捨てる。","捨てられたカードの誘発効果を次のチェーンへ置く。"],"deckTip":"引いたカードも捨て札候補にできる。相手にも墓地利用や暗黒界の誘発機会を与える点はリスク。","simulator":{"ruleKey":"dark_world_dealings_draw_then_simultaneous_discard","expected":"both_draw_simultaneously -> both_discard_simultaneously","engineGap":true,"implementationNote":"ドローイベントと捨てるイベントを別の同時イベントとして記録する。"},"sourceRefs":["SRC-1103-MAJOR-RULINGS","SRC-DEALINGS-OFFICIAL"],"reviewNote":"捨てた暗黒界の誘発は取引の解決後。"},{"id":"R1103-DEALINGS-002","layer":"card","title":"手札0枚でも暗黒界の取引を発動できる","question":"自分または相手の手札が0枚の時、暗黒界の取引を発動できるか。","answer":"発動できる。先に双方が1枚ドローするため、発動時点でどちらかの手札が0枚でも、その後に捨てるカードを用意できる。","verdict":"can","status":"historical_source_confirmed","confidence":"high","historicalScope":"1103","cards":["暗黒界の取引"],"tags":["暗黒界の取引","手札0枚","発動可能","ドロー後に捨てる"],"steps":["双方のデッキにカードがあることを確認する。","手札枚数に関係なく取引を発動する。","双方がドローした後、そのカードを含む手札から1枚捨てる。"],"deckTip":"空の手札からでもトップを交換できるため、完全な死に札にはなりにくい。","simulator":{"ruleKey":"dealings_legal_with_zero_hand","expected":"zero_hand_allowed_if_both_can_draw","engineGap":false,"implementationNote":"発動可否を現在の手札枚数で拒否しない。"},"sourceRefs":["SRC-1103-MAJOR-RULINGS","SRC-DEALINGS-OFFICIAL"],"reviewNote":"次のドローで捨てるカードが確保される。"},{"id":"R1103-DEALINGS-003","layer":"card","title":"どちらかのデッキが0枚なら暗黒界の取引を発動できない","question":"自分または相手のデッキが0枚の時、暗黒界の取引を発動できるか。","answer":"発動できない。双方が1枚ドローする処理を必ず行う効果なので、どちらか一方でもドローできない状態では発動条件を満たさない。","verdict":"cannot","status":"historical_source_confirmed","confidence":"high","historicalScope":"1103","cards":["暗黒界の取引"],"tags":["暗黒界の取引","デッキ0枚","発動不可","ドロー"],"steps":["双方のデッキ枚数を確認する。","一方でも0枚なら発動を拒 。"},"sourceRefs":["SRC-1103-MAJOR-RULINGS","SRC-DARKWORLD-GATES-OFFICIAL"],"reviewNote":"捨てるのは効果なので暗黒界が誘発する。"},{"id":"R1103-GATES-003","layer":"card","title":"門の解決時に悪魔族を捨てられなければドローもしない","question":"門の効果解決時に手札の悪魔族がなくなった場合、または門自体がサイクロンで破壊された場合、捨てる・ドローは行うか。","answer":"どちらの場合も捨てる処理もドローも行わない。墓地の悪魔族を除外した発動コストだけは戻らない。フィールド魔法の門が解決時にフィールドに存在しない場合、その効果は適用されない。","verdict":"conditional","status":"historical_source_confirmed","confidence":"high","historicalScope":"1103","cards":["暗黒界の門","サイクロン"],"tags":["暗黒界の門","解決時不在","サイクロン","悪魔族不在","コストは戻らない","ドローしない"],"steps":["墓地の悪魔族を除外して門の効果を発動する。","解決時に門が表側表示で存在し、手札に悪魔族があるか確認する。","どちらかを満たさなければ捨てず、ドローもしない。","除外済みコストは戻さない。"],"deckTip":"門へのサイクロンは1対1交換以上になりやすい。発動側は手札の悪魔族を途中で失うチェーンにも注意。","simulator":{"ruleKey":"gates_fails_without_self_or_hand_fiend_on_resolution","expected":"cost_remains; if_gate_absent_or_no_hand_fiend -> no_discard_no_draw","engineGap":true,"implementationNote":"解決時にフィールド魔法の存在と手札の悪魔族を再検査する。"},"sourceRefs":["SRC-1103-MAJOR-RULINGS","SRC-DARKWORLD-GATES-OFFICIAL"],"reviewNote":"部分的にドローだけ行うことはない。"},{"id":"R1103-GATES-004","layer":"card","title":"門のカード発動と同じチェーンでは起動効果を使えない","question":"暗黒界の門をフィールド魔法として発動した同じチェーン上で、墓地を除外して手札交換する効果も続けて発動できるか。","answer":"できない。まず暗黒界の門そのもののカード発動を解決してフィールドへ適用させる必要がある。チェーン解決後、自分のメインフェイズに改めて起動効果を発動する。","verdict":"cannot","status":"historical_source_confirmed","confidence":"high","historicalScope":"1103","cards":["暗黒界の門"],"tags":["暗黒界の門","カードの発動","起動効果","同一チェーン不可","メインフェイズ"],"steps":["暗黒界の門のカード発動をチェーンへ置く。","そのチェーン中は門の起動効果を発動しない。","チェーンを解決して門をフィールドへ適用する。","優先権を得たメインフェイズに起動効果を発動する。"],"deckTip":"門の発動にチェーンして即座に手札交換はできない。除去を受ける前に使えるとは限らない。","simulator":{"ruleKey":"gates_ignition_unavailable_during_initial_activation_chain","expected":"resolve_field_spell_activation_before_ignition_available","engineGap":false,"implementationNote":"カード発動が未解決の永続カードに起動効果を与えない。"},"sourceRefs":["SRC-1103-MAJOR-RULINGS","SRC-DARKWORLD-GATES-OFFICIAL"],"reviewNote":"フィールド魔法のカード発動と起動効果を別扱いにする。"},{"id":"R1103-ENISHI-001","layer":"card ースコスト","効果無効","フィールド発動"],"steps":["デブリ・ドラゴンでローンファイア・ブロッサムを蘇生し無効化する。","ロンファ自身をリリースして起動効果を発動する。","コストのリリースは成立する。","効果はフィールドで発動したものとして無効化され、特殊召喚しない。"],"deckTip":"デブリで釣ったロンファをそのまま自己リリースして展開することはできない。月の書などでロンファ側の無効情報を切る必要がある。","simulator":{"ruleKey":"debris_field_effect_negation_persists_after_self_cost_leave","expected":"debris_revived_lonefire -> tribute_self_cost -> effect_resolves_negated","engineGap":true,"implementationNote":"発動時点の無効状態を効果オブジェクトへスナップショットし、コストで発生源が離れても維持する1103処理を適用。"},"sourceRefs":["SRC-1103-MAJOR-RULINGS"],"reviewNote":"1103裁定まとめに明記。ヴェーラー適用後の自己リリース裁定と共通化できる。"},{"id":"R1103-LONEFIRE-001","layer":"card","title":"2枚目のローンファイアは同じターンでも効果を使える","question":"1枚目の『ローンファイア・ブロッサム』の効果で2枚目のローンファイア・ブロッサムを特殊召喚した。同じターン中に2枚目も効果を発動できるか。","answer":"発動できる。1103当時の『1ターンに1度』はカード1枚ごとの制限で、別個体には引き継がれない。いったんフィールドを離れて再び出た同じカードも、当時の扱いでは再度使用できる。","verdict":"can","status":"historical_source_confirmed","confidence":"medium","historicalScope":"1103","cards":["ローンファイア・ブロッサム"],"tags":["ローンファイア・ブロッサム","1ターンに1度","ソフトターン1","再展開","連鎖"],"steps":["1枚目のロンファの効果を使用する。","2枚目のロンファをデッキから特殊召喚する。","2枚目は別個体なのでそのターンの使用済み情報を持たない。","2枚目の起動効果を発動できる。"],"deckTip":"ロンファ→ロンファ→植物族という連鎖展開が可能。","simulator":{"ruleKey":"legacy_soft_once_per_turn_per_card_instance","expected":"lonefire_A_used -> summon_lonefire_B -> B_can_activate","engineGap":true,"implementationNote":"カード名単位のhard OPTではなく、フィールド上のカードインスタンス単位で使用済みを管理し、離脱でリセットする。"},"sourceRefs":["SRC-1103-MAJOR-RULINGS"],"reviewNote":"1103裁定まとめに明記。現行PSCTのカード名制限と混同しない。"},{"id":"R1103-LONEFIRE-002","layer":"card","title":"モンスターゾーンが埋まっていてもロンファ自身をリリースして発動できる","question":"自分のモンスターゾーンが全て埋まっている時、『ローンファイア・ブロッサム』自身をリリースして効果を発動できるか。","answer":"発動できる。発動コストでローンファイア・ブロッサム自身をリリースした時点でモンスターゾーンが1枠空き、効果解決時にデッキから植物族を特殊召喚できる。","verdict":"can","status":"historical_source_confirmed","confidence":"high","historicalScope":"1103","cards":["ローンファイア・ブロッサム"],"tags":["ローンファイア・ブロッサム","ゾーン満杯","リリースコスト","特殊召喚","発動可否"],"steps":["自分のモンスターゾーンが全て使用中であることを確認する。","ロンファ自身を発動コストとしてリリースする。","コスト処理後にモンスターゾ
